name: P3B Registration Static Contracts

on:
  pull_request:
    branches:
      - hardening/p3a-organization-profile-authorization
      - hardening/complete-migration-lineage
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3b-registration-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p3b-registration-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked test environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
      - name: Run P3B static contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -m py_compile \
            alembic/versions/c97d8e9f0a23_p3b_registration_read_boundary.py \
            alembic/versions/d07d8e9f0a24_p3b_registration_envelope_storage.py \
            alembic/versions/e07d8e9f0a25_p3b_registration_dek_capabilities.py \
            alembic/versions/f07d8e9f0a26_p3b_registration_create_capability.py \
            alembic/versions/g07d8e9f0a27_p3b_registration_replace_capability.py \
            alembic/versions/h07d8e9f0a28_p3b_registration_replace_conflict_key_acl.py \
            alembic/versions/i07d8e9f0a29_p3b_registration_legacy_backfill_capabilities.py \
            alembic/versions/j07d8e9f0a2a_p3b_registration_replace_without_upsert_reads.py \
            app/core/aws_kms.py \
            app/core/registration_crypto.py \
            app/repositories/organization_registrations.py \
            app/repositories/organization_registration_mutations.py \
            app/repositories/registration_keys.py \
            app/routers/organizations.py \
            app/services/__init__.py \
            app/services/gym_service.py \
            app/services/organization_registration_service.py \
            app/services/registration_key_service.py \
            scripts/p3b_backfill_legacy_registrations.py \
            tests/test_aws_kms_provider.py \
            tests/test_p3b_legacy_backfill_command.py \
            tests/test_p3b_organization_registration_service.py \
            tests/test_p3b_registration_application_cutover.py \
            tests/test_p3b_registration_create_capability.py \
            tests/test_p3b_registration_crypto.py \
            tests/test_p3b_registration_dek_capabilities.py \
            tests/test_p3b_registration_envelope_storage.py \
            tests/test_p3b_registration_key_repository.py \
            tests/test_p3b_registration_key_service.py \
            tests/test_p3b_registration_legacy_backfill_capabilities.py \
            tests/test_p3b_registration_mutation_repository.py \
            tests/test_p3b_registration_read_boundary.py \
            tests/test_p3b_registration_replace_capability.py \
            tests/test_p3b_registration_replace_conflict_key_acl.py \
            tests/test_p3b_registration_replace_without_upsert_reads.py
          python -m pytest --noconftest -q \
            tests/test_aws_kms_provider.py \
            tests/test_p3b_legacy_backfill_command.py \
            tests/test_p3b_organization_registration_service.py \
            tests/test_p3b_registration_application_cutover.py \
            tests/test_p3b_registration_create_capability.py \
            tests/test_p3b_registration_crypto.py \
            tests/test_p3b_registration_dek_capabilities.py \
            tests/test_p3b_registration_envelope_storage.py \
            tests/test_p3b_registration_key_repository.py \
            tests/test_p3b_registration_key_service.py \
            tests/test_p3b_registration_legacy_backfill_capabilities.py \
            tests/test_p3b_registration_mutation_repository.py \
            tests/test_p3b_registration_read_boundary.py \
            tests/test_p3b_registration_replace_capability.py \
            tests/test_p3b_registration_replace_conflict_key_acl.py \
            tests/test_p3b_registration_replace_without_upsert_reads.py
          python -s scripts/verify_alembic_graph.py
          python -s scripts/migration_semantics_gate.py
