name: P8-O Production-like Observability

on:
  push:
    branches:
      - hardening/p8-observability-operational-response
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p8o-production-like-observability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  P8R_CERTIFIED_HEAD: ecec7c21aa5f70331124796d81aab18b779e64b8
  P8R_CERTIFIED_TREE: 8de69d66087da6fda721479a029078d102cf4437
  SECRET_KEY: ci-p8o-not-production
  AWS_ACCESS_KEY_ID: ci-p8o-not-production
  AWS_SECRET_ACCESS_KEY: ci-p8o-not-production
  S3_BUCKET_NAME: gymflow-p8o-test
  ENVIRONMENT: test
  P8_METRICS_OTLP_ENDPOINT: http://127.0.0.1:4318/v1/metrics
  P8_METRICS_EXPORT_INTERVAL_SECONDS: '1'
  P8_METRICS_EXPORT_TIMEOUT_SECONDS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  operational-signals:
    name: Real PostgreSQL Redis API provider and OTLP observability
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIGRATION_PASSWORD: ci-p8o-migration
      AUTH_RUNTIME_PASSWORD: ci-p8o-auth
      APP_RUNTIME_PASSWORD: ci-p8o-app
      WORKER_RUNTIME_PASSWORD: ci-p8o-worker
      MAINTENANCE_RUNTIME_PASSWORD: ci-p8o-maintenance
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-p8o-migration@127.0.0.1:5432/gymflow_p8o_test
      MAINTENANCE_DATABASE_URL: postgresql+asyncpg://lifecycle_maintenance_test_runtime:ci-p8o-maintenance@127.0.0.1:5432/gymflow_p8o_test
      TEST_DATABASE_URL: postgresql+asyncpg://app_test_runtime:ci-p8o-app@127.0.0.1:5432/gymflow_p8o_test
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-p8o-migration@127.0.0.1:5432/gymflow_p8o_test
      WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:ci-p8o-worker@127.0.0.1:5432/gymflow_p8o_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      P8O_PROCESS_FAULTS: '1'
      P8O_OTLP_CAPTURE_PATH: /tmp/p8o-operational-otlp.jsonl

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Guard certified P8-R parent boundary
        run: |
          set -euo pipefail
          git cat-file -e "${P8R_CERTIFIED_HEAD}^{commit}"
          test "$(git rev-parse "${P8R_CERTIFIED_HEAD}^{tree}")" = "${P8R_CERTIFIED_TREE}"
          git merge-base --is-ancestor "${P8R_CERTIFIED_HEAD}" HEAD

      - name: Install PostgreSQL 16 and exact disposable identities
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          bash scripts/ci/p8o_provision_pg16.sh operational

      - name: Migrate exact current schema head
        run: |
          set -euo pipefail
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | wc -l)" -eq 1
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads

      - name: Start real local OTLP HTTP collector
        run: |
          set -euo pipefail
          python scripts/ci/p8o_otlp_collector.py \
            --capture "${P8O_OTLP_CAPTURE_PATH}" \
            >/tmp/p8o-collector.log 2>&1 &
          echo "$!" >/tmp/p8o-collector.pid
          for _ in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4318/healthz >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/p8o-collector.log
          exit 1

      - name: Seed real P4E durable operational states
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p4e_operational_snapshots_runtime.py

      - name: Prove real production-like signal metric alert runbook chain
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q -s --maxfail=1 \
            tests/test_p8_production_like_observability_runtime.py \
            -k 'not test_20_real_postgresql_stuck_lifecycle_snapshot_crosses_watchdog_boundary and not test_90_real_postgresql_service_outage_emits_disconnect_storm_and_recovers'
          python -m pytest --noconftest -q -s --maxfail=1 \
            tests/test_p8o_stuck_lifecycle_runtime.py
          : > "${P8O_OTLP_CAPTURE_PATH}"
          python -m pytest --noconftest -q -s --maxfail=1 \
            tests/test_p8o_database_disconnect_runtime.py

      - name: Stop OTLP collector and guard exact head
        if: always()
        run: |
          set -euo pipefail
          if test -f /tmp/p8o-collector.pid; then
            kill "$(cat /tmp/p8o-collector.pid)" 2>/dev/null || true
          fi
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code

  dependency-faults:
    name: Real Redis provider-network and PostgreSQL disconnect authority
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIGRATION_PASSWORD: ci-p8o-p5d-migration
      AUTH_RUNTIME_PASSWORD: ci-p8o-p5d-auth
      APP_RUNTIME_PASSWORD: ci-p8o-p5d-app
      WORKER_RUNTIME_PASSWORD: ci-p8o-p5d-worker
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-p8o-p5d-migration@127.0.0.1:5432/gymflow_p5d_test
      TEST_DATABASE_URL: postgresql+psycopg://app_test_runtime:ci-p8o-p5d-app@127.0.0.1:5432/gymflow_p5d_test
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://migration_owner:ci-p8o-p5d-migration@127.0.0.1:5432/gymflow_p5d_test
      WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:ci-p8o-p5d-worker@127.0.0.1:5432/gymflow_p5d_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      P5D_PROCESS_FAULTS: '1'
      P5D_DISPOSABLE_DATABASE: gymflow_p5d_test
      P5D_DISPOSABLE_BROKER: redis-db-1
      P8O_PROCESS_FAULTS: '1'
      P8O_OTLP_CAPTURE_PATH: /tmp/p8o-p5d-otlp.jsonl

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Guard certified P8-R parent boundary
        run: |
          set -euo pipefail
          git cat-file -e "${P8R_CERTIFIED_HEAD}^{commit}"
          test "$(git rev-parse "${P8R_CERTIFIED_HEAD}^{tree}")" = "${P8R_CERTIFIED_TREE}"
          git merge-base --is-ancestor "${P8R_CERTIFIED_HEAD}" HEAD

      - name: Install PostgreSQL 16 and exact P5-D identities
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          bash scripts/ci/p8o_provision_pg16.sh p5d

      - name: Migrate exact current schema head
        run: |
          set -euo pipefail
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | wc -l)" -eq 1
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads

      - name: Start P5-D OTLP evidence collector
        run: |
          set -euo pipefail
          python scripts/ci/p8o_otlp_collector.py \
            --capture "${P8O_OTLP_CAPTURE_PATH}" \
            >/tmp/p8o-p5d-collector.log 2>&1 &
          echo "$!" >/tmp/p8o-p5d-collector.pid
          for _ in $(seq 1 50); do
            curl --fail --silent http://127.0.0.1:4318/healthz >/dev/null && exit 0
            sleep 0.2
          done
          cat /tmp/p8o-p5d-collector.log
          exit 1

      - name: Prove inherited real dependency and provider-ack fault semantics
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q -s --maxfail=1 \
            tests/test_p5d_dependency_loss_runtime.py

      - name: Stop collector and guard exact head
        if: always()
        run: |
          set -euo pipefail
          if test -f /tmp/p8o-p5d-collector.pid; then
            kill "$(cat /tmp/p8o-p5d-collector.pid)" 2>/dev/null || true
          fi
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code

  worker-redelivery:
    name: Real Celery prefork death redelivery and P8 worker metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIGRATION_PASSWORD: ci-p8o-p5w2-migration
      AUTH_RUNTIME_PASSWORD: ci-p8o-p5w2-auth
      APP_RUNTIME_PASSWORD: ci-p8o-p5w2-app
      WORKER_RUNTIME_PASSWORD: ci-p8o-p5w2-worker
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-p8o-p5w2-migration@127.0.0.1:5432/gymflow_p5w2_test
      TEST_DATABASE_URL: postgresql+psycopg://app_test_runtime:ci-p8o-p5w2-app@127.0.0.1:5432/gymflow_p5w2_test
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://migration_owner:ci-p8o-p5w2-migration@127.0.0.1:5432/gymflow_p5w2_test
      WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:ci-p8o-p5w2-worker@127.0.0.1:5432/gymflow_p5w2_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      P5W2_PROCESS_FAULTS: '1'
      P5W2_DISPOSABLE_DATABASE: gymflow_p5w2_test
      P5W2_DISPOSABLE_BROKER: redis-db-1
      P8O_PROCESS_FAULTS: '1'
      P8O_OTLP_CAPTURE_PATH: /tmp/p8o-p5w2-otlp.jsonl

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Guard certified P8-R parent boundary
        run: |
          set -euo pipefail
          git cat-file -e "${P8R_CERTIFIED_HEAD}^{commit}"
          test "$(git rev-parse "${P8R_CERTIFIED_HEAD}^{tree}")" = "${P8R_CERTIFIED_TREE}"
          git merge-base --is-ancestor "${P8R_CERTIFIED_HEAD}" HEAD

      - name: Install PostgreSQL 16 and exact P5-W2 identities
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          bash scripts/ci/p8o_provision_pg16.sh p5w2

      - name: Migrate exact current schema head
        run: |
          set -euo pipefail
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | wc -l)" -eq 1
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads

      - name: Start worker OTLP evidence collector
        run: |
          set -euo pipefail
          python scripts/ci/p8o_otlp_collector.py \
            --capture "${P8O_OTLP_CAPTURE_PATH}" \
            >/tmp/p8o-p5w2-collector.log 2>&1 &
          echo "$!" >/tmp/p8o-p5w2-collector.pid
          for _ in $(seq 1 50); do
            curl --fail --silent http://127.0.0.1:4318/healthz >/dev/null && exit 0
            sleep 0.2
          done
          cat /tmp/p8o-p5w2-collector.log
          exit 1

      - name: Prove real prefork worker death redelivery and convergence
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q -s --maxfail=1 \
            tests/test_p5w2_worker_crash_redelivery_runtime.py
          sleep 3
          python scripts/ci/p8o_verify_worker_capture.py "${P8O_OTLP_CAPTURE_PATH}"

      - name: Stop collector and guard exact head
        if: always()
        run: |
          set -euo pipefail
          if test -f /tmp/p8o-p5w2-collector.pid; then
            kill "$(cat /tmp/p8o-p5w2-collector.pid)" 2>/dev/null || true
          fi
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code

  certification-contract:
    name: P8-O exact-head production-like observability decision
    needs: [operational-signals, dependency-faults, worker-redelivery]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/gymflow_p8o_contract
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Guard certified P8-R parent boundary
        run: |
          set -euo pipefail
          git cat-file -e "${P8R_CERTIFIED_HEAD}^{commit}"
          test "$(git rev-parse "${P8R_CERTIFIED_HEAD}^{tree}")" = "${P8R_CERTIFIED_TREE}"
          git merge-base --is-ancestor "${P8R_CERTIFIED_HEAD}" HEAD

      - name: Compile and validate P8-O proof surface
        run: |
          set -euo pipefail
          python -m json.tool docs/architecture/p8_production_like_observability_contract.json >/dev/null
          python -m py_compile \
            scripts/ci/p8o_otlp_collector.py \
            scripts/ci/p8o_verify_worker_capture.py \
            tests/test_p8_production_like_observability_runtime.py \
            tests/test_p8o_stuck_lifecycle_runtime.py \
            tests/test_p8o_database_disconnect_runtime.py \
            tests/test_p8_production_like_observability_contracts.py

      - name: Reprove P8 prerequisite contracts and inherited runtime boundaries
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p8_governance_contracts.py \
            tests/test_p8_logging_redaction_contracts.py \
            tests/test_p8_metrics_contracts.py \
            tests/test_p8_alert_slo_contracts.py \
            tests/test_p8_runbook_contracts.py \
            tests/test_p6s_scheduler_static_contracts.py \
            tests/test_celery_single_app_boundary.py \
            tests/test_p7_system_drain_contracts.py

      - name: Prove P8-O complete real-failure evidence contract
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p8_production_like_observability_contracts.py

      - name: Emit exact-head P8-O decision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          echo 'P8_PRODUCTION_LIKE_OBSERVABILITY=PASS'
          echo 'P8_REAL_DEPENDENCY_FAILURE_INJECTION=PASS'
          echo 'P8_REAL_WORKER_REDELIVERY_OBSERVABILITY=PASS'
          echo 'P8_REAL_OTLP_EXPORT=PASS'
          echo 'P8_AUTHORITY_SURVIVES_OBSERVABILITY_FAILURE=PASS'
          echo 'P8_OBSERVABILITY_NON_AUTHORITATIVE=PASS'
          echo 'P8_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'
