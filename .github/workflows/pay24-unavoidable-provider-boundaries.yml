name: PAY-24 Unavoidable Provider Boundaries

on:
  push:
    branches:
      - hardening/pay24-unavoidable-provider-boundaries
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay24-provider-boundaries-${{ github.ref }}
  cancel-in-progress: false

env:
  PAY24_CERTIFIED_APPLICATION_SHA: 2ff924da83f4a9b246abc733ec4299ac669b5df1
  PAY24_CERTIFIED_APPLICATION_TREE: cf692fb89221f58fdcc2abd44b466a28d54f81a3
  PAY24_ALEMBIC_HEAD: zz87d8e9f0a68
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  pay24-scope-static:
    name: PAY24 exact application freeze and checkout contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://pay24_app:unused@127.0.0.1:1/pay24_static
      AUTH_DATABASE_URL: postgresql+asyncpg://pay24_auth:unused@127.0.0.1:1/pay24_static
      FINANCE_PAYMENT_DATABASE_URL: postgresql+asyncpg://pay24_payment:unused@127.0.0.1:1/pay24_static
      REDIS_URL: redis://127.0.0.1:1/0
      CELERY_BROKER_URL: redis://127.0.0.1:1/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:1/2
      SECRET_KEY: pay24-ci-static-not-production
      AWS_ACCESS_KEY_ID: pay24-ci
      AWS_SECRET_ACCESS_KEY: pay24-ci

    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Bind evidence-only chain to certified application
        run: |
          set -euo pipefail

          git merge-base --is-ancestor \
            "$PAY24_CERTIFIED_APPLICATION_SHA" \
            HEAD

          test "$(git rev-parse "$PAY24_CERTIFIED_APPLICATION_SHA^{tree}")" \
            = "$PAY24_CERTIFIED_APPLICATION_TREE"

          git diff --name-only \
            "$PAY24_CERTIFIED_APPLICATION_SHA...HEAD" \
            | LC_ALL=C sort \
            > /tmp/pay24-ci-delta.txt

          printf '%s\n' \
            '.github/workflows/pay24-unavoidable-provider-boundaries.yml' \
            > /tmp/pay24-ci-expected.txt

          diff -u \
            /tmp/pay24-ci-expected.txt \
            /tmp/pay24-ci-delta.txt

          echo "PAY24_EXACT_APPLICATION_SHA=$PAY24_CERTIFIED_APPLICATION_SHA"
          echo "PAY24_CI_EVIDENCE_CHAIN_SCOPE=PASS"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install locked test environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check

      - name: Compile PAY24 surface
        run: |
          python -m py_compile \
            alembic/versions/zz57d8e9f0a65_pay24a_durable_activation_authority.py \
            alembic/versions/zz67d8e9f0a66_pay24b_checkout_admission_bridge.py \
            alembic/versions/zz77d8e9f0a67_pay24b_ri1b1_claim_finish_expand.py \
            alembic/versions/zz87d8e9f0a68_pay24b_ri1b3_claim_finish_contract.py \
            app/core/config.py \
            app/core/database.py \
            app/core/payment_database.py \
            app/core/runtime_principal_attestation.py \
            app/finance_core/api/payment_boundary.py \
            app/finance_core/services/checkout_orchestration.py \
            app/finance_core/services/member_subscription_checkout.py \
            app/payment_activation/authority.py \
            app/routers/member_subscriptions_v2.py \
            tests/finance_core/payment_database.py \
            tests/finance_core/test_pay17_fault_injection_concurrency.py \
            tests/finance_core/test_phase6c_checkout_orchestration.py \
            tests/test_migration_app_secure_owner_context_boundary.py \
            tests/test_p4d_refund_authority_static_contracts.py \
            tests/test_pay24b_b1b_member_checkout_payment_identity_static.py \
            tests/test_pay24b_b1b_member_checkout_runtime_composition.py \
            tests/test_pay24b_checkout_admission_static.py \
            tests/test_pay24b_payment_runtime_identity_static.py \
            tests/test_pay24b_ri1b2_route_runtime_composition.py \
            tests/test_pay24b_ri1b3_claim_finish_contract_static.py

      - name: Prove exact PAY24 static and ASGI route contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest --noconftest -q \
            tests/test_pay24b_b1b_member_checkout_payment_identity_static.py \
            tests/test_pay24b_b1b_member_checkout_runtime_composition.py \
            tests/test_pay24b_ri1b3_claim_finish_contract_static.py \
            tests/test_pay24b_ri1b2_route_runtime_composition.py \
            tests/test_pay24b_ri1b2_http_payment_identity_wiring_static.py \
            tests/test_pay24b_ri1b1_claim_finish_expand_static.py \
            tests/test_pay24b_checkout_admission_static.py \
            tests/test_pay24b_payment_runtime_identity_static.py \
            tests/test_pay8_durable_checkout_webhooks_static.py \
            tests/test_p4d_refund_authority_static_contracts.py \
            tests/test_migration_app_secure_owner_context_boundary.py \
            tests/test_auth_database_boundary.py \
            tests/test_lifecycle_maintenance_runtime_boundary.py \
            tests/test_pay2_financial_authority_static_contracts.py \
            tests/test_process_database_profile_boundary.py \
            tests/test_process_profile_deployment_contract.py \
            tests/test_runtime_binding_alignment.py \
            tests/test_runtime_principal_attestation.py

          echo "PAY24_RI1B3_STATIC_AND_ROUTE_COMPOSITION=PASS"
          echo "PAY24_REAL_PROVIDER_CALLS=0"
          echo "PAY24_REAL_MONEY_MOVEMENT=0"

  pay24-pg16:
    name: PAY24 fresh PG16 identity migration and authority matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      MIGRATION_PASSWORD: ci-pay24-migration
      PAYMENT_PASSWORD: ci-pay24-payment
      APP_PASSWORD: ci-pay24-app
      AUTH_PASSWORD: ci-pay24-auth

      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay24-migration@127.0.0.1:5432/gymflow_pay24_ci
      AUTH_DATABASE_URL: postgresql+asyncpg://pay24_auth_deployment:ci-pay24-auth@127.0.0.1:5432/gymflow_pay24_ci
      FINANCE_PAYMENT_DATABASE_URL: postgresql+asyncpg://finance_payment_deployment:ci-pay24-payment@127.0.0.1:5432/gymflow_pay24_ci

      DOERS_CLUSTER_VERIFY_DATABASE_URL: postgresql+psycopg://migration_owner:ci-pay24-migration@127.0.0.1:5432/postgres

      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: pay24-ci-runtime-not-production
      AWS_ACCESS_KEY_ID: pay24-ci
      AWS_SECRET_ACCESS_KEY: pay24-ci
      ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Bind to certified application ancestor
        run: |
          set -euo pipefail
          git merge-base --is-ancestor \
            "$PAY24_CERTIFIED_APPLICATION_SHA" \
            HEAD
          test "$(git rev-parse "$PAY24_CERTIFIED_APPLICATION_SHA^{tree}")" \
            = "$PAY24_CERTIFIED_APPLICATION_TREE"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check

      - name: Install PostgreSQL 16
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-16 \
            postgresql-client-16 \
            postgresql-contrib \
            postgresql-16-partman \
            postgresql-16-postgis-3
          sudo systemctl start postgresql
          pg_config --version
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 \
            -d postgres -c 'SELECT version();'

      - name: Bootstrap canonical capability roles
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap_cluster_roles.sh

          python -c "import json, pathlib; data=json.loads(pathlib.Path('security/cluster_role_bootstrap/roles.v1.json').read_text()); assert 'finance_payment_runtime' in data['managed_roles']"

          echo "PAY24_CANONICAL_PAYMENT_CAPABILITY_BOOTSTRAP=PASS"

      - name: Provision isolated PAY24 deployment logins
        run: |
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-pay24-migration';

          CREATE ROLE finance_payment_deployment
            LOGIN PASSWORD 'ci-pay24-payment'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;

          ALTER ROLE finance_payment_deployment SET row_security = 'on';
          ALTER ROLE finance_payment_deployment SET statement_timeout = '15s';
          ALTER ROLE finance_payment_deployment SET lock_timeout = '2s';
          ALTER ROLE finance_payment_deployment
            SET idle_in_transaction_session_timeout = '30s';

          GRANT finance_payment_runtime
            TO finance_payment_deployment
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;

          CREATE ROLE pay24_app_deployment
            LOGIN PASSWORD 'ci-pay24-app'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;

          ALTER ROLE pay24_app_deployment SET row_security = 'on';
          ALTER ROLE pay24_app_deployment SET statement_timeout = '5s';
          ALTER ROLE pay24_app_deployment SET lock_timeout = '2s';
          ALTER ROLE pay24_app_deployment
            SET idle_in_transaction_session_timeout = '15s';

          GRANT app_runtime
            TO pay24_app_deployment
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;

          GRANT app_user
            TO pay24_app_deployment
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;

          CREATE ROLE pay24_auth_deployment
            LOGIN PASSWORD 'ci-pay24-auth'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;

          GRANT auth_runtime
            TO pay24_auth_deployment
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;

          CREATE DATABASE gymflow_pay24_ci OWNER migration_owner;

          GRANT CONNECT ON DATABASE gymflow_pay24_ci
            TO finance_payment_deployment,
               pay24_app_deployment,
               pay24_auth_deployment;
          SQL

      - name: Provision infrastructure-owned extensions
        run: |
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 \
            -d gymflow_pay24_ci <<'SQL'
          CREATE SCHEMA IF NOT EXISTS partman AUTHORIZATION postgres;
          CREATE EXTENSION IF NOT EXISTS pg_partman SCHEMA partman;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE EXTENSION IF NOT EXISTS citext;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS postgis;

          GRANT USAGE ON SCHEMA partman TO migration_owner;
          GRANT SELECT, INSERT, UPDATE, DELETE
            ON ALL TABLES IN SCHEMA partman
            TO migration_owner;
          GRANT USAGE, SELECT, UPDATE
            ON ALL SEQUENCES IN SCHEMA partman
            TO migration_owner;
          GRANT EXECUTE
            ON ALL FUNCTIONS IN SCHEMA partman
            TO migration_owner;
          GRANT EXECUTE
            ON ALL PROCEDURES IN SCHEMA partman
            TO migration_owner;
          SQL

      - name: Verify canonical role contract
        run: |
          bash scripts/ci/verify_cluster_roles.sh

      - name: Fresh migration to RI1B1 dual-authority baseline
        run: |
          set -euo pipefail

          python -s -m alembic -c alembic.ini \
            upgrade zz77d8e9f0a67

          DB_REV="$(
            PGPASSWORD="$MIGRATION_PASSWORD" \
            psql -X -At \
              -h 127.0.0.1 \
              -U migration_owner \
              -d gymflow_pay24_ci \
              -c 'SELECT version_num FROM alembic_version'
          )"

          test "$DB_REV" = "zz77d8e9f0a67"

          echo "PAY24_RI1B1_FRESH_PG16_BASELINE=PASS"

      - name: Prove PAY8 and PAY24 authority matrix
        run: |
          PGPASSWORD="$MIGRATION_PASSWORD" \
          psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U migration_owner \
            -d gymflow_pay24_ci <<'SQL'
          DO $$
          DECLARE
            fn oid;
            n integer;
          BEGIN
            SELECT count(*)
              INTO n
              FROM pg_catalog.pg_proc p
              JOIN pg_catalog.pg_namespace ns
                ON ns.oid = p.pronamespace
             WHERE ns.nspname = 'app_secure'
               AND p.proname = 'reserve_finance_provider_operation';

            IF n <> 1 THEN
              RAISE EXCEPTION 'reserve function cardinality drift';
            END IF;

            SELECT p.oid
              INTO fn
              FROM pg_catalog.pg_proc p
              JOIN pg_catalog.pg_namespace ns
                ON ns.oid = p.pronamespace
             WHERE ns.nspname = 'app_secure'
               AND p.proname = 'reserve_finance_provider_operation';

            IF NOT pg_catalog.has_function_privilege(
                'app_runtime', fn, 'EXECUTE'
            ) OR pg_catalog.has_function_privilege(
                'finance_payment_runtime', fn, 'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'reserve authority broadened';
            END IF;

            SELECT count(*)
              INTO n
              FROM pg_catalog.pg_proc p
              JOIN pg_catalog.pg_namespace ns
                ON ns.oid = p.pronamespace
             WHERE ns.nspname = 'app_secure'
               AND p.proname = 'claim_finance_provider_operation';

            IF n <> 1 THEN
              RAISE EXCEPTION 'claim function cardinality drift';
            END IF;

            SELECT p.oid
              INTO fn
              FROM pg_catalog.pg_proc p
              JOIN pg_catalog.pg_namespace ns
                ON ns.oid = p.pronamespace
             WHERE ns.nspname = 'app_secure'
               AND p.proname = 'claim_finance_provider_operation';

            IF NOT pg_catalog.has_function_privilege(
                'app_runtime', fn, 'EXECUTE'
            ) OR NOT pg_catalog.has_function_privilege(
                'finance_payment_runtime', fn, 'EXECUTE'
            ) OR pg_catalog.has_function_privilege(
                'auth_runtime', fn, 'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'claim dual-authority matrix drift';
            END IF;

            SELECT count(*)
              INTO n
              FROM pg_catalog.pg_proc p
              JOIN pg_catalog.pg_namespace ns
                ON ns.oid = p.pronamespace
             WHERE ns.nspname = 'app_secure'
               AND p.proname = 'finish_finance_provider_operation';

            IF n <> 1 THEN
              RAISE EXCEPTION 'finish function cardinality drift';
            END IF;

            SELECT p.oid
              INTO fn
              FROM pg_catalog.pg_proc p
              JOIN pg_catalog.pg_namespace ns
                ON ns.oid = p.pronamespace
             WHERE ns.nspname = 'app_secure'
               AND p.proname = 'finish_finance_provider_operation';

            IF NOT pg_catalog.has_function_privilege(
                'app_runtime', fn, 'EXECUTE'
            ) OR NOT pg_catalog.has_function_privilege(
                'finance_payment_runtime', fn, 'EXECUTE'
            ) OR pg_catalog.has_function_privilege(
                'auth_runtime', fn, 'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'finish dual-authority matrix drift';
            END IF;

            SELECT count(*)
              INTO n
              FROM pg_catalog.pg_proc p
              JOIN pg_catalog.pg_namespace ns
                ON ns.oid = p.pronamespace
             WHERE ns.nspname = 'app_secure'
               AND p.proname = 'reconcile_finance_provider_operation';

            IF n <> 1 THEN
              RAISE EXCEPTION 'reconcile function cardinality drift';
            END IF;

            SELECT p.oid
              INTO fn
              FROM pg_catalog.pg_proc p
              JOIN pg_catalog.pg_namespace ns
                ON ns.oid = p.pronamespace
             WHERE ns.nspname = 'app_secure'
               AND p.proname = 'reconcile_finance_provider_operation';

            IF pg_catalog.has_function_privilege(
                'app_runtime', fn, 'EXECUTE'
            ) OR pg_catalog.has_function_privilege(
                'finance_payment_runtime', fn, 'EXECUTE'
            ) OR NOT pg_catalog.has_function_privilege(
                'finance_reconciliation_runtime', fn, 'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'reconcile authority drift';
            END IF;

            SELECT count(*)
              INTO n
              FROM pg_catalog.pg_proc p
              JOIN pg_catalog.pg_namespace ns
                ON ns.oid = p.pronamespace
             WHERE ns.nspname = 'app_secure'
               AND p.proname =
                   'pay24b_request_current_provider_admission';

            IF n <> 1 THEN
              RAISE EXCEPTION 'PAY24 bridge cardinality drift';
            END IF;

            SELECT p.oid
              INTO fn
              FROM pg_catalog.pg_proc p
              JOIN pg_catalog.pg_namespace ns
                ON ns.oid = p.pronamespace
             WHERE ns.nspname = 'app_secure'
               AND p.proname =
                   'pay24b_request_current_provider_admission';

            IF pg_catalog.has_function_privilege(
                'app_runtime', fn, 'EXECUTE'
            ) OR NOT pg_catalog.has_function_privilege(
                'finance_payment_runtime', fn, 'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'PAY24 bridge identity drift';
            END IF;

            IF pg_catalog.pg_has_role(
                'app_runtime',
                'finance_payment_runtime',
                'MEMBER'
            ) OR pg_catalog.pg_has_role(
                'app_runtime',
                'finance_payment_runtime',
                'SET'
            ) THEN
              RAISE EXCEPTION
                'app_runtime can reach finance_payment_runtime';
            END IF;
          END
          $$;
          SQL

          echo "PAY24_RI1B1_DUAL_AUTHORITY_MATRIX=PASS"
          echo "PAY24_APP_RUNTIME_PAYMENT_REACHABILITY=0"


      - name: Prove RI1B3 contraction downgrade and re-upgrade
        run: |
          set -euo pipefail

          ORG="b1300000-0000-4000-8000-000000000001"
          ENTITY="b1300000-0000-4000-8000-000000000011"
          PAYMENT="b1300000-0000-4000-8000-000000000021"

          LEASE1="b1300000-0000-4000-8000-000000000031"
          LEASE2="b1300000-0000-4000-8000-000000000032"
          LEASE3="b1300000-0000-4000-8000-000000000033"

          REQUEST_HASH="$(printf 'a%.0s' {1..64})"

          RESERVE_SIG="app_secure.reserve_finance_provider_operation(uuid,text,text,text,text,text)"
          CLAIM_SIG="app_secure.claim_finance_provider_operation(uuid,uuid)"
          FINISH_SIG="app_secure.finish_finance_provider_operation(uuid,uuid,bigint,text,text,text,text)"
          RECON_SIG="app_secure.reconcile_finance_provider_operation(uuid,text,text,text,text)"

          sql_admin() {
            sudo -u postgres \
              psql -X -v ON_ERROR_STOP=1 \
                -d gymflow_pay24_ci "$@"
          }

          authority_vector() {
            sql_admin -AtF '|' -c "
              SELECT
                pg_catalog.has_function_privilege(
                  'app_runtime','$RESERVE_SIG','EXECUTE'
                ),
                pg_catalog.has_function_privilege(
                  'finance_payment_runtime','$RESERVE_SIG','EXECUTE'
                ),
                pg_catalog.has_function_privilege(
                  'app_runtime','$CLAIM_SIG','EXECUTE'
                ),
                pg_catalog.has_function_privilege(
                  'finance_payment_runtime','$CLAIM_SIG','EXECUTE'
                ),
                pg_catalog.has_function_privilege(
                  'app_runtime','$FINISH_SIG','EXECUTE'
                ),
                pg_catalog.has_function_privilege(
                  'finance_payment_runtime','$FINISH_SIG','EXECUTE'
                ),
                pg_catalog.has_function_privilege(
                  'app_runtime','$RECON_SIG','EXECUTE'
                ),
                pg_catalog.has_function_privilege(
                  'finance_payment_runtime','$RECON_SIG','EXECUTE'
                ),
                pg_catalog.has_function_privilege(
                  'finance_reconciliation_runtime','$RECON_SIG','EXECUTE'
                );
            "
          }

          BASELINE_VECTOR="$(authority_vector)"
          test "$BASELINE_VECTOR" = "t|f|t|t|t|t|f|f|t"

          BASE_CLAIM_MD5="$(
            sql_admin -At -c "
              SELECT pg_catalog.md5(
                pg_catalog.pg_get_functiondef(
                  '$CLAIM_SIG'::pg_catalog.regprocedure
                )
              );
            "
          )"

          BASE_FINISH_MD5="$(
            sql_admin -At -c "
              SELECT pg_catalog.md5(
                pg_catalog.pg_get_functiondef(
                  '$FINISH_SIG'::pg_catalog.regprocedure
                )
              );
            "
          )"

          BASE_RESERVE_MD5="$(
            sql_admin -At -c "
              SELECT pg_catalog.md5(
                pg_catalog.pg_get_functiondef(
                  '$RESERVE_SIG'::pg_catalog.regprocedure
                )
              );
            "
          )"

          BASE_RECON_MD5="$(
            sql_admin -At -c "
              SELECT pg_catalog.md5(
                pg_catalog.pg_get_functiondef(
                  '$RECON_SIG'::pg_catalog.regprocedure
                )
              );
            "
          )"

          sql_admin <<SQL
          INSERT INTO public.organizations(
              id,
              name,
              slug,
              tier,
              is_active,
              max_branches,
              default_currency_code
          )
          VALUES (
              '$ORG',
              'PAY24 RI1B3 CI Org',
              'pay24-ri1b3-ci-org',
              'basic',
              true,
              10,
              'INR'
          );

          INSERT INTO finance.legal_entities(
              id,
              code,
              legal_name,
              status
          )
          VALUES (
              '$ENTITY',
              'PAY24_RI1B3',
              'PAY24 RI1B3 CI Entity',
              'active'
          );

          INSERT INTO finance.payments(
              id,
              organization_id,
              legal_entity_id,
              provider_code,
              amount,
              currency_code,
              status
          )
          VALUES (
              '$PAYMENT',
              '$ORG',
              '$ENTITY',
              'runtime_provider',
              100.00,
              'INR',
              'created'
          );
          SQL

          RESERVE_OUT="$(
            PGPASSWORD="$APP_PASSWORD" \
            psql -X -AtF '|' -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 \
              -U pay24_app_deployment \
              -d gymflow_pay24_ci \
              -c "
                SELECT pg_catalog.set_config(
                  'app.current_org_id',
                  '$ORG',
                  false
                );

                SELECT
                  operation_id,
                  status,
                  COALESCE(provider_object_id,''),
                  attempt_count,
                  replayed
                FROM app_secure.reserve_finance_provider_operation(
                  '$PAYMENT'::uuid,
                  'runtime_provider',
                  'sandbox',
                  'create_checkout',
                  'ri1b3-ci-runtime',
                  '$REQUEST_HASH'
                );
              " \
            | tail -n 1
          )"

          OP_ID="$(printf '%s' "$RESERVE_OUT" | cut -d '|' -f1)"

          test "$(printf '%s' "$RESERVE_OUT" | cut -d '|' -f2)" = reserved
          test "$(printf '%s' "$RESERVE_OUT" | cut -d '|' -f4)" = 0
          test "$(printf '%s' "$RESERVE_OUT" | cut -d '|' -f5)" = f

          python -s -m alembic -c alembic.ini \
            upgrade "$PAY24_ALEMBIC_HEAD"

          test "$(
            sql_admin -At \
              -c 'SELECT version_num FROM alembic_version'
          )" = "$PAY24_ALEMBIC_HEAD"

          CONTRACT_VECTOR="$(authority_vector)"

          echo "RI1B3_CONTRACT_VECTOR=$CONTRACT_VECTOR"

          test "$CONTRACT_VECTOR" = "t|f|f|t|f|t|f|f|t"

          CONTRACT_CLAIM_MD5="$(
            sql_admin -At -c "
              SELECT pg_catalog.md5(
                pg_catalog.pg_get_functiondef(
                  '$CLAIM_SIG'::pg_catalog.regprocedure
                )
              );
            "
          )"

          CONTRACT_FINISH_MD5="$(
            sql_admin -At -c "
              SELECT pg_catalog.md5(
                pg_catalog.pg_get_functiondef(
                  '$FINISH_SIG'::pg_catalog.regprocedure
                )
              );
            "
          )"

          test "$CONTRACT_CLAIM_MD5" != "$BASE_CLAIM_MD5"
          test "$CONTRACT_FINISH_MD5" != "$BASE_FINISH_MD5"

          test "$(
            sql_admin -At -c "
              SELECT pg_catalog.md5(
                pg_catalog.pg_get_functiondef(
                  '$RESERVE_SIG'::pg_catalog.regprocedure
                )
              );
            "
          )" = "$BASE_RESERVE_MD5"

          test "$(
            sql_admin -At -c "
              SELECT pg_catalog.md5(
                pg_catalog.pg_get_functiondef(
                  '$RECON_SIG'::pg_catalog.regprocedure
                )
              );
            "
          )" = "$BASE_RECON_MD5"

          expect_denied() {
            LOGIN="$1"
            PASSWORD="$2"
            LABEL="$3"
            SQL_BODY="$4"

            set +e

            PGPASSWORD="$PASSWORD" \
            psql -X -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 \
              -U "$LOGIN" \
              -d gymflow_pay24_ci \
              -c "
                SELECT pg_catalog.set_config(
                  'app.current_org_id',
                  '$ORG',
                  false
                );

                $SQL_BODY
              " \
              >"/tmp/$LABEL.out" \
              2>"/tmp/$LABEL.err"

            RC=$?

            set -e

            test "$RC" -ne 0

            grep -Eqi \
              'permission denied for function|permission denied' \
              "/tmp/$LABEL.err"
          }

          expect_denied \
            pay24_app_deployment \
            "$APP_PASSWORD" \
            ri1b3-app-claim \
            "SELECT * FROM app_secure.claim_finance_provider_operation(
               '$OP_ID'::uuid,
               '$LEASE1'::uuid
             );"

          expect_denied \
            pay24_app_deployment \
            "$APP_PASSWORD" \
            ri1b3-app-finish \
            "SELECT * FROM app_secure.finish_finance_provider_operation(
               '$OP_ID'::uuid,
               '$LEASE1'::uuid,
               1,
               'failed_retryable',
               NULL,
               'ri1b3_ci',
               NULL
             );"

          expect_denied \
            finance_payment_deployment \
            "$PAYMENT_PASSWORD" \
            ri1b3-payment-reserve \
            "SELECT * FROM app_secure.reserve_finance_provider_operation(
               '$PAYMENT'::uuid,
               'runtime_provider',
               'sandbox',
               'create_checkout',
               'ri1b3-payment-reserve-denied',
               '$REQUEST_HASH'
             );"

          CLAIM1="$(
            PGPASSWORD="$PAYMENT_PASSWORD" \
            psql -X -AtF '|' -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 \
              -U finance_payment_deployment \
              -d gymflow_pay24_ci \
              -c "
                SELECT pg_catalog.set_config(
                  'app.current_org_id',
                  '$ORG',
                  false
                );

                SELECT
                  operation_id,
                  status,
                  lease_fence,
                  COALESCE(provider_object_id,''),
                  attempt_count,
                  claimed
                FROM app_secure.claim_finance_provider_operation(
                  '$OP_ID'::uuid,
                  '$LEASE1'::uuid
                );
              " \
            | tail -n 1
          )"

          test "$(printf '%s' "$CLAIM1" | cut -d '|' -f2)" = in_flight
          test "$(printf '%s' "$CLAIM1" | cut -d '|' -f5)" = 1
          test "$(printf '%s' "$CLAIM1" | cut -d '|' -f6)" = t

          FENCE1="$(printf '%s' "$CLAIM1" | cut -d '|' -f3)"

          FINISH1="$(
            PGPASSWORD="$PAYMENT_PASSWORD" \
            psql -X -AtF '|' -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 \
              -U finance_payment_deployment \
              -d gymflow_pay24_ci \
              -c "
                SELECT pg_catalog.set_config(
                  'app.current_org_id',
                  '$ORG',
                  false
                );

                SELECT
                  operation_id,
                  status,
                  COALESCE(provider_object_id,''),
                  attempt_count
                FROM app_secure.finish_finance_provider_operation(
                  '$OP_ID'::uuid,
                  '$LEASE1'::uuid,
                  $FENCE1,
                  'failed_retryable',
                  NULL,
                  'ri1b3_ci',
                  NULL
                );
              " \
            | tail -n 1
          )"

          test "$(printf '%s' "$FINISH1" | cut -d '|' -f2)" = failed_retryable

          python -s -m alembic -c alembic.ini \
            downgrade zz77d8e9f0a67

          test "$(
            sql_admin -At \
              -c 'SELECT version_num FROM alembic_version'
          )" = zz77d8e9f0a67

          DOWNGRADE_VECTOR="$(authority_vector)"

          test "$DOWNGRADE_VECTOR" = "$BASELINE_VECTOR"

          test "$(
            sql_admin -At -c "
              SELECT pg_catalog.md5(
                pg_catalog.pg_get_functiondef(
                  '$CLAIM_SIG'::pg_catalog.regprocedure
                )
              );
            "
          )" = "$BASE_CLAIM_MD5"

          test "$(
            sql_admin -At -c "
              SELECT pg_catalog.md5(
                pg_catalog.pg_get_functiondef(
                  '$FINISH_SIG'::pg_catalog.regprocedure
                )
              );
            "
          )" = "$BASE_FINISH_MD5"

          APP_CLAIM="$(
            PGPASSWORD="$APP_PASSWORD" \
            psql -X -AtF '|' -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 \
              -U pay24_app_deployment \
              -d gymflow_pay24_ci \
              -c "
                SELECT pg_catalog.set_config(
                  'app.current_org_id',
                  '$ORG',
                  false
                );

                SELECT
                  operation_id,
                  status,
                  lease_fence,
                  COALESCE(provider_object_id,''),
                  attempt_count,
                  claimed
                FROM app_secure.claim_finance_provider_operation(
                  '$OP_ID'::uuid,
                  '$LEASE2'::uuid
                );
              " \
            | tail -n 1
          )"

          test "$(printf '%s' "$APP_CLAIM" | cut -d '|' -f2)" = in_flight
          test "$(printf '%s' "$APP_CLAIM" | cut -d '|' -f6)" = t

          APP_FENCE="$(printf '%s' "$APP_CLAIM" | cut -d '|' -f3)"

          PGPASSWORD="$APP_PASSWORD" \
          psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U pay24_app_deployment \
            -d gymflow_pay24_ci \
            -c "
              SELECT pg_catalog.set_config(
                'app.current_org_id',
                '$ORG',
                false
              );

              SELECT *
              FROM app_secure.finish_finance_provider_operation(
                '$OP_ID'::uuid,
                '$LEASE2'::uuid,
                $APP_FENCE,
                'failed_retryable',
                NULL,
                'ri1b3_ci',
                NULL
              );
            "

          python -s -m alembic -c alembic.ini \
            upgrade "$PAY24_ALEMBIC_HEAD"

          test "$(
            sql_admin -At \
              -c 'SELECT version_num FROM alembic_version'
          )" = "$PAY24_ALEMBIC_HEAD"

          REUPGRADE_VECTOR="$(authority_vector)"

          test "$REUPGRADE_VECTOR" = "$CONTRACT_VECTOR"

          test "$(
            sql_admin -At -c "
              SELECT pg_catalog.md5(
                pg_catalog.pg_get_functiondef(
                  '$CLAIM_SIG'::pg_catalog.regprocedure
                )
              );
            "
          )" = "$CONTRACT_CLAIM_MD5"

          test "$(
            sql_admin -At -c "
              SELECT pg_catalog.md5(
                pg_catalog.pg_get_functiondef(
                  '$FINISH_SIG'::pg_catalog.regprocedure
                )
              );
            "
          )" = "$CONTRACT_FINISH_MD5"

          expect_denied \
            pay24_app_deployment \
            "$APP_PASSWORD" \
            ri1b3-app-reupgrade \
            "SELECT * FROM app_secure.claim_finance_provider_operation(
               '$OP_ID'::uuid,
               '$LEASE3'::uuid
             );"

          CLAIM3="$(
            PGPASSWORD="$PAYMENT_PASSWORD" \
            psql -X -AtF '|' -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 \
              -U finance_payment_deployment \
              -d gymflow_pay24_ci \
              -c "
                SELECT pg_catalog.set_config(
                  'app.current_org_id',
                  '$ORG',
                  false
                );

                SELECT
                  operation_id,
                  status,
                  lease_fence,
                  COALESCE(provider_object_id,''),
                  attempt_count,
                  claimed
                FROM app_secure.claim_finance_provider_operation(
                  '$OP_ID'::uuid,
                  '$LEASE3'::uuid
                );
              " \
            | tail -n 1
          )"

          test "$(printf '%s' "$CLAIM3" | cut -d '|' -f2)" = in_flight
          test "$(printf '%s' "$CLAIM3" | cut -d '|' -f6)" = t

          FENCE3="$(printf '%s' "$CLAIM3" | cut -d '|' -f3)"

          PGPASSWORD="$PAYMENT_PASSWORD" \
          psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U finance_payment_deployment \
            -d gymflow_pay24_ci \
            -c "
              SELECT pg_catalog.set_config(
                'app.current_org_id',
                '$ORG',
                false
              );

              SELECT *
              FROM app_secure.finish_finance_provider_operation(
                '$OP_ID'::uuid,
                '$LEASE3'::uuid,
                $FENCE3,
                'failed_retryable',
                NULL,
                'ri1b3_ci',
                NULL
              );
            "

          FINAL_VECTOR="$(
            sql_admin -AtF '|' -c "
              SELECT
                status,
                attempt_count,
                COALESCE(provider_object_id,''),
                COALESCE(provider_evidence_sha256::text,'')
              FROM finance.provider_operations
              WHERE id='$OP_ID'::uuid;
            "
          )"

          test "$FINAL_VECTOR" = "failed_retryable|3||"

          echo "PAY24_RI1B3_ZZ77_TO_ZZ87=PASS"
          echo "PAY24_RI1B3_APP_RUNTIME_CLAIM_DENIED=PASS"
          echo "PAY24_RI1B3_APP_RUNTIME_FINISH_DENIED=PASS"
          echo "PAY24_RI1B3_PAYMENT_RUNTIME_CLAIM_FINISH=PASS"
          echo "PAY24_RI1B3_RESERVE_APP_ONLY=PASS"
          echo "PAY24_RI1B3_RECONCILIATION_ISOLATED=PASS"
          echo "PAY24_RI1B3_ZZ87_TO_ZZ77_EXACT_RESTORE=PASS"
          echo "PAY24_RI1B3_ZZ77_TO_ZZ87_REUPGRADE=PASS"
          echo "PAY24_RI1B3_REUPGRADE_EQUIVALENCE=PASS"
          echo "PAY24_REAL_PROVIDER_CALLS=0"
          echo "PAY24_REAL_MONEY_MOVEMENT=0"

      - name: Prove isolated payment deployment session
        run: |
          set -euo pipefail

          PAYMENT_VECTOR="$(
            PGPASSWORD="$PAYMENT_PASSWORD" \
            psql -X -AtF '|' \
              -h 127.0.0.1 \
              -U finance_payment_deployment \
              -d gymflow_pay24_ci \
              -c "
                SELECT
                  session_user,
                  current_user,
                  current_setting('row_security'),
                  current_setting('statement_timeout'),
                  current_setting('lock_timeout'),
                  current_setting(
                    'idle_in_transaction_session_timeout'
                  );
              "
          )"

          echo "PAYMENT_SESSION_VECTOR=$PAYMENT_VECTOR"

          test "$PAYMENT_VECTOR" \
            = "finance_payment_deployment|finance_payment_deployment|on|15s|2s|30s"

          MEMBERSHIP="$(
            sudo -u postgres psql -X -AtF '|' \
              -d postgres \
              -c "
                SELECT
                  am.admin_option,
                  am.inherit_option,
                  am.set_option
                FROM pg_catalog.pg_auth_members am
                JOIN pg_catalog.pg_roles granted
                  ON granted.oid = am.roleid
                JOIN pg_catalog.pg_roles member
                  ON member.oid = am.member
                WHERE granted.rolname =
                        'finance_payment_runtime'
                  AND member.rolname =
                        'finance_payment_deployment';
              "
          )"

          echo "PAYMENT_MEMBERSHIP_VECTOR=$MEMBERSHIP"
          test "$MEMBERSHIP" = "f|t|f"

          echo "PAY24_REAL_PAYMENT_SESSION=PASS"

      - name: Prove pristine Stage-0 posture
        run: |
          PGPASSWORD="$MIGRATION_PASSWORD" \
          psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U migration_owner \
            -d gymflow_pay24_ci <<'SQL'
          BEGIN;
          SET LOCAL ROLE app_security_owner;

          DO $$
          DECLARE
            r record;
          BEGIN
            SELECT *
              INTO r
              FROM finance.payment_activation_authority;

            IF r.generation <> 0
               OR r.stage <> 0
               OR r.provider_egress_state <> 'blocked'
               OR r.internal_organization_id IS NOT NULL
               OR r.checkout
               OR r.webhooks
               OR r.payment_application
               OR r.subscription_activation
               OR r.refund_execution
               OR r.recurring_billing
               OR r.dunning
               OR r.platform_billing
            THEN
              RAISE EXCEPTION 'PAY24 Stage0 posture drift';
            END IF;

            IF EXISTS (
              SELECT 1
              FROM finance.provider_admission_leases
            ) THEN
              RAISE EXCEPTION
                'unexpected provider admission during CI';
            END IF;
          END
          $$;

          ROLLBACK;
          SQL

          echo "PAY24_STAGE0_FAIL_CLOSED_POSTURE=PASS"
          echo "PAY24_PROVIDER_ADMISSIONS_CREATED=0"
          echo "PAY24_REAL_PROVIDER_CALLS=0"
          echo "PAY24_REAL_MONEY_MOVEMENT=0"

  inherited-architecture:
    name: Inherited architecture contracts
    uses: ./.github/workflows/architecture-hardening-contracts.yml

  inherited-finance:
    name: Inherited Finance Core hardening
    uses: ./.github/workflows/finance-hardening-ci.yml

  inherited-migration-hardening:
    name: Inherited migration hardening
    uses: ./.github/workflows/hardening-ci.yml

  inherited-migration-lifecycle:
    name: Inherited fresh PG16 migration lifecycle
    uses: ./.github/workflows/migration-lifecycle-ci.yml

  pay24-readiness:
    name: PAY24 exact application SHA readiness
    if: ${{ always() }}
    needs:
      - pay24-scope-static
      - pay24-pg16
      - inherited-architecture
      - inherited-finance
      - inherited-migration-hardening
      - inherited-migration-lifecycle
    runs-on: ubuntu-24.04

    steps:
      - name: Require every PAY24 and inherited gate
        env:
          SCOPE_STATIC: ${{ needs.pay24-scope-static.result }}
          PAY24_PG16: ${{ needs.pay24-pg16.result }}
          ARCHITECTURE: ${{ needs.inherited-architecture.result }}
          FINANCE: ${{ needs.inherited-finance.result }}
          MIGRATION_HARDENING: ${{ needs.inherited-migration-hardening.result }}
          MIGRATION_LIFECYCLE: ${{ needs.inherited-migration-lifecycle.result }}
        run: |
          set -euo pipefail

          test "$SCOPE_STATIC" = success
          test "$PAY24_PG16" = success
          test "$ARCHITECTURE" = success
          test "$FINANCE" = success
          test "$MIGRATION_HARDENING" = success
          test "$MIGRATION_LIFECYCLE" = success

          echo "PAY24_CERTIFIED_APPLICATION_SHA=$PAY24_CERTIFIED_APPLICATION_SHA"
          echo "PAY24_RI1B3_REMOTE_EXACT_SHA_CI=PASS"
          echo "PAY24B_B1B_REMOTE_EXACT_SHA_CI=PASS"
          echo "PAY24B_B1B_MEMBER_LOCAL_PREPARATION_APP_IDENTITY=PASS"
          echo "PAY24B_B1B_PROVIDER_EFFECTS_PAYMENT_IDENTITY=PASS"
          echo "PAY24B_B1B_CLAIM_ADMISSION_SAME_TX=PASS"
          echo "PAY24B_B1B_START_COMMITTED_BEFORE_PROVIDER_IO=PASS"
          echo "PAY24B_B1B_TERMINAL_OUTCOME_ATOMIC_WITH_ADMISSION_FINISH=PASS"
          echo "PAY24B_B1B_UNKNOWN_NON_REPLAY=PASS"
          echo "PAY24B_REFUND_PROVIDER_BOUNDARY=NOT_STARTED"
          echo "PAY24_REAL_PROVIDER_CALLS=0"
          echo "PAY24_REAL_MONEY_MOVEMENT=0"
          echo "PAY24_STAGE1_LIVE_ACTIVATION=NOT_AUTHORIZED"
          echo "PAY23_ENTERPRISE_PAYMENT_SYSTEM=NOT_CERTIFIED"
