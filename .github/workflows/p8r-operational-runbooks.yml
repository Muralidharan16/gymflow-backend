name: P8-R Operational Runbooks

on:
  push:
    branches:
      - hardening/p8-observability-operational-response
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p8r-operational-runbooks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runbooks:
    name: P8-R critical failure operational response
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      P8A_CERTIFIED_HEAD: b19714b6c0a0d2b50ca862e35bf096d822014b71
      P8A_CERTIFIED_TREE: 104621750b126c302f890adbf27c13460df5f3a4
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/gymflow_p8r_contract
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-p8r-contract-not-production
      AWS_ACCESS_KEY_ID: ci-p8r-contract
      AWS_SECRET_ACCESS_KEY: ci-p8r-contract
      S3_BUCKET_NAME: gymflow-p8r-contract
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Guard certified P8-A parent boundary
        run: |
          set -euo pipefail
          git cat-file -e "${P8A_CERTIFIED_HEAD}^{commit}"
          test "$(git rev-parse "${P8A_CERTIFIED_HEAD}^{tree}")" = "${P8A_CERTIFIED_TREE}"
          git merge-base --is-ancestor "${P8A_CERTIFIED_HEAD}" HEAD

      - name: Validate runbook contract and repository paths
        run: |
          set -euo pipefail
          python -m json.tool docs/architecture/p8_runbook_contract.json >/dev/null
          test -f docs/architecture/P8R_OPERATIONAL_RUNBOOKS.md
          test "$(find docs/runbooks/p8 -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 14
          python -m py_compile tests/test_p8_runbook_contracts.py

      - name: Reprove P8 governance logging metrics alerts and inherited runtime boundaries
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p8_governance_contracts.py \
            tests/test_p8_logging_redaction_contracts.py \
            tests/test_p8_metrics_contracts.py \
            tests/test_p8_alert_slo_contracts.py \
            tests/test_p6s_scheduler_static_contracts.py \
            tests/test_celery_single_app_boundary.py \
            tests/test_p7_system_drain_contracts.py

      - name: Prove complete actionable runbook coverage
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p8_runbook_contracts.py

      - name: Emit P8-R decision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          echo 'P8_RUNBOOK_COVERAGE=PASS'
          echo 'P8_ALERT_RUNBOOK_BINDING=PASS'
          echo 'P8_SAFE_FIRST_RESPONSE=PASS'
          echo 'P8_RECOVERY_VERIFICATION=PASS'
          echo 'P8_OBSERVABILITY_NON_AUTHORITATIVE=PASS'
          echo 'P8_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'
