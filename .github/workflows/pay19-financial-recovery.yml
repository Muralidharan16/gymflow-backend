          FINANCE_CORE_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay19-migration@127.0.0.1:55440/gymflow_pay19_recovery_test
          TEST_DATABASE_URL: postgresql+asyncpg://app_test_runtime:ci-pay19-app@127.0.0.1:55440/gymflow_pay19_recovery_test
          TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay19-migration@127.0.0.1:55440/gymflow_pay19_recovery_test
          FINANCE_CONFIG_DATABASE_URL: postgresql://finance_config_deployment:ci-pay19-config@127.0.0.1:55440/gymflow_pay19_recovery_test
          PAY17_RECON_DATABASE_URL: postgresql+asyncpg://pay17_recon_test:ci-pay19-recon@127.0.0.1:55440/gymflow_pay19_recovery_test
          PAY9_APP_DATABASE_URL: postgresql://app_test_runtime:ci-pay19-app@127.0.0.1:55440/gymflow_pay19_recovery_test
