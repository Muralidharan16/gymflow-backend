          grep -q 'PAY19_NO_REUSED_INVOICE_NUMBER=PASS' "$EVIDENCE_DIR/replay-guards.log"
          grep -q 'PAY19_NO_REPEATED_REFUND=PASS' "$EVIDENCE_DIR/replay-guards.log"
