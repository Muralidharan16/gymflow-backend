      - name: Reconcile provider success safely on recovered PITR database
        env:
          DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay19-migration@127.0.0.1:55440/gymflow_pay19_recovery_test
          FINANCE_CORE_TEST_DATABASE_URL: postgresql+asyncpg://finance_core_test_subject:ci-pay19-finance@127.0.0.1:55440/gymflow_pay19_recovery_test
          FINANCE_CORE_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay19-migration@127.0.0.1:55440/gymflow_pay19_recovery_test
          FINANCE_CONFIG_DATABASE_URL: postgresql://finance_config_deployment:ci-pay19-config@127.0.0.1:55440/gymflow_pay19_recovery_test
