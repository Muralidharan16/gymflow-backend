          echo 'PAY19_LIVE_MONEY_MOVEMENT=DISABLED'
          echo 'PAY19_PRODUCTION_RUNTIME_BINDING=DISABLED'
          echo 'PAY19_MERGE=NOT_AUTHORIZED'
          echo 'PAY19_RELEASE=NOT_AUTHORIZED'
          echo 'PAY19_DEPLOYMENT=NOT_AUTHORIZED'
          echo 'PAY19_FINANCIAL_RECOVERY=PASS'
