          PAY9_WORKER_DATABASE_URL: postgresql://worker_test_runtime:ci-pay19-worker@127.0.0.1:55440/gymflow_pay19_recovery_test
          PAY9_ADMIN_DATABASE_URL: postgresql://postgres:ci-pay19-postgres@127.0.0.1:55440/gymflow_pay19_recovery_test
          PAY9_MIGRATION_DATABASE_URL: postgresql://migration_owner:ci-pay19-migration@127.0.0.1:55440/gymflow_pay19_recovery_test
          PAY4_APP_DATABASE_URL: postgresql://app_test_runtime:ci-pay19-app@127.0.0.1:55440/gymflow_pay19_recovery_test
          PAY4_WORKER_DATABASE_URL: postgresql://worker_test_runtime:ci-pay19-worker@127.0.0.1:55440/gymflow_pay19_recovery_test
          PAY4_ADMIN_DATABASE_URL: postgresql://postgres:ci-pay19-postgres@127.0.0.1:55440/gymflow_pay19_recovery_test
