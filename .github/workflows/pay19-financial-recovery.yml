              raise SystemExit("PAY-19 RPO target exceeded")
          if payload["rto_ms"] > payload["rto_target_ms"]:
              raise SystemExit("PAY-19 RTO target exceeded")
          (evidence / "pay19-decision.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat "$EVIDENCE_DIR/pay19-decision.json"
          echo 'PAY19_BACKUP=PASS'
          echo 'PAY19_RESTORE=PASS'
          echo 'PAY19_PITR=PASS'
          echo 'PAY19_FINANCE_TABLE_INTEGRITY=PASS'
          echo 'PAY19_INVOICE_NUMBERING_INTEGRITY=PASS'
          echo 'PAY19_LEDGER_BALANCE_INTEGRITY=PASS'
          echo 'PAY19_PROVIDER_REFERENCE_INTEGRITY=PASS'
          echo 'PAY19_REFUND_COMMAND_INTEGRITY=PASS'
          echo 'PAY19_IDEMPOTENCY_INTEGRITY=PASS'
          echo 'PAY19_OUTBOX_INTEGRITY=PASS'
          echo 'PAY19_SUBSCRIPTION_BINDING_INTEGRITY=PASS'
          echo 'PAY19_PAYMENT_APPLICATION_INTEGRITY=PASS'
          echo 'PAY19_ACCOUNTING_RECONSTRUCTION=PASS'
          echo 'PAY19_RECOVERY_RECONCILIATION=PASS'
      - name: Stop PITR cluster
        if: ${{ always() }}
        run: |
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl \
            -D "$PITR_RESTORE" -m fast -w stop >/dev/null 2>&1 || true
      - name: Upload PAY-19 recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pay19-recovery-${{ env.PAY19_CANDIDATE_SHA }}
          path: pay19-evidence/
          if-no-files-found: error
          retention-days: 14

  pr_decision:
    name: PAY-19 PR contract decision
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [contract]
    runs-on: ubuntu-24.04
    steps:
      - name: Require PAY-19 PR contract
        env:
          CONTRACT: ${{ needs.contract.result }}
        run: |
          set -euo pipefail
          test "$CONTRACT" = success
          echo 'PAY19_PR_CONTRACT=PASS'
          echo 'PAY19_DESTRUCTIVE_RECOVERY=EXACT_HEAD_PUSH_ONLY'

  decision:
    name: PAY-19 final financial recovery decision
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [contract, inherited_static, finance_regression, recovery]
    runs-on: ubuntu-24.04
    steps:
