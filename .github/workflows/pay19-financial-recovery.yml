          echo 'PAY19_RECONCILIATION_AFTER_PITR=PASS'
      - name: Emit machine-readable recovery evidence and hard gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          evidence = Path(os.environ["EVIDENCE_DIR"])
          def digest(name: str) -> str:
              return hashlib.sha256((evidence / name).read_bytes()).hexdigest()
          source = digest("source-finance.txt")
          logical = digest("logical-finance.txt")
          full = digest("full-finance.txt")
          pitr = digest("pitr-finance.txt")
          if len({source, logical, full, pitr}) != 1:
              raise SystemExit("PAY-19 recovery fingerprints differ")
          payload = {
              "candidate_sha": os.environ["PAY19_CANDIDATE_SHA"],
              "alembic_head": os.environ["PAY19_ALEMBIC_HEAD"],
              "postgresql_major": 16,
              "logical_backup_sha256": (evidence / "logical-backup.sha256").read_text().split()[0],
              "physical_manifest_sha256": (evidence / "physical-manifest.sha256").read_text().split()[0],
              "financial_fingerprint_sha256": source,
              "logical_restore_equal": True,
              "physical_restore_equal": True,
              "pitr_equal": True,
              "pre_target_survives": True,
              "post_target_excluded": True,
              "rpo_ms": int((evidence / "rpo-ms.txt").read_text()),
              "rpo_target_ms": int(os.environ["RPO_TARGET_MS"]),
              "rto_ms": int((evidence / "rto-ms.txt").read_text()),
