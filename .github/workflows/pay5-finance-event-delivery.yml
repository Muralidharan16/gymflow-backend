name: PAY-5 Finance Event Delivery

on:
  push:
    branches:
      - hardening/pay5-finance-event-delivery
  pull_request:
    branches:
      - hardening/pay4-member-finance-binding
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay5-finance-event-${{ github.ref }}
  cancel-in-progress: true

env:
  PAY5_BASE_SHA: bde31b620b1619c85e581933da1c8de465a6aa00
  PAY5_BASE_TREE: 4ff5e1176657dc96643d7da01f3d7f91c564fb78
  PAY5_PREDECESSOR: zo07d8e9f0a49
  PAY5_HEAD: zp07d8e9f0a50
  PAY5_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: PAY-5 static Finance event delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/pay5_static
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: pay5-static-not-production
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      S3_BUCKET_NAME: pay5-static
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY5_CANDIDATE_SHA }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
      - name: Exact PAY-5 scope and graph
        run: |
          set -euo pipefail
          test "$(git rev-parse "${PAY5_BASE_SHA}^{tree}")" = "${PAY5_BASE_TREE}"
          git merge-base --is-ancestor "${PAY5_BASE_SHA}" HEAD
          git diff --name-only "${PAY5_BASE_SHA}...HEAD" > /tmp/pay5-changed.txt
          python - <<'PY_SCOPE'
          from pathlib import Path
          allowed={
              ".github/workflows/pay5-finance-event-delivery.yml",
              "alembic/versions/zp07d8e9f0a50_pay5_finance_event_delivery.py",
              "app/core/celery_app.py",
              "app/finance_core/models/foundation.py",
              "app/models/__init__.py",
              "app/models/subscription_lifecycle.py",
              "app/tasks/finance_event_dispatcher.py",
              "docs/architecture/PAY5_ACCEPTANCE_MATRIX.md",
              "docs/architecture/PAY5_FINANCE_EVENT_DELIVERY.md",
              "docs/architecture/pay5_finance_event_delivery_v1.json",
              "security/cluster_role_bootstrap/ownership.v1.json",
              "tests/test_celery_single_app_boundary.py",
              "tests/test_cluster_role_contract_manifests.py",
              "tests/test_migration_app_secure_owner_context_boundary.py",
              "tests/test_pay5_finance_event_delivery_runtime.py",
              "tests/test_pay5_finance_event_delivery_static.py",
          }
          changed={x.strip() for x in Path("/tmp/pay5-changed.txt").read_text().splitlines() if x.strip()}
          if changed != allowed:
              raise SystemExit(
                  f"PAY-5 exact scope mismatch: missing={sorted(allowed-changed)}, "
                  f"unexpected={sorted(changed-allowed)}"
              )
          migrations=sorted(x for x in changed if x.startswith("alembic/versions/"))
          if migrations != ["alembic/versions/zp07d8e9f0a50_pay5_finance_event_delivery.py"]:
              raise SystemExit(f"PAY-5 migration scope mismatch: {migrations}")
          print(f"PAY-5 exact allowlist paths: {len(changed)}")
          PY_SCOPE
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "${PAY5_HEAD}"
      - name: PAY-5 static contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            app/tasks/finance_event_dispatcher.py \
            app/core/celery_app.py \
            app/finance_core/models/foundation.py \
            app/models/subscription_lifecycle.py \
            alembic/versions/zp07d8e9f0a50_pay5_finance_event_delivery.py
          python -m json.tool docs/architecture/pay5_finance_event_delivery_v1.json >/dev/null
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_pay5_finance_event_delivery_static.py \
            tests/test_cluster_role_contract_manifests.py \
            tests/test_migration_managed_role_boundary.py \
            tests/test_migration_app_secure_owner_context_boundary.py \
            tests/test_celery_single_app_boundary.py \
            tests/test_alembic_model_import_boundary.py
          echo 'PAY5_FINANCE_EVENT_DELIVERY=PASS'

  protocol_pg16:
    name: PAY-5 real PG16 crash redelivery and migration proof
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay5-migration@127.0.0.1:5432/gymflow_pay5_test
      PAY5_WORKER_DATABASE_URL: postgresql://pay5_worker_test:ci-pay5-worker@127.0.0.1:5432/gymflow_pay5_test
      PAY5_ADMIN_DATABASE_URL: postgresql://postgres:ci-pay5-postgres@127.0.0.1:5432/gymflow_pay5_test
      PAY4_APP_DATABASE_URL: postgresql://pay5_app_test:ci-pay5-app@127.0.0.1:5432/gymflow_pay5_test
      PAY4_WORKER_DATABASE_URL: postgresql://pay5_worker_test:ci-pay5-worker@127.0.0.1:5432/gymflow_pay5_test
      PAY4_MIGRATION_DATABASE_URL: postgresql://migration_owner:ci-pay5-migration@127.0.0.1:5432/gymflow_pay5_test
      PAY4_ADMIN_DATABASE_URL: postgresql://postgres:ci-pay5-postgres@127.0.0.1:5432/gymflow_pay5_test
      WORKER_DATABASE_URL: postgresql+asyncpg://pay5_worker_test:ci-pay5-worker@127.0.0.1:5432/gymflow_pay5_test
      SECRET_KEY: pay5-pg16-not-production
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      S3_BUCKET_NAME: pay5-pg16
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY5_CANDIDATE_SHA }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
      - name: Install PG16 and canonical roles
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE postgres PASSWORD 'ci-pay5-postgres';
          ALTER ROLE migration_owner PASSWORD 'ci-pay5-migration';
          CREATE ROLE pay5_app_test LOGIN PASSWORD 'ci-pay5-app'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE pay5_worker_test LOGIN PASSWORD 'ci-pay5-worker'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT app_runtime TO pay5_app_test WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT worker_runtime TO pay5_worker_test WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          CREATE DATABASE gymflow_pay5_test OWNER migration_owner;
          SQL
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_pay5_test
      - name: Upgrade certified PAY-4 predecessor and fingerprint it
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade "${PAY5_PREDECESSOR}"
          PGPASSWORD=ci-pay5-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay5_test -At <<'SQL' > /tmp/pay5-rel-before.txt
          SELECT n.nspname||'.'||c.relname||'|'||c.relfilenode
          FROM pg_catalog.pg_class c
          JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname IN ('public','finance')
            AND c.relkind IN ('r','p')
          ORDER BY 1;
          SQL
          PGPASSWORD=ci-pay5-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay5_test -At <<'SQL' > /tmp/pay5-acl-before.txt
          SELECT table_schema||'.'||table_name||'|'||grantee||'|'||privilege_type
          FROM information_schema.role_table_grants
          WHERE table_schema IN ('public','finance')
            AND grantee IN ('app_security_owner','app_runtime','worker_runtime')
          UNION ALL
          SELECT table_schema||'.'||table_name||'.'||column_name||'|'||grantee||'|'||privilege_type
          FROM information_schema.column_privileges
          WHERE table_schema IN ('public','finance')
            AND grantee IN ('app_security_owner','app_runtime','worker_runtime')
          ORDER BY 1;
          SQL
      - name: Upgrade PAY-5 and prove no predecessor table rewrite
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade "${PAY5_HEAD}"
          PGPASSWORD=ci-pay5-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay5_test -At <<'SQL' > /tmp/pay5-rel-after.txt
          SELECT n.nspname||'.'||c.relname||'|'||c.relfilenode
          FROM pg_catalog.pg_class c
          JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname IN ('public','finance')
            AND c.relkind IN ('r','p')
            AND NOT (
              n.nspname='public'
              AND c.relname='member_subscription_finance_event_consumptions'
            )
          ORDER BY 1;
          SQL
          diff -u /tmp/pay5-rel-before.txt /tmp/pay5-rel-after.txt
      - name: Real PAY-5 crash, replay, lease and effectively-once proof
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_pay5_finance_event_delivery_runtime.py
          echo 'PAY5_PRODUCT_CONSUMPTION=PASS'
          echo 'PAY5_CRASH_REDELIVERY=PASS'
          echo 'PAY5_STALE_LEASE_FENCING=PASS'
          echo 'PAY5_EFFECTIVELY_ONCE=PASS'
      - name: Populated downgrade fails closed
        run: |
          set -euo pipefail
          python - <<'PY'
          from tests.test_pay5_finance_event_delivery_runtime import (
              _cleanup_pay5,_seed_ready,_claim,_consume,WORKER_A
          )
          _cleanup_pay5()
          _seed_ready()
          claim=_claim(WORKER_A)[0]
          _consume(WORKER_A,int(claim[5]))
          PY
          set +e
          OUTPUT="$(python -s -m alembic -c alembic.ini downgrade "${PAY5_PREDECESSOR}" 2>&1)"
          RC=$?
          set -e
          test "$RC" -ne 0
          printf '%s\n' "$OUTPUT" | grep -F \
            'PAY-5 downgrade blocked: product Finance-event consumption evidence exists'
          python - <<'PY'
          from tests.test_pay5_finance_event_delivery_runtime import _cleanup_pay5
          _cleanup_pay5()
          PY
      - name: Empty downgrade restores exact predecessor then re-upgrade
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini downgrade "${PAY5_PREDECESSOR}"
          PGPASSWORD=ci-pay5-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay5_test -At <<'SQL' > /tmp/pay5-rel-restored.txt
          SELECT n.nspname||'.'||c.relname||'|'||c.relfilenode
          FROM pg_catalog.pg_class c
          JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname IN ('public','finance')
            AND c.relkind IN ('r','p')
          ORDER BY 1;
          SQL
          PGPASSWORD=ci-pay5-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay5_test -At <<'SQL' > /tmp/pay5-acl-restored.txt
          SELECT table_schema||'.'||table_name||'|'||grantee||'|'||privilege_type
          FROM information_schema.role_table_grants
          WHERE table_schema IN ('public','finance')
            AND grantee IN ('app_security_owner','app_runtime','worker_runtime')
          UNION ALL
          SELECT table_schema||'.'||table_name||'.'||column_name||'|'||grantee||'|'||privilege_type
          FROM information_schema.column_privileges
          WHERE table_schema IN ('public','finance')
            AND grantee IN ('app_security_owner','app_runtime','worker_runtime')
          ORDER BY 1;
          SQL
          diff -u /tmp/pay5-rel-before.txt /tmp/pay5-rel-restored.txt
          diff -u /tmp/pay5-acl-before.txt /tmp/pay5-acl-restored.txt
          python -s -m alembic -c alembic.ini upgrade "${PAY5_HEAD}"
          echo 'PAY5_MIGRATION_LIFECYCLE=PASS'

  architecture:
    uses: ./.github/workflows/architecture-hardening-contracts.yml
  general_platform:
    uses: ./.github/workflows/hardening-ci.yml
  finance:
    uses: ./.github/workflows/finance-hardening-ci.yml
  migration_lifecycle:
    uses: ./.github/workflows/migration-lifecycle-ci.yml
  migration_preservation:
    uses: ./.github/workflows/migration-data-preservation-ci.yml
  migration_adversarial:
    uses: ./.github/workflows/migration-adversarial-safety-ci.yml
  migration_contracts:
    uses: ./.github/workflows/migration-lifecycle-contracts.yml
  migration_semantics:
    uses: ./.github/workflows/migration-semantics-inventory.yml

  certify:
    name: Terminal immutable PAY-5 decision
    if: ${{ always() }}
    needs:
      - contract
      - protocol_pg16
      - architecture
      - general_platform
      - finance
      - migration_lifecycle
      - migration_preservation
      - migration_adversarial
      - migration_contracts
      - migration_semantics
    runs-on: ubuntu-24.04
    steps:
      - name: Require all PAY-5 gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          data=json.loads(os.environ["RESULTS"])
          bad={k:v["result"] for k,v in data.items() if v["result"]!="success"}
          if bad:
              raise SystemExit(f"PAY-5 prerequisite failure: {bad}")
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY5_CANDIDATE_SHA }}
      - name: Bind exact PAY-5 candidate
        run: |
          set -euo pipefail
          mkdir -p pay5-evidence
          test "$(git rev-parse "${PAY5_BASE_SHA}^{tree}")" = "${PAY5_BASE_TREE}"
          git merge-base --is-ancestor "${PAY5_BASE_SHA}" HEAD
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          decision={
            "phase":"PAY-5",
            "candidate_sha":os.environ["PAY5_CANDIDATE_SHA"],
            "candidate_tree":subprocess.check_output(
              ["git","rev-parse","HEAD^{tree}"],text=True
            ).strip(),
            "inherited_pay4_sha":os.environ["PAY5_BASE_SHA"],
            "alembic_head":os.environ["PAY5_HEAD"],
            "live_money_movement":False,
            "refund_provider_execution":"DEFERRED_FAIL_CLOSED",
            "merge_authorized":False,
            "release_authorized":False,
            "deployment_authorized":False,
            "decision":"PASS",
          }
          Path("pay5-evidence/decision.json").write_text(
              json.dumps(decision,indent=2,sort_keys=True)+"\n"
          )
          PY
          cat pay5-evidence/decision.json
          echo 'PAY5_FINANCE_EVENT_DELIVERY=PASS'
          echo 'PAY5_PRODUCT_CONSUMPTION=PASS'
          echo 'PAY5_CRASH_REDELIVERY=PASS'
          echo 'PAY5_STALE_LEASE_FENCING=PASS'
          echo 'PAY5_EFFECTIVELY_ONCE=PASS'
          echo 'PAY5_MIGRATION_LIFECYCLE=PASS'
          echo 'PAY5_PAY4_INHERITED=PASS'
          echo 'PAY5_LIVE_MONEY_MOVEMENT=DISABLED'
          echo 'PAY5_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'
          echo 'PAY5_FINAL=PASS'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pay5-final-${{ github.sha }}
          path: pay5-evidence/
          if-no-files-found: error
          retention-days: 30
