name: PAY-2A Finance Identity Isolation

on:
  push:
    branches:
      - hardening/pay2-financial-authority-db-security
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay2a-finance-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pay2a:
    name: Fresh PG16 Finance capability isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      MIGRATION_PASSWORD: ci-migration-owner
      P2B_DATABASE: gymflow_pay2a_identity
      DOERS_CLUSTER_VERIFY_DATABASE_URL: postgresql+psycopg://migration_owner:ci-migration-owner@127.0.0.1:5432/postgres
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install locked test environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check

      - name: Exact PAY-2A scope guard
        run: |
          set -euo pipefail
          BASE=ba8d77d0e50907fd435d358697d9721a63bad64b
          test "$(git rev-parse "${BASE}^{tree}")" = "cd9500217b8230df2c0777b405b3d462b83e99ac"
          git merge-base --is-ancestor "${BASE}" HEAD
          git diff --name-only "${BASE}...HEAD" > /tmp/pay2a.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              ".github/workflows/pay2a-finance-identity-isolation.yml",
              "docs/architecture/PAY2_FINANCIAL_AUTHORITY_DB_SECURITY.md",
              "docs/architecture/pay2_financial_authority_v1.json",
              "security/cluster_role_bootstrap/identity_transitions.v1.json",
              "security/cluster_role_bootstrap/memberships.v1.json",
              "security/cluster_role_bootstrap/role_settings.v1.json",
              "security/cluster_role_bootstrap/roles.v1.json",
              "tests/test_cluster_role_contract_manifests.py",
              "tests/test_p2b_cluster_role_bootstrap.py",
              "tests/test_pay2a_finance_identity_isolation.py",
          }
          changed={x.strip() for x in Path("/tmp/pay2a.txt").read_text().splitlines() if x.strip()}
          if changed != allowed:
              raise SystemExit(f"PAY-2A scope mismatch: {sorted(changed)}")
          if any(x.startswith("alembic/versions/") for x in changed):
              raise SystemExit("PAY-2A must not add a migration")
          PY

      - name: Static identity contract
        run: |
          set -euo pipefail
          python -m json.tool docs/architecture/pay2_financial_authority_v1.json >/dev/null
          python -m pytest --noconftest -q             tests/test_cluster_role_contract_manifests.py             tests/test_external_cluster_role_preflight.py             tests/test_p2b_cluster_role_bootstrap.py             tests/test_cluster_identity_graph.py             tests/test_pay2a_finance_identity_isolation.py
          python -s scripts/verify_head_workflow_bootstrap.py

      - name: Install PostgreSQL 16
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16 postgresql-contrib postgresql-16-partman postgresql-16-postgis-3
          sudo systemctl start postgresql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres -c 'SELECT version();'

      - name: Prove bootstrap fails closed then create exact capability graph
        run: |
          set -euo pipefail
          bash scripts/ci/certify_fresh_cluster_bootstrap_fail_closed.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-migration-owner';
          CREATE DATABASE gymflow_pay2a_identity OWNER migration_owner;
          SQL
          python -s scripts/verify_cluster_role_bootstrap.py
          python -s scripts/verify_cluster_identity_graph.py

      - name: Exercise role and graph escalation rejection
        run: |
          set -euo pipefail
          bash scripts/ci/certify_cluster_role_verifier_negative_paths.sh
          bash scripts/ci/certify_cluster_identity_graph_negative_paths.sh
          python -s scripts/verify_cluster_role_bootstrap.py
          python -s scripts/verify_cluster_identity_graph.py

      - name: Verify PAY-1 Alembic baseline remains untouched
        run: |
          set -euo pipefail
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "zk07d8e9f0a45"
          echo 'PAY2A_CLUSTER_ROLE_BOOTSTRAP=PASS'
          echo 'PAY2A_FINANCE_IDENTITY_ISOLATION=PASS'
          echo 'PAY2A_MIGRATION_BASELINE=PASS'
          echo 'PAY2_LIVE_MONEY_MOVEMENT=DISABLED'
          echo 'PAY2_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'
