name: P2F Exact Frozen-SHA Production Certification

on:
  push:
    branches:
      - certification/p2f-0346c73
    paths:
      - .github/workflows/p2f-exact-frozen-sha-certification.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p2f-exact-0346c73
  cancel-in-progress: false

env:
  EXPECTED_HEAD: 0346c73aaee5013eb43b4c90c257a81fba7f5c9c
  EXPECTED_TREE: 48ce9c2ea616f4efab84ff430d290a3424d11fb3
  EXPECTED_BASE: 43e03954723583601ee123505c5ce155b0bba162
  HARDENING_BRANCH: hardening/complete-migration-lineage
  PR_NUMBER: '2'
  PIP_VERSION: 26.2.1
  PYTHONDONTWRITEBYTECODE: '1'
  REDIS_URL: redis://127.0.0.1:6379/0
  CELERY_BROKER_URL: redis://127.0.0.1:6379/1
  CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
  SECRET_KEY: p2f-certification-only-not-production
  AWS_ACCESS_KEY_ID: p2f-ci
  AWS_SECRET_ACCESS_KEY: p2f-ci
  AWS_REGION_NAME: us-east-1
  S3_BUCKET_NAME: gymflow-p2f-certification
  ENVIRONMENT: test

jobs:
  exact-clean-cluster:
    name: Exact SHA clean-cluster migration, data, adversarial, and runtime certification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MIGRATION_PASSWORD: p2f-migration-owner
      DATABASE_URL: postgresql+asyncpg://migration_owner:p2f-migration-owner@127.0.0.1:5432/gymflow_p2f_lifecycle
      EVIDENCE_DIR: ${{ runner.temp }}/p2f-evidence/clean-cluster
    steps:
      - name: Checkout immutable P2E candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 0346c73aaee5013eb43b4c90c257a81fba7f5c9c
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source, base, branch, and PR merge provenance
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1)"
          git fsck --strict

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/p2f-main" \
            "+refs/heads/${HARDENING_BRANCH}:refs/remotes/origin/p2f-hardening" \
            "+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/p2f-pr-merge"

          test "$(git rev-parse refs/remotes/origin/p2f-main)" = "$EXPECTED_BASE"
          test "$(git rev-parse refs/remotes/origin/p2f-hardening)" = "$EXPECTED_HEAD"
          test "$(git rev-parse refs/remotes/origin/p2f-pr-merge^{tree})" = "$EXPECTED_TREE"

          read -r merge_sha merge_base merge_head < <(
            git rev-list --parents -n 1 refs/remotes/origin/p2f-pr-merge
          )
          test "$merge_base" = "$EXPECTED_BASE"
          test "$merge_head" = "$EXPECTED_HEAD"

          printf '%s\n' "$EXPECTED_HEAD" > "$EVIDENCE_DIR/candidate-sha.txt"
          printf '%s\n' "$EXPECTED_TREE" > "$EVIDENCE_DIR/candidate-tree.txt"
          printf '%s\n' "$EXPECTED_BASE" > "$EVIDENCE_DIR/base-sha.txt"
          printf '%s\n' "$merge_sha" > "$EVIDENCE_DIR/pr-merge-sha.txt"
          printf '%s\n' "$(git rev-parse refs/remotes/origin/p2f-pr-merge^{tree})" > "$EVIDENCE_DIR/pr-merge-tree.txt"
          git status --porcelain=v1 > "$EVIDENCE_DIR/worktree-status.txt"
          git show -s --format=fuller "$EXPECTED_HEAD" > "$EVIDENCE_DIR/candidate-commit.txt"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Reproduce exact locked Python environment
        run: |
          set -euo pipefail
          python -m pip install "pip==$PIP_VERSION"
          python -m pip install -r requirements-test.lock
          python -m pip check
          python --version | tee "$EVIDENCE_DIR/python-version.txt"
          python -m pip --version | tee "$EVIDENCE_DIR/pip-version.txt"
          python -m pip freeze | LC_ALL=C sort > "$EVIDENCE_DIR/resolved-test-environment.txt"
          diff -u requirements-test.lock "$EVIDENCE_DIR/resolved-test-environment.txt"
          sha256sum requirements-test.lock > "$EVIDENCE_DIR/requirements-test-lock.sha256"
          if python -m pip freeze | grep -qi '^psycopg2'; then
            echo 'P2F forbids Psycopg 2 in the certified environment.' >&2
            exit 1
          fi

      - name: Certify static source and migration contracts before database mutation
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -s scripts/verify_alembic_graph.py
          python -s scripts/migration_semantics_gate.py
          python -s scripts/verify_runtime_identity_routing.py
          python -s scripts/verify_head_workflow_bootstrap.py
          python -m pytest --noconftest -q \
            tests/test_process_database_profile_boundary.py \
            tests/test_process_profile_deployment_contract.py \
            tests/test_pytest_db_context_fidelity_boundary.py \
            tests/test_auth_database_boundary.py \
            tests/test_lifecycle_maintenance_runtime_boundary.py \
            tests/test_runtime_principal_attestation.py \
            | tee "$EVIDENCE_DIR/static-contracts.log"

      - name: Install clean PostgreSQL 16 and Redis certification stack
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
          redis-cli ping
          pg_config --version | tee "$EVIDENCE_DIR/pg-config-version.txt"
          sudo -u postgres psql -X -At -d postgres -c 'SHOW server_version;' \
            > "$EVIDENCE_DIR/postgresql-version.txt"
          redis-server --version > "$EVIDENCE_DIR/redis-version.txt"
          {
            echo "ImageOS=${ImageOS:-unknown}"
            echo "ImageVersion=${ImageVersion:-unknown}"
            uname -a
            cat /etc/os-release
          } > "$EVIDENCE_DIR/runner-environment.txt"

      - name: Prove cluster is clean before DOERS bootstrap
        run: |
          set -euo pipefail
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          DO $$
          DECLARE role_name text;
          BEGIN
            FOREACH role_name IN ARRAY ARRAY[
              'app_rls_executor','app_runtime','app_security_owner','app_user',
              'audit_writer','auth_runtime','branch_admin','branch_viewer',
              'lifecycle_maintenance_runtime','migration_owner','ops_support',
              'readonly_analytics','worker_runtime',
              'app_test_runtime','auth_test_runtime','worker_test_runtime',
              'maintenance_test_runtime','platform_billing_test_runtime',
              'finance_test_runtime','synthetic_test_runtime','test_runner'
            ]
            LOOP
              IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = role_name) THEN
                RAISE EXCEPTION 'unclean P2F cluster: managed/test role % already exists', role_name;
              END IF;
            END LOOP;
            IF EXISTS (
              SELECT 1 FROM pg_catalog.pg_database
              WHERE datname LIKE 'gymflow_p2f_%'
            ) THEN
              RAISE EXCEPTION 'unclean P2F cluster: certification database already exists';
            END IF;
          END
          $$;
          SQL

      - name: Bootstrap canonical external roles and exact deployment login overlays
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'p2f-migration-owner';

          CREATE ROLE app_test_runtime LOGIN PASSWORD 'p2f-api-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE auth_test_runtime LOGIN PASSWORD 'p2f-auth-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE worker_test_runtime LOGIN PASSWORD 'p2f-worker-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE maintenance_test_runtime LOGIN PASSWORD 'p2f-maintenance-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;

          ALTER ROLE app_test_runtime SET row_security = 'on';
          ALTER ROLE app_test_runtime SET statement_timeout = '5s';
          ALTER ROLE app_test_runtime SET lock_timeout = '2s';
          ALTER ROLE app_test_runtime SET idle_in_transaction_session_timeout = '15s';

          ALTER ROLE auth_test_runtime SET row_security = 'on';
          ALTER ROLE auth_test_runtime SET statement_timeout = '5s';
          ALTER ROLE auth_test_runtime SET lock_timeout = '2s';
          ALTER ROLE auth_test_runtime SET idle_in_transaction_session_timeout = '15s';

          ALTER ROLE worker_test_runtime SET row_security = 'on';
          ALTER ROLE worker_test_runtime SET statement_timeout = '15s';
          ALTER ROLE worker_test_runtime SET lock_timeout = '2s';
          ALTER ROLE worker_test_runtime SET idle_in_transaction_session_timeout = '30s';

          ALTER ROLE maintenance_test_runtime SET row_security = 'on';
          ALTER ROLE maintenance_test_runtime SET statement_timeout = '15s';
          ALTER ROLE maintenance_test_runtime SET lock_timeout = '2s';
          ALTER ROLE maintenance_test_runtime SET idle_in_transaction_session_timeout = '30s';

          GRANT app_runtime TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT auth_runtime TO auth_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_runtime TO auth_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO auth_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT worker_runtime TO worker_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT lifecycle_maintenance_runtime TO maintenance_test_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;

          CREATE DATABASE gymflow_p2f_lifecycle OWNER migration_owner;
          GRANT CONNECT ON DATABASE gymflow_p2f_lifecycle
            TO app_test_runtime, auth_test_runtime, worker_test_runtime, maintenance_test_runtime;
          SQL

      - name: Prove P2B and P2C before Alembic and provision infrastructure extensions
        env:
          DOERS_CLUSTER_VERIFY_DATABASE_URL: postgresql+psycopg://migration_owner:p2f-migration-owner@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          bash scripts/ci/verify_cluster_roles.sh
          python -s scripts/verify_cluster_role_bootstrap.py \
            | tee "$EVIDENCE_DIR/p2b-before-head.log"
          python -s scripts/verify_cluster_identity_graph.py \
            | tee "$EVIDENCE_DIR/p2c-before-head.log"
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p2f_lifecycle
          sudo -u postgres psql -X -At -d gymflow_p2f_lifecycle \
            -c "SELECT extname || '=' || extversion FROM pg_catalog.pg_extension ORDER BY extname;" \
            > "$EVIDENCE_DIR/extensions.txt"

      - name: Capture governed clean baseline
        run: |
          set -euo pipefail
          python scripts/migration_lifecycle_snapshot.py \
            --mode database --output "$EVIDENCE_DIR/database-baseline.json"
          python scripts/migration_lifecycle_snapshot.py \
            --mode cluster --output "$EVIDENCE_DIR/cluster-baseline.json"

      - name: Upgrade exact candidate base to HEAD first pass
        run: |
          set -euo pipefail
          set -o pipefail
          python -s -m alembic -c alembic.ini upgrade head 2>&1 \
            | tee "$EVIDENCE_DIR/upgrade-head-1.log"
          python -s -m alembic -c alembic.ini current --check-heads 2>&1 \
            | tee "$EVIDENCE_DIR/current-head-1.log"
          python scripts/migration_lifecycle_snapshot.py \
            --mode database --output "$EVIDENCE_DIR/database-head-1.json"
          python scripts/migration_lifecycle_snapshot.py \
            --mode cluster --output "$EVIDENCE_DIR/cluster-head-1.json"
          sudo -u postgres pg_dump --schema-only --no-comments \
            --restrict-key=P2FExactHead \
            --dbname=gymflow_p2f_lifecycle \
            > "$EVIDENCE_DIR/schema-head-1.sql"
          cmp "$EVIDENCE_DIR/cluster-baseline.json" "$EVIDENCE_DIR/cluster-head-1.json"

      - name: Prove exact live runtime principals and fail-closed drift
        env:
          DATABASE_URL: postgresql+asyncpg://app_test_runtime:p2f-api-runtime@127.0.0.1:5432/gymflow_p2f_lifecycle
          AUTH_DATABASE_URL: postgresql+asyncpg://auth_test_runtime:p2f-auth-runtime@127.0.0.1:5432/gymflow_p2f_lifecycle
          WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:p2f-worker-runtime@127.0.0.1:5432/gymflow_p2f_lifecycle
          MAINTENANCE_DATABASE_URL: postgresql+asyncpg://maintenance_test_runtime:p2f-maintenance-runtime@127.0.0.1:5432/gymflow_p2f_lifecycle
          ENVIRONMENT: production
        run: |
          set -euo pipefail
          python -s scripts/verify_runtime_principal_bindings.py \
            | tee "$EVIDENCE_DIR/runtime-bindings.log"
          bash scripts/ci/certify_runtime_principal_negative_paths.sh \
            | tee "$EVIDENCE_DIR/runtime-negative-paths.log"

      - name: Reprove role and identity graph after HEAD and adversarial runtime checks
        env:
          DOERS_CLUSTER_VERIFY_DATABASE_URL: postgresql+psycopg://migration_owner:p2f-migration-owner@127.0.0.1:5432/postgres
          ENVIRONMENT: test
        run: |
          set -euo pipefail
          python -s scripts/verify_cluster_role_bootstrap.py \
            | tee "$EVIDENCE_DIR/p2b-head-1.log"
          python -s scripts/verify_cluster_identity_graph.py \
            | tee "$EVIDENCE_DIR/p2c-head-1.log"

      - name: Downgrade exact HEAD to base and prove governed restoration
        run: |
          set -euo pipefail
          set -o pipefail
          python -s -m alembic -c alembic.ini downgrade base 2>&1 \
            | tee "$EVIDENCE_DIR/downgrade-base.log"
          python scripts/migration_lifecycle_snapshot.py \
            --mode database --output "$EVIDENCE_DIR/database-base-restored.json"
          python scripts/migration_lifecycle_snapshot.py \
            --mode cluster --output "$EVIDENCE_DIR/cluster-base-restored.json"
          cmp "$EVIDENCE_DIR/database-baseline.json" "$EVIDENCE_DIR/database-base-restored.json"
          cmp "$EVIDENCE_DIR/cluster-baseline.json" "$EVIDENCE_DIR/cluster-base-restored.json"

      - name: Re-upgrade base to exact HEAD and prove deterministic equivalence
        run: |
          set -euo pipefail
          set -o pipefail
          python -s -m alembic -c alembic.ini upgrade head 2>&1 \
            | tee "$EVIDENCE_DIR/upgrade-head-2.log"
          python -s -m alembic -c alembic.ini current --check-heads 2>&1 \
            | tee "$EVIDENCE_DIR/current-head-2.log"
          python scripts/migration_lifecycle_snapshot.py \
            --mode database --output "$EVIDENCE_DIR/database-head-2.json"
          python scripts/migration_lifecycle_snapshot.py \
            --mode cluster --output "$EVIDENCE_DIR/cluster-head-2.json"
          sudo -u postgres pg_dump --schema-only --no-comments \
            --restrict-key=P2FExactHead \
            --dbname=gymflow_p2f_lifecycle \
            > "$EVIDENCE_DIR/schema-head-2.sql"
          cmp "$EVIDENCE_DIR/database-head-1.json" "$EVIDENCE_DIR/database-head-2.json"
          cmp "$EVIDENCE_DIR/schema-head-1.sql" "$EVIDENCE_DIR/schema-head-2.sql"
          cmp "$EVIDENCE_DIR/cluster-baseline.json" "$EVIDENCE_DIR/cluster-head-2.json"

      - name: Execute populated rollback and adversarial migration safety scenarios
        env:
          MIGRATION_USER: migration_owner
          MIGRATION_PASSWORD: p2f-migration-owner
          PGHOST: 127.0.0.1
          PGPORT: '5432'
        run: |
          set -euo pipefail
          ADV="$EVIDENCE_DIR/adversarial"
          mkdir -p "$ADV"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          CREATE DATABASE gymflow_p2f_adv_0002 OWNER migration_owner;
          CREATE DATABASE gymflow_p2f_adv_0003 OWNER migration_owner;
          CREATE DATABASE gymflow_p2f_adv_0004 OWNER migration_owner;
          CREATE DATABASE gymflow_p2f_adv_0006 OWNER migration_owner;
          CREATE DATABASE gymflow_p2f_adv_multi OWNER migration_owner;
          CREATE DATABASE gymflow_p2f_adv_ambiguous OWNER migration_owner;
          CREATE DATABASE gymflow_p2f_adv_evolved OWNER migration_owner;
          CREATE DATABASE gymflow_p2f_adv_reference OWNER migration_owner;
          SQL
          for database in \
            gymflow_p2f_adv_0002 gymflow_p2f_adv_0003 gymflow_p2f_adv_0004 \
            gymflow_p2f_adv_0006 gymflow_p2f_adv_multi gymflow_p2f_adv_ambiguous \
            gymflow_p2f_adv_evolved gymflow_p2f_adv_reference; do
            sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$database" <<'SQL'
          CREATE EXTENSION btree_gist;
          CREATE EXTENSION citext;
          CREATE EXTENSION pg_trgm;
          CREATE EXTENSION postgis;
          SQL
          done
          python -m scripts.verify_0002_populated_rollback \
            --database gymflow_p2f_adv_0002 --evidence-dir "$ADV"
          python -m scripts.verify_0003_populated_rollback \
            --database gymflow_p2f_adv_0003 --evidence-dir "$ADV"
          python -m scripts.verify_0004_maps_rollback \
            --database gymflow_p2f_adv_0004 --evidence-dir "$ADV"
          python -m scripts.verify_0006_audit_outbox_rollback \
            --database gymflow_p2f_adv_0006 --evidence-dir "$ADV"
          python -m scripts.run_00f_adversarial \
            --multi-db gymflow_p2f_adv_multi \
            --ambiguous-db gymflow_p2f_adv_ambiguous \
            --evolved-db gymflow_p2f_adv_evolved \
            --evidence-dir "$ADV"
          python -m scripts.verify_00f_predecessor_refs \
            --database gymflow_p2f_adv_reference --evidence-dir "$ADV"

      - name: Prove populated legacy address data roundtrip across 0009 to 00f
        env:
          DATABASE_URL: postgresql+asyncpg://migration_owner:p2f-migration-owner@127.0.0.1:5432/gymflow_p2f_data
        run: |
          set -euo pipefail
          DATA="$EVIDENCE_DIR/data-preservation"
          mkdir -p "$DATA"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres \
            -c "CREATE DATABASE gymflow_p2f_data OWNER migration_owner;"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_p2f_data <<'SQL'
          CREATE EXTENSION btree_gist;
          CREATE EXTENSION citext;
          CREATE EXTENSION pg_trgm;
          CREATE EXTENSION postgis;
          SQL
          python -s -m alembic -c alembic.ini upgrade 0004_google_maps_integration

          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p2f_data <<'SQL'
          INSERT INTO public.organizations (
            id, name, tier, is_active, country, profile_completed, slug, business_type
          ) VALUES (
            '11111111-1111-4111-8111-111111111111',
            'P2F Legacy Data Gym',
            'basic', TRUE, 'India', TRUE,
            'p2f-legacy-data-gym', 'gym'
          );
          INSERT INTO public.organization_addresses (
            id, org_id, address_type, address_line1, address_line2, city,
            state_province, postal_code, country_code, label,
            effective_from, effective_until, is_verified, verified_at,
            verification_source, coordinates, coordinates_source,
            latitude, longitude, maps_embed_allowed,
            maps_verification_status, maps_verification_source,
            maps_last_verified_at, maps_updated_at, maps_next_retry_at,
            maps_retry_count, is_primary, formatted_address
          ) VALUES (
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111',
            'operational', 'enc:123 Heritage Road', 'Suite 4',
            'Puducherry', 'Puducherry', '605001', 'IN', 'Legacy Main',
            '2026-05-01 00:00:00+00', '2027-05-01 00:00:00+00',
            TRUE, '2026-05-18 08:00:00+00', 'google',
            ST_SetSRID(ST_MakePoint(79.8083, 11.9416),4326)::geography,
            'google', 11.9416, 79.8083, FALSE,
            'verified', 'google_places_api',
            '2026-05-18 10:00:00+00', '2026-05-18 09:00:00+00',
            '2026-05-19 09:00:00+00', 3, TRUE,
            '123 Heritage Road, Puducherry 605001'
          );
          SQL

          python -s -m alembic -c alembic.ini upgrade 0009_view_security_invoker
          sudo -u postgres pg_dump --schema-only --no-comments \
            --dbname=gymflow_p2f_data > "$DATA/schema-0009-before.sql"
          python scripts/normalize_pg_dump.py \
            "$DATA/schema-0009-before.sql" "$DATA/schema-0009-before.canonical.sql"
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -qAt -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p2f_data \
            -c "SELECT row_to_json(s)::text FROM (SELECT id,org_id,address_type,address_line1,address_line2,city,state_province,postal_code,country_code,label,effective_from,effective_until,is_verified,verified_at,verification_source,ST_AsEWKT(coordinates::geometry) AS coordinates_ewkt,coordinates_source,latitude,longitude,maps_embed_allowed,maps_verification_status,maps_verification_error,maps_verification_source,maps_last_verified_at,maps_updated_at,maps_next_retry_at,maps_retry_count,is_primary,formatted_address,geocoding_failed FROM public.organization_addresses WHERE id='22222222-2222-4222-8222-222222222222') s;" \
            > "$DATA/address-0009-before.json"

          python -s -m alembic -c alembic.ini upgrade 00f277c748ea

          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p2f_data <<'SQL'
          DO $$
          DECLARE a record; b record; g record;
          BEGIN
            PERFORM pg_catalog.set_config(
              'app.current_org_id','11111111-1111-4111-8111-111111111111',true
            );
            SELECT * INTO a FROM public.organization_addresses
              WHERE id='22222222-2222-4222-8222-222222222222';
            IF NOT FOUND OR a.org_id <> '11111111-1111-4111-8111-111111111111'::uuid
              OR a.address_line1 <> 'enc:123 Heritage Road'
              OR a.formatted_address <> '123 Heritage Road, Puducherry 605001'
              OR a.branch_id IS NULL THEN
              RAISE EXCEPTION 'P2F legacy address data did not survive 0009->00f';
            END IF;
            SELECT b0.id,b0.org_id,b0.address_id,s.is_primary,s.is_active,s.branch_status
              INTO b
              FROM public.org_branches b0
              JOIN public.org_branch_state s ON s.branch_id=b0.id
              WHERE b0.id=a.branch_id;
            IF NOT FOUND OR b.org_id<>a.org_id OR b.address_id<>a.id
              OR NOT b.is_primary OR NOT b.is_active OR b.branch_status<>'active' THEN
              RAISE EXCEPTION 'P2F deterministic branch mapping is invalid';
            END IF;
            SELECT * INTO g FROM public.branch_geolocation_state WHERE address_id=a.id;
            IF NOT FOUND OR g.org_id<>a.org_id OR g.validation_status<>'success'
              OR g.geocode_attempts<>3 OR g.geocode_provider<>'google_places_api' THEN
              RAISE EXCEPTION 'P2F geolocation state was not preserved';
            END IF;
          END
          $$;
          SQL

          python -s -m alembic -c alembic.ini downgrade 0009_view_security_invoker
          sudo -u postgres pg_dump --schema-only --no-comments \
