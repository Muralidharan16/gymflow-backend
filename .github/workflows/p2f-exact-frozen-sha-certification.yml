              OR pg_catalog.pg_has_role(current_user,'worker_runtime','SET')
              OR pg_catalog.pg_has_role(current_user,'lifecycle_maintenance_runtime','MEMBER')
              OR pg_catalog.pg_has_role(current_user,'lifecycle_maintenance_runtime','SET')
              THEN RAISE EXCEPTION 'Platform Billing runtime crossed background boundary'; END IF;
            IF EXISTS (
              SELECT 1 FROM information_schema.table_privileges
              WHERE grantee=current_user AND table_schema='public'
                AND (
                  (table_name<>'organizations' AND table_name NOT LIKE 'platform\_%' ESCAPE '\')
                  OR privilege_type NOT IN ('SELECT','INSERT','UPDATE','DELETE')
                )
            ) THEN RAISE EXCEPTION 'Platform Billing runtime has out-of-bound table ACL'; END IF;
            IF pg_catalog.has_table_privilege(current_user,'public.organizations','TRUNCATE')
              THEN RAISE EXCEPTION 'Platform Billing runtime may TRUNCATE organizations'; END IF;
          END
          $$;
          SQL

      - name: Run exact isolated Platform Billing regressions
        run: |
          set -euo pipefail
