  seal:
    name: Seal P2F exact-SHA certification
    if: always()
    needs:
      - provenance_lifecycle_runtime
      - migration_safety
      - general_regressions
      - platform_billing_regressions
      - finance_regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable P2E candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 0346c73aaee5013eb43b4c90c257a81fba7f5c9c
          fetch-depth: 0
          persist-credentials: false
      - name: Require all certification lanes and immutable refs
        env:
          LIFECYCLE_RESULT: ${{ needs.provenance_lifecycle_runtime.result }}
          MIGRATION_RESULT: ${{ needs.migration_safety.result }}
          GENERAL_RESULT: ${{ needs.general_regressions.result }}
          PLATFORM_RESULT: ${{ needs.platform_billing_regressions.result }}
          FINANCE_RESULT: ${{ needs.finance_regressions.result }}
        run: |
          set -euo pipefail
          test "$LIFECYCLE_RESULT" = success
          test "$MIGRATION_RESULT" = success
          test "$GENERAL_RESULT" = success
          test "$PLATFORM_RESULT" = success
          test "$FINANCE_RESULT" = success
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1)"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/p2f-main-seal" \
            "+refs/heads/${HARDENING_BRANCH}:refs/remotes/origin/p2f-hardening-seal" \
            "+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/p2f-pr-merge-seal"
          test "$(git rev-parse refs/remotes/origin/p2f-main-seal)" = "$EXPECTED_BASE"
          test "$(git rev-parse refs/remotes/origin/p2f-hardening-seal)" = "$EXPECTED_HEAD"
          test "$(git rev-parse refs/remotes/origin/p2f-pr-merge-seal^{tree})" = "$EXPECTED_TREE"
          read -r merge_sha merge_base merge_head < <(git rev-list --parents -n 1 refs/remotes/origin/p2f-pr-merge-seal)
          test "$merge_base" = "$EXPECTED_BASE"
          test "$merge_head" = "$EXPECTED_HEAD"
          mkdir -p p2f-seal
          cat > p2f-seal/CERTIFICATION.txt <<EOF
          phase=P2F
          candidate_sha=$EXPECTED_HEAD
          candidate_tree=$EXPECTED_TREE
          base_sha=$EXPECTED_BASE
          pr_merge_sha=$merge_sha
          lifecycle_runtime=$LIFECYCLE_RESULT
          migration_safety=$MIGRATION_RESULT
          general=$GENERAL_RESULT
          platform_billing=$PLATFORM_RESULT
          finance=$FINANCE_RESULT
          github_run_id=$GITHUB_RUN_ID
          EOF
          sha256sum p2f-seal/CERTIFICATION.txt > p2f-seal/SHA256SUMS
      - name: Upload P2F seal
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: p2f-seal-${{ env.EXPECTED_HEAD }}
          path: p2f-seal/
          if-no-files-found: error
          retention-days: 30
