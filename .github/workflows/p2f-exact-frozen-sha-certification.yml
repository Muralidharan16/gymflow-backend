          CREATE DATABASE gymflow_p2f_platform_default OWNER migration_owner;
          CREATE DATABASE gymflow_p2f_platform OWNER migration_owner;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p2f_platform
          DATABASE_URL=postgresql+asyncpg://migration_owner:p2f-migration-owner@127.0.0.1:5432/gymflow_p2f_platform \
            python -s -m alembic -c alembic.ini upgrade head

      - name: Grant and prove exact bounded Platform Billing test runtime surface
        run: |
          set -euo pipefail
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p2f_platform <<'SQL'
          DO $$
          DECLARE target record;
          BEGIN
            FOR target IN
              SELECT n.nspname AS schema_name,c.relname AS relation_name
              FROM pg_catalog.pg_class c
              JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p')
                AND (c.relname='organizations' OR c.relname LIKE 'platform\_%' ESCAPE '\')
            LOOP
              EXECUTE format(
                'GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE %I.%I TO platform_billing_test_runtime',
                target.schema_name,target.relation_name
              );
            END LOOP;
          END
          $$;
          SQL
          PGPASSWORD="$PLATFORM_BILLING_RUNTIME_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U platform_billing_test_runtime -d gymflow_p2f_platform <<'SQL'
          DO $$
          DECLARE r record;
          BEGIN
            SELECT * INTO r FROM pg_catalog.pg_roles WHERE rolname=current_user;
            IF r.rolsuper OR r.rolcreatedb OR r.rolcreaterole OR r.rolinherit
              OR r.rolreplication OR r.rolbypassrls
              THEN RAISE EXCEPTION 'Platform Billing runtime is over-privileged'; END IF;
            IF pg_catalog.has_database_privilege(current_user,current_database(),'CREATE')
