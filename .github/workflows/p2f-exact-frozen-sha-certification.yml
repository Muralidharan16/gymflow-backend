          ALTER ROLE finance_test_runtime SET row_security='on';
          ALTER ROLE finance_test_runtime SET statement_timeout='10s';
          ALTER ROLE finance_test_runtime SET lock_timeout='3s';
          ALTER ROLE finance_test_runtime SET idle_in_transaction_session_timeout='15s';
          ALTER ROLE synthetic_test_runtime SET row_security='on';
          ALTER ROLE synthetic_test_runtime SET statement_timeout='10s';
          ALTER ROLE synthetic_test_runtime SET lock_timeout='3s';
          ALTER ROLE synthetic_test_runtime SET idle_in_transaction_session_timeout='15s';
          GRANT app_runtime TO finance_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO finance_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT test_runner TO synthetic_test_runtime WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;
          CREATE DATABASE gymflow_p2f_finance OWNER migration_owner;
          GRANT CONNECT ON DATABASE gymflow_p2f_finance TO finance_test_runtime,synthetic_test_runtime;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p2f_finance
          python -s -m alembic -c alembic.ini upgrade head

      - name: Grant bounded Finance test surfaces and prove posture
        run: |
          set -euo pipefail
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p2f_finance <<'SQL'
          GRANT USAGE ON SCHEMA finance TO finance_test_runtime;
          GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA finance TO finance_test_runtime;
          GRANT SELECT ON TABLE public.organizations TO finance_test_runtime;
          GRANT SELECT,INSERT,UPDATE ON TABLE public.organizations TO synthetic_test_runtime;
          GRANT SELECT,INSERT ON TABLE public.organization_creation_idempotency TO synthetic_test_runtime;
          GRANT SELECT ON TABLE public.owners,public.gyms,public.organization_users,
            public.organization_members,public.org_branches TO synthetic_test_runtime;
          GRANT USAGE ON SCHEMA finance TO synthetic_test_runtime;
          GRANT SELECT ON TABLE finance.billing_parties,finance.invoices,finance.payments
            TO synthetic_test_runtime;
          SQL
          PGPASSWORD="$FINANCE_RUNTIME_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U finance_test_runtime -d gymflow_p2f_finance <<'SQL'
          DO $$
          DECLARE r record;
          BEGIN
            SELECT * INTO r FROM pg_catalog.pg_roles WHERE rolname=current_user;
            IF r.rolsuper OR r.rolcreatedb OR r.rolcreaterole OR r.rolinherit
              OR r.rolreplication OR r.rolbypassrls
              THEN RAISE EXCEPTION 'Finance runtime is over-privileged'; END IF;
            IF pg_catalog.has_database_privilege(current_user,current_database(),'CREATE')
              OR pg_catalog.has_schema_privilege(current_user,'public','CREATE')
              OR pg_catalog.has_schema_privilege(current_user,'finance','CREATE')
              THEN RAISE EXCEPTION 'Finance runtime may create objects'; END IF;
            IF pg_catalog.pg_has_role(current_user,'worker_runtime','MEMBER')
              OR pg_catalog.pg_has_role(current_user,'auth_runtime','MEMBER')
              OR pg_catalog.pg_has_role(current_user,'test_runner','MEMBER')
              OR pg_catalog.pg_has_role(current_user,'app_runtime','SET')
              OR pg_catalog.pg_has_role(current_user,'app_user','SET')
              THEN RAISE EXCEPTION 'Finance runtime has invalid role reachability'; END IF;
            IF EXISTS (
              SELECT 1 FROM pg_catalog.pg_class c
              JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='finance' AND c.relkind IN ('r','p')
                AND pg_catalog.has_table_privilege(current_user,c.oid,'TRUNCATE')
            ) THEN RAISE EXCEPTION 'Finance runtime may TRUNCATE finance data'; END IF;
          END
          $$;
          SQL
          PGPASSWORD="$SYNTHETIC_RUNTIME_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U synthetic_test_runtime -d gymflow_p2f_finance <<'SQL'
          DO $$
          DECLARE r record; m record;
          BEGIN
            SELECT * INTO r FROM pg_catalog.pg_roles WHERE rolname=current_user;
            IF r.rolsuper OR r.rolcreatedb OR r.rolcreaterole OR r.rolinherit
              OR r.rolreplication OR r.rolbypassrls
              THEN RAISE EXCEPTION 'synthetic runtime is over-privileged'; END IF;
            IF pg_catalog.pg_has_role(current_user,'auth_runtime','MEMBER')
              OR pg_catalog.pg_has_role(current_user,'app_runtime','MEMBER')
              OR pg_catalog.pg_has_role(current_user,'worker_runtime','MEMBER')
              OR pg_catalog.pg_has_role(current_user,'app_user','MEMBER')
              THEN RAISE EXCEPTION 'synthetic runtime has unrelated membership'; END IF;
            SELECT am.* INTO m
              FROM pg_catalog.pg_auth_members am
              JOIN pg_catalog.pg_roles granted ON granted.oid=am.roleid
              JOIN pg_catalog.pg_roles member ON member.oid=am.member
              WHERE granted.rolname='test_runner' AND member.rolname=current_user;
            IF NOT FOUND OR m.admin_option OR m.inherit_option OR NOT m.set_option
              THEN RAISE EXCEPTION 'synthetic test_runner edge is not SET-only'; END IF;
          END
          $$;
          SQL

      - name: Run exact isolated Finance Core regressions
        run: |
          set -euo pipefail
          set -o pipefail
          python -m pytest -q --maxfail=1 tests/finance_core 2>&1 \
            | tee "$EVIDENCE_DIR/pytest-finance.log"
          printf 'success\n' > "$EVIDENCE_DIR/status.txt"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"
          find "$EVIDENCE_DIR" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum \
            > "$EVIDENCE_DIR/SHA256SUMS"

      - name: Upload Finance evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: p2f-finance-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/p2f-evidence/finance/
          if-no-files-found: error
          retention-days: 30

  seal:
    name: Seal exact-SHA P2F certification evidence
    if: always()
    needs:
      - exact-clean-cluster
      - exact-general-regressions
      - exact-platform-billing-regressions
      - exact-finance-regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable P2E candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 0346c73aaee5013eb43b4c90c257a81fba7f5c9c
          fetch-depth: 0
          persist-credentials: false

      - name: Require every certification lane green and refs unchanged
        env:
          CLEAN_RESULT: ${{ needs.exact-clean-cluster.result }}
          GENERAL_RESULT: ${{ needs.exact-general-regressions.result }}
          PLATFORM_RESULT: ${{ needs.exact-platform-billing-regressions.result }}
          FINANCE_RESULT: ${{ needs.exact-finance-regressions.result }}
        run: |
          set -euo pipefail
          test "$CLEAN_RESULT" = success
          test "$GENERAL_RESULT" = success
          test "$PLATFORM_RESULT" = success
          test "$FINANCE_RESULT" = success
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1)"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/p2f-main-seal" \
            "+refs/heads/${HARDENING_BRANCH}:refs/remotes/origin/p2f-hardening-seal" \
            "+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/p2f-pr-merge-seal"
          test "$(git rev-parse refs/remotes/origin/p2f-main-seal)" = "$EXPECTED_BASE"
          test "$(git rev-parse refs/remotes/origin/p2f-hardening-seal)" = "$EXPECTED_HEAD"
          test "$(git rev-parse refs/remotes/origin/p2f-pr-merge-seal^{tree})" = "$EXPECTED_TREE"
          read -r merge_sha merge_base merge_head < <(
            git rev-list --parents -n 1 refs/remotes/origin/p2f-pr-merge-seal
          )
          test "$merge_base" = "$EXPECTED_BASE"
          test "$merge_head" = "$EXPECTED_HEAD"

      - name: Download and assemble all current-run evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_RESULT: ${{ needs.exact-clean-cluster.result }}
          GENERAL_RESULT: ${{ needs.exact-general-regressions.result }}
          PLATFORM_RESULT: ${{ needs.exact-platform-billing-regressions.result }}
          FINANCE_RESULT: ${{ needs.exact-finance-regressions.result }}
        run: |
          set -euo pipefail
          mkdir -p p2f-final/lane-artifacts
          python - <<'PY'
          import json, os, urllib.request, zipfile, io, pathlib

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          head = os.environ["EXPECTED_HEAD"]
          wanted = {
              f"p2f-clean-cluster-{head}",
              f"p2f-general-{head}",
              f"p2f-platform-billing-{head}",
              f"p2f-finance-{head}",
          }
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "doers-p2f-certification",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              return urllib.request.urlopen(req, timeout=60).read()

          listing = json.loads(get(f"{api}/repos/{repo}/actions/runs/{run_id}/artifacts"))
          artifacts = {a["name"]: a for a in listing["artifacts"]}
          missing = wanted - artifacts.keys()
          if missing:
              raise SystemExit(f"missing P2F lane artifacts: {sorted(missing)}")

          root = pathlib.Path("p2f-final/lane-artifacts")
          digests = {}
          for name in sorted(wanted):
              artifact = artifacts[name]
              blob = get(artifact["archive_download_url"])
              target = root / name
              target.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(blob)) as zf:
                  zf.extractall(target)
              digests[name] = artifact.get("digest")

          pathlib.Path("p2f-final/github-artifact-digests.json").write_text(
              json.dumps(digests, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          cat > p2f-final/CERTIFICATION.txt <<EOF
          phase=P2F
          candidate_sha=$EXPECTED_HEAD
          candidate_tree=$EXPECTED_TREE
          base_sha=$EXPECTED_BASE
          hardening_branch=$HARDENING_BRANCH
          pr_number=$PR_NUMBER
          clean_cluster=$CLEAN_RESULT
          general=$GENERAL_RESULT
          platform_billing=$PLATFORM_RESULT
          finance=$FINANCE_RESULT
          github_run_id=$GITHUB_RUN_ID
          certification_branch=$GITHUB_REF_NAME
          EOF

          for lane in \
            p2f-clean-cluster-$EXPECTED_HEAD \
            p2f-general-$EXPECTED_HEAD \
            p2f-platform-billing-$EXPECTED_HEAD \
            p2f-finance-$EXPECTED_HEAD; do
            test "$(cat "p2f-final/lane-artifacts/$lane/candidate-sha.txt")" = "$EXPECTED_HEAD"
            test "$(cat "p2f-final/lane-artifacts/$lane/status.txt")" = success
          done

          find p2f-final -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > p2f-final/SHA256SUMS
          tar -czf "p2f-exact-sha-${EXPECTED_HEAD}.tar.gz" p2f-final
          sha256sum "p2f-exact-sha-${EXPECTED_HEAD}.tar.gz" \
            > "p2f-exact-sha-${EXPECTED_HEAD}.tar.gz.sha256"

      - name: Upload sealed P2F evidence bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: p2f-exact-sha-evidence-${{ env.EXPECTED_HEAD }}
          path: |
            p2f-final/
            p2f-exact-sha-${{ env.EXPECTED_HEAD }}.tar.gz
            p2f-exact-sha-${{ env.EXPECTED_HEAD }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
