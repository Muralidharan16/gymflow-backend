  exact-general-regressions:
    name: Exact SHA General runtime and regression certification
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MIGRATION_PASSWORD: p2f-migration-owner
      GENERAL_RUNTIME_PASSWORD: p2f-app-runtime
      AUTH_RUNTIME_PASSWORD: p2f-auth-runtime
      MAINTENANCE_RUNTIME_PASSWORD: p2f-maintenance-runtime
      DATABASE_URL: postgresql+asyncpg://migration_owner:p2f-migration-owner@127.0.0.1:5432/gymflow_p2f_general
      TEST_DATABASE_URL: postgresql+asyncpg://app_test_runtime:p2f-app-runtime@127.0.0.1:5432/gymflow_p2f_general
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:p2f-migration-owner@127.0.0.1:5432/gymflow_p2f_general
      AUTH_DATABASE_URL: postgresql+asyncpg://auth_test_runtime:p2f-auth-runtime@127.0.0.1:5432/gymflow_p2f_general
      MAINTENANCE_DATABASE_URL: postgresql+asyncpg://lifecycle_maintenance_test_runtime:p2f-maintenance-runtime@127.0.0.1:5432/gymflow_p2f_general
      EVIDENCE_DIR: ${{ runner.temp }}/p2f-evidence/general
    steps:
      - name: Checkout immutable P2E candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 0346c73aaee5013eb43b4c90c257a81fba7f5c9c
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1)"
          printf '%s\n' "$EXPECTED_HEAD" > "$EVIDENCE_DIR/candidate-sha.txt"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install locked environment and database services
        run: |
          set -euo pipefail
          python -m pip install "pip==$PIP_VERSION"
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > "$EVIDENCE_DIR/resolved-test-environment.txt"
          diff -u requirements-test.lock "$EVIDENCE_DIR/resolved-test-environment.txt"
          bash scripts/ci/install_pg16_test_stack.sh
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
          redis-cli ping

      - name: Bootstrap exact General/Auth/Maintenance runtime overlay
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'p2f-migration-owner';
          CREATE ROLE test_runner LOGIN PASSWORD 'p2f-test-runner'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_test_runtime LOGIN PASSWORD 'p2f-app-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE auth_test_runtime LOGIN PASSWORD 'p2f-auth-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE lifecycle_maintenance_test_runtime LOGIN PASSWORD 'p2f-maintenance-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          ALTER ROLE app_test_runtime SET row_security='on';
          ALTER ROLE app_test_runtime SET statement_timeout='5s';
          ALTER ROLE app_test_runtime SET lock_timeout='2s';
          ALTER ROLE app_test_runtime SET idle_in_transaction_session_timeout='15s';
          ALTER ROLE auth_test_runtime SET row_security='on';
          ALTER ROLE auth_test_runtime SET statement_timeout='5s';
          ALTER ROLE auth_test_runtime SET lock_timeout='2s';
          ALTER ROLE auth_test_runtime SET idle_in_transaction_session_timeout='15s';
          ALTER ROLE lifecycle_maintenance_test_runtime SET row_security='on';
          ALTER ROLE lifecycle_maintenance_test_runtime SET statement_timeout='15s';
          ALTER ROLE lifecycle_maintenance_test_runtime SET lock_timeout='2s';
          ALTER ROLE lifecycle_maintenance_test_runtime SET idle_in_transaction_session_timeout='30s';
          GRANT app_runtime TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT auth_runtime TO auth_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_runtime TO auth_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO auth_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT lifecycle_maintenance_runtime TO lifecycle_maintenance_test_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          CREATE DATABASE gymflow_p2f_general OWNER migration_owner;
          GRANT CONNECT ON DATABASE gymflow_p2f_general
            TO app_test_runtime,auth_test_runtime,lifecycle_maintenance_test_runtime;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p2f_general
          python -s -m alembic -c alembic.ini upgrade head

      - name: Prove General/Auth/Maintenance least-privilege runtime posture
        run: |
          set -euo pipefail
          PGPASSWORD="$GENERAL_RUNTIME_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U app_test_runtime -d gymflow_p2f_general <<'SQL'
          DO $$
          DECLARE r record;
          BEGIN
            SELECT * INTO r FROM pg_catalog.pg_roles WHERE rolname=current_user;
            IF current_user<>'app_test_runtime' OR r.rolsuper OR r.rolcreatedb
              OR r.rolcreaterole OR r.rolinherit OR r.rolreplication OR r.rolbypassrls
              THEN RAISE EXCEPTION 'unsafe General runtime posture'; END IF;
            IF pg_catalog.has_database_privilege(current_user,current_database(),'CREATE')
              OR pg_catalog.has_schema_privilege(current_user,'public','CREATE')
              THEN RAISE EXCEPTION 'General runtime may create objects'; END IF;
            IF pg_catalog.pg_has_role(current_user,'auth_runtime','MEMBER')
              OR pg_catalog.pg_has_role(current_user,'worker_runtime','MEMBER')
              OR pg_catalog.pg_has_role(current_user,'lifecycle_maintenance_runtime','MEMBER')
              OR pg_catalog.pg_has_role(current_user,'app_runtime','SET')
              OR pg_catalog.pg_has_role(current_user,'app_user','SET')
              THEN RAISE EXCEPTION 'General runtime has invalid role reachability'; END IF;
            IF pg_catalog.has_table_privilege(current_user,'public.organizations','INSERT')
              THEN RAISE EXCEPTION 'General runtime may create tenant roots'; END IF;
          END
          $$;
          SQL
          PGPASSWORD="$AUTH_RUNTIME_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U auth_test_runtime -d gymflow_p2f_general <<'SQL'
          DO $$
          DECLARE r record;
          BEGIN
            SELECT * INTO r FROM pg_catalog.pg_roles WHERE rolname=current_user;
            IF r.rolsuper OR r.rolcreatedb OR r.rolcreaterole OR r.rolinherit
              OR r.rolreplication OR r.rolbypassrls
              THEN RAISE EXCEPTION 'unsafe Auth runtime posture'; END IF;
            IF NOT pg_catalog.pg_has_role(current_user,'auth_runtime','MEMBER')
              OR pg_catalog.pg_has_role(current_user,'auth_runtime','SET')
              OR pg_catalog.pg_has_role(current_user,'worker_runtime','MEMBER')
              THEN RAISE EXCEPTION 'Auth runtime role edge is invalid'; END IF;
          END
          $$;
          SQL
          PGPASSWORD="$MAINTENANCE_RUNTIME_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U lifecycle_maintenance_test_runtime -d gymflow_p2f_general <<'SQL'
          DO $$
          DECLARE r record;
          BEGIN
            SELECT * INTO r FROM pg_catalog.pg_roles WHERE rolname=current_user;
            IF r.rolsuper OR r.rolcreatedb OR r.rolcreaterole OR r.rolinherit
              OR r.rolreplication OR r.rolbypassrls
              THEN RAISE EXCEPTION 'unsafe maintenance runtime posture'; END IF;
            IF NOT pg_catalog.pg_has_role(current_user,'lifecycle_maintenance_runtime','MEMBER')
              OR pg_catalog.pg_has_role(current_user,'lifecycle_maintenance_runtime','SET')
              OR pg_catalog.pg_has_role(current_user,'app_runtime','MEMBER')
              OR pg_catalog.pg_has_role(current_user,'auth_runtime','MEMBER')
              OR pg_catalog.pg_has_role(current_user,'worker_runtime','MEMBER')
              THEN RAISE EXCEPTION 'maintenance runtime role edge is invalid'; END IF;
          END
          $$;
          SQL

      - name: Run exact General regression suite
        run: |
          set -euo pipefail
          set -o pipefail
          python -m pytest -q --maxfail=1 --ignore=tests/platform_billing 2>&1 \
            | tee "$EVIDENCE_DIR/pytest-general.log"
          printf 'success\n' > "$EVIDENCE_DIR/status.txt"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"
          find "$EVIDENCE_DIR" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum \
            > "$EVIDENCE_DIR/SHA256SUMS"

      - name: Upload General evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: p2f-general-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/p2f-evidence/general/
          if-no-files-found: error
          retention-days: 30

