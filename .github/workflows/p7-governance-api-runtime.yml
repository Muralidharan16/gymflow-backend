name: P7 Governance API Runtime

on:
  push:
    branches:
      - hardening/p7-api-runtime-graceful-deployment
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p7-governance-api-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Frozen P7 API runtime and graceful deployment contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P6_MERGE_BASE: 561510eed6244cee268215ff1c53af72a636a601
      P6_CERTIFIED_TREE: 6ae7a92bd06100434b80aed98772147f2bbeaef4
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Prove exact merged P6 ancestry and tree
        run: |
          set -euo pipefail
          git cat-file -e "${P6_MERGE_BASE}^{commit}"
          test "$(git rev-parse "${P6_MERGE_BASE}^{tree})" = "${P6_CERTIFIED_TREE}"
          git merge-base --is-ancestor "${P6_MERGE_BASE}" HEAD

      - name: Validate P7 governance artifacts
        run: |
          set -euo pipefail
          python -m json.tool docs/architecture/p7_api_runtime_matrix.json >/dev/null
          python -m py_compile tests/test_p7_governance_contracts.py
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p7_governance_contracts.py

      - name: Reprove inherited P6 governance and final-certification contracts
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p6_governance_contracts.py \
            tests/test_p6f_final_certification_contracts.py
          python -s scripts/verify_alembic_graph.py
          python -s scripts/verify_head_workflow_bootstrap.py

      - name: Emit P7 governance markers
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          echo "P7_PRESTOP_AUTHORIZATION=GOVERNANCE_FROZEN"
          echo "P7_LIVENESS_READINESS_SEPARATED=GOVERNANCE_FROZEN"
          echo "P7_READINESS_FALSE_BEFORE_SHUTDOWN=GOVERNANCE_FROZEN"
          echo "P7_NEW_REQUEST_DRAIN=GOVERNANCE_FROZEN"
          echo "P7_INFLIGHT_COMPLETION=GOVERNANCE_FROZEN"
          echo "P7_API_RESOURCE_SHUTDOWN=GOVERNANCE_FROZEN"
          echo "P7_WORKER_TERMINATION_RECOVERABLE=GOVERNANCE_FROZEN"
          echo "P7_PRODUCTION_LIKE_ROLLOUT=GOVERNANCE_FROZEN"
          echo "P7_NO_LOST_DURABLE_BUSINESS_WORK=GOVERNANCE_FROZEN"
          echo "P7_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED"
          echo "P7_GOVERNANCE_API_RUNTIME=PASS"
