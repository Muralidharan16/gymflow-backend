name: P10-B Representative Baseline Calibration

on:
  push:
    branches:
      - hardening/p10-performance-security-final-production-certification
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p10b-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CERTIFICATION_HEAD: zk07d8e9f0a45
  MIGRATION_PASSWORD: ci-migration-owner
  GENERAL_RUNTIME_PASSWORD: ci-app-test-runtime
  AUTH_RUNTIME_PASSWORD: ci-auth-test-runtime
  WORKER_RUNTIME_PASSWORD: ci-worker-test-runtime
  MAINTENANCE_RUNTIME_PASSWORD: ci-lifecycle-maintenance-runtime
  DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_migration_test
  TEST_DATABASE_URL: postgresql+asyncpg://app_test_runtime:ci-app-test-runtime@127.0.0.1:5432/gymflow_test
  TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
  AUTH_DATABASE_URL: postgresql+asyncpg://auth_test_runtime:ci-auth-test-runtime@127.0.0.1:5432/gymflow_test
  WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:ci-worker-test-runtime@127.0.0.1:5432/gymflow_test
  MAINTENANCE_DATABASE_URL: postgresql+asyncpg://lifecycle_maintenance_test_runtime:ci-lifecycle-maintenance-runtime@127.0.0.1:5432/gymflow_test
  REDIS_URL: redis://127.0.0.1:6379/0
  CELERY_BROKER_URL: redis://127.0.0.1:6379/1
  CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
  SECRET_KEY: p10b-calibration-synthetic-secret-not-production
  AWS_ACCESS_KEY_ID: p10b-synthetic
  AWS_SECRET_ACCESS_KEY: p10b-synthetic
  S3_BUCKET_NAME: p10b-synthetic
  ENVIRONMENT: test
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  calibration:
    name: Production-shaped P10-B calibration PG16
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      P10B_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      P10B_ALEMBIC_HEAD: zk07d8e9f0a45
      P10B_DB: gymflow_test
      P10B_SECRET_KEY: p10b-calibration-synthetic-secret-not-production
      P10B_METRICS_PORT: '4322'
      P10B_API_PORT: '8000'
      P10B_DURATION_SECONDS: '60'
      P10B_CONCURRENCY: '24'
      P10B_CPU_LIMIT: '1.20'
      EVIDENCE_DIR: p10b-evidence
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Validate P10-B calibration contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/ci/p10b_load_calibration.py tests/test_p10b_baseline_contracts.py
          bash -n scripts/ci/run_p10b_baseline_calibration.sh
          python -m pytest --noconftest -q --maxfail=1 tests/test_p10b_baseline_contracts.py

      - name: Prepare fresh real PostgreSQL 16 identities and head schema
        run: bash scripts/ci/prepare_p3e_pg16.sh

      - name: Run production-shaped baseline calibration
        run: bash scripts/ci/run_p10b_baseline_calibration.sh

      - name: Upload P10-B calibration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p10b-calibration-${{ github.event.pull_request.head.sha || github.sha }}
          path: p10b-evidence/
          if-no-files-found: error
          retention-days: 14
