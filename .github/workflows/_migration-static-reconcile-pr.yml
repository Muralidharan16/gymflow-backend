name: Migration Static Contract Reconciler

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: migration-static-contract-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'hardening/complete-migration-lineage'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/complete-migration-lineage
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Reconcile hardened static contracts idempotently
        id: patch
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path('.')
          old_sha = 'c5bc24e259ea9938f680c8f5f41fe74c5a73ed1ffb7f9ab5b1a63946db6a702f'
          new_sha = 'fc37f303ca42975c67d52c0921b7a9215038e235bfbbaa1743aa14cf6deb5716'

          def reconcile(path_str: str, old: str, new: str, expected_count: int = 1) -> None:
              path = root / path_str
              source = path.read_text(encoding='utf-8')
              old_count = source.count(old)
              new_count = source.count(new)
              if old_count == expected_count and new_count == 0:
                  path.write_text(source.replace(old, new), encoding='utf-8')
                  return
              if old_count == 0 and new_count == expected_count:
                  return
              raise SystemExit(
                  f'{path_str}: reconciliation drift for {old!r}: '
                  f'old_count={old_count}, new_count={new_count}, expected={expected_count}'
              )

          reconcile(
              'tests/test_dafd_app_private_owner_context_boundary.py',
              'def test_complete_68_revision_private_and_executor_inventories_are_closed() -> None:\n    migrations = sorted(VERSIONS.glob("*.py"))\n    assert len(migrations) == 68',
              'def test_complete_69_revision_private_and_executor_inventories_are_closed() -> None:\n    migrations = sorted(VERSIONS.glob("*.py"))\n    assert len(migrations) == 69',
          )
          reconcile(
              'tests/test_migration_app_secure_owner_context_boundary.py',
              'def test_complete_68_revision_app_secure_file_inventory_is_closed() -> None:\n    migrations = sorted(VERSIONS.glob("*.py"))\n    assert len(migrations) == 68',
              'def test_complete_69_revision_app_secure_file_inventory_is_closed() -> None:\n    migrations = sorted(VERSIONS.glob("*.py"))\n    assert len(migrations) == 69',
          )
          reconcile(
              'tests/test_migration_app_private_owner_context_boundary.py',
              old_sha,
              new_sha,
              expected_count=2,
          )
          reconcile(
              'tests/test_migration_shared_infrastructure_boundary.py',
              old_sha,
              new_sha,
          )
          reconcile(
              'tests/test_migration_shared_infrastructure_boundary.py',
              '    assert "CREATE EXTENSION IF NOT EXISTS btree_gist;" in source_0021\n',
              '    assert "CREATE EXTENSION IF NOT EXISTS btree_gist;" not in source_0021\n'
              '    assert "requires infrastructure-provisioned btree_gist" in source_0021\n'
              '    assert "owner_name IS DISTINCT FROM \'postgres\'" in source_0021\n',
          )
          reconcile(
              'alembic/versions/00f277c748ea_add_hyperscale_branch_name_and_address_.py',
              'window.  A later, explicitly gated contract migration may remove predecessor\n'
              'storage only after dual-write/read compatibility has been proven in production.\n',
              'window.  A later, explicitly gated contract migration may remove predecessor\n'
              'storage only after dual-write/read compatibility has been proven in production.\n\n'
              'Managed cluster roles are provisioned from security/cluster_role_bootstrap;\n'
              'this revision validates that posture but never creates or mutates those roles.\n',
          )
          reconcile(
              'tests/test_migration_managed_role_boundary.py',
              '        "CREATE OR REPLACE FUNCTION "\n        "app_private.create_branch_contacts_audit_partition"',
              '        "CREATE FUNCTION "\n        "app_private.create_branch_contacts_audit_partition"',
          )
          reconcile(
              'tests/test_migration_managed_role_boundary.py',
              '    partition_drop = (\n        "DROP TABLE IF EXISTS "\n        "app_private.partition_metadata CASCADE;"\n    )',
              '    partition_drop = "DROP TABLE app_private.partition_metadata RESTRICT;"',
          )
          reconcile(
              'tests/test_migration_managed_role_boundary.py',
              '("DROP TRIGGER", "DROP FUNCTION", "DROP TABLE")',
              '("DROP TRIGGER", "DROP POLICY", "DROP FUNCTION", "DROP TABLE")',
          )
          PY
          python -m py_compile \
            alembic/versions/00f277c748ea_add_hyperscale_branch_name_and_address_.py \
            alembic/versions/0020_contacts_hardened.py \
            alembic/versions/0021_staff_roles.py \
            tests/test_0003_security_schema_lifecycle.py \
            tests/test_dafd_app_private_owner_context_boundary.py \
            tests/test_migration_app_private_owner_context_boundary.py \
            tests/test_migration_app_secure_owner_context_boundary.py \
            tests/test_migration_managed_role_boundary.py \
            tests/test_migration_shared_infrastructure_boundary.py
          git diff --check
          if git diff --quiet -- \
            alembic/versions/00f277c748ea_add_hyperscale_branch_name_and_address_.py \
            tests/test_dafd_app_private_owner_context_boundary.py \
            tests/test_migration_app_private_owner_context_boundary.py \
            tests/test_migration_app_secure_owner_context_boundary.py \
            tests/test_migration_managed_role_boundary.py \
            tests/test_migration_shared_infrastructure_boundary.py; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run exact static hardening suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest --noconftest -q \
            tests/test_0003_security_schema_lifecycle.py \
            tests/test_0027_complete_owner_context_boundary.py \
            tests/test_66a_pg_partman_boundary.py \
            tests/test_371b333_spatial_index_lineage.py \
            tests/test_database_sync_driver_boundary.py \
            tests/test_database_session_guc_boundary.py \
            tests/test_alembic_env_config_boundary.py \
            tests/test_alembic_model_import_boundary.py \
            tests/test_dafd_app_private_owner_context_boundary.py \
            tests/test_migration_app_private_owner_context_boundary.py \
            tests/test_migration_app_secure_owner_context_boundary.py \
            tests/test_migration_managed_role_boundary.py \
            tests/test_migration_shared_infrastructure_boundary.py \
            tests/test_platform_billing_cleanup_boundary.py \
            tests/test_address_audit_rls_context_boundary.py \
            tests/test_cluster_role_contract_manifests.py \
            tests/test_rbac_expand_contract_root_cause.py \
            tests/test_0020_contacts_downgrade_contract.py

      - name: Publish bounded reconciliation
        if: steps.patch.outputs.changed == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alembic/versions/00f277c748ea_add_hyperscale_branch_name_and_address_.py \
            tests/test_dafd_app_private_owner_context_boundary.py \
            tests/test_migration_app_private_owner_context_boundary.py \
            tests/test_migration_app_secure_owner_context_boundary.py \
            tests/test_migration_managed_role_boundary.py \
            tests/test_migration_shared_infrastructure_boundary.py
          observed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            alembic/versions/00f277c748ea_add_hyperscale_branch_name_and_address_.py \
            tests/test_dafd_app_private_owner_context_boundary.py \
            tests/test_migration_app_private_owner_context_boundary.py \
            tests/test_migration_app_secure_owner_context_boundary.py \
            tests/test_migration_managed_role_boundary.py \
            tests/test_migration_shared_infrastructure_boundary.py | sort)"
          test "$observed" = "$expected"
          git diff --cached --check
          git commit -m 'test: reconcile hardened migration static contracts'
          git fetch origin hardening/complete-migration-lineage
          git rebase origin/hardening/complete-migration-lineage
          python -m pytest --noconftest -q \
            tests/test_0003_security_schema_lifecycle.py \
            tests/test_0027_complete_owner_context_boundary.py \
            tests/test_66a_pg_partman_boundary.py \
            tests/test_371b333_spatial_index_lineage.py \
            tests/test_database_sync_driver_boundary.py \
            tests/test_database_session_guc_boundary.py \
            tests/test_alembic_env_config_boundary.py \
            tests/test_alembic_model_import_boundary.py \
            tests/test_dafd_app_private_owner_context_boundary.py \
            tests/test_migration_app_private_owner_context_boundary.py \
            tests/test_migration_app_secure_owner_context_boundary.py \
            tests/test_migration_managed_role_boundary.py \
            tests/test_migration_shared_infrastructure_boundary.py \
            tests/test_platform_billing_cleanup_boundary.py \
            tests/test_address_audit_rls_context_boundary.py \
            tests/test_cluster_role_contract_manifests.py \
            tests/test_rbac_expand_contract_root_cause.py \
            tests/test_0020_contacts_downgrade_contract.py
          git diff --check origin/hardening/complete-migration-lineage..HEAD
          git push origin HEAD:hardening/complete-migration-lineage
