name: P4E Operational Snapshots PG16

on:
  push:
    branches:
      - hardening/p4e-operational-recovery-observability
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4e-operational-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operational-snapshots:
    name: Aggregate observability authority and lifecycle on PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MIGRATION_PASSWORD: ci-migration-owner
      AUTH_RUNTIME_PASSWORD: ci-auth-p4e-runtime
      APP_RUNTIME_PASSWORD: ci-app-test-runtime
      WORKER_RUNTIME_PASSWORD: ci-worker-runtime
      MAINTENANCE_RUNTIME_PASSWORD: ci-lifecycle-maintenance-runtime
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_p4e_test
      TEST_DATABASE_URL: postgresql+asyncpg://app_test_runtime:ci-app-test-runtime@127.0.0.1:5432/gymflow_p4e_test
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_p4e_test
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Install PostgreSQL 16 and reduced identities
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-migration-owner';
          CREATE ROLE auth_p4e_runtime LOGIN PASSWORD 'ci-auth-p4e-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_test_runtime LOGIN PASSWORD 'ci-app-test-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE worker_test_runtime LOGIN PASSWORD 'ci-worker-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE lifecycle_maintenance_test_runtime LOGIN PASSWORD 'ci-lifecycle-maintenance-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT auth_runtime TO auth_p4e_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO auth_p4e_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_runtime TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT worker_runtime TO worker_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT lifecycle_maintenance_runtime TO lifecycle_maintenance_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          ALTER ROLE auth_p4e_runtime SET row_security='on';
          ALTER ROLE auth_p4e_runtime SET statement_timeout='5s';
          ALTER ROLE auth_p4e_runtime SET lock_timeout='2s';
          ALTER ROLE auth_p4e_runtime SET idle_in_transaction_session_timeout='15s';
          ALTER ROLE app_test_runtime SET row_security='on';
          ALTER ROLE worker_test_runtime SET row_security='on';
          ALTER ROLE lifecycle_maintenance_test_runtime SET row_security='on';
          CREATE DATABASE gymflow_p4e_test OWNER migration_owner;
          REVOKE ALL ON DATABASE gymflow_p4e_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE gymflow_p4e_test TO migration_owner,auth_p4e_runtime,app_test_runtime,worker_test_runtime,lifecycle_maintenance_test_runtime;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p4e_test

      - name: Prove graph and closed static contracts
        run: |
          set -euo pipefail
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = 'zf07d8e9f0a40'
          python -m py_compile \
            alembic/versions/zf07d8e9f0a40_p4e_operational_snapshots.py \
            tests/test_p4e_operational_snapshots_static_contracts.py \
            tests/test_p4e_operational_snapshots_runtime.py
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p4e_operational_snapshots_static_contracts.py \
            tests/test_migration_app_secure_owner_context_boundary.py \
            tests/test_p4d_refund_authority_static_contracts.py \
            tests/test_p4c_inherited_contracts.py \
            tests/test_platform_maintenance_control_plane.py \
            tests/test_p4a_external_effect_contracts.py

      - name: Migrate to predecessor and freeze ACL baseline
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade ze07d8e9f0a3f
          test "$(python -s -m alembic -c alembic.ini current | awk '{print $1}')" = 'ze07d8e9f0a3f'
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 -At \
            -h 127.0.0.1 -U migration_owner -d gymflow_p4e_test <<'SQL' > /tmp/p4e_relation_acl_predecessor.txt
          SELECT 'REL|' || n.nspname || '.' || c.relname || '|' || coalesce(c.relacl::text,'NULL')
          FROM pg_catalog.pg_class AS c
          JOIN pg_catalog.pg_namespace AS n ON n.oid=c.relnamespace
          WHERE (n.nspname,c.relname) IN (
              ('public','branch_outbox_events'),
              ('public','org_branch_state'),
              ('finance','refunds'),
              ('finance','refund_execution_commands')
          )
          UNION ALL
          SELECT 'ATT|' || n.nspname || '.' || c.relname || '.' || a.attname || '|' || coalesce(a.attacl::text,'NULL')
          FROM pg_catalog.pg_attribute AS a
          JOIN pg_catalog.pg_class AS c ON c.oid=a.attrelid
          JOIN pg_catalog.pg_namespace AS n ON n.oid=c.relnamespace
          WHERE a.attnum > 0 AND NOT a.attisdropped
            AND (n.nspname,c.relname) IN (
              ('public','branch_outbox_events'),
              ('public','org_branch_state'),
              ('finance','refunds'),
              ('finance','refund_execution_commands')
            )
          ORDER BY 1;
          SQL
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p4e_test <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM pg_catalog.pg_proc AS p
              JOIN pg_catalog.pg_namespace AS n ON n.oid=p.pronamespace
              WHERE n.nspname='app_secure'
                AND p.proname IN (
                  'search_operational_snapshot',
                  'refund_execution_operational_snapshot'
                )
                AND p.pronargs=0
            ) THEN
              RAISE EXCEPTION 'P4E snapshot exists before zf07';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_catalog.pg_proc AS p
              JOIN pg_catalog.pg_namespace AS n ON n.oid=p.pronamespace
              WHERE n.nspname='app_secure'
                AND p.proname='discover_refund_execution_maintenance'
                AND p.pronargs=1
            ) THEN
              RAISE EXCEPTION 'P4D maintenance authority missing at predecessor';
            END IF;
          END
          $$;
          SQL

      - name: Upgrade zf07 and prove authority/ACL isolation
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 -At \
            -h 127.0.0.1 -U migration_owner -d gymflow_p4e_test <<'SQL' > /tmp/p4e_relation_acl_head.txt
          SELECT 'REL|' || n.nspname || '.' || c.relname || '|' || coalesce(c.relacl::text,'NULL')
          FROM pg_catalog.pg_class AS c
          JOIN pg_catalog.pg_namespace AS n ON n.oid=c.relnamespace
          WHERE (n.nspname,c.relname) IN (
              ('public','branch_outbox_events'),
              ('public','org_branch_state'),
              ('finance','refunds'),
              ('finance','refund_execution_commands')
          )
          UNION ALL
          SELECT 'ATT|' || n.nspname || '.' || c.relname || '.' || a.attname || '|' || coalesce(a.attacl::text,'NULL')
          FROM pg_catalog.pg_attribute AS a
          JOIN pg_catalog.pg_class AS c ON c.oid=a.attrelid
          JOIN pg_catalog.pg_namespace AS n ON n.oid=c.relnamespace
          WHERE a.attnum > 0 AND NOT a.attisdropped
            AND (n.nspname,c.relname) IN (
              ('public','branch_outbox_events'),
              ('public','org_branch_state'),
              ('finance','refunds'),
              ('finance','refund_execution_commands')
            )
          ORDER BY 1;
          SQL
          diff -u /tmp/p4e_relation_acl_predecessor.txt /tmp/p4e_relation_acl_head.txt
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p4e_test <<'SQL'
          DO $$
          DECLARE
            function_name text;
            function_oid oid;
            owner_name text;
            security_definer boolean;
            volatility "char";
            config text[];
          BEGIN
            FOREACH function_name IN ARRAY ARRAY[
              'search_operational_snapshot',
              'refund_execution_operational_snapshot'
            ] LOOP
              SELECT p.oid,r.rolname,p.prosecdef,p.provolatile,p.proconfig
                INTO function_oid,owner_name,security_definer,volatility,config
              FROM pg_catalog.pg_proc AS p
              JOIN pg_catalog.pg_namespace AS n ON n.oid=p.pronamespace
              JOIN pg_catalog.pg_roles AS r ON r.oid=p.proowner
              WHERE n.nspname='app_secure'
                AND p.proname=function_name
                AND p.pronargs=0;
              IF function_oid IS NULL
                 OR owner_name IS DISTINCT FROM 'app_security_owner'
                 OR security_definer IS DISTINCT FROM true
                 OR volatility IS DISTINCT FROM 's'
                 OR NOT ('row_security=on'=ANY(config))
                 OR NOT EXISTS (SELECT 1 FROM unnest(config) x WHERE x LIKE 'search_path=%')
              THEN
                RAISE EXCEPTION 'unsafe P4E function metadata for %', function_name;
              END IF;
              IF NOT pg_catalog.has_function_privilege('lifecycle_maintenance_runtime',function_oid,'EXECUTE') THEN
                RAISE EXCEPTION 'maintenance EXECUTE missing for %', function_name;
              END IF;
              IF pg_catalog.has_function_privilege('app_runtime',function_oid,'EXECUTE')
                 OR pg_catalog.has_function_privilege('auth_runtime',function_oid,'EXECUTE')
                 OR pg_catalog.has_function_privilege('worker_runtime',function_oid,'EXECUTE')
                 OR pg_catalog.has_function_privilege('finance_config_runtime',function_oid,'EXECUTE')
              THEN
                RAISE EXCEPTION 'runtime privilege expansion for %', function_name;
              END IF;
              IF EXISTS (
                SELECT 1
                FROM pg_catalog.pg_proc AS p
                CROSS JOIN LATERAL pg_catalog.aclexplode(
                  COALESCE(p.proacl,pg_catalog.acldefault('f',p.proowner))
                ) AS acl
                WHERE p.oid=function_oid
                  AND acl.grantee=0
                  AND acl.privilege_type='EXECUTE'
              ) THEN
                RAISE EXCEPTION 'PUBLIC EXECUTE present for %', function_name;
              END IF;
            END LOOP;
          END
          $$;
          SQL

      - name: Run P4E PostgreSQL runtime semantics
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p4e_operational_snapshots_runtime.py

      - name: Prove zf07 downgrade and re-upgrade reversibility
        run: |
          set -euo pipefail
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 -At \
            -h 127.0.0.1 -U migration_owner -d gymflow_p4e_test <<'SQL' > /tmp/p4e_functions_before.txt
          SELECT n.nspname || '.' || p.proname || '()|' || r.rolname || '|' || p.prosecdef || '|' || p.provolatile::text || '|' || coalesce(p.proconfig::text,'NULL') || '|' || coalesce(p.proacl::text,'NULL')
          FROM pg_catalog.pg_proc AS p
          JOIN pg_catalog.pg_namespace AS n ON n.oid=p.pronamespace
          JOIN pg_catalog.pg_roles AS r ON r.oid=p.proowner
          WHERE n.nspname='app_secure'
            AND p.proname IN (
              'search_operational_snapshot',
              'refund_execution_operational_snapshot'
            )
            AND p.pronargs=0
          ORDER BY 1;
          SQL
          python -s -m alembic -c alembic.ini downgrade ze07d8e9f0a3f
          test "$(python -s -m alembic -c alembic.ini current | awk '{print $1}')" = 'ze07d8e9f0a3f'
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 -At \
            -h 127.0.0.1 -U migration_owner -d gymflow_p4e_test <<'SQL' > /tmp/p4e_relation_acl_downgraded.txt
          SELECT 'REL|' || n.nspname || '.' || c.relname || '|' || coalesce(c.relacl::text,'NULL')
          FROM pg_catalog.pg_class AS c
          JOIN pg_catalog.pg_namespace AS n ON n.oid=c.relnamespace
          WHERE (n.nspname,c.relname) IN (
              ('public','branch_outbox_events'),
              ('public','org_branch_state'),
              ('finance','refunds'),
              ('finance','refund_execution_commands')
          )
          UNION ALL
          SELECT 'ATT|' || n.nspname || '.' || c.relname || '.' || a.attname || '|' || coalesce(a.attacl::text,'NULL')
          FROM pg_catalog.pg_attribute AS a
          JOIN pg_catalog.pg_class AS c ON c.oid=a.attrelid
          JOIN pg_catalog.pg_namespace AS n ON n.oid=c.relnamespace
          WHERE a.attnum > 0 AND NOT a.attisdropped
            AND (n.nspname,c.relname) IN (
              ('public','branch_outbox_events'),
              ('public','org_branch_state'),
              ('finance','refunds'),
              ('finance','refund_execution_commands')
            )
          ORDER BY 1;
          SQL
          diff -u /tmp/p4e_relation_acl_predecessor.txt /tmp/p4e_relation_acl_downgraded.txt
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p4e_test <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM pg_catalog.pg_proc AS p
              JOIN pg_catalog.pg_namespace AS n ON n.oid=p.pronamespace
              WHERE n.nspname='app_secure'
                AND p.proname IN (
                  'search_operational_snapshot',
                  'refund_execution_operational_snapshot'
                )
                AND p.pronargs=0
            ) THEN
              RAISE EXCEPTION 'P4E functions survived zf07 downgrade';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_catalog.pg_proc AS p
              JOIN pg_catalog.pg_namespace AS n ON n.oid=p.pronamespace
              WHERE n.nspname='app_secure'
                AND p.proname='discover_refund_execution_maintenance'
                AND p.pronargs=1
            ) THEN
              RAISE EXCEPTION 'P4D maintenance authority was damaged by zf07 downgrade';
            END IF;
          END
          $$;
          SQL
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 -At \
            -h 127.0.0.1 -U migration_owner -d gymflow_p4e_test <<'SQL' > /tmp/p4e_functions_after.txt
          SELECT n.nspname || '.' || p.proname || '()|' || r.rolname || '|' || p.prosecdef || '|' || p.provolatile::text || '|' || coalesce(p.proconfig::text,'NULL') || '|' || coalesce(p.proacl::text,'NULL')
          FROM pg_catalog.pg_proc AS p
          JOIN pg_catalog.pg_namespace AS n ON n.oid=p.pronamespace
          JOIN pg_catalog.pg_roles AS r ON r.oid=p.proowner
          WHERE n.nspname='app_secure'
            AND p.proname IN (
              'search_operational_snapshot',
              'refund_execution_operational_snapshot'
            )
            AND p.pronargs=0
          ORDER BY 1;
          SQL
          diff -u /tmp/p4e_functions_before.txt /tmp/p4e_functions_after.txt
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p4e_operational_snapshots_runtime.py::test_snapshot_functions_are_maintenance_only_and_pii_free

      - name: Final exact-head proof
        run: |
          set -euo pipefail
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = 'zf07d8e9f0a40'
          python -s -m alembic -c alembic.ini current --check-heads
          git diff --exit-code
          git diff --cached --exit-code
          echo "P4E_SLICE1A_PG16_CERTIFICATION=PASS"
