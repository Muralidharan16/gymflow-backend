name: P3A C87 Migration Diagnostic

on:
  pull_request:
    branches: [main, hardening/complete-migration-lineage]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p3a-c87-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  c87-diagnostic:
    name: Surface exact C87 fresh-head failure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_c87_diag
      MIGRATION_PASSWORD: ci-migration-owner
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check

      - name: Provision fresh PostgreSQL 16 candidate
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-migration-owner';
          CREATE DATABASE gymflow_c87_diag OWNER migration_owner;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_c87_diag

      - name: Run fresh HEAD and persist exact migration failure
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -uo pipefail
          python -s -m alembic -c alembic.ini upgrade head 2>&1 | tee /tmp/c87-alembic.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          text = Path('/tmp/c87-alembic.log').read_text(encoding='utf-8', errors='replace')
          text = text.replace('ci-migration-owner', '<redacted>')
          tail = text[-12000:]
          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ.get('HEAD_BRANCH', '').strip()
          path = '.p3a-c87-diagnostic.txt'
          api = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          exists = False
          try:
              request = urllib.request.Request(api + f'?ref={branch}', headers=headers)
              with urllib.request.urlopen(request, timeout=20):
                  exists = True
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          if branch and not exists:
              payload = {
                  'message': 'ci(p3a): persist c87 diagnostic evidence',
                  'content': base64.b64encode(tail.encode('utf-8')).decode('ascii'),
                  'branch': branch,
              }
              request = urllib.request.Request(
                  api,
                  data=json.dumps(payload).encode('utf-8'),
                  headers=headers,
                  method='PUT',
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status not in (200, 201):
                      raise RuntimeError(
                          f'failed to persist c87 evidence: HTTP {response.status}'
                      )
          PY
            exit "$status"
          fi
          python -s -m alembic -c alembic.ini current --check-heads
