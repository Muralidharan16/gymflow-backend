name: P3A C87 Migration Diagnostic

on:
  pull_request:
    branches: [main, hardening/complete-migration-lineage]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3a-c87-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  c87-diagnostic:
    name: Surface exact C87 fresh-head failure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_c87_diag
      MIGRATION_PASSWORD: ci-migration-owner
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check

      - name: Provision fresh PostgreSQL 16 candidate
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-migration-owner';
          CREATE DATABASE gymflow_c87_diag OWNER migration_owner;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_c87_diag

      - name: Run fresh HEAD and capture migration failure
        id: migrate
        continue-on-error: true
        run: |
          set -uo pipefail
          python -s -m alembic -c alembic.ini upgrade head 2>&1 | tee /tmp/c87-alembic.log
          status=${PIPESTATUS[0]}
          sed -i 's/ci-migration-owner/<redacted>/g' /tmp/c87-alembic.log
          exit "$status"

      - name: Upload C87 failure evidence
        if: steps.migrate.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p3a-c87-alembic-${{ github.sha }}
          path: /tmp/c87-alembic.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail on migration error
        if: steps.migrate.outcome == 'failure'
        run: exit 1

      - name: Prove current HEAD
        if: steps.migrate.outcome == 'success'
        run: python -s -m alembic -c alembic.ini current --check-heads
