name: P3A C87 Migration Diagnostic

on:
  pull_request:
    branches: [main, hardening/complete-migration-lineage]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: p3a-c87-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  c87-diagnostic:
    name: Surface exact C87 fresh-head failure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_c87_diag
      MIGRATION_PASSWORD: ci-migration-owner
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check

      - name: Provision fresh PostgreSQL 16 candidate
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-migration-owner';
          CREATE DATABASE gymflow_c87_diag OWNER migration_owner;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_c87_diag

      - name: Run fresh HEAD and publish exact migration failure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          python -s -m alembic -c alembic.ini upgrade head 2>&1 | tee /tmp/c87-alembic.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          text = Path('/tmp/c87-alembic.log').read_text(encoding='utf-8', errors='replace')
          for secret in ('ci-migration-owner',):
              text = text.replace(secret, '<redacted>')
          tail = text[-7000:]
          safe = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=C87 fresh-head migration failure::{safe}')

          pr_number = os.environ.get('PR_NUMBER', '').strip()
          if pr_number:
              body = (
                  '<!-- p3a-c87-diagnostic -->\n'
                  '**Temporary P3A C87 migration diagnostic**\n\n'
                  'Fresh PostgreSQL 16 failed while upgrading to HEAD. Exact tail:\n\n'
                  '```text\n' + tail + '\n```'
              )
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{pr_number}/comments",
                  data=json.dumps({'body': body}).encode('utf-8'),
                  headers={
                      'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status not in (200, 201):
                      raise RuntimeError(f'failed to publish diagnostic comment: HTTP {response.status}')
          PY
            exit "$status"
          fi
          python -s -m alembic -c alembic.ini current --check-heads
