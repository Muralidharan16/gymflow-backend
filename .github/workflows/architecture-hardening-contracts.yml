name: Architecture Hardening Contracts

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-contracts:
    name: Identity, transaction, auth and audit contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Compile architecture hardening surface
        run: |
          python -m py_compile \
            app/core/config.py \
            app/core/database.py \
            app/core/auth_database.py \
            app/core/security.py \
            app/routers/auth.py \
            app/routers/onboarding.py \
            app/services/onboarding_service.py \
            alembic/versions/4d5e6f708192_establish_audit_principal_registry.py \
            alembic/versions/5e6f708192a3_auth_runtime_privilege_boundary.py

      - name: Run architecture boundary contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest --noconftest -q \
            tests/test_database_session_guc_boundary.py \
            tests/test_database_transaction_context_boundary.py \
            tests/test_onboarding_rls_context_boundary.py \
            tests/test_audit_principal_registry_boundary.py \
            tests/test_auth_database_boundary.py \
            tests/test_cluster_role_contract_manifests.py