name: P10-S Long Soak
on:
  push:
    branches: [hardening/p10-performance-security-final-production-certification]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: p10s-soak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CERTIFICATION_HEAD: zk07d8e9f0a45
  MIGRATION_PASSWORD: ci-migration-owner
  GENERAL_RUNTIME_PASSWORD: ci-app-test-runtime
  AUTH_RUNTIME_PASSWORD: ci-auth-test-runtime
  WORKER_RUNTIME_PASSWORD: ci-worker-test-runtime
  MAINTENANCE_RUNTIME_PASSWORD: ci-lifecycle-maintenance-runtime
  DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_migration_test
  TEST_DATABASE_URL: postgresql+asyncpg://app_test_runtime:ci-app-test-runtime@127.0.0.1:5432/gymflow_test
  TEST_ADMIN_DATABASE_URL: postgresql://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
  P10B_APP_DATABASE_URL: postgresql://app_test_runtime:ci-app-test-runtime@127.0.0.1:5432/gymflow_test
  WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:ci-worker-test-runtime@127.0.0.1:5432/gymflow_test
  REDIS_URL: redis://127.0.0.1:6379/0
  CELERY_BROKER_URL: redis://127.0.0.1:6379/1
  CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
  SECRET_KEY: p10s-synthetic-secret-not-production
  AWS_ACCESS_KEY_ID: p10s-synthetic
  AWS_SECRET_ACCESS_KEY: p10s-synthetic
  S3_BUCKET_NAME: p10s-synthetic
  ENVIRONMENT: test
  PYTHONDONTWRITEBYTECODE: '1'
  P10S_ADMIN_DATABASE_URL: postgresql://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
jobs:
  soak:
    if: github.event_name == 'pull_request'
    name: Five minute API worker PostgreSQL Redis soak
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      P10S_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      P10S_DB: gymflow_test
      P10S_SECRET_KEY: p10s-synthetic-secret-not-production
      P10S_METRICS_PORT: '4323'
      P10S_DURATION_SECONDS: '300'
      EVIDENCE_DIR: p10s-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install exact locked environment and prove P10-S contracts
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort >/tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt
          python -m py_compile scripts/ci/p10s_http_soak.py scripts/ci/p10s_worker_activity.py scripts/ci/p10s_resource_sampler.py scripts/ci/p10s_verify_soak.py
          python -m pytest --noconftest -q --maxfail=1 tests/test_p10s_contracts.py
          python scripts/ci/verify_p10_performance_budgets.py | tee /tmp/p10s-budget.log
          grep -q '^P10_BASELINE_BUDGETS=PASS$' /tmp/p10s-budget.log
      - name: Prepare real PostgreSQL 16 reduced identities and HEAD schema
        run: bash scripts/ci/prepare_p3e_pg16.sh
      - name: Run continuous production-container soak
        run: bash scripts/ci/run_p10s_soak.sh
      - name: Upload P10-S evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p10s-${{ github.event.pull_request.head.sha || github.sha }}
          path: p10s-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Emit P10-S terminal marker
        run: |
          grep -q '^P10_SOAK=PASS$' p10s-evidence/decision.log
          echo 'P10_SOAK=PASS'
          echo 'P10_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'

  bind_same_head_soak:
    if: github.event_name != 'pull_request'
    name: Bind canonical same-head five-minute soak
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      P10S_CANDIDATE_SHA: ${{ github.sha }}
      EVIDENCE_DIR: p10s-evidence
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install contract-only pytest
        run: python -m pip install 'pytest==9.1.1'

      - name: Prove P10-S binding and frozen-budget contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/ci/p10s_bind_same_head_soak.py \
            scripts/ci/p10s_verify_soak.py \
            tests/test_p10s_contracts.py
          python -m pytest --noconftest -q --maxfail=1 tests/test_p10s_contracts.py
          python scripts/ci/verify_p10_performance_budgets.py | tee /tmp/p10s-budget.log
          grep -q '^P10_BASELINE_BUDGETS=PASS$' /tmp/p10s-budget.log

      - name: Bind canonical same-head PR soak evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -s scripts/ci/p10s_bind_same_head_soak.py \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${P10S_CANDIDATE_SHA}" \
            --output-dir "${EVIDENCE_DIR}" \
            | tee "${EVIDENCE_DIR}/p10s-bind.log"
          grep -q '^P10S_SAME_HEAD_SOAK_BOUND=PASS$' "${EVIDENCE_DIR}/p10s-bind.log"

      - name: Re-enforce frozen soak budgets on bound evidence
        run: |
          set -euo pipefail
          python -s scripts/ci/p10s_verify_soak.py \
            --http "${EVIDENCE_DIR}/http.json" \
            --worker "${EVIDENCE_DIR}/worker.json" \
            --resources "${EVIDENCE_DIR}/resources.jsonl" \
            --output "${EVIDENCE_DIR}/bound-decision.json" \
            | tee "${EVIDENCE_DIR}/bound-decision.log"
          grep -q '^P10_SOAK=PASS$' "${EVIDENCE_DIR}/bound-decision.log"
          test "$(git rev-parse HEAD)" = "${P10S_CANDIDATE_SHA}"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload bound P10-S evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p10s-${{ github.sha }}
          path: p10s-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Emit bound P10-S terminal marker
        run: |
          echo 'P10_SOAK=PASS'
          echo 'P10_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'
