name: P3A Application Boundary Repair

on:
  push:
    branches:
      - hardening/p3a-organization-profile-authorization
    paths:
      - .github/workflows/p3a-application-gate-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Apply exact application-boundary repair
        run: |
          set -euo pipefail
          python scripts/p3a_application_gate_repair.py
          python -m py_compile app/routers/organizations.py tests/test_organization_profile_authorization_boundary.py
          git diff --check
          grep -n "Organization profile access denied" app/routers/organizations.py
          grep -n "P3B registration access is not broadened" .github/workflows/p3a-organization-profile-application.yml
          grep -n "auth onboarding capability accepted invalid patch" .github/workflows/p3a-organization-profile-boundary.yml
          git rm scripts/p3a_application_gate_repair.py .github/workflows/p3a-application-gate-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/routers/organizations.py tests/test_organization_profile_authorization_boundary.py .github/workflows/p3a-organization-profile-boundary.yml .github/workflows/p3a-organization-profile-application.yml
          git commit -m 'fix: certify P3A application boundary without P3B grants'
          git push origin HEAD:hardening/p3a-organization-profile-authorization
