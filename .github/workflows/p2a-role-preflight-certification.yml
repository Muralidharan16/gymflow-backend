name: P2A External Role Preflight Certification

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2a-role-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p2a-role-preflight-certification:
    name: PG16 reject-before-mutation and command compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      MIGRATION_PASSWORD: ci-migration-owner
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_p2a_test
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m py_compile alembic/env.py app/core/cluster_role_preflight.py

      - name: Install PostgreSQL 16 extension packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-16 \
            postgresql-client-16 \
            postgresql-contrib \
            postgresql-16-partman \
            postgresql-16-postgis-3
          sudo systemctl start postgresql
          pg_config --version
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres -c 'SELECT version();'
          test -f /usr/share/postgresql/16/extension/pg_partman.control

      - name: Bootstrap canonical external PostgreSQL roles
        run: bash scripts/ci/bootstrap_cluster_roles.sh

      - name: Provision P2A migration login secret and database overlay
        run: |
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-migration-owner';
          CREATE DATABASE gymflow_p2a_test OWNER migration_owner;
          SQL

      - name: Verify canonical external role contract
        run: bash scripts/ci/verify_cluster_roles.sh

      - name: Provision infrastructure-owned extensions
        run: |
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_p2a_test <<'SQL'
          CREATE SCHEMA IF NOT EXISTS partman AUTHORIZATION postgres;
          CREATE EXTENSION IF NOT EXISTS pg_partman SCHEMA partman;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE EXTENSION IF NOT EXISTS citext;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS postgis;
          GRANT USAGE ON SCHEMA partman TO migration_owner;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA partman TO migration_owner;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA partman TO migration_owner;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA partman TO migration_owner;
          GRANT EXECUTE ON ALL PROCEDURES IN SCHEMA partman TO migration_owner;
          SQL

      - name: Prove forbidden migration-owner edge is rejected before mutation
        run: |
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          GRANT app_runtime TO migration_owner WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;
          SQL

          set +e
          output="$(python -s -m alembic -c alembic.ini upgrade head 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            echo 'P2A BLOCK: Alembic HEAD accepted a forbidden migration-owner role edge.' >&2
            exit 1
          fi
          grep -F 'External PostgreSQL role preflight failed before Alembic HEAD.' <<<"$output"
          grep -F 'app_runtime' <<<"$output"

          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_p2a_test <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.alembic_version') IS NOT NULL THEN
              RAISE EXCEPTION 'P2A preflight failure mutated alembic_version';
            END IF;
            IF to_regclass('public.organizations') IS NOT NULL THEN
              RAISE EXCEPTION 'P2A preflight failure executed application migrations';
            END IF;
          END
          $$;
          SQL

      - name: Restore canonical edge contract
        run: |
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          REVOKE app_runtime FROM migration_owner;
          SQL

      - name: Prove canonical HEAD succeeds
        run: |
          python -s -m alembic -c alembic.ini upgrade head

      - name: Prove non-destination Alembic inspection command succeeds
        run: |
          python -s -m alembic -c alembic.ini current --check-heads
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p2a_test <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.alembic_version') IS NULL THEN
              RAISE EXCEPTION 'canonical HEAD did not create alembic_version';
            END IF;
            IF to_regclass('public.organizations') IS NULL THEN
              RAISE EXCEPTION 'canonical HEAD did not create application schema';
            END IF;
          END
          $$;
          SQL
