name: P5 Governance and Fault Matrix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - hardening/p5-concurrency-crash-fault-tolerance
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-governance-fault-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Frozen P5 concurrency and durable-worker fault contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P4_MERGE_BASE: 99de1600636979fa355f8ba8ff665f98dc8148bf
      P4_CERTIFIED_TREE: 766243d0bdd0ccd1377d57ae726222f04ff4cf1c
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Prove exact merged P4 ancestry and tree
        run: |
          set -euo pipefail
          git cat-file -e "${P4_MERGE_BASE}^{commit}"
          test "$(git rev-parse "${P4_MERGE_BASE}^{tree}")" = "${P4_CERTIFIED_TREE}"
          git merge-base --is-ancestor "${P4_MERGE_BASE}" HEAD

      - name: Validate P5 governance artifacts
        run: |
          set -euo pipefail
          python -m json.tool docs/architecture/p5_fault_injection_matrix.json >/dev/null
          python -m py_compile tests/test_p5_governance_contracts.py
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p5_governance_contracts.py

      - name: Reprove inherited P4 contract and repository graph guards
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p4f_final_certification_contracts.py \
            tests/test_p4e_final_certification_contracts.py \
            tests/test_p4a_external_effect_contracts.py
          python -s scripts/verify_alembic_graph.py
          python -s scripts/verify_head_workflow_bootstrap.py

      - name: Emit governance marker
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          echo "P5_PROVIDER_REFUND_EXECUTION=DEFERRED_FAIL_CLOSED"
          echo "P5_GOVERNANCE_FAULT_MATRIX=PASS"
