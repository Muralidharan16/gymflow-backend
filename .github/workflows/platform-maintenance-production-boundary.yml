name: Platform Maintenance Production Boundary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-maintenance-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform-maintenance-boundary:
    name: API-clean startup and bounded maintenance execution
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_platform_maintenance_test
      MIGRATION_PASSWORD: ci-migration-owner
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-platform-maintenance-not-production
      AWS_ACCESS_KEY_ID: ci-platform-maintenance
      AWS_SECRET_ACCESS_KEY: ci-platform-maintenance
      AWS_REGION_NAME: us-east-1
      S3_BUCKET_NAME: gymflow-platform-maintenance-test
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked test environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Certify static platform-maintenance architecture
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -m py_compile \
            app/core/supervisor.py \
            app/core/celery_app.py \
            app/tasks/platform_maintenance.py \
            alembic/versions/af5b6c7d8e9f_platform_maintenance_control_plane.py
          python -m pytest --noconftest -q \
            tests/test_platform_maintenance_control_plane.py \
            tests/test_migration_app_secure_owner_context_boundary.py
          python -s scripts/verify_runtime_identity_routing.py
          python -s scripts/verify_alembic_graph.py
          python -s scripts/migration_semantics_gate.py

      - name: Install PostgreSQL 16 and Redis
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
          redis-cli ping

      - name: Bootstrap canonical roles and deployment logins
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-migration-owner';
          CREATE ROLE app_platform_test_runtime LOGIN PASSWORD 'ci-api-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE auth_platform_test_runtime LOGIN PASSWORD 'ci-auth-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE maintenance_platform_test_runtime LOGIN PASSWORD 'ci-maint-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;

          ALTER ROLE app_platform_test_runtime SET row_security='on';
          ALTER ROLE app_platform_test_runtime SET statement_timeout='5s';
          ALTER ROLE app_platform_test_runtime SET lock_timeout='2s';
          ALTER ROLE app_platform_test_runtime SET idle_in_transaction_session_timeout='15s';
          ALTER ROLE auth_platform_test_runtime SET row_security='on';
          ALTER ROLE auth_platform_test_runtime SET statement_timeout='5s';
          ALTER ROLE auth_platform_test_runtime SET lock_timeout='2s';
          ALTER ROLE auth_platform_test_runtime SET idle_in_transaction_session_timeout='15s';
          ALTER ROLE maintenance_platform_test_runtime SET row_security='on';
          ALTER ROLE maintenance_platform_test_runtime SET statement_timeout='15s';
          ALTER ROLE maintenance_platform_test_runtime SET lock_timeout='2s';
          ALTER ROLE maintenance_platform_test_runtime SET idle_in_transaction_session_timeout='30s';

          GRANT app_runtime TO app_platform_test_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO app_platform_test_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT auth_runtime TO auth_platform_test_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO auth_platform_test_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT lifecycle_maintenance_runtime TO maintenance_platform_test_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;

          CREATE DATABASE gymflow_platform_maintenance_test OWNER migration_owner;
          GRANT CONNECT ON DATABASE gymflow_platform_maintenance_test
            TO app_platform_test_runtime,
               auth_platform_test_runtime,
               maintenance_platform_test_runtime;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_platform_maintenance_test

      - name: Fresh Alembic HEAD through reduced migration identity
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads

      - name: Prove maintenance has helper-only access and every helper fails closed
        run: |
          set -euo pipefail
          if PGPASSWORD='ci-maint-runtime' psql -X -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 -U maintenance_platform_test_runtime \
              -d gymflow_platform_maintenance_test \
              -c "UPDATE public.active_idempotency_keys SET status='FAILED'"; then
            echo 'maintenance login unexpectedly has direct idempotency UPDATE' >&2
            exit 1
          fi
          if PGPASSWORD='ci-api-runtime' psql -X -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 -U app_platform_test_runtime \
              -d gymflow_platform_maintenance_test \
              -c "SELECT app_secure.reclaim_stale_idempotency_keys(30,10)"; then
            echo 'API login unexpectedly executes platform-maintenance helper' >&2
            exit 1
          fi

          for helper_sql in \
            "SELECT app_secure.reclaim_stale_idempotency_keys(30,10)" \
            "SELECT app_secure.archive_expired_idempotency_keys(48,10)" \
            "SELECT * FROM app_secure.claim_due_geocoding_reverification(10)" \
            "SELECT app_secure.cleanup_expired_places_cache(10)"
          do
            if PGPASSWORD='ci-maint-runtime' psql -X -v ON_ERROR_STOP=1 \
                -h 127.0.0.1 -U maintenance_platform_test_runtime \
                -d gymflow_platform_maintenance_test \
                -c "$helper_sql"; then
              echo "maintenance helper unexpectedly ran without platform context: $helper_sql" >&2
              exit 1
            fi
          done

      - name: Seed real maintenance targets as migration owner
        run: |
          set -euo pipefail
          PGPASSWORD='ci-migration-owner' psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner \
            -d gymflow_platform_maintenance_test <<'SQL'
          INSERT INTO public.active_idempotency_keys (
              tenant_id, idempotency_key, status, heartbeat_at,
              owner_worker_id, partition_name, created_at
          ) VALUES
              ('11111111-1111-4111-8111-111111111111','p2f-stale','IN_PROGRESS',
               pg_catalog.clock_timestamp()-interval '10 minutes',
               'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','p0',
               pg_catalog.clock_timestamp()-interval '10 minutes'),
              ('11111111-1111-4111-8111-111111111111','p2f-completed','COMPLETED',
               pg_catalog.clock_timestamp()-interval '3 days',NULL,'p0',
               pg_catalog.clock_timestamp()-interval '3 days'),
              ('11111111-1111-4111-8111-111111111111','p2f-fresh','IN_PROGRESS',
               pg_catalog.clock_timestamp(),
               'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','p0',
               pg_catalog.clock_timestamp());

          INSERT INTO public.google_places_cache (
              place_id, latitude, longitude, expires_at
          ) VALUES
              ('p2f-expired-place',11.94,79.80,
               pg_catalog.clock_timestamp()-interval '100 days'),
              ('p2f-current-place',11.95,79.81,
               pg_catalog.clock_timestamp()+interval '20 days');
          SQL

      - name: Execute bounded helpers with maintenance context and verify exact mutations
        run: |
          set -euo pipefail
          PGPASSWORD='ci-maint-runtime' psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U maintenance_platform_test_runtime \
            -d gymflow_platform_maintenance_test <<'SQL'
          BEGIN;
          SELECT pg_catalog.set_config('app.internal_maintenance','platform',true);
          SELECT app_secure.reclaim_stale_idempotency_keys(30,500);
          SELECT app_secure.archive_expired_idempotency_keys(48,1000);
          SELECT * FROM app_secure.claim_due_geocoding_reverification(50);
          SELECT app_secure.cleanup_expired_places_cache(1000);
          COMMIT;
          SQL

          PGPASSWORD='ci-migration-owner' psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner \
            -d gymflow_platform_maintenance_test <<'SQL'
          DO $$
          BEGIN
            IF (SELECT status FROM public.active_idempotency_keys
                WHERE tenant_id='11111111-1111-4111-8111-111111111111'
                  AND idempotency_key='p2f-stale') <> 'FAILED' THEN
              RAISE EXCEPTION 'stale IN_PROGRESS anchor was not reclaimed as FAILED';
            END IF;
            IF EXISTS (
                SELECT 1 FROM public.active_idempotency_keys
                WHERE tenant_id='11111111-1111-4111-8111-111111111111'
                  AND idempotency_key='p2f-completed'
            ) THEN
              RAISE EXCEPTION 'expired COMPLETED anchor was not archived';
            END IF;
            IF (SELECT status FROM public.active_idempotency_keys
                WHERE tenant_id='11111111-1111-4111-8111-111111111111'
                  AND idempotency_key='p2f-fresh') <> 'IN_PROGRESS' THEN
              RAISE EXCEPTION 'fresh in-progress anchor was incorrectly changed';
            END IF;
            IF EXISTS (
                SELECT 1 FROM public.google_places_cache
                WHERE place_id='p2f-expired-place'
            ) THEN
              RAISE EXCEPTION 'expired places cache row was not removed';
            END IF;
            IF NOT EXISTS (
                SELECT 1 FROM public.google_places_cache
                WHERE place_id='p2f-current-place'
            ) THEN
              RAISE EXCEPTION 'current places cache row was incorrectly removed';
            END IF;
          END
          $$;
          SQL

      - name: Prepare P6 production Redis for production entrypoints
        run: |
          set -euo pipefail
          sudo sysctl -w vm.overcommit_memory=1
          test "$(cat /proc/sys/vm/overcommit_memory)" = "1"

          CERT_DIR="/tmp/platform-maintenance-redis-tls"
          CONFIG_DIR="/tmp/platform-maintenance-redis-config"
          mkdir -p "${CERT_DIR}" "${CONFIG_DIR}"

          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout "${CERT_DIR}/ca.key" \
            -out "${CERT_DIR}/ca.crt" \
            -subj '/CN=DOERS Platform Maintenance CI CA'
          openssl req -newkey rsa:2048 -sha256 -nodes \
            -keyout "${CERT_DIR}/server.key" \
            -out "${CERT_DIR}/server.csr" \
            -subj '/CN=platform-maint-primary'
          cat > "${CERT_DIR}/server.ext" <<'EOF'
          basicConstraints=CA:FALSE
          keyUsage=digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:localhost,DNS:platform-maint-primary,DNS:platform-maint-replica,IP:127.0.0.1
          EOF
          openssl x509 -req -sha256 -days 1 \
            -in "${CERT_DIR}/server.csr" \
            -CA "${CERT_DIR}/ca.crt" \
            -CAkey "${CERT_DIR}/ca.key" \
            -CAcreateserial \
            -out "${CERT_DIR}/server.crt" \
            -extfile "${CERT_DIR}/server.ext"
          chmod 0644 "${CERT_DIR}/ca.crt" "${CERT_DIR}/server.crt" "${CERT_DIR}/server.key"

          REDIS_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::${REDIS_PASSWORD}"
          export PLATFORM_MAINT_REDIS_PASSWORD="${REDIS_PASSWORD}"
          echo "PLATFORM_MAINT_REDIS_PASSWORD=${REDIS_PASSWORD}" >> "${GITHUB_ENV}"
          echo "PLATFORM_MAINT_CERT_DIR=${CERT_DIR}" >> "${GITHUB_ENV}"

          cat > "${CONFIG_DIR}/primary.conf" <<EOF
          port 0
          tls-port 6379
          tls-cert-file /tls/server.crt
          tls-key-file /tls/server.key
          tls-ca-cert-file /tls/ca.crt
          tls-auth-clients no
          requirepass ${REDIS_PASSWORD}
          dir /data
          appendonly yes
          appendfsync everysec
          save 60 1
          maxmemory 128mb
          maxmemory-policy noeviction
          EOF

          cat > "${CONFIG_DIR}/replica.conf" <<EOF
          port 0
          tls-port 6379
          tls-cert-file /tls/server.crt
          tls-key-file /tls/server.key
          tls-ca-cert-file /tls/ca.crt
          tls-auth-clients no
          requirepass ${REDIS_PASSWORD}
          masterauth ${REDIS_PASSWORD}
          replicaof platform-maint-primary 6379
          tls-replication yes
          dir /data
          appendonly yes
          appendfsync everysec
          save 60 1
          maxmemory 128mb
          maxmemory-policy noeviction
          EOF

          docker network create platform-maint-redis-net
          docker volume create platform-maint-primary-data
          docker volume create platform-maint-replica-data
          docker run -d --name platform-maint-primary \
            --network platform-maint-redis-net \
            -p 16379:6379 \
            -v platform-maint-primary-data:/data \
            -v "${CERT_DIR}:/tls:ro" \
            -v "${CONFIG_DIR}:/config:ro" \
            redis:7-alpine redis-server /config/primary.conf
          docker run -d --name platform-maint-replica \
            --network platform-maint-redis-net \
            -v platform-maint-replica-data:/data \
            -v "${CERT_DIR}:/tls:ro" \
            -v "${CONFIG_DIR}:/config:ro" \
            redis:7-alpine redis-server /config/replica.conf

          REDISS_BASE="rediss://:${REDIS_PASSWORD}@localhost:16379"
          REDISS_QUERY="ssl_cert_reqs=required&ssl_ca_certs=${CERT_DIR}/ca.crt"
          echo "REDIS_URL=${REDISS_BASE}/0?${REDISS_QUERY}" >> "${GITHUB_ENV}"
          echo "CELERY_BROKER_URL=${REDISS_BASE}/1?${REDISS_QUERY}" >> "${GITHUB_ENV}"
          echo "CELERY_RESULT_BACKEND=${REDISS_BASE}/2?${REDISS_QUERY}" >> "${GITHUB_ENV}"
          echo "REDIS_PRODUCTION_TOPOLOGY=self_managed_ha" >> "${GITHUB_ENV}"
          echo "REDIS_PERSISTENCE_MODE=aof_everysec_rdb" >> "${GITHUB_ENV}"
          echo "REDIS_MAXMEMORY_POLICY=noeviction" >> "${GITHUB_ENV}"
          echo "REDIS_HA_MIN_REPLICAS=1" >> "${GITHUB_ENV}"
          echo "REDIS_VM_OVERCOMMIT_MEMORY=1" >> "${GITHUB_ENV}"
          echo "REDIS_MANAGED_PROVIDER_ATTESTED=false" >> "${GITHUB_ENV}"

          python scripts/verify_redis_production_readiness.py \
            --host localhost \
            --port 16379 \
            --ca-cert "${CERT_DIR}/ca.crt" \
            --password-env PLATFORM_MAINT_REDIS_PASSWORD \
            --expected-replicas 1 \
            --require-local-overcommit

      - name: Execute production maintenance task integration through maintenance DB identity
        env:
          ENVIRONMENT: production
          DOERS_PROCESS_PROFILE: maintenance
          CELERY_WORKER_PROFILE: maintenance
          DATABASE_URL: ''
          AUTH_DATABASE_URL: ''
          WORKER_DATABASE_URL: ''
          MAINTENANCE_DATABASE_URL: postgresql+asyncpg://maintenance_platform_test_runtime:ci-maint-runtime@127.0.0.1:5432/gymflow_platform_maintenance_test
          P4E_METRICS_OTLP_ENDPOINT: http://127.0.0.1:4318/v1/metrics
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          from app.tasks.platform_maintenance import (
              _run_archive_expired_idempotency,
              _run_geocoding_reverification,
              _run_places_cache_cleanup,
              _run_reclaim_stale_idempotency,
          )
          assert asyncio.run(_run_reclaim_stale_idempotency()) == 0
          assert asyncio.run(_run_archive_expired_idempotency()) == 0
          assert asyncio.run(_run_geocoding_reverification()) == 0
          assert asyncio.run(_run_places_cache_cleanup()) == 0
          PY

      - name: Boot production API with only API and auth credentials and reject supervisor DB errors
        env:
          ENVIRONMENT: production
          DOERS_PROCESS_PROFILE: api
          CELERY_WORKER_PROFILE: ''
          DATABASE_URL: postgresql+asyncpg://app_platform_test_runtime:ci-api-runtime@127.0.0.1:5432/gymflow_platform_maintenance_test
          AUTH_DATABASE_URL: postgresql+asyncpg://auth_platform_test_runtime:ci-auth-runtime@127.0.0.1:5432/gymflow_platform_maintenance_test
          WORKER_DATABASE_URL: ''
          MAINTENANCE_DATABASE_URL: ''
          P8_METRICS_OTLP_ENDPOINT: http://127.0.0.1:4318/v1/metrics
        run: |
          set -euo pipefail
          LOG=/tmp/platform-api.log
          uvicorn app.main:app --host 127.0.0.1 --port 8765 > "$LOG" 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/openapi.json >/tmp/openapi.json; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$LOG"
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          sleep 4
          kill "$pid"
          wait "$pid" || true
          cat "$LOG"
          if grep -Eiq \
              'Supervisor worker failed|permission denied for table|UndefinedColumn|worker .* crashed|CRITICAL.*Worker' \
              "$LOG"; then
            echo 'Production API emitted a supervised database/runtime failure' >&2
            exit 1
          fi
          if grep -Eiq 'zombie_reclaim|anchor_key_archive|maps_stale_sweep|maps_retry_sweep|places_cache_cleanup' "$LOG"; then
            echo 'API process still starts database-global maintenance work' >&2
            exit 1
          fi

      - name: Reprove cluster identity graph after maintenance execution
        env:
          DOERS_CLUSTER_VERIFY_DATABASE_URL: postgresql+psycopg://migration_owner:ci-migration-owner@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          python -s scripts/verify_cluster_role_bootstrap.py
          python -s scripts/verify_cluster_identity_graph.py

      - name: Cleanup disposable production Redis topology
        if: always()
        run: |
          docker rm -f platform-maint-replica platform-maint-primary >/dev/null 2>&1 || true
          docker volume rm platform-maint-replica-data platform-maint-primary-data >/dev/null 2>&1 || true
          docker network rm platform-maint-redis-net >/dev/null 2>&1 || true
