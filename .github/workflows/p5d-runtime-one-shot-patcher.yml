name: P5D Runtime One-Shot Patcher

on:
  push:
    branches: [automation/p5d-runtime-patcher-20260913]

permissions:
  contents: write

jobs:
  patch-p5d-temp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hardening/p5d-dependency-loss-temp
          fetch-depth: 1

      - name: Patch exact P5D lifecycle fixture transition source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5cbd76b10fc99b97f3e12d804470d87414784c90"
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_p5d_dependency_loss_runtime.py')
          source = path.read_text(encoding='utf-8')
          old = '                transition_source="p5d_runtime",\n'
          new = '                transition_source="api",\n'
          if source.count(old) != 1:
              raise SystemExit('unexpected P5D lifecycle transition-source shape')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          python -m py_compile tests/test_p5d_dependency_loss_runtime.py
          test "$(git diff --name-only)" = "tests/test_p5d_dependency_loss_runtime.py"
          grep -Fq 'transition_source="api"' tests/test_p5d_dependency_loss_runtime.py
          if grep -Fq 'transition_source="p5d_runtime"' tests/test_p5d_dependency_loss_runtime.py; then
            echo 'invalid P5D transition source remains' >&2
            exit 1
          fi

      - name: Commit exact legal lifecycle-source repair
        shell: bash
        run: |
          set -euo pipefail
          git add -- tests/test_p5d_dependency_loss_runtime.py
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "tests/test_p5d_dependency_loss_runtime.py"
          git -c user.name='Muralidharan16' \
            -c user.email='145135907+Muralidharan16@users.noreply.github.com' \
            commit -m 'P5D use legal lifecycle transition source'
          git push origin HEAD:hardening/p5d-dependency-loss-temp
