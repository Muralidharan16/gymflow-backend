name: P5D Runtime One-Shot Patcher

on:
  push:
    branches: [automation/p5d-runtime-patcher-20260913]

permissions:
  contents: write

jobs:
  patch-p5d-temp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hardening/p5d-dependency-loss-temp
          fetch-depth: 1

      - name: Patch exact P5D state observation privilege defect
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f302318b1cff56202a3ee6d73bcfe339e1e688e0"
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_p5d_dependency_loss_runtime.py')
          source = path.read_text(encoding='utf-8')
          old = '''def _search_state(seed: _BaseSeed) -> tuple[Any, ...]:
              with _connect(_AUTH_LOGIN, "AUTH_RUNTIME_PASSWORD") as connection:
                  with connection.cursor() as cursor:
                      cursor.execute(
                          """
                          SELECT
                              pg_catalog.set_config('app.current_role','owner',true),
                              pg_catalog.set_config('app.current_org_id',%s,true),
                              pg_catalog.set_config('app.current_user_id',%s,true),
                              pg_catalog.set_config('app.current_principal_type','owner',true)
                          """,
                          (str(seed.org_id), str(seed.owner_id)),
                      )
                      cursor.execute(
                          """
                          SELECT search_visibility_version,search_provider_ack_version,
                                 search_last_synced_at,search_sync_failed_at,
                                 lifecycle_transition_in_progress,saga_last_checkpoint,status
                          FROM public.org_branch_state
                          WHERE branch_id=%s AND org_id=%s
                          """,
                          (seed.branch_id, seed.org_id),
                      )
                      row = cursor.fetchone()
                      assert row is not None
                      return row
          '''
          new = '''def _search_state(seed: _BaseSeed) -> tuple[Any, ...]:
              # Read-only CI infrastructure observation. The faulting and replacement
              # application workers remain worker_test_runtime/NOBYPASSRLS; do not
              # widen runtime table ACL merely to inspect post-fault evidence.
              output = _admin_psql(
                  "SELECT search_visibility_version::text," 
                  "COALESCE(search_provider_ack_version::text,'NULL')," 
                  "CASE WHEN search_last_synced_at IS NULL THEN 'NULL' ELSE 'SET' END," 
                  "CASE WHEN search_sync_failed_at IS NULL THEN 'NULL' ELSE 'SET' END," 
                  "lifecycle_transition_in_progress::text," 
                  "COALESCE(saga_last_checkpoint,'NULL'),status "
                  "FROM public.org_branch_state "
                  f"WHERE branch_id='{seed.branch_id}'::uuid "
                  f"AND org_id='{seed.org_id}'::uuid;",
                  tuples_only=True,
              )
              rows = [line.strip() for line in output.splitlines() if line.strip()]
              assert len(rows) == 1
              values = rows[0].split("|")
              assert len(values) == 7
              return (
                  int(values[0]),
                  None if values[1] == "NULL" else int(values[1]),
                  None if values[2] == "NULL" else values[2],
                  None if values[3] == "NULL" else values[3],
                  values[4] == "true",
                  None if values[5] == "NULL" else values[5],
                  values[6],
              )
          '''
          if source.count(old) != 1:
              raise SystemExit('unexpected P5D search-state reader shape')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          python -m py_compile tests/test_p5d_dependency_loss_runtime.py
          test "$(git diff --name-only)" = "tests/test_p5d_dependency_loss_runtime.py"
          grep -Fq 'Read-only CI infrastructure observation.' tests/test_p5d_dependency_loss_runtime.py
          grep -Fq 'output = _admin_psql(' tests/test_p5d_dependency_loss_runtime.py
          grep -Fq 'tuples_only=True' tests/test_p5d_dependency_loss_runtime.py

      - name: Commit exact infrastructure observation repair
        shell: bash
        run: |
          set -euo pipefail
          git add -- tests/test_p5d_dependency_loss_runtime.py
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "tests/test_p5d_dependency_loss_runtime.py"
          git -c user.name='Muralidharan16' \
            -c user.email='145135907+Muralidharan16@users.noreply.github.com' \
            commit -m 'P5D observe fault state through CI infrastructure'
          git push origin HEAD:hardening/p5d-dependency-loss-temp
