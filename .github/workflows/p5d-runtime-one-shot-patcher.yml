name: P5D Runtime One-Shot Patcher

on:
  push:
    branches: [automation/p5d-runtime-patcher-20260913]

permissions:
  contents: write

jobs:
  patch-p5d-temp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hardening/p5d-dependency-loss-temp
          fetch-depth: 1

      - name: Patch exact P5D lifecycle actor fixture identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7524b41c6bb75e350bddbb7b9056f8a7b193366c"
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_p5d_dependency_loss_runtime.py")
          source = path.read_text(encoding="utf-8")
          anchor = '            branch_rows = [(seed.branch_id, "Primary")]\n'
          replacement = (
              '            # Canonical lifecycle actor bridge: lifecycle audit FKs\n'
              '            # target organization_users even for an owner-authenticated actor.\n'
              '            cursor.execute(\n'
              '                """\n'
              '                INSERT INTO public.organization_users(\n'
              '                    id,org_id,name,email,password_hash,is_active,is_verified\n'
              '                ) VALUES (\n'
              "                    %s,%s,'P5-D Runtime Owner User',%s,\n"
              "                    'fixture-not-a-real-password-hash',true,true\n"
              '                )\n'
              '                """,\n'
              '                (\n'
              '                    seed.owner_id,\n'
              '                    seed.org_id,\n'
              '                    f"p5d-{seed.owner_id.hex}@example.test",\n'
              '                ),\n'
              '            )\n'
              '            branch_rows = [(seed.branch_id, "Primary")]\n'
          )
          if source.count(anchor) != 1:
              raise SystemExit("unexpected P5D branch_rows anchor count")
          path.write_text(source.replace(anchor, replacement, 1), encoding="utf-8")
          PY
          git diff --check
          python -m py_compile tests/test_p5d_dependency_loss_runtime.py
          test "$(git diff --name-only)" = "tests/test_p5d_dependency_loss_runtime.py"
          grep -Fq 'INSERT INTO public.organization_users(' tests/test_p5d_dependency_loss_runtime.py
          grep -Fq 'P5-D Runtime Owner User' tests/test_p5d_dependency_loss_runtime.py

      - name: Commit exact canonical lifecycle-actor seed repair
        shell: bash
        run: |
          set -euo pipefail
          git add -- tests/test_p5d_dependency_loss_runtime.py
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "tests/test_p5d_dependency_loss_runtime.py"
          git -c user.name='Muralidharan16' \
            -c user.email='145135907+Muralidharan16@users.noreply.github.com' \
            commit -m 'P5D seed canonical lifecycle actor identity'
          git push origin HEAD:hardening/p5d-dependency-loss-temp
