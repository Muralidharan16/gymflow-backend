name: P5D Runtime One-Shot Patcher

on:
  push:
    branches: [automation/p5d-runtime-patcher-20260913]

permissions:
  contents: write

jobs:
  patch-p5d-temp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hardening/p5d-dependency-loss-temp
          fetch-depth: 1

      - name: Patch exact P5D lifecycle actor fixture identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7524b41c6bb75e350bddbb7b9056f8a7b193366c"
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_p5d_dependency_loss_runtime.py')
          source = path.read_text(encoding='utf-8')
          anchor = '''            cursor.execute(
                """
                INSERT INTO public.owners(
                    id,org_id,owner_name,email,hashed_password,
                    email_verified,onboarding_completed
                ) VALUES (
                    %s,%s,'P5-D Runtime Owner',%s,
                    'fixture-not-a-real-password-hash',true,true
                )
                """,
                (seed.owner_id, seed.org_id, f"p5d-{seed.owner_id.hex}@example.test"),
            )
            branch_rows = [(seed.branch_id, "Primary")]
'''
          replacement = '''            owner_email = f"p5d-{seed.owner_id.hex}@example.test"
            cursor.execute(
                """
                INSERT INTO public.owners(
                    id,org_id,owner_name,email,hashed_password,
                    email_verified,onboarding_completed
                ) VALUES (
                    %s,%s,'P5-D Runtime Owner',%s,
                    'fixture-not-a-real-password-hash',true,true
                )
                """,
                (seed.owner_id, seed.org_id, owner_email),
            )
            # Canonical lifecycle actor bridge: the production lifecycle schema
            # records status/history actor IDs against organization_users even
            # when the authenticated product actor is an owner. Existing
            # lifecycle fixtures seed the same owner UUID into both identities.
            cursor.execute(
                """
                INSERT INTO public.organization_users(
                    id,org_id,name,email,password_hash,is_active,is_verified
                ) VALUES (
                    %s,%s,'P5-D Runtime Owner User',%s,
                    'fixture-not-a-real-password-hash',true,true
                )
                """,
                (seed.owner_id, seed.org_id, owner_email),
            )
            branch_rows = [(seed.branch_id, "Primary")]
'''
          if source.count(anchor) != 1:
              raise SystemExit('unexpected P5D owner fixture seed shape')
          path.write_text(source.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          git diff --check
          python -m py_compile tests/test_p5d_dependency_loss_runtime.py
          test "$(git diff --name-only)" = "tests/test_p5d_dependency_loss_runtime.py"
          grep -Fq 'INSERT INTO public.organization_users(' tests/test_p5d_dependency_loss_runtime.py
          grep -Fq '(seed.owner_id, seed.org_id, owner_email)' tests/test_p5d_dependency_loss_runtime.py
          grep -Fq 'Canonical lifecycle actor bridge' tests/test_p5d_dependency_loss_runtime.py

      - name: Commit exact canonical lifecycle-actor seed repair
        shell: bash
        run: |
          set -euo pipefail
          git add -- tests/test_p5d_dependency_loss_runtime.py
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "tests/test_p5d_dependency_loss_runtime.py"
          git -c user.name='Muralidharan16' \
            -c user.email='145135907+Muralidharan16@users.noreply.github.com' \
            commit -m 'P5D seed canonical lifecycle actor identity'
          git push origin HEAD:hardening/p5d-dependency-loss-temp
