name: P3A Predecessor ACL Diagnostic

on:
  push:
    branches:
      - hardening/p3a-organization-profile-authorization
    paths:
      - .github/workflows/p3a-predecessor-acl-diagnostic.yml

permissions:
  contents: read

jobs:
  predecessor-acl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_p3a_acl
      MIGRATION_PASSWORD: ci-migration-owner
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-p3a-diagnostic
      AWS_ACCESS_KEY_ID: ci-p3a
      AWS_SECRET_ACCESS_KEY: ci-p3a
      AWS_REGION_NAME: us-east-1
      S3_BUCKET_NAME: gymflow-p3a-test
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python -m pip install -r requirements-test.lock >/dev/null
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-migration-owner';
          CREATE DATABASE gymflow_p3a_acl OWNER migration_owner;
          SQL
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p3a_acl
          python -s -m alembic -c alembic.ini upgrade b06c7d8e9f0a
      - name: Print exact predecessor ACLs
        run: |
          set -euo pipefail
          PGPASSWORD='ci-migration-owner' psql -X -A -F '|' -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p3a_acl <<'SQL'
          SELECT 'OWNER_RELATION_ACL', x.privilege_type, x.is_grantable, grantor.rolname
          FROM pg_catalog.pg_class c
          CROSS JOIN LATERAL pg_catalog.aclexplode(c.relacl) x
          JOIN pg_catalog.pg_roles grantee ON grantee.oid=x.grantee
          LEFT JOIN pg_catalog.pg_roles grantor ON grantor.oid=x.grantor
          WHERE c.oid='public.owners'::regclass
            AND grantee.rolname='app_security_owner'
          ORDER BY 2,3,4;

          SELECT 'OWNER_COLUMN_ACL', a.attname, x.privilege_type, x.is_grantable, grantor.rolname
          FROM pg_catalog.pg_attribute a
          CROSS JOIN LATERAL pg_catalog.aclexplode(a.attacl) x
          JOIN pg_catalog.pg_roles grantee ON grantee.oid=x.grantee
          LEFT JOIN pg_catalog.pg_roles grantor ON grantor.oid=x.grantor
          WHERE a.attrelid='public.owners'::regclass
            AND a.attnum>0 AND NOT a.attisdropped
            AND grantee.rolname='app_security_owner'
          ORDER BY 2,3,4,5;

          SELECT 'ORG_USER_COLUMN_ACL', a.attname, x.privilege_type, x.is_grantable, grantor.rolname
          FROM pg_catalog.pg_attribute a
          CROSS JOIN LATERAL pg_catalog.aclexplode(a.attacl) x
          JOIN pg_catalog.pg_roles grantee ON grantee.oid=x.grantee
          LEFT JOIN pg_catalog.pg_roles grantor ON grantor.oid=x.grantor
          WHERE a.attrelid='public.organization_users'::regclass
            AND a.attnum>0 AND NOT a.attisdropped
            AND grantee.rolname='app_security_owner'
          ORDER BY 2,3,4,5;
          SQL
