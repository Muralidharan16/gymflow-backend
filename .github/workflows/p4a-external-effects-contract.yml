name: P4A External Effects Contract

on:
  pull_request:
    branches:
      - hardening/p3e-background-worker-identity
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4a-external-effects-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  external-effects-contract:
    name: External acknowledgement, retry and recovery contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Compile P4A contract tests and inherited external-effect surfaces
        run: |
          set -euo pipefail
          python -m py_compile \
            tests/test_p4a_external_effect_contracts.py \
            app/tasks/branch_outbox_poller.py \
            app/tasks/reminders.py \
            app/tasks/daily_digest.py \
            app/services/branch_lifecycle_service.py \
            app/finance_core/models/foundation.py

      - name: Validate P4 inventory JSON
        run: |
          set -euo pipefail
          python -m json.tool docs/architecture/p4_external_effect_inventory.json >/dev/null

      - name: Prove P4A external-effect hard contract
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p4a_external_effect_contracts.py

      - name: Reprove inherited P3E static async identity boundary
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p3e_async_identity_static_contracts.py \
            tests/test_p3e_asset_fencing_static_contracts.py

      - name: Prove canonical HEAD workflow bootstrap scanner remains green
        run: |
          set -euo pipefail
          python scripts/verify_head_workflow_bootstrap.py
