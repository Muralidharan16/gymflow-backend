name: PAY-11 Platform Billing Production Model

on:
  push:
    branches:
      - hardening/pay11-platform-billing-production-model
  pull_request:
    branches:
      - hardening/pay10-refund-credit-note-provider-execution
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay11-platform-billing-production-model-${{ github.ref }}
  cancel-in-progress: true

env:
  PAY11_BASE_SHA: 4fbbde1f4fe809f433f7a4b19894c59dcaffed9b
  PAY11_BASE_TREE: ac51aff5b1c68dbec655744834ea3a070dd81ff3
  PAY11_PREDECESSOR: zv07d8e9f0a56
  PAY11_HEAD: zw07d8e9f0a57
  PAY11_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: PAY-11 production model static contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/pay11_static
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: pay11-static-not-production
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      S3_BUCKET_NAME: pay11-static
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY11_CANDIDATE_SHA }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
      - name: Exact PAY-11 scope and Alembic graph
        run: |
          set -euo pipefail
          test "$(git rev-parse "${PAY11_BASE_SHA}^{tree}")" = "${PAY11_BASE_TREE}"
          git merge-base --is-ancestor "${PAY11_BASE_SHA}" HEAD
          test "$(git merge-base "${PAY11_BASE_SHA}" HEAD)" = "${PAY11_BASE_SHA}"
          git diff --name-only "${PAY11_BASE_SHA}...HEAD" > /tmp/pay11-changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              ".github/workflows/pay11-platform-billing-production-model.yml",
              "alembic/versions/zw07d8e9f0a57_pay11_platform_billing_production_model.py",
              "app/platform_billing/models/__init__.py",
              "app/platform_billing/models/production.py",
              "app/platform_billing/models/subscription.py",
              "app/platform_billing/policies/data/catalog_release_v1.json",
              "app/platform_billing/policies/data/provider_release_v1.json",
              "docs/architecture/PAY11_PLATFORM_BILLING_PRODUCTION_MODEL.md",
              "docs/architecture/pay11_platform_billing_model_v1.json",
              "tests/platform_billing/test_architecture.py",
              "tests/platform_billing/test_pay11_production_model.py",
              "tests/platform_billing/test_pay11_production_model_static.py",
              "tests/platform_billing/test_phase1_schema.py",
              "tests/platform_billing/test_phase4a_persistence.py",
              "tests/platform_billing/test_phase4d0_reconciliation_schema.py",
              "tests/platform_billing/test_phase4e2c1_fake_provider_evidence.py",
          }
          changed = {p.strip() for p in Path("/tmp/pay11-changed.txt").read_text().splitlines() if p.strip()}
          if changed != allowed:
              raise SystemExit(
                  f"PAY-11 exact scope mismatch: missing={sorted(allowed-changed)}, "
                  f"unexpected={sorted(changed-allowed)}"
              )
          print(f"PAY-11 exact allowlist paths: {len(changed)}")
          PY
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "${PAY11_HEAD}"
      - name: PAY-11 static production-model contracts
        run: |
          set -euo pipefail
          python -m py_compile             alembic/versions/zw07d8e9f0a57_pay11_platform_billing_production_model.py             app/platform_billing/models/production.py             app/platform_billing/models/subscription.py             app/platform_billing/models/__init__.py             tests/platform_billing/test_pay11_production_model.py             tests/platform_billing/test_pay11_production_model_static.py
          python -m json.tool app/platform_billing/policies/data/catalog_release_v1.json >/dev/null
          python -m json.tool app/platform_billing/policies/data/provider_release_v1.json >/dev/null
          python -m json.tool docs/architecture/pay11_platform_billing_model_v1.json >/dev/null
          python -m pytest --noconftest -q --maxfail=1             tests/platform_billing/test_pay11_production_model_static.py             tests/test_platform_billing_cleanup_boundary.py             tests/test_alembic_model_import_boundary.py
          echo 'PAY11_REQUIRED_PRODUCTION_ENTITIES=PASS'
          echo 'PAY11_CATALOG_PROVIDER_RELEASE_MANIFESTS=PASS'
          echo 'PAY11_PLAN_PRICE_PUBLICATION_IMMUTABILITY=PASS'
          echo 'PAY11_SUBSCRIBER_CONTRACT_RETENTION=PASS'
          echo 'PAY11_CONTROLLED_CONTRACT_MIGRATION=PASS'
          echo 'PAY11_ISSUED_DOCUMENT_IMMUTABILITY=PASS'
          echo 'PAY11_REFUND_CAPACITY_AND_BACKING=PASS'
          echo 'PAY11_LIVE_PROVIDER=DISABLED'
          echo 'PAY11_LIVE_MONEY_MOVEMENT=DISABLED'
          echo 'PAY11_MERGE=NOT_AUTHORIZED'

  protocol_pg16:
    name: PAY-11 PG16 migration lifecycle and downgrade safety
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay11-migration@127.0.0.1:5432/gymflow_pay11_lifecycle_test
      SECRET_KEY: pay11-pg16-not-production
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      S3_BUCKET_NAME: pay11-pg16
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY11_CANDIDATE_SHA }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
      - name: Install PG16 disposable PAY-11 database
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-pay11-migration';
          CREATE DATABASE gymflow_pay11_lifecycle_test OWNER migration_owner;
          SQL
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_pay11_lifecycle_test
      - name: Prove additive upgrade and empty roundtrip
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade "${PAY11_PREDECESSOR}"
          test "$(PGPASSWORD=ci-pay11-migration psql -X -qAt -v ON_ERROR_STOP=1             -h 127.0.0.1 -U migration_owner -d gymflow_pay11_lifecycle_test             -c "SELECT pg_catalog.to_regclass('public.platform_invoices') IS NULL")" = "t"
          python -s -m alembic -c alembic.ini upgrade "${PAY11_HEAD}"
          PGPASSWORD=ci-pay11-migration psql -X -v ON_ERROR_STOP=1             -h 127.0.0.1 -U migration_owner -d gymflow_pay11_lifecycle_test <<'SQL'
          DO $$
          DECLARE missing_count integer;
          BEGIN
            SELECT count(*) INTO missing_count
            FROM (
              VALUES
                ('platform_provider_subscriptions'),
                ('platform_mandates'),
                ('platform_document_sequences'),
                ('platform_invoices'),
                ('platform_invoice_lines'),
                ('platform_payment_attempts'),
                ('platform_refunds'),
                ('platform_credit_notes'),
                ('platform_credit_note_lines'),
                ('platform_catalog_releases'),
                ('platform_catalog_release_items'),
                ('platform_provider_releases')
            ) AS required(name)
            WHERE pg_catalog.to_regclass('public.' || name) IS NULL;
            IF missing_count <> 0 THEN
              RAISE EXCEPTION 'PAY-11 required relation count missing=%', missing_count;
            END IF;
          END
          $$;
          SQL
          python -s -m alembic -c alembic.ini downgrade "${PAY11_PREDECESSOR}"
          test "$(PGPASSWORD=ci-pay11-migration psql -X -qAt -v ON_ERROR_STOP=1             -h 127.0.0.1 -U migration_owner -d gymflow_pay11_lifecycle_test             -c "SELECT pg_catalog.to_regclass('public.platform_invoices') IS NULL")" = "t"
          python -s -m alembic -c alembic.ini upgrade "${PAY11_HEAD}"
          echo 'PAY11_EMPTY_MIGRATION_ROUNDTRIP=PASS'
      - name: Prove populated downgrade fails closed
        run: |
          set -euo pipefail
          PGPASSWORD=ci-pay11-migration psql -X -v ON_ERROR_STOP=1             -h 127.0.0.1 -U migration_owner -d gymflow_pay11_lifecycle_test <<'SQL'
          INSERT INTO public.platform_provider_releases(
            code, version, provider_code, environment, adapter_version,
            contract_sha256, status, manifest_json
          ) VALUES (
            'provider_release_v99', 99, 'fake', 'test', 'downgrade-guard',
            repeat('a',64), 'draft', '{}'::jsonb
          );
          SQL
          if OUTPUT="$(python -s -m alembic -c alembic.ini downgrade "${PAY11_PREDECESSOR}" 2>&1)"; then
            printf '%s\n' "$OUTPUT"
            echo 'PAY-11 populated downgrade unexpectedly succeeded' >&2
            exit 1
          else
            RC=$?
            printf '%s\n' "$OUTPUT"
            test "$RC" -ne 0
          fi
          test "$(PGPASSWORD=ci-pay11-migration psql -X -qAt -v ON_ERROR_STOP=1             -h 127.0.0.1 -U migration_owner -d gymflow_pay11_lifecycle_test             -c 'SELECT version_num FROM public.alembic_version')" = "${PAY11_HEAD}"
          test "$(PGPASSWORD=ci-pay11-migration psql -X -qAt -v ON_ERROR_STOP=1             -h 127.0.0.1 -U migration_owner -d gymflow_pay11_lifecycle_test             -c "SELECT count(*) FROM public.platform_provider_releases WHERE version=99")" = "1"
          PGPASSWORD=ci-pay11-migration psql -X -v ON_ERROR_STOP=1             -h 127.0.0.1 -U migration_owner -d gymflow_pay11_lifecycle_test             -c "DELETE FROM public.platform_provider_releases WHERE version=99"
          python -s -m alembic -c alembic.ini downgrade "${PAY11_PREDECESSOR}"
          python -s -m alembic -c alembic.ini upgrade "${PAY11_HEAD}"
          echo 'PAY11_POPULATED_DOWNGRADE_FAIL_CLOSED=PASS'

  architecture:
    uses: ./.github/workflows/architecture-hardening-contracts.yml

  general_platform:
    uses: ./.github/workflows/hardening-ci.yml

  finance:
    uses: ./.github/workflows/finance-hardening-ci.yml

  migration_lifecycle:
    uses: ./.github/workflows/migration-lifecycle-ci.yml

  migration_preservation:
    uses: ./.github/workflows/migration-data-preservation-ci.yml

  migration_adversarial:
    uses: ./.github/workflows/migration-adversarial-safety-ci.yml

  migration_contracts:
    uses: ./.github/workflows/migration-lifecycle-contracts.yml

  migration_semantics:
    uses: ./.github/workflows/migration-semantics-inventory.yml

  certify:
    name: PAY-11 final production-model decision
    if: ${{ always() }}
    needs:
      - contract
      - protocol_pg16
      - architecture
      - general_platform
      - finance
      - migration_lifecycle
      - migration_preservation
      - migration_adversarial
      - migration_contracts
      - migration_semantics
    runs-on: ubuntu-24.04
    steps:
      - name: Require every PAY-11 gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          data = json.loads(os.environ["RESULTS"])
          bad = {key: value["result"] for key, value in data.items() if value["result"] != "success"}
          if bad:
              raise SystemExit(f"PAY-11 prerequisite failure: {bad}")
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY11_CANDIDATE_SHA }}
      - name: Bind exact PAY-11 candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse "${PAY11_BASE_SHA}^{tree}")" = "${PAY11_BASE_TREE}"
          test "$(git merge-base "${PAY11_BASE_SHA}" HEAD)" = "${PAY11_BASE_SHA}"
          grep -Fq 'revision: str = "zw07d8e9f0a57"' \
            alembic/versions/zw07d8e9f0a57_pay11_platform_billing_production_model.py
          python - <<'PY'
          import json, os, subprocess
          decision = {
              "phase": "PAY-11",
              "candidate_sha": os.environ["PAY11_CANDIDATE_SHA"],
              "candidate_tree": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^{tree}"], text=True
              ).strip(),
              "predecessor_sha": os.environ["PAY11_BASE_SHA"],
              "alembic_head": os.environ["PAY11_HEAD"],
              "live_provider": False,
              "production_credentials": False,
              "live_money_movement": False,
              "merge_authorized": False,
              "release_authorized": False,
              "deployment_authorized": False,
              "decision": "PAY11_PLATFORM_BILLING_MODEL=PASS",
          }
          print(json.dumps(decision, indent=2, sort_keys=True))
          PY
          echo 'PAY11_PLATFORM_BILLING_MODEL=PASS'
          echo 'PAY11_LIVE_PROVIDER=DISABLED'
          echo 'PAY11_PRODUCTION_CREDENTIALS=DISABLED'
          echo 'PAY11_LIVE_MONEY_MOVEMENT=DISABLED'
          echo 'PAY11_MERGE=NOT_AUTHORIZED'
