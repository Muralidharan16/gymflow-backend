name: P6 Governance and Production Readiness

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - hardening/p6-celery-redis-scheduler-production-readiness
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6-governance-production-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Frozen P6 Celery Redis scheduler production-readiness contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P5_MERGE_BASE: 52949397fc3f7d4822e0c31c5ee76a21f2c182fb
      P5_CERTIFIED_TREE: 388a89ef09daff7c719ae07ebc5d22d152af4c58
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Prove exact merged P5 ancestry and tree
        run: |
          set -euo pipefail
          git cat-file -e "${P5_MERGE_BASE}^{commit}"
          test "$(git rev-parse "${P5_MERGE_BASE}^{tree}")" = "${P5_CERTIFIED_TREE}"
          git merge-base --is-ancestor "${P5_MERGE_BASE}" HEAD

      - name: Validate P6 governance artifacts
        run: |
          set -euo pipefail
          python -m json.tool docs/architecture/p6_production_readiness_matrix.json >/dev/null
          python -m py_compile tests/test_p6_governance_contracts.py
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p6_governance_contracts.py

      - name: Reprove inherited P5 governance and final-certification contracts
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p5_governance_contracts.py \
            tests/test_p5f_final_certification_contracts.py
          python -s scripts/verify_alembic_graph.py
          python -s scripts/verify_head_workflow_bootstrap.py

      - name: Emit P6 governance markers
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          echo "P6_REDIS_PRODUCTION_CONTRACT=FROZEN"
          echo "P6_BROKER_RECONNECT_CONTRACT=FROZEN"
          echo "P6_WORKER_SIGTERM_CONTRACT=FROZEN"
          echo "P6_LATE_ACK_REDELIVERY_CONTRACT=FROZEN"
          echo "P6_POISON_MESSAGE_CONTRACT=FROZEN"
          echo "P6_BEAT_SINGLE_OWNER_CONTRACT=FROZEN"
          echo "P6_NO_LOST_DURABLE_BUSINESS_WORK=GOVERNANCE_FROZEN"
          echo "P6_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED"
          echo "P6_GOVERNANCE_PRODUCTION_READINESS=PASS"
