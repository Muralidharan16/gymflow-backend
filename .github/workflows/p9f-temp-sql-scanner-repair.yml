name: P9F Temporary SQL Scanner Repair

on:
  push:
    branches:
      - repair/p9f-sql-scanner-fb008

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact temporary repair head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Guard repair base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8bb8eee3d05bdd03d59c3210e8969fa5bcf10d86"

      - name: Scope mixed-file SQL scanning without weakening pgcrypto detection
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path("tests/test_migration_shared_infrastructure_boundary.py")
          source = path.read_text(encoding="utf-8")
          function_anchor = "\n\ndef _repository_sql_fragments() -> list[tuple[Path, str]]:\n"
          test_anchor = "\n\ndef test_pgcrypto_lifecycle_is_absent_repository_wide():\n"
          helper = base64.b64decode("").decode()
          regression = base64.b64decode("").decode()
          old_else = base64.b64decode("ICAgICAgICBlbHNlOgogICAgICAgICAgICB2YWx1ZXMgPSBbCiAgICAgICAgICAgICAgICBzb3VyY2UKICAgICAgICAgICAgICAgIGZvciBfIGluIFswXQogICAgICAgICAgICAgICAgaWYgU1FMX0hJTlRfUkUuc2VhcmNoKHNvdXJjZSkKICAgICAgICAgICAgXQo=").decode()
          new_else = base64.b64decode("ICAgICAgICBlbHNlOgogICAgICAgICAgICB2YWx1ZXMgPSBfbWl4ZWRfdGV4dF9zcWxfZnJhZ21lbnRzKHNvdXJjZSkK").decode()
          assert source.count(function_anchor) == 1
          assert source.count(test_anchor) == 1
          assert source.count(old_else) == 1
          source = source.replace(function_anchor, helper + function_anchor, 1)
          source = source.replace(old_else, new_else, 1)
          source = source.replace(test_anchor, regression + test_anchor, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Validate focused scanner repair
        run: |
          set -euo pipefail
          python -m py_compile tests/test_migration_shared_infrastructure_boundary.py
          python - <<'PY'
          import runpy
          namespace = runpy.run_path("tests/test_migration_shared_infrastructure_boundary.py")
          namespace["test_mixed_text_sql_fragment_scanner_is_language_scoped"]()
          fragments = namespace["_repository_sql_fragments"]()
          call_pattern = namespace["re"].compile(
              r"(?<![A-Za-z0-9_])(" + "|".join(sorted(namespace["PGCRYPTO_ONLY"], key=lambda value: (-len(value), value))) + r")\s*\(",
              namespace["re"].IGNORECASE,
          )
          matches = [(path, fragment) for path, fragment in fragments if call_pattern.search(fragment)]
          assert matches == [], matches
          PY

      - name: Commit repair on temporary branch
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "tests/test_migration_shared_infrastructure_boundary.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_migration_shared_infrastructure_boundary.py
          git diff --cached --check
          git commit -m "fix(p9f): scope mixed-file SQL scanning"
          git push origin "HEAD:${GITHUB_REF_NAME}"
