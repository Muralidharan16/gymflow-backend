name: P3D HTTP Authorization Boundary

on:
  pull_request:
    branches:
      - hardening/p3c-profile-registration-atomicity
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3d-http-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  http-boundary:
    name: P3D lifecycle HTTP boundary contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Run P3D HTTP boundary contracts
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q \
            tests/test_p3d_branch_lifecycle_http_static.py
