name: P5E One-Shot Context Patcher

on:
  push:
    branches:
      - automation/p5e-context-patcher-20260913

permissions:
  contents: write

jobs:
  patch-temp-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact temp candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hardening/p5e-verification-authority-temp
          fetch-depth: 1

      - name: Guard exact runtime repair and harden its static contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6145a3e2936a6c17d8aa5d55e354f2e5c0a4c6b4"
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_p5e_provider_ack_ambiguity_static_contracts.py")
          source = path.read_text(encoding="utf-8")

          old_state = 'state_assertion = seed.index("assert cursor.fetchone() == (False, 2, 1, None)")'
          new_state = 'state_assertion = seed.index(\'assert fixture_state == "false|2|1|NULL"\')'
          if source.count(old_state) != 1:
              raise SystemExit(f"expected one old state guard, found {source.count(old_state)}")
          source = source.replace(old_state, new_state)

          old_tuple = '''        '"UPDATE 1"',
              ):
          '''
          new_tuple = '''        '"UPDATE 1"',
                  '"-A"',
                  '"-t"',
                  '"-F"',
                  "search_visibility_version::text",
                  "search_provider_ack_version::text",
                  "search_last_synced_at::text",
                  "return verified.stdout.strip()",
              ):
          '''
          if source.count(old_tuple) != 1:
              raise SystemExit(f"expected one infrastructure tuple anchor, found {source.count(old_tuple)}")
          source = source.replace(old_tuple, new_tuple)

          old_guard = '''    assert "SET search_visibility_version=2" not in security_seed
          '''
          new_guard = '''    assert "SET search_visibility_version=2" not in security_seed
              assert "app.current_role','owner" not in seed
          '''
          if source.count(old_guard) != 1:
              raise SystemExit(f"expected one reduced-role guard anchor, found {source.count(old_guard)}")
          source = source.replace(old_guard, new_guard)
          path.write_text(source, encoding="utf-8")
          PY
          git diff --check
          python -m py_compile tests/test_p5e_provider_ack_ambiguity_static_contracts.py
          test "$(git status --short | wc -l)" = "1"
          git status --short | grep -Fx ' M tests/test_p5e_provider_ack_ambiguity_static_contracts.py'

      - name: Commit only static regression guard to temp branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Muralidharan16'
          git config user.email '145135907+Muralidharan16@users.noreply.github.com'
          git add -- tests/test_p5e_provider_ack_ambiguity_static_contracts.py
          git diff --cached --check
          test "$(git diff --cached --name-only)" = 'tests/test_p5e_provider_ack_ambiguity_static_contracts.py'
          git commit -m 'P5E guard infrastructure-owned lifecycle verification'
          git push origin HEAD:hardening/p5e-verification-authority-temp
