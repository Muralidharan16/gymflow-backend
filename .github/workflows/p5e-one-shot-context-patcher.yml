name: P5E One-Shot Context Patcher

on:
  push:
    branches: [automation/p5e-context-patcher-20260913]

permissions:
  contents: write

jobs:
  patch-temp-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hardening/p5e-verification-authority-temp
          fetch-depth: 1

      - name: Use a claimable materialization event for the ABA fence proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "23e799199d9bf6f9daa1764a0e8fa1d04c6d5536"
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('tests/test_p5e_provider_ack_ambiguity_runtime.py')
          runtime = runtime_path.read_text(encoding='utf-8')
          start = runtime.index(
              'def test_provider_capabilities_reject_same_worker_aba_fence(tmp_path: Path) -> None:'
          )
          prefix, test = runtime[:start], runtime[start:]

          old = '    reconciliation_id = uuid.uuid4()\n\n'
          new = '    reconciliation_id = uuid.uuid4()\n    materialization_id = uuid.uuid4()\n\n'
          if test.count(old) != 1:
              raise SystemExit('unexpected reconciliation-id fixture shape')
          test = test.replace(old, new, 1)

          anchor_lines = [
              '            )',
              '        connection.commit()',
              '',
              '    aba_event_ids = (',
          ]
          commit_anchor = '\n'.join(anchor_lines) + '\n'
          if test.count(commit_anchor) != 1:
              raise SystemExit('unexpected ABA auth insert anchor')

          insertion_lines = [
              '            )',
              '            cursor.execute(',
              '                """',
              '                INSERT INTO public.branch_outbox_events(',
              '                    outbox_id,tenant_id,branch_id,event_type,payload,',
              '                    max_attempts,correlation_id',
              '                ) VALUES (',
              "                    %s,%s,%s,'branch.member_notification','{}'::jsonb,5,%s",
              '                )',
              '                """,',
              '                (',
              '                    materialization_id,',
              '                    notification.base.org_id,',
              '                    notification.base.branch_id,',
              '                    uuid.uuid4(),',
              '                ),',
              '            )',
              '        connection.commit()',
              '',
              '    aba_event_ids = (',
          ]
          materialization_insert = '\n'.join(insertion_lines) + '\n'
          test = test.replace(commit_anchor, materialization_insert, 1)

          old_ids = '\n'.join([
              '    aba_event_ids = (',
              '        search.event_id,',
              '        notification.parent_id,',
              '        notification.command_id,',
              '        reconciliation_id,',
              '    )',
              '',
          ])
          new_ids = '\n'.join([
              '    aba_event_ids = (',
              '        search.event_id,',
              '        materialization_id,',
              '        notification.command_id,',
              '        reconciliation_id,',
              '    )',
              '',
          ])
          if test.count(old_ids) != 1:
              raise SystemExit('unexpected ABA event-id tuple')
          test = test.replace(old_ids, new_ids, 1)

          old_stale = '(notification.parent_id, worker_id, 1),'
          new_stale = '(materialization_id, worker_id, 1),'
          if test.count(old_stale) != 1:
              raise SystemExit('unexpected materialization stale-call target')
          test = test.replace(old_stale, new_stale, 1)
          runtime_path.write_text(prefix + test, encoding='utf-8')

          static_path = Path('tests/test_p5e_provider_ack_ambiguity_static_contracts.py')
          static = static_path.read_text(encoding='utf-8')
          old_static = (
              '    auth_insert = test.index("\'notification.reconcile\',\'{}\'::jsonb")\n'
              '    worker_url = test.index(\n'
          )
          new_static = (
              '    materialization_insert = test.index("\'branch.member_notification\',\'{}\'::jsonb")\n'
              '    reconciliation_insert = test.index("\'notification.reconcile\',\'{}\'::jsonb")\n'
              '    worker_url = test.index(\n'
          )
          if static.count(old_static) != 1:
              raise SystemExit('unexpected static auth-insert guard')
          static = static.replace(old_static, new_static, 1)

          old_order = (
              '    assert auth_insert < worker_url < claim_import < first_claim < expiry < second_claim\n'
              '    assert test.count("asyncio.run(_claim_events(worker_id))") == 2\n'
          )
          new_order = (
              '    assert materialization_insert < worker_url\n'
              '    assert reconciliation_insert < worker_url < claim_import < first_claim < expiry < second_claim\n'
              '    assert test.count("asyncio.run(_claim_events(worker_id))") == 2\n'
              '    assert "materialization_id" in test\n'
              '    assert "(notification.parent_id, worker_id, 1)" not in test\n'
              '    assert "(materialization_id, worker_id, 1)" in test\n'
          )
          if static.count(old_order) != 1:
              raise SystemExit('unexpected static ABA ordering guard')
          static = static.replace(old_order, new_order, 1)
          static_path.write_text(static, encoding='utf-8')
          PY

          git diff --check
          python -m py_compile \
            tests/test_p5e_provider_ack_ambiguity_runtime.py \
            tests/test_p5e_provider_ack_ambiguity_static_contracts.py
          test "$(git diff --name-only | wc -l)" = "2"
          git diff --name-only | grep -Fx 'tests/test_p5e_provider_ack_ambiguity_runtime.py'
          git diff --name-only | grep -Fx 'tests/test_p5e_provider_ack_ambiguity_static_contracts.py'
          grep -Fq "'branch.member_notification','{}'::jsonb" tests/test_p5e_provider_ack_ambiguity_runtime.py
          grep -Fq '(materialization_id, worker_id, 1)' tests/test_p5e_provider_ack_ambiguity_runtime.py

      - name: Commit exact two-file materialization ABA repair
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            tests/test_p5e_provider_ack_ambiguity_runtime.py \
            tests/test_p5e_provider_ack_ambiguity_static_contracts.py
          git diff --cached --check
          expected=$'tests/test_p5e_provider_ack_ambiguity_runtime.py\ntests/test_p5e_provider_ack_ambiguity_static_contracts.py'
          test "$(git diff --cached --name-only)" = "$expected"
          git -c user.name='Muralidharan16' \
            -c user.email='145135907+Muralidharan16@users.noreply.github.com' \
            commit -m 'P5E isolate materialization ABA event from terminal parent'
          git push origin HEAD:hardening/p5e-verification-authority-temp
