name: P5E One-Shot Context Patcher

on:
  push:
    branches:
      - automation/p5e-context-patcher-20260913

permissions:
  contents: write

jobs:
  patch-temp-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact temp candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hardening/p5e-verification-authority-temp
          fetch-depth: 1

      - name: Align P5-E notification outbox fixtures with app runtime RLS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fc02e71da8276edf8bbb81f0a2226326aa32f1ed"
          grep -Fq 'GRANT app_runtime TO auth_p5e_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;' \
            .github/workflows/p5e-provider-ack-ambiguity-pg16.yml
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path("tests/test_p5e_provider_ack_ambiguity_runtime.py")
          runtime = runtime_path.read_text(encoding="utf-8")
          start = runtime.index("def _seed_notification() -> _NotificationSeed:")
          end = runtime.index("\ndef _install_fault_triggers() -> None:", start)
          replacement = '''def _seed_notification() -> _NotificationSeed:
              base = _seed_base()
              parent_id = uuid.uuid4()
              command_id = uuid.uuid4()
              member_id = uuid.uuid4()
              correlation_id = uuid.uuid4()
              idempotency_key = (
                  f"branch-lifecycle/{correlation_id}/{member_id}/email"
              )

              with _connect(_AUTH_LOGIN, "AUTH_RUNTIME_PASSWORD") as connection:
                  with connection.cursor() as cursor:
                      cursor.execute(
                          """
                          SELECT
                              pg_catalog.set_config('app.current_org_id',%s,true),
                              pg_catalog.set_config('app.current_role','saga_orchestrator',true)
                          """,
                          (str(base.org_id),),
                      )
                      cursor.execute(
                          """
                          INSERT INTO public.members(
                              id,org_id,home_branch_id,member_uid,member_number,
                              name,email,status,is_active,is_migrated,created_at,updated_at
                          ) VALUES (
                              %s,%s,%s,%s,1,'P5-E Member','p5e-member@example.test',
                              'active',true,false,pg_catalog.clock_timestamp(),
                              pg_catalog.clock_timestamp()
                          )
                          """,
                          (
                              member_id,
                              base.org_id,
                              base.branch_id,
                              f"P5E{member_id.hex[:17].upper()}",
                          ),
                      )
                      cursor.execute(
                          """
                          INSERT INTO public.branch_outbox_events(
                              outbox_id,tenant_id,branch_id,event_type,payload,
                              status,attempt_count,max_attempts,correlation_id
                          ) VALUES (
                              %s,%s,%s,'branch.member_notification','{}'::jsonb,
                              'superseded',1,5,%s
                          )
                          """,
                          (parent_id, base.org_id, base.branch_id, correlation_id),
                      )
                  connection.commit()

              with _connect(_ADMIN_LOGIN, "MIGRATION_PASSWORD") as connection:
                  with connection.cursor() as cursor:
                      _as_security_owner(cursor)
                      cursor.execute(
                          """
                          INSERT INTO public.notification_commands(
                              command_id,source_outbox_id,tenant_id,branch_id,member_id,
                              effect_type,channel,template_key,template_data,
                              idempotency_key,status,attempt_count,max_attempts,
                              next_attempt_at,correlation_id
                          ) VALUES (
                              %s,%s,%s,%s,%s,'branch.member_notification','email',
                              'branch_lifecycle_status_changed',
                              '{"branch_name":"P5-E Runtime Branch","from_status":"active",'
                              '"to_status":"temporarily_closed"}'::jsonb,
                              %s,'pending',0,5,pg_catalog.clock_timestamp(),%s
                          )
                          """,
                          (
                              command_id,
                              parent_id,
                              base.org_id,
                              base.branch_id,
                              member_id,
                              idempotency_key,
                              correlation_id,
                          ),
                      )
                  connection.commit()

              with _connect(_AUTH_LOGIN, "AUTH_RUNTIME_PASSWORD") as connection:
                  with connection.cursor() as cursor:
                      cursor.execute(
                          """
                          SELECT
                              pg_catalog.set_config('app.current_org_id',%s,true),
                              pg_catalog.set_config('app.current_role','saga_orchestrator',true)
                          """,
                          (str(base.org_id),),
                      )
                      cursor.execute(
                          """
                          INSERT INTO public.branch_outbox_events(
                              outbox_id,tenant_id,branch_id,event_type,payload,
                              max_attempts,correlation_id
                          ) VALUES (
                              %s,%s,%s,'notification.delivery',
                              pg_catalog.jsonb_build_object('command_id',%s::text),5,%s
                          )
                          """,
                          (
                              command_id,
                              base.org_id,
                              base.branch_id,
                              command_id,
                              correlation_id,
                          ),
                      )
                  connection.commit()
              return _NotificationSeed(
                  base,
                  parent_id,
                  command_id,
                  member_id,
                  idempotency_key,
              )
          '''
          # Normalize the replacement's deliberate YAML indentation back to Python column zero.
          replacement = "\n".join(
              line[12:] if line.startswith("            ") else line
              for line in replacement.splitlines()
          ) + "\n"
          runtime = runtime[:start] + replacement + runtime[end:]
          runtime_path.write_text(runtime, encoding="utf-8")

          static_path = Path("tests/test_p5e_provider_ack_ambiguity_static_contracts.py")
          static = static_path.read_text(encoding="utf-8")
          test_start = static.index(
              "def test_notification_member_fixture_uses_canonical_auth_app_runtime_identity() -> None:"
          )
          test_end = static.index(
              "\ndef test_runtime_step_uses_only_non_routable_broker_placeholders() -> None:",
              test_start,
          )
          regression = '''def test_notification_fixture_preserves_canonical_rls_role_domains() -> None:
              runtime = RUNTIME.read_text(encoding="utf-8")
              seed = runtime[
                  runtime.index("def _seed_notification()") :
                  runtime.index("def _install_fault_triggers()")
              ]
              auth_literal = 'with _connect(_AUTH_LOGIN, "AUTH_RUNTIME_PASSWORD") as connection:'
              admin_literal = 'with _connect(_ADMIN_LOGIN, "MIGRATION_PASSWORD") as connection:'
              first_auth = seed.index(auth_literal)
              member_insert = seed.index("INSERT INTO public.members(")
              parent_outbox = seed.index("'branch.member_notification','{}'::jsonb")
              admin_connection = seed.index(admin_literal, parent_outbox)
              security_owner = seed.index("_as_security_owner(cursor)", admin_connection)
              command_insert = seed.index("INSERT INTO public.notification_commands(")
              second_auth = seed.index(auth_literal, admin_connection)
              delivery_outbox = seed.index("'notification.delivery',", second_auth)
              assert (
                  first_auth
                  < member_insert
                  < parent_outbox
                  < admin_connection
                  < security_owner
                  < command_insert
                  < second_auth
                  < delivery_outbox
              )
              assert seed.count(auth_literal) == 2
              assert seed.count(admin_literal) == 1
              assert seed.count(
                  "pg_catalog.set_config('app.current_role','saga_orchestrator',true)"
              ) == 2
              workflow = WORKFLOW.read_text(encoding="utf-8")
              assert (
                  "GRANT app_runtime TO auth_p5e_runtime "
                  "WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;"
              ) in workflow
          '''
          regression = "\n".join(
              line[12:] if line.startswith("            ") else line
              for line in regression.splitlines()
          ) + "\n"
          static = static[:test_start] + regression + static[test_end:]
          static_path.write_text(static, encoding="utf-8")
          PY

          git diff --check
          python -m py_compile \
            tests/test_p5e_provider_ack_ambiguity_runtime.py \
            tests/test_p5e_provider_ack_ambiguity_static_contracts.py
          grep -Fq "pg_catalog.set_config('app.current_role','saga_orchestrator',true)" \
            tests/test_p5e_provider_ack_ambiguity_runtime.py
          test "$(git status --short | wc -l)" = "2"
          git status --short | grep -Fx ' M tests/test_p5e_provider_ack_ambiguity_runtime.py'
          git status --short | grep -Fx ' M tests/test_p5e_provider_ack_ambiguity_static_contracts.py'

      - name: Commit only P5-E RLS fixture repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Muralidharan16'
          git config user.email '145135907+Muralidharan16@users.noreply.github.com'
          git add -- \
            tests/test_p5e_provider_ack_ambiguity_runtime.py \
            tests/test_p5e_provider_ack_ambiguity_static_contracts.py
          git diff --cached --check
          expected=$'tests/test_p5e_provider_ack_ambiguity_runtime.py\ntests/test_p5e_provider_ack_ambiguity_static_contracts.py'
          test "$(git diff --cached --name-only)" = "$expected"
          git commit -m 'P5E align notification outbox fixture RLS roles'
          git push origin HEAD:hardening/p5e-verification-authority-temp
