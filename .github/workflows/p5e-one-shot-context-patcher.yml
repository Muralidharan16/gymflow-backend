name: P5E One-Shot Context Patcher

on:
  push:
    branches:
      - automation/p5e-context-patcher-20260913

permissions:
  contents: write

jobs:
  patch-temp-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact temp candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hardening/p5e-verification-authority-temp
          fetch-depth: 1

      - name: Align P5-E reconciliation fixture with app runtime RLS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7afcb717b4a5eaef3c8849205269023f3fd3d4eb"
          grep -Fq 'GRANT app_runtime TO auth_p5e_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;' \
            .github/workflows/p5e-provider-ack-ambiguity-pg16.yml
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path("tests/test_p5e_provider_ack_ambiguity_runtime.py")
          runtime = runtime_path.read_text(encoding="utf-8")
          fn_start = runtime.index(
              "def test_provider_capabilities_reject_same_worker_aba_fence(tmp_path: Path) -> None:"
          )
          admin_start = runtime.index(
              '    with _connect(_ADMIN_LOGIN, "MIGRATION_PASSWORD") as connection:\n',
              fn_start,
          )
          update_start = runtime.index(
              '            cursor.execute(\n'
              '                """\n'
              '                UPDATE public.branch_outbox_events\n',
              admin_start,
          )
          prefix = runtime[admin_start:update_start]
          if prefix.count("'notification.reconcile'") != 1:
              raise SystemExit("expected exactly one reconciliation fixture insert")
          if prefix.count("_as_security_owner(cursor)") != 1:
              raise SystemExit("expected reconciliation fixture to start in security-owner context")

          replacement = '''    with _connect(_AUTH_LOGIN, "AUTH_RUNTIME_PASSWORD") as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      SELECT
                          pg_catalog.set_config('app.current_org_id',%s,true),
                          pg_catalog.set_config('app.current_role','saga_orchestrator',true)
                      """,
                      (str(notification.base.org_id),),
                  )
                  cursor.execute(
                      """
                      INSERT INTO public.branch_outbox_events(
                          outbox_id,tenant_id,branch_id,event_type,payload,
                          max_attempts,correlation_id
                      ) VALUES (
                          %s,%s,%s,'notification.reconcile','{}'::jsonb,5,%s
                      )
                      """,
                      (
                          reconciliation_id,
                          notification.base.org_id,
                          notification.base.branch_id,
                          uuid.uuid4(),
                      ),
                  )
              connection.commit()

          with _connect(_ADMIN_LOGIN, "MIGRATION_PASSWORD") as connection:
              with connection.cursor() as cursor:
                  _as_security_owner(cursor)
          '''
          runtime = runtime[:admin_start] + replacement + runtime[update_start:]
          runtime_path.write_text(runtime, encoding="utf-8")

          static_path = Path("tests/test_p5e_provider_ack_ambiguity_static_contracts.py")
          static = static_path.read_text(encoding="utf-8")
          anchor = "\ndef test_runtime_step_uses_only_non_routable_broker_placeholders() -> None:\n"
          regression = '''\ndef test_aba_reconciliation_fixture_preserves_rls_role_domains() -> None:
              runtime = RUNTIME.read_text(encoding="utf-8")
              test = runtime[
                  runtime.index("def test_provider_capabilities_reject_same_worker_aba_fence") :
              ]
              auth_literal = 'with _connect(_AUTH_LOGIN, "AUTH_RUNTIME_PASSWORD") as connection:'
              admin_literal = 'with _connect(_ADMIN_LOGIN, "MIGRATION_PASSWORD") as connection:'
              auth_connection = test.index(auth_literal)
              tenant_context = test.index("pg_catalog.set_config('app.current_org_id',%s,true)")
              saga_role = test.index(
                  "pg_catalog.set_config('app.current_role','saga_orchestrator',true)"
              )
              reconciliation_insert = test.index("'notification.reconcile','{}'::jsonb")
              admin_connection = test.index(admin_literal, reconciliation_insert)
              security_owner = test.index("_as_security_owner(cursor)", admin_connection)
              fence_update = test.index("UPDATE public.branch_outbox_events", security_owner)
              assert (
                  auth_connection
                  < tenant_context
                  < saga_role
                  < reconciliation_insert
                  < admin_connection
                  < security_owner
                  < fence_update
              )
          '''
          if static.count(anchor) != 1:
              raise SystemExit("expected static insertion anchor exactly once")
          if "test_aba_reconciliation_fixture_preserves_rls_role_domains" in static:
              raise SystemExit("ABA reconciliation RLS regression already exists")
          static = static.replace(anchor, regression + anchor, 1)
          static_path.write_text(static, encoding="utf-8")
          PY

          git diff --check
          python -m py_compile \
            tests/test_p5e_provider_ack_ambiguity_runtime.py \
            tests/test_p5e_provider_ack_ambiguity_static_contracts.py
          test "$(git status --short | wc -l)" = "2"
          git status --short | grep -Fx ' M tests/test_p5e_provider_ack_ambiguity_runtime.py'
          git status --short | grep -Fx ' M tests/test_p5e_provider_ack_ambiguity_static_contracts.py'

      - name: Commit only P5-E reconciliation RLS fixture repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Muralidharan16'
          git config user.email '145135907+Muralidharan16@users.noreply.github.com'
          git add -- \
            tests/test_p5e_provider_ack_ambiguity_runtime.py \
            tests/test_p5e_provider_ack_ambiguity_static_contracts.py
          git diff --cached --check
          expected=$'tests/test_p5e_provider_ack_ambiguity_runtime.py\ntests/test_p5e_provider_ack_ambiguity_static_contracts.py'
          test "$(git diff --cached --name-only)" = "$expected"
          git commit -m 'P5E align reconciliation fixture RLS role'
          git push origin HEAD:hardening/p5e-verification-authority-temp
