name: P5E One-Shot Context Patcher

on:
  push:
    branches:
      - automation/p5e-context-patcher-20260913

permissions:
  contents: write

jobs:
  patch-temp-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact temp candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hardening/p5e-verification-authority-temp
          fetch-depth: 1

      - name: Guard exact parent and apply one context-only replacement
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7b5c421bb09c76833a46ebf48cc409f57080fc7b"
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_p5e_provider_ack_ambiguity_runtime.py")
          source = path.read_text(encoding="utf-8")
          old = '''            if operation == "delete":
                          cursor.execute(
                              """
                              SELECT is_public,search_visibility_version,
                                     search_provider_ack_version,search_last_synced_at
                              FROM public.org_branch_state
                              WHERE branch_id=%s AND org_id=%s
                              """,
                              (base.branch_id, base.org_id),
                          )
                          assert cursor.fetchone() == (False, 2, 1, None)
          '''
          new = '''            if operation == "delete":
                          cursor.execute(
                              """
                              SELECT
                                  pg_catalog.set_config('app.current_org_id',%s,true),
                                  pg_catalog.set_config('app.current_role','owner',true)
                              """,
                              (str(base.org_id),),
                          )
                          cursor.execute(
                              """
                              SELECT is_public,search_visibility_version,
                                     search_provider_ack_version,search_last_synced_at
                              FROM public.org_branch_state
                              WHERE branch_id=%s AND org_id=%s
                              """,
                              (base.branch_id, base.org_id),
                          )
                          assert cursor.fetchone() == (False, 2, 1, None)
          '''
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one guarded replacement, found {source.count(old)}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          python -m py_compile tests/test_p5e_provider_ack_ambiguity_runtime.py
          test "$(git status --short | wc -l)" = "1"
          git status --short | grep -Fx ' M tests/test_p5e_provider_ack_ambiguity_runtime.py'

      - name: Commit only the repaired runtime harness to temp branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Muralidharan16'
          git config user.email '145135907+Muralidharan16@users.noreply.github.com'
          git add -- tests/test_p5e_provider_ack_ambiguity_runtime.py
          git diff --cached --check
          test "$(git diff --cached --name-only)" = 'tests/test_p5e_provider_ack_ambiguity_runtime.py'
          git commit -m 'P5E bind lifecycle verification to tenant RLS context'
          git push origin HEAD:hardening/p5e-verification-authority-temp
