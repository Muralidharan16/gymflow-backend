name: P5E One-Shot Context Patcher

on:
  push:
    branches: [automation/p5e-context-patcher-20260913]

permissions:
  contents: write

jobs:
  patch-temp-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hardening/p5e-verification-authority-temp
          fetch-depth: 1
      - name: Patch exact P5-E ABA fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5e5ebc5cc61997e6e9657e9b9054ed0cbdcc7d8d"
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_p5e_provider_ack_ambiguity_runtime.py')
          s = p.read_text()
          old = "                    processed_at=NULL,last_error=NULL\n"
          assert s.count(old) == 1
          p.write_text(s.replace(old, "                    last_error=NULL\n", 1))
          p = Path('tests/test_p5e_provider_ack_ambiguity_static_contracts.py')
          s = p.read_text()
          assert s.count('        "processed_at=NULL",\n') == 1
          s = s.replace('        "processed_at=NULL",\n', '', 1)
          old = '    assert "claimed_at" not in update\n'
          assert s.count(old) == 1
          s = s.replace(old, old + '    assert "processed_at" not in update\n', 1)
          p.write_text(s)
          PY
          git diff --check
          python -m py_compile tests/test_p5e_provider_ack_ambiguity_runtime.py tests/test_p5e_provider_ack_ambiguity_static_contracts.py
          test "$(git diff --name-only | wc -l)" = "2"
          git diff --name-only | grep -Fx 'tests/test_p5e_provider_ack_ambiguity_runtime.py'
          git diff --name-only | grep -Fx 'tests/test_p5e_provider_ack_ambiguity_static_contracts.py'
      - name: Commit exact two-file repair
        shell: bash
        run: |
          set -euo pipefail
          git add tests/test_p5e_provider_ack_ambiguity_runtime.py tests/test_p5e_provider_ack_ambiguity_static_contracts.py
          git diff --cached --check
          git -c user.name='Muralidharan16' -c user.email='145135907+Muralidharan16@users.noreply.github.com' commit -m 'P5E remove nonexistent processed_at from ABA fixture'
          git push origin HEAD:hardening/p5e-verification-authority-temp
