name: P5E One-Shot Context Patcher

on:
  push:
    branches:
      - automation/p5e-context-patcher-20260913

permissions:
  contents: write

jobs:
  patch-temp-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact temp candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hardening/p5e-verification-authority-temp
          fetch-depth: 1

      - name: Bound notification fixture member UID to schema contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7005bc5676842e908947d4e0d373b4fd23453f07"
          python - <<'PY'
          from pathlib import Path
          import uuid

          path = Path("tests/test_p5e_provider_ack_ambiguity_runtime.py")
          source = path.read_text(encoding="utf-8")
          old = 'f"P5E{member_id.hex[:20].upper()}"'
          new = 'f"P5E{member_id.hex[:17].upper()}"'
          if source.count(old) != 1:
              raise SystemExit(f"expected overlength P5-E member UID fixture once, found {source.count(old)}")
          source = source.replace(old, new)
          if old in source or source.count(new) != 1:
              raise SystemExit("P5-E member UID fixture replacement did not converge exactly")
          path.write_text(source, encoding="utf-8")

          sample_id = uuid.UUID("01234567-89ab-cdef-0123-456789abcdef")
          sample_uid = f"P5E{sample_id.hex[:17].upper()}"
          if len(sample_uid) != 20:
              raise SystemExit(f"bounded fixture UID length is {len(sample_uid)}, expected 20")
          PY
          git diff --check
          python -m py_compile tests/test_p5e_provider_ack_ambiguity_runtime.py
          test "$(git status --short | wc -l)" = "1"
          git status --short | grep -Fx ' M tests/test_p5e_provider_ack_ambiguity_runtime.py'

      - name: Commit only bounded notification fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Muralidharan16'
          git config user.email '145135907+Muralidharan16@users.noreply.github.com'
          git add -- tests/test_p5e_provider_ack_ambiguity_runtime.py
          git diff --cached --check
          test "$(git diff --cached --name-only)" = 'tests/test_p5e_provider_ack_ambiguity_runtime.py'
          git commit -m 'P5E bound notification fixture member UID'
          git push origin HEAD:hardening/p5e-verification-authority-temp
