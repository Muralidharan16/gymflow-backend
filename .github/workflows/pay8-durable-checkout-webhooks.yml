name: PAY-8 Durable Checkout Webhooks

on:
  push:
    branches:
      - hardening/pay8-durable-checkout-webhooks
  pull_request:
    branches:
      - hardening/pay7-provider-adapter-boundary
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay8-durable-checkout-webhooks-${{ github.ref }}
  cancel-in-progress: true

env:
  PAY8_BASE_SHA: 3489f0841866e7ffcd01a16c753c3e382293e22e
  PAY8_BASE_TREE: b652d3a4ab09bf93c30a5834729cd189334b9d0f
  PAY8_PREDECESSOR: zq07d8e9f0a51
  PAY8_HEAD: zr07d8e9f0a52
  PAY8_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: PAY-8 static durable provider contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/pay8_static
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: pay8-static-not-production
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      S3_BUCKET_NAME: pay8-static
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY8_CANDIDATE_SHA }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
      - name: Exact PAY-8 scope and graph
        run: |
          set -euo pipefail
          test "$(git rev-parse "${PAY8_BASE_SHA}^{tree}")" = "${PAY8_BASE_TREE}"
          git merge-base --is-ancestor "${PAY8_BASE_SHA}" HEAD
          git diff --name-only "${PAY8_BASE_SHA}...HEAD" > /tmp/pay8-changed.txt
          python - <<'PY_SCOPE'
          from pathlib import Path
          allowed={
              ".github/workflows/pay8-durable-checkout-webhooks.yml",
              "alembic/versions/zr07d8e9f0a52_pay8_durable_checkout_webhooks.py",
              "app/finance_core/api/payment_boundary.py",
              "app/finance_core/domain/checkout_callbacks.py",
              "app/finance_core/models/__init__.py",
              "app/finance_core/models/foundation.py",
              "app/finance_core/services/checkout_orchestration.py",
              "app/finance_core/services/member_subscription_checkout.py",
              "app/finance_core/services/provider_operations.py",
              "app/finance_core/services/provider_webhook_inbox.py",
              "app/finance_core/services/razorpay_webhooks.py",
              "app/routers/member_subscriptions_v2.py",
              "docs/architecture/PAY8_ACCEPTANCE_MATRIX.md",
              "docs/architecture/PAY8_DURABLE_CHECKOUT_WEBHOOKS.md",
              "docs/architecture/pay8_durable_checkout_webhooks_v1.json",
              "security/cluster_role_bootstrap/ownership.v1.json",
              "tests/finance_core/admin_database.py",
              "tests/finance_core/test_phase6c_checkout_orchestration.py",
              "tests/finance_core/test_phase6v_test_mode_checkout_route_integration.py",
              "tests/finance_core/test_phase6aj_checkout_callback_recording.py",
              "tests/finance_core/test_phase5b_foundation.py",
              "tests/test_cluster_role_contract_manifests.py",
              "tests/test_migration_app_secure_owner_context_boundary.py",
              "tests/test_pay8_durable_checkout_webhooks_runtime.py",
              "tests/test_pay8_durable_checkout_webhooks_static.py",
              "tests/test_p4d_refund_authority_static_contracts.py",
          }
          changed={x.strip() for x in Path("/tmp/pay8-changed.txt").read_text().splitlines() if x.strip()}
          if changed != allowed:
              raise SystemExit(
                  f"PAY-8 exact scope mismatch: missing={sorted(allowed-changed)}, "
                  f"unexpected={sorted(changed-allowed)}"
              )
          migrations=sorted(x for x in changed if x.startswith("alembic/versions/"))
          expected=["alembic/versions/zr07d8e9f0a52_pay8_durable_checkout_webhooks.py"]
          if migrations != expected:
              raise SystemExit(f"PAY-8 migration scope mismatch: {migrations}")
          print(f"PAY-8 exact allowlist paths: {len(changed)}")
          PY_SCOPE
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "${PAY8_HEAD}"
      - name: PAY-8 focused static contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            alembic/versions/zr07d8e9f0a52_pay8_durable_checkout_webhooks.py \
            app/finance_core/api/payment_boundary.py \
            app/finance_core/models/foundation.py \
            app/finance_core/services/checkout_orchestration.py \
            app/finance_core/services/member_subscription_checkout.py \
            app/finance_core/services/provider_operations.py \
            app/finance_core/services/provider_webhook_inbox.py \
            app/finance_core/services/razorpay_webhooks.py \
            app/routers/member_subscriptions_v2.py
          python -m json.tool docs/architecture/pay8_durable_checkout_webhooks_v1.json >/dev/null
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_pay8_durable_checkout_webhooks_static.py \
            tests/test_cluster_role_contract_manifests.py \
            tests/test_migration_managed_role_boundary.py \
            tests/test_migration_app_secure_owner_context_boundary.py \
            tests/test_alembic_model_import_boundary.py
          echo 'PAY8_DURABLE_PROVIDER_OPERATION=PASS'
          echo 'PAY8_UNKNOWN_OUTCOME_FENCING=PASS'
          echo 'PAY8_WEBHOOK_INBOX=PASS'
          echo 'PAY8_DIRECT_DML_DENIAL=PASS'

  protocol_pg16:
    name: PAY-8 real PG16 saga webhook and migration proof
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay8-migration@127.0.0.1:5432/gymflow_pay8_test
      PAY8_APP_DATABASE_URL: postgresql://pay8_app_test:ci-pay8-app@127.0.0.1:5432/gymflow_pay8_test
      PAY8_PAYMENT_DATABASE_URL: postgresql://pay8_payment_test:ci-pay8-payment@127.0.0.1:5432/gymflow_pay8_test
      PAY8_RECON_DATABASE_URL: postgresql://pay8_recon_test:ci-pay8-recon@127.0.0.1:5432/gymflow_pay8_test
      PAY8_ADMIN_DATABASE_URL: postgresql://postgres:ci-pay8-postgres@127.0.0.1:5432/gymflow_pay8_test
      SECRET_KEY: pay8-pg16-not-production
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      S3_BUCKET_NAME: pay8-pg16
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY8_CANDIDATE_SHA }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
      - name: Install PG16 and canonical roles
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE postgres PASSWORD 'ci-pay8-postgres';
          ALTER ROLE migration_owner PASSWORD 'ci-pay8-migration';
          CREATE ROLE pay8_app_test LOGIN PASSWORD 'ci-pay8-app'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE pay8_payment_test LOGIN PASSWORD 'ci-pay8-payment'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE pay8_recon_test LOGIN PASSWORD 'ci-pay8-recon'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT app_runtime TO pay8_app_test WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT finance_payment_runtime TO pay8_payment_test WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT finance_reconciliation_runtime TO pay8_recon_test WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          CREATE DATABASE gymflow_pay8_test OWNER migration_owner;
          GRANT CONNECT ON DATABASE gymflow_pay8_test TO pay8_app_test;
          GRANT CONNECT ON DATABASE gymflow_pay8_test TO pay8_payment_test;
          GRANT CONNECT ON DATABASE gymflow_pay8_test TO pay8_recon_test;
          SQL
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_pay8_test
      - name: Upgrade certified PAY-7 predecessor and fingerprint
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade "${PAY8_PREDECESSOR}"
          PGPASSWORD=ci-pay8-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay8_test -At <<'SQL' > /tmp/pay8-rel-before.txt
          SELECT n.nspname||'.'||c.relname||'|'||c.relfilenode
          FROM pg_catalog.pg_class c
          JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname IN ('public','finance')
            AND c.relkind IN ('r','p')
          ORDER BY 1;
          SQL
          PGPASSWORD=ci-pay8-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay8_test -At <<'SQL' > /tmp/pay8-acl-before.txt
          SELECT table_schema||'.'||table_name||'|'||grantee||'|'||privilege_type
          FROM information_schema.role_table_grants
          WHERE table_schema IN ('public','finance')
            AND grantee IN (
              'app_security_owner','app_runtime','worker_runtime',
              'finance_payment_runtime','finance_reconciliation_runtime'
            )
          UNION ALL
          SELECT table_schema||'.'||table_name||'.'||column_name||'|'||grantee||'|'||privilege_type
          FROM information_schema.column_privileges
          WHERE table_schema IN ('public','finance')
            AND grantee IN (
              'app_security_owner','app_runtime','worker_runtime',
              'finance_payment_runtime','finance_reconciliation_runtime'
            )
          ORDER BY 1;
          SQL
      - name: Upgrade PAY-8 and prove no predecessor table rewrite
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade "${PAY8_HEAD}"
          PGPASSWORD=ci-pay8-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay8_test -At <<'SQL' > /tmp/pay8-rel-after.txt
          SELECT n.nspname||'.'||c.relname||'|'||c.relfilenode
          FROM pg_catalog.pg_class c
          JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname IN ('public','finance')
            AND c.relkind IN ('r','p')
            AND NOT (
              n.nspname='finance'
              AND c.relname IN ('provider_operations','provider_webhook_inbox')
            )
          ORDER BY 1;
          SQL
          diff -u /tmp/pay8-rel-before.txt /tmp/pay8-rel-after.txt
      - name: Real PAY-8 provider saga and webhook fault proof
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_pay8_durable_checkout_webhooks_runtime.py
          echo 'PAY8_UNKNOWN_OUTCOME_FENCING=PASS'
          echo 'PAY8_PROVIDER_RECONCILIATION=PASS'
          echo 'PAY8_WEBHOOK_REPLAY_FENCING=PASS'
          echo 'PAY8_WEBHOOK_CRASH_RECOVERY=PASS'
          echo 'PAY8_DIRECT_DML_DENIAL=PASS'
      - name: Populated downgrade fails closed
        run: |
          set -euo pipefail
          python - <<'PY'
          from tests.test_pay8_durable_checkout_webhooks_runtime import (
              _admin_scalar, _cleanup_and_seed, _reserve, PAYMENT_A
          )
          _cleanup_and_seed()
          _reserve(PAYMENT_A, key="pay8:downgrade:evidence")
          assert _admin_scalar(
              "SELECT count(*) FROM finance.provider_operations "
              "WHERE idempotency_key='pay8:downgrade:evidence'"
          ) == 1
          PY
          if OUTPUT="$(python -s -m alembic -c alembic.ini downgrade "${PAY8_PREDECESSOR}" 2>&1)"; then
            printf '%s\n' "$OUTPUT"
            echo 'PAY-8 populated downgrade unexpectedly succeeded' >&2
            exit 1
          else
            RC=$?
            printf '%s\n' "$OUTPUT"
            test "$RC" -ne 0
          fi
          python - <<'PY'
          from tests.test_pay8_durable_checkout_webhooks_runtime import (
              _admin_scalar,
          )
          state = (
              _admin_scalar("SELECT version_num FROM public.alembic_version"),
              _admin_scalar(
                  "SELECT count(*) FROM finance.provider_operations "
                  "WHERE idempotency_key='pay8:downgrade:evidence'"
              ),
              _admin_scalar(
                  "SELECT pg_catalog.to_regclass("
                  "'finance.provider_operations') IS NOT NULL"
              ),
              _admin_scalar(
                  "SELECT pg_catalog.to_regclass("
                  "'finance.provider_webhook_inbox') IS NOT NULL"
              ),
          )
          print(f"PAY8_POST_FAILED_DOWNGRADE_STATE={state!r}")
          assert state == ("zr07d8e9f0a52", 1, True, True)
          PY
          echo 'PAY8_POPULATED_DOWNGRADE_FAIL_CLOSED=PASS'
          python - <<'PY'
          from tests.test_pay8_durable_checkout_webhooks_runtime import _cleanup_and_seed
          _cleanup_and_seed()
          PY
      - name: Empty downgrade restores predecessor then re-upgrade
        run: |
          set -euo pipefail
          PGPASSWORD=ci-pay8-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay8_test -At <<'SQL' > /tmp/pay8-rel-pre-downgrade.txt
          SELECT n.nspname||'.'||c.relname||'|'||c.relfilenode
          FROM pg_catalog.pg_class c
          JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname IN ('public','finance')
            AND c.relkind IN ('r','p')
            AND NOT (
              n.nspname='finance'
              AND c.relname IN ('provider_operations','provider_webhook_inbox')
            )
          ORDER BY 1;
          SQL

          python -s -m alembic -c alembic.ini downgrade "${PAY8_PREDECESSOR}"

          PGPASSWORD=ci-pay8-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay8_test -At <<'SQL' > /tmp/pay8-rel-restored.txt
          SELECT n.nspname||'.'||c.relname||'|'||c.relfilenode
          FROM pg_catalog.pg_class c
          JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname IN ('public','finance')
            AND c.relkind IN ('r','p')
          ORDER BY 1;
          SQL
          PGPASSWORD=ci-pay8-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay8_test -At <<'SQL' > /tmp/pay8-acl-restored.txt
          SELECT table_schema||'.'||table_name||'|'||grantee||'|'||privilege_type
          FROM information_schema.role_table_grants
          WHERE table_schema IN ('public','finance')
            AND grantee IN (
              'app_security_owner','app_runtime','worker_runtime',
              'finance_payment_runtime','finance_reconciliation_runtime'
            )
          UNION ALL
          SELECT table_schema||'.'||table_name||'.'||column_name||'|'||grantee||'|'||privilege_type
          FROM information_schema.column_privileges
          WHERE table_schema IN ('public','finance')
            AND grantee IN (
              'app_security_owner','app_runtime','worker_runtime',
              'finance_payment_runtime','finance_reconciliation_runtime'
            )
          ORDER BY 1;
          SQL
          diff -u /tmp/pay8-rel-pre-downgrade.txt /tmp/pay8-rel-restored.txt
          diff -u /tmp/pay8-acl-before.txt /tmp/pay8-acl-restored.txt
          python -s -m alembic -c alembic.ini upgrade "${PAY8_HEAD}"
          echo 'PAY8_MIGRATION_LIFECYCLE=PASS'

  architecture:
    uses: ./.github/workflows/architecture-hardening-contracts.yml
  general_platform:
    uses: ./.github/workflows/hardening-ci.yml
  finance:
    uses: ./.github/workflows/finance-hardening-ci.yml
  migration_lifecycle:
    uses: ./.github/workflows/migration-lifecycle-ci.yml
  migration_preservation:
    uses: ./.github/workflows/migration-data-preservation-ci.yml
  migration_adversarial:
    uses: ./.github/workflows/migration-adversarial-safety-ci.yml
  migration_contracts:
    uses: ./.github/workflows/migration-lifecycle-contracts.yml
  migration_semantics:
    uses: ./.github/workflows/migration-semantics-inventory.yml

  certify:
    name: Terminal immutable PAY-8 decision
    if: ${{ always() }}
    needs:
      - contract
      - protocol_pg16
      - architecture
      - general_platform
      - finance
      - migration_lifecycle
      - migration_preservation
      - migration_adversarial
      - migration_contracts
      - migration_semantics
    runs-on: ubuntu-24.04
    steps:
      - name: Require all PAY-8 gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          data=json.loads(os.environ["RESULTS"])
          bad={k:v["result"] for k,v in data.items() if v["result"]!="success"}
          if bad:
              raise SystemExit(f"PAY-8 prerequisite failure: {bad}")
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY8_CANDIDATE_SHA }}
      - name: Bind exact PAY-8 candidate
        run: |
          set -euo pipefail
          mkdir -p pay8-evidence
          test "$(git rev-parse "${PAY8_BASE_SHA}^{tree}")" = "${PAY8_BASE_TREE}"
          git merge-base --is-ancestor "${PAY8_BASE_SHA}" HEAD
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          decision={
            "phase":"PAY-8",
            "candidate_sha":os.environ["PAY8_CANDIDATE_SHA"],
            "candidate_tree":subprocess.check_output(
              ["git","rev-parse","HEAD^{tree}"],text=True
            ).strip(),
            "inherited_pay7_sha":os.environ["PAY8_BASE_SHA"],
            "alembic_head":os.environ["PAY8_HEAD"],
            "live_provider":False,
            "live_money_movement":False,
            "refund_provider_execution":"DEFERRED_FAIL_CLOSED",
            "merge_authorized":False,
            "release_authorized":False,
            "deployment_authorized":False,
            "decision":"PASS",
          }
          Path("pay8-evidence/decision.json").write_text(
              json.dumps(decision,indent=2,sort_keys=True)+"\n"
          )
          PY
          cat pay8-evidence/decision.json
          echo 'PAY8_DURABLE_PROVIDER_OPERATION=PASS'
          echo 'PAY8_UNKNOWN_OUTCOME_FENCING=PASS'
          echo 'PAY8_PROVIDER_RECONCILIATION=PASS'
          echo 'PAY8_WEBHOOK_INBOX=PASS'
          echo 'PAY8_WEBHOOK_REPLAY_FENCING=PASS'
          echo 'PAY8_WEBHOOK_CRASH_RECOVERY=PASS'
          echo 'PAY8_DIRECT_DML_DENIAL=PASS'
          echo 'PAY8_MIGRATION_LIFECYCLE=PASS'
          echo 'PAY8_PAY7_INHERITED=PASS'
          echo 'PAY8_LIVE_PROVIDER=DISABLED'
          echo 'PAY8_LIVE_MONEY_MOVEMENT=DISABLED'
          echo 'PAY8_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'
          echo 'PAY8_FINAL=PASS'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pay8-final-${{ github.sha }}
          path: pay8-evidence/
          if-no-files-found: error
          retention-days: 30
