def test_0020_requires_infrastructure_owned_citext_and_never_creates_it() -> None:
    source = _source()
    upgrade = _upgrade(source)
    assert "0020 requires infrastructure-owned citext" in source
    assert "owner postgres" in source
    assert "CREATE EXTENSION" not in upgrade


def test_0020_revision_owned_private_functions_are_not_silently_replaced() -> None:
    source = _source()
    upgrade = _upgrade(source)
    assert "target-object collision; refusing silent adoption" in source
    assert "CREATE OR REPLACE FUNCTION app_private." not in upgrade
    assert upgrade.count("CREATE FUNCTION app_private.") == 9


def test_0020_audit_tenant_registry_is_validated_for_exhaustive_rls_preflight() -> None:
    source = _source()
    assert "fk_branch_contacts_audit_org" in source
    assert "constraint_data.convalidated" in source
    assert "SELECT id::text AS org_id FROM public.organizations" in source
    assert "SET LOCAL ROLE app_rls_executor" in source
    assert "downgrade would discard populated business/audit relation" in source


def test_0020_downgrade_is_strict_and_non_cascading() -> None:
    downgrade = _downgrade(_source())
    assert "CASCADE" not in downgrade
    assert "IF EXISTS" not in downgrade
    assert "DROP POLICY tenant_isolation_contacts_audit" in downgrade
    assert "DROP POLICY tenant_isolation_contacts" in downgrade
