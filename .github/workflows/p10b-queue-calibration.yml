name: P10-B Queue Calibration

on:
  push:
    branches:
      - hardening/p10-performance-security-final-production-certification
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p10b-queue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  queue-calibration:
    name: Synthetic Redis queue calibration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      P10B_QUEUE_ITEMS: '5000'
      P10B_QUEUE_PAYLOAD_BYTES: '256'
      EVIDENCE_DIR: p10b-queue-evidence
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked Redis client and validate probe
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m py_compile scripts/ci/p10b_queue_calibration.py

      - name: Run isolated queue calibration
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          python -s scripts/ci/p10b_queue_calibration.py \
            --redis-url "${REDIS_URL}" \
            --items "${P10B_QUEUE_ITEMS}" \
            --payload-bytes "${P10B_QUEUE_PAYLOAD_BYTES}" \
            --output "${EVIDENCE_DIR}/queue-calibration.json" \
            | tee "${EVIDENCE_DIR}/queue-calibration.log"
          grep -q 'P10B_QUEUE_CALIBRATION=PASS' "${EVIDENCE_DIR}/queue-calibration.log"
          python - "${EVIDENCE_DIR}/queue-calibration.json" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          assert data['decision'] == 'CALIBRATION_PASS'
          assert data['items'] == 5000
          assert data['remaining_items'] == 0
          assert data['durable_business_authority'] == 'postgresql'
          PY
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --exit-code
          git diff --cached --exit-code
          echo 'P10B_QUEUE_CALIBRATION=PASS'
          echo 'P10_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'

      - name: Upload queue calibration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p10b-queue-calibration-${{ github.event.pull_request.head.sha || github.sha }}
          path: p10b-queue-evidence/
          if-no-files-found: error
          retention-days: 14
