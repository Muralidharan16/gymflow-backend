name: P5-C Compensation Crash and Replay PostgreSQL 16

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - hardening/p5-concurrency-crash-fault-tolerance
      - hardening/p5c-compensation-replay-temp
  workflow_call:
    inputs:
      certification_head:
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5c-compensation-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compensation-crash-replay:
    name: Real compensation process death and replay convergence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIGRATION_PASSWORD: ci-p5c-migration-owner
      AUTH_RUNTIME_PASSWORD: ci-p5c-auth-runtime
      APP_RUNTIME_PASSWORD: ci-p5c-app-runtime
      WORKER_RUNTIME_PASSWORD: ci-p5c-worker-runtime
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-p5c-migration-owner@127.0.0.1:5432/gymflow_p5c_test
      TEST_DATABASE_URL: postgresql+psycopg://app_test_runtime:ci-p5c-app-runtime@127.0.0.1:5432/gymflow_p5c_test
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://migration_owner:ci-p5c-migration-owner@127.0.0.1:5432/gymflow_p5c_test
      WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:ci-p5c-worker-runtime@127.0.0.1:5432/gymflow_p5c_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-p5c-not-production
      AWS_ACCESS_KEY_ID: ci-p5c-not-production
      AWS_SECRET_ACCESS_KEY: ci-p5c-not-production
      S3_BUCKET_NAME: gymflow-p5c-test
      ENVIRONMENT: test
      P5C_PROCESS_FAULTS: '1'
      P5C_DISPOSABLE_DATABASE: gymflow_p5c_test
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment and prove P5-C static contracts
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt
          python -m py_compile \
            tests/test_p5c_compensation_crash_replay_runtime.py \
            tests/test_p5c_compensation_crash_replay_static_contracts.py
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p5_governance_contracts.py \
            tests/test_p5w_worker_fencing_static_contracts.py \
            tests/test_p5w2_worker_crash_static_contracts.py \
            tests/test_p5e_provider_ack_ambiguity_static_contracts.py \
            tests/test_p5d_dependency_loss_static_contracts.py \
            tests/test_p5r_race_deadlock_static_contracts.py \
            tests/test_p5c_compensation_crash_replay_static_contracts.py

      - name: Install PostgreSQL 16 and reduced runtime identities
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-p5c-migration-owner';
          CREATE ROLE auth_p5c_runtime LOGIN PASSWORD 'ci-p5c-auth-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_test_runtime LOGIN PASSWORD 'ci-p5c-app-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE worker_test_runtime LOGIN PASSWORD 'ci-p5c-worker-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT auth_runtime TO auth_p5c_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO auth_p5c_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_runtime TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT worker_runtime TO worker_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          ALTER ROLE auth_p5c_runtime SET row_security='on';
          ALTER ROLE auth_p5c_runtime SET statement_timeout='5s';
          ALTER ROLE auth_p5c_runtime SET lock_timeout='3s';
          ALTER ROLE auth_p5c_runtime SET idle_in_transaction_session_timeout='15s';
          ALTER ROLE app_test_runtime SET row_security='on';
          ALTER ROLE app_test_runtime SET statement_timeout='12s';
          ALTER ROLE app_test_runtime SET lock_timeout='5s';
          ALTER ROLE app_test_runtime SET idle_in_transaction_session_timeout='30s';
          ALTER ROLE worker_test_runtime SET row_security='on';
          ALTER ROLE worker_test_runtime SET statement_timeout='15s';
          ALTER ROLE worker_test_runtime SET lock_timeout='5s';
          ALTER ROLE worker_test_runtime SET idle_in_transaction_session_timeout='30s';
          CREATE DATABASE gymflow_p5c_test OWNER migration_owner;
          REVOKE ALL ON DATABASE gymflow_p5c_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE gymflow_p5c_test
            TO migration_owner,auth_p5c_runtime,app_test_runtime,worker_test_runtime;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p5c_test

      - name: Prove exact certified PostgreSQL 16 migration head
        env:
          CERTIFICATION_HEAD: ${{ inputs.certification_head }}
        run: |
          set -euo pipefail
          # Historical P5 same-head certification anchor: zj07d8e9f0a44
          expected_head="${CERTIFICATION_HEAD:-zk07d8e9f0a45}"
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "${expected_head}"
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads
          PGPASSWORD="${APP_RUNTIME_PASSWORD}" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U app_test_runtime -d gymflow_p5c_test \
            -c 'SELECT current_user,pg_catalog.current_setting('\''row_security'\'');'
          PGPASSWORD="${WORKER_RUNTIME_PASSWORD}" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U worker_test_runtime -d gymflow_p5c_test \
            -c 'SELECT current_user,pg_catalog.current_setting('\''row_security'\'');'
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_p5c_test <<'SQL'
          DO $$
          BEGIN
            IF pg_catalog.has_table_privilege(
              'app_runtime','public.branch_outbox_events','INSERT'
            ) THEN
              RAISE EXCEPTION 'P5C refuses table-wide app_runtime outbox INSERT';
            END IF;
            IF pg_catalog.has_table_privilege(
              'worker_runtime','public.branch_outbox_events','INSERT'
            ) THEN
              RAISE EXCEPTION 'P5C refuses table-wide worker_runtime outbox INSERT';
            END IF;
            IF NOT pg_catalog.has_column_privilege(
              'app_runtime','public.branch_outbox_events','lease_fence','INSERT'
            ) THEN
              RAISE EXCEPTION 'P5C predecessor lost certified P5-D lease_fence INSERT';
            END IF;
          END
          $$;
          SQL

      - name: Prove compensation process death and replay convergence
        run: |
          set +e
          python -m pytest --noconftest -q -s --showlocals --maxfail=1 \
            tests/test_p5c_compensation_crash_replay_runtime.py
          rc=$?
          set -e
          if [ "${rc}" -ne 0 ]; then
            echo "--- PostgreSQL 16 error statements ---"
            sudo tail -n 200 /var/log/postgresql/postgresql-16-main.log
          fi
          exit "${rc}"

      - name: Reprove inherited lifecycle worker and compensation boundaries
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p5w_worker_fencing_runtime.py \
            tests/test_branch_hours_durable_worker_boundary.py \
            tests/test_branch_lifecycle_durable_worker_boundary.py \
            tests/test_branch_lifecycle_transaction_boundary.py \
            tests/test_celery_single_app_boundary.py \
            tests/test_p4a_external_effect_contracts.py \
            tests/test_p4d_refund_authority_static_contracts.py \
            tests/test_lifecycle_compensation_state_metadata_boundary.py
          python -s scripts/verify_head_workflow_bootstrap.py

      - name: Emit same-head P5-C markers
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          echo "P5C_BEFORE_COMMIT_CRASH=PASS"
          echo "P5C_REPLACEMENT_WORKER_RECOVERY=PASS"
          echo "P5C_AFTER_COMMIT_REDELIVERY=PASS"
          echo "P5C_SINGLE_COMPENSATION_EFFECT=PASS"
          echo "P5C_NO_FROZEN_UNRECOVERABLE_AGGREGATE=PASS"
          echo "P5C_PROVIDER_REFUND_EXECUTION=DEFERRED_FAIL_CLOSED"
