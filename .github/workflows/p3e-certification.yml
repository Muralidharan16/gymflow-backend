name: P3E Final Certification Matrix

on:
  pull_request:
    branches:
      - hardening/p3d-branch-role-lifecycle-matrix
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3e-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MIGRATION_PASSWORD: ci-migration-owner
  GENERAL_RUNTIME_PASSWORD: ci-app-test-runtime
  AUTH_RUNTIME_PASSWORD: ci-auth-test-runtime
  WORKER_RUNTIME_PASSWORD: ci-worker-test-runtime
  MAINTENANCE_RUNTIME_PASSWORD: ci-lifecycle-maintenance-runtime
  DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_migration_test
  TEST_DATABASE_URL: postgresql+asyncpg://app_test_runtime:ci-app-test-runtime@127.0.0.1:5432/gymflow_test
  TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
  AUTH_DATABASE_URL: postgresql+asyncpg://auth_test_runtime:ci-auth-test-runtime@127.0.0.1:5432/gymflow_test
  WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:ci-worker-test-runtime@127.0.0.1:5432/gymflow_test
  MAINTENANCE_DATABASE_URL: postgresql+asyncpg://lifecycle_maintenance_test_runtime:ci-lifecycle-maintenance-runtime@127.0.0.1:5432/gymflow_test
  REDIS_URL: redis://127.0.0.1:6379/0
  CELERY_BROKER_URL: redis://127.0.0.1:6379/1
  CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
  AWS_ACCESS_KEY_ID: ci-test
  AWS_SECRET_ACCESS_KEY: ci-test
  AWS_REGION_NAME: us-east-1
  S3_BUCKET_NAME: gymflow-ci-test
  ENVIRONMENT: test
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  tenant-context-pool-isolation:
    name: P3E Tenant Context and Pool Isolation PG16
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SECRET_KEY: ci-p3e-context-not-production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt
      - name: Prepare fresh P3E PostgreSQL 16 boundary
        run: bash scripts/ci/prepare_p3e_pg16.sh
      - name: Prove transaction context and pool isolation
        run: |
          set -euo pipefail
          python -m pytest -q --maxfail=1 \
            tests/test_p3d_branch_role_lifecycle_runtime.py \
            tests/test_branch_lifecycle_transaction_boundary.py \
            tests/test_branch_lifecycle_fixture_identity_boundary.py \
            tests/test_database_transaction_context_boundary.py \
            tests/test_database_session_guc_boundary.py \
            tests/test_pytest_db_context_fidelity_boundary.py \
            tests/test_worker_database_identity_boundary.py \
            tests/test_p3e_worker_principal_routing_runtime.py
      - name: Reprove non-escalating cluster identity graph
        env:
          DOERS_CLUSTER_VERIFY_DATABASE_URL: postgresql+psycopg://migration_owner:ci-migration-owner@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          python -s scripts/verify_cluster_role_bootstrap.py
          python -s scripts/verify_cluster_identity_graph.py

  inherited-p3abc:
    name: P3E Inherited P3A P3B P3C Regression PG16
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SECRET_KEY: ci-p3e-inherited-p3abc-not-production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt
      - name: Prepare fresh P3E PostgreSQL 16 boundary
        run: bash scripts/ci/prepare_p3e_pg16.sh
      - name: Reprove final P3B database contract
        env:
          P3B_MIGRATION_DSN: postgresql://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
        run: |
          set -euo pipefail
          python -s scripts/ci/verify_p3b_registration_contract_boundary.py --expect final
      - name: Run inherited P3A P3B P3C source contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q \
            tests/test_p3a_profile_http_authorization.py \
            tests/test_organization_profile_authorization_boundary.py \
            tests/test_organization_profile_principal_binding.py \
            tests/test_organization_onboarding_authorization_boundary.py \
            tests/test_p3a_auth_runtime_decoupling.py \
            tests/test_p3b_registration_application_cutover.py \
            tests/test_p3b_registration_contract.py \
            tests/test_p3b_registration_read_boundary.py \
            tests/test_p3b_registration_create_capability.py \
            tests/test_p3b_registration_replace_without_upsert_reads.py \
            tests/test_p3c_profile_registration_atomicity_static.py \
            tests/test_p3c_atomic_service_behavior.py
      - name: Reprove P3C combined mutation runtime
        env:
          P3C_MIGRATION_DSN: postgresql://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
          P3C_API_ASYNC_DSN: postgresql+asyncpg://app_test_runtime:ci-app-test-runtime@127.0.0.1:5432/gymflow_test
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m py_compile scripts/ci/verify_p3c_combined_mutation_runtime.py
          python -s scripts/ci/verify_p3c_combined_mutation_runtime.py
      - name: Reprove final P3B and cluster identity graph
        env:
          P3B_MIGRATION_DSN: postgresql://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
          DOERS_CLUSTER_VERIFY_DATABASE_URL: postgresql+psycopg://migration_owner:ci-migration-owner@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          python -s scripts/ci/verify_p3b_registration_contract_boundary.py --expect final
          python -s scripts/verify_cluster_role_bootstrap.py
          python -s scripts/verify_cluster_identity_graph.py

  inherited-p3d:
    name: P3E Inherited P3D Lifecycle Regression PG16
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SECRET_KEY: ci-p3e-inherited-p3d-not-production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt
      - name: Prepare fresh P3E PostgreSQL 16 boundary
        run: bash scripts/ci/prepare_p3e_pg16.sh
      - name: Run P3D source contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q \
            tests/test_p3d_branch_role_lifecycle_static.py \
            tests/test_p3d_branch_lifecycle_http_static.py
      - name: Reprove P3D role lifecycle concurrency and maintenance contracts
        run: |
          set -euo pipefail
          python -m pytest -q --maxfail=1 \
            tests/test_p3d_branch_role_lifecycle_runtime.py \
            tests/test_p3d_branch_role_revocation_runtime.py \
            tests/test_branch_read_rls_matrix.py \
            tests/test_branch_lifecycle.py \
            tests/test_branch_lifecycle_transaction_boundary.py \
            tests/test_branch_lifecycle_fixture_identity_boundary.py \
            tests/test_database_transaction_context_boundary.py \
            tests/test_database_session_guc_boundary.py \
            tests/test_pytest_db_context_fidelity_boundary.py \
            tests/test_branch_lifecycle_durable_worker_boundary.py \
            tests/test_lifecycle_maintenance_runtime_boundary.py \
            tests/test_lifecycle_rls_policy_role_boundary.py \
            tests/test_worker_database_identity_boundary.py \
            tests/test_branch_lifecycle_checkpoint_contract.py \
            tests/test_branch_lifecycle_history_correlation_boundary.py
      - name: Reprove cluster identity graph
        env:
          DOERS_CLUSTER_VERIFY_DATABASE_URL: postgresql+psycopg://migration_owner:ci-migration-owner@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          python -s scripts/verify_cluster_role_bootstrap.py
          python -s scripts/verify_cluster_identity_graph.py

  migration-lifecycle:
    name: P3E Full Migration Lifecycle PG16
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SECRET_KEY: ci-p3e-migration-lifecycle-not-production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt
      - name: Prepare fresh P3E PostgreSQL 16 boundary
        run: bash scripts/ci/prepare_p3e_pg16.sh
      - name: Prove P3E downgrade to predecessor and two full re-upgrade cycles
        run: |
          set -euo pipefail
          export DATABASE_URL="postgresql+asyncpg://migration_owner:${MIGRATION_PASSWORD}@127.0.0.1:5432/gymflow_migration_test"
          for cycle in 1 2; do
            python -s -m alembic -c alembic.ini downgrade k07d8e9f0a2b
            current="$(PGPASSWORD="${MIGRATION_PASSWORD}" psql -X -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -U migration_owner -d gymflow_migration_test -c 'SELECT version_num FROM public.alembic_version')"
            test "${current}" = "k07d8e9f0a2b"
            absent="$(PGPASSWORD="${MIGRATION_PASSWORD}" psql -X -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -U migration_owner -d gymflow_migration_test -c "SELECT pg_catalog.to_regclass('public.organization_asset_jobs') IS NULL AND pg_catalog.to_regclass('public.organization_asset_cleanup_jobs') IS NULL AND NOT EXISTS (SELECT 1 FROM pg_catalog.pg_proc AS p JOIN pg_catalog.pg_namespace AS n ON n.oid=p.pronamespace WHERE n.nspname='app_secure' AND p.proname IN ('expire_legacy_member_subscriptions','advance_trial_lifecycles','enqueue_organization_asset_job','claim_organization_asset_job','finalize_organization_asset_job','fail_organization_asset_job','delete_current_organization_asset','dispatchable_organization_asset_jobs','claim_organization_asset_cleanup','complete_organization_asset_cleanup','fail_organization_asset_cleanup','dispatchable_organization_asset_cleanup'))")"
            test "${absent}" = "t"
            python -s -m alembic -c alembic.ini upgrade head
            python -s -m alembic -c alembic.ini current --check-heads
          done
      - name: Prove final P3E capability and deploy-owner boundaries
        run: |
          set -euo pipefail
          PGPASSWORD="${MIGRATION_PASSWORD}" psql -X -At -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_migration_test <<'SQL'
          DO $$
          DECLARE
            v_claim_oid oid;
            v_finalize_oid oid;
            v_definition text;
          BEGIN
            IF pg_catalog.has_schema_privilege('migration_owner', 'app_secure', 'USAGE') THEN
              RAISE EXCEPTION 'migration_owner retained app_secure USAGE';
            END IF;

            SELECT p.oid, pg_catalog.pg_get_functiondef(p.oid)
              INTO v_claim_oid, v_definition
              FROM pg_catalog.pg_proc AS p
              JOIN pg_catalog.pg_namespace AS n ON n.oid = p.pronamespace
             WHERE n.nspname = 'app_secure'
               AND p.proname = 'claim_organization_asset_job'
               AND pg_catalog.pg_get_function_identity_arguments(p.oid)
                   = 'p_job_id uuid, p_lease_token uuid, p_lease_seconds integer';
            IF v_claim_oid IS NULL
               OR pg_catalog.strpos(v_definition, 'attempt_count = job.attempt_count + 1') = 0
               OR pg_catalog.strpos(v_definition, 'owner_row.email_verified IS TRUE') = 0 THEN
              RAISE EXCEPTION 'final asset claim contract is incomplete';
            END IF;

            SELECT p.oid, pg_catalog.pg_get_functiondef(p.oid)
              INTO v_finalize_oid, v_definition
              FROM pg_catalog.pg_proc AS p
              JOIN pg_catalog.pg_namespace AS n ON n.oid = p.pronamespace
             WHERE n.nspname = 'app_secure'
               AND p.proname = 'finalize_organization_asset_job'
               AND pg_catalog.pg_get_function_identity_arguments(p.oid)
                   = 'p_job_id uuid, p_lease_token uuid, p_width integer, p_height integer, p_size_bytes bigint, p_content_type text';
            IF v_finalize_oid IS NULL
               OR pg_catalog.strpos(v_definition, 'owner_row.email_verified IS TRUE') = 0
               OR pg_catalog.strpos(v_definition, 'logo_updated_by_owner_id = v_job.requested_by_owner_id') = 0 THEN
              RAISE EXCEPTION 'final asset finalize contract is incomplete';
            END IF;

            IF pg_catalog.has_function_privilege('app_runtime', v_claim_oid, 'EXECUTE')
               OR pg_catalog.has_function_privilege('auth_runtime', v_claim_oid, 'EXECUTE')
               OR pg_catalog.has_function_privilege('lifecycle_maintenance_runtime', v_claim_oid, 'EXECUTE')
               OR pg_catalog.has_function_privilege('migration_owner', v_claim_oid, 'EXECUTE')
               OR NOT pg_catalog.has_function_privilege('worker_runtime', v_claim_oid, 'EXECUTE') THEN
              RAISE EXCEPTION 'asset claim execution matrix drifted';
            END IF;
            IF NOT pg_catalog.has_function_privilege(
                'app_security_owner', 'public.owners', 'email_verified', 'SELECT'
            ) THEN
              RAISE EXCEPTION 'reduced owner lacks exact live-authority read';
            END IF;
            IF pg_catalog.has_table_privilege('worker_runtime', 'public.owners', 'SELECT') THEN
              RAISE EXCEPTION 'worker gained direct owners SELECT';
            END IF;
          END $$;
          SQL
      - name: Reprove Alembic graph migration semantics and cluster graph
        env:
          DOERS_CLUSTER_VERIFY_DATABASE_URL: postgresql+psycopg://migration_owner:ci-migration-owner@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          python -s scripts/verify_alembic_graph.py
          python -s scripts/migration_semantics_gate.py
          python -s scripts/verify_cluster_role_bootstrap.py
          python -s scripts/verify_cluster_identity_graph.py

  general-regressions:
    name: P3E General Regression Certification PG16
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SECRET_KEY: ci-p3e-general-not-production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt
      - name: Prepare fresh P3E PostgreSQL 16 boundary
        run: bash scripts/ci/prepare_p3e_pg16.sh
      - name: Reprove P3D and P3E source contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q \
            tests/test_p3d_branch_role_lifecycle_static.py \
            tests/test_p3d_branch_lifecycle_http_static.py \
            tests/test_p3e_async_identity_static_contracts.py \
            tests/test_p3e_unsafe_legacy_jobs_static_contracts.py \
            tests/test_p3e_asset_fencing_static_contracts.py
      - name: Run general regression suite fail-fast
        id: general_pytest
        continue-on-error: true
        run: |
          set -uo pipefail
          # Dedicated P3E runtime files own relational fixtures and are executed
          # by same-head decisive workflows; the general suite proves everything
          # else without recreating privileged fixture state.
          python -m pytest -q --maxfail=1 \
            --ignore=tests/platform_billing \
            --ignore=tests/test_p3e_subscription_expiry_maintenance_runtime.py \
            --ignore=tests/test_p3e_trial_lifecycle_maintenance_runtime.py \
            --ignore=tests/test_p3e_asset_fencing_runtime.py \
            --ignore=tests/test_p3e_asset_modern_owner_provenance_runtime.py \
            2>&1 | tee /tmp/p3e-general-pytest.log
          exit ${PIPESTATUS[0]}
      - name: Upload general regression failure evidence
        if: steps.general_pytest.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3e-general-pytest-${{ github.sha }}
          path: /tmp/p3e-general-pytest.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce general regression result
        if: steps.general_pytest.outcome == 'failure'
        run: exit 1
      - name: Reprove final P3B and cluster identity graph after regressions
        env:
          P3B_MIGRATION_DSN: postgresql://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
          DOERS_CLUSTER_VERIFY_DATABASE_URL: postgresql+psycopg://migration_owner:ci-migration-owner@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          python -s scripts/ci/verify_p3b_registration_contract_boundary.py --expect final
          python -s scripts/verify_cluster_role_bootstrap.py
          python -s scripts/verify_cluster_identity_graph.py
