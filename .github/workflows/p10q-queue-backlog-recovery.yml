name: P10-Q Queue Throughput and Backlog Recovery

on:
  push:
    branches:
      - hardening/p10-performance-security-final-production-certification
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p10q-backlog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CERTIFICATION_HEAD: zk07d8e9f0a45
  MIGRATION_PASSWORD: ci-migration-owner
  GENERAL_RUNTIME_PASSWORD: ci-app-test-runtime
  AUTH_RUNTIME_PASSWORD: ci-auth-test-runtime
  WORKER_RUNTIME_PASSWORD: ci-worker-test-runtime
  MAINTENANCE_RUNTIME_PASSWORD: ci-lifecycle-maintenance-runtime
  DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_migration_test
  TEST_DATABASE_URL: postgresql+asyncpg://app_test_runtime:ci-app-test-runtime@127.0.0.1:5432/gymflow_test
  TEST_ADMIN_DATABASE_URL: postgresql://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
  P10B_APP_DATABASE_URL: postgresql://app_test_runtime:ci-app-test-runtime@127.0.0.1:5432/gymflow_test
  WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:ci-worker-test-runtime@127.0.0.1:5432/gymflow_test
  REDIS_URL: redis://127.0.0.1:6379/0
  CELERY_BROKER_URL: redis://127.0.0.1:6379/1
  CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
  SECRET_KEY: p10q-synthetic-secret-not-production
  AWS_ACCESS_KEY_ID: p10q-synthetic
  AWS_SECRET_ACCESS_KEY: p10q-synthetic
  S3_BUCKET_NAME: p10q-synthetic
  ENVIRONMENT: test
  PYTHONDONTWRITEBYTECODE: '1'
  EVIDENCE_DIR: p10q-evidence

jobs:
  backlog_recovery:
    name: Real PostgreSQL durable backlog drain across worker replacement
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install locked environment and prove P10-Q contracts
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt
          python -m py_compile scripts/ci/p10q_backlog_recovery.py tests/test_p10q_contracts.py
          python -m pytest --noconftest -q --maxfail=1 tests/test_p10q_contracts.py
          python scripts/ci/verify_p10_performance_budgets.py | tee /tmp/p10q-budget.log
          grep -q '^P10_BASELINE_BUDGETS=PASS$' /tmp/p10q-budget.log

      - name: Prepare real PostgreSQL 16 reduced identities and HEAD schema
        run: bash scripts/ci/prepare_p3e_pg16.sh

      - name: Prove measured backlog recovery
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}/workers"
          python -s scripts/ci/p10q_backlog_recovery.py             --items 800             --concurrency 4             --output "${EVIDENCE_DIR}/decision.json"             --timeseries "${EVIDENCE_DIR}/queue-depth.jsonl"             --worker-log-dir "${EVIDENCE_DIR}/workers"             | tee "${EVIDENCE_DIR}/run.log"
          grep -q '^P10_QUEUE_BACKLOG_RECOVERY=PASS$' "${EVIDENCE_DIR}/run.log"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload P10-Q evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p10q-backlog-${{ github.event.pull_request.head.sha || github.sha }}
          path: p10q-evidence/
          if-no-files-found: error
          retention-days: 14

  crash_redelivery:
    name: Real worker crash redelivery and duplicate convergence
    uses: ./.github/workflows/p5w2-worker-crash-redelivery-pg16.yml
    with:
      certification_head: zk07d8e9f0a45

  terminal:
    name: P10-Q exact-head terminal decision
    if: always()
    needs: [backlog_recovery, crash_redelivery]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require backlog and crash recovery proofs
        run: |
          set -euo pipefail
          test "${{ needs.backlog_recovery.result }}" = "success"
          test "${{ needs.crash_redelivery.result }}" = "success"

      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Emit P10-Q terminal marker
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/ci/verify_p10_performance_budgets.py
          python -m pytest --noconftest -q --maxfail=1 tests/test_p10q_contracts.py
          git diff --exit-code
          git diff --cached --exit-code
          echo 'P10_QUEUE_BACKLOG_RECOVERY=PASS'
          echo 'P10_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'
