name: One-shot 6f app-secure inventory reconciliation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: app-secure-6f-inventory-once
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'hardening/complete-migration-lineage'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/complete-migration-lineage
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile exact 6f inventory contract
        id: patch
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('tests/test_migration_app_secure_owner_context_boundary.py')
          source = path.read_text(encoding='utf-8')

          file_old = '    "0029_rbac_p8_contract.py",\n    A1.name,\n'
          file_new = (
              '    "0029_rbac_p8_contract.py",\n'
              '    "6f708192a3b4_address_runtime_privilege_boundary.py",\n'
              '    A1.name,\n'
          )
          expected_old = (
              '        "0029_rbac_p8_contract.py": view_contract,\n'
              '        A1.name: view_contract,\n'
          )
          expected_new = (
              '        "0029_rbac_p8_contract.py": view_contract,\n'
              '        "6f708192a3b4_address_runtime_privilege_boundary.py": {\n'
              '            "grant_schema",\n'
              '            "revoke_schema",\n'
              '        },\n'
              '        A1.name: view_contract,\n'
          )

          def reconcile(old: str, new: str) -> None:
              global source
              old_count = source.count(old)
              new_count = source.count(new)
              if old_count == 1 and new_count == 0:
                  source = source.replace(old, new)
              elif old_count == 0 and new_count == 1:
                  return
              else:
                  raise SystemExit(
                      f'6f inventory anchor drift: old_count={old_count}, new_count={new_count}'
                  )

          reconcile(file_old, file_new)
          reconcile(expected_old, expected_new)
          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile tests/test_migration_app_secure_owner_context_boundary.py
          git diff --check
          if git diff --quiet -- tests/test_migration_app_secure_owner_context_boundary.py; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run targeted inventory tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pytest --noconftest -q \
            tests/test_migration_app_secure_owner_context_boundary.py \
            -k 'complete_app_secure_file_inventory_is_closed or complete_app_secure_ddl_category_allowlist_is_exact'

      - name: Publish one-file correction
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_migration_app_secure_owner_context_boundary.py
          test "$(git diff --cached --name-only)" = 'tests/test_migration_app_secure_owner_context_boundary.py'
          git diff --cached --check
          git commit -m 'test: include 6f app secure boundary in inventory'
          git fetch origin hardening/complete-migration-lineage
          git rebase origin/hardening/complete-migration-lineage
          python -m pytest --noconftest -q \
            tests/test_migration_app_secure_owner_context_boundary.py \
            -k 'complete_app_secure_file_inventory_is_closed or complete_app_secure_ddl_category_allowlist_is_exact'
          git push origin HEAD:hardening/complete-migration-lineage
