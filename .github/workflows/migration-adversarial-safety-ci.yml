name: Migration Adversarial Safety

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-adversarial-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-0020-domain-hardening:
    name: Apply bounded 0020 domain hardening
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'hardening/complete-migration-lineage'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout hardening head
        uses: actions/checkout@v4
        with:
          ref: hardening/complete-migration-lineage
          fetch-depth: 0

      - name: Compile and execute self-validating source patch
        run: |
          python -m py_compile scripts/apply_0020_domain_hardening.py
          python scripts/apply_0020_domain_hardening.py
          python -m py_compile alembic/versions/0020_contacts_hardened.py
          git diff --check

      - name: Restore normal CI and publish source fix
        run: |
          git show f9bc29d1e3acfe1cf4177486eb704266fb2176b9:.github/workflows/migration-adversarial-safety-ci.yml \
            > .github/workflows/migration-adversarial-safety-ci.yml
          rm -f \
            .github/workflows/_apply-0020-domain-hardening.yml \
            .github/_0020_patch_trigger \
            scripts/apply_0020_domain_hardening.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: harden contacts migration ownership and rollback'
          git push origin HEAD:hardening/complete-migration-lineage

  adversarial-00f:
    name: Adversarial migration production safety
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      MIGRATION_USER: migration_owner
      MIGRATION_PASSWORD: ci-migration-owner
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      EVIDENCE_DIR: migration-adversarial-evidence
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m py_compile \
            scripts/verify_00f_adversarial.py \
            scripts/run_00f_adversarial.py \
            scripts/verify_00f_predecessor_refs.py \
            scripts/verify_0002_populated_rollback.py \
            scripts/verify_0003_populated_rollback.py \
            scripts/verify_0004_maps_rollback.py \
            scripts/verify_0006_audit_outbox_rollback.py

      - name: Install PostgreSQL 16 extension packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-16 \
            postgresql-client-16 \
            postgresql-contrib \
            postgresql-16-partman \
            postgresql-16-postgis-3
          sudo systemctl start postgresql

      - name: Bootstrap isolated reduced-role databases
        run: |
          mkdir -p "$EVIDENCE_DIR"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          CREATE ROLE migration_owner
            LOGIN PASSWORD 'ci-migration-owner'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE branch_admin NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE branch_viewer NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE ops_support NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE gymflow_adv_0002 OWNER migration_owner;
          CREATE DATABASE gymflow_adv_0003 OWNER migration_owner;
          CREATE DATABASE gymflow_adv_0004 OWNER migration_owner;
          CREATE DATABASE gymflow_adv_0006 OWNER migration_owner;
          CREATE DATABASE gymflow_adv_multi OWNER migration_owner;
          CREATE DATABASE gymflow_adv_ambiguous OWNER migration_owner;
          CREATE DATABASE gymflow_adv_evolved OWNER migration_owner;
          CREATE DATABASE gymflow_adv_reference OWNER migration_owner;
          SQL

          for database in \
            gymflow_adv_0002 \
            gymflow_adv_0003 \
            gymflow_adv_0004 \
            gymflow_adv_0006 \
            gymflow_adv_multi \
            gymflow_adv_ambiguous \
            gymflow_adv_evolved \
            gymflow_adv_reference; do
            sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$database" <<'SQL'
          CREATE EXTENSION btree_gist;
          CREATE EXTENSION citext;
          CREATE EXTENSION pg_trgm;
          CREATE EXTENSION postgis;
          SQL
          done

      - name: Prove populated 0002 rollback blocks before mutation
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python -m scripts.verify_0002_populated_rollback \
            --database gymflow_adv_0002 \
            --evidence-dir "$EVIDENCE_DIR"

      - name: Prove populated 0003 security rollback blocks before mutation
        run: |
          python -m scripts.verify_0003_populated_rollback \
            --database gymflow_adv_0003 \
            --evidence-dir "$EVIDENCE_DIR"

      - name: Prove 0004 durable Maps and rebuildable-cache rollback policy
        run: |
          python -m scripts.verify_0004_maps_rollback \
            --database gymflow_adv_0004 \
            --evidence-dir "$EVIDENCE_DIR"

      - name: Prove 0006 audit and outbox rollback policy
        run: |
          python -m scripts.verify_0006_audit_outbox_rollback \
            --database gymflow_adv_0006 \
            --evidence-dir "$EVIDENCE_DIR"

      - name: Execute core 0009-00f adversarial migration scenarios
        run: |
          python -m scripts.run_00f_adversarial \
            --multi-db gymflow_adv_multi \
            --ambiguous-db gymflow_adv_ambiguous \
            --evolved-db gymflow_adv_evolved \
            --evidence-dir "$EVIDENCE_DIR"

      - name: Prove predecessor-owned branch references block rollback preflight
        run: |
          python -m scripts.verify_00f_predecessor_refs \
            --database gymflow_adv_reference \
            --evidence-dir "$EVIDENCE_DIR"

      - name: Upload adversarial migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-adversarial-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: migration-adversarial-evidence/
          if-no-files-found: error
          retention-days: 14
