name: Migration Adversarial Safety

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-adversarial-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-0020-domain-hardening:
    name: Publish bounded 0020 candidate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'hardening/complete-migration-lineage'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout hardening head
        uses: actions/checkout@v4
        with:
          ref: hardening/complete-migration-lineage
          fetch-depth: 0

      - name: Compile and execute self-validating source patch
        run: |
          python -m py_compile scripts/apply_0020_domain_hardening.py
          python scripts/apply_0020_domain_hardening.py
          python -m py_compile alembic/versions/0020_contacts_hardened.py
          git diff --check

      - name: Publish migration-only candidate branch
        run: |
          python <<'PY'
          import subprocess

          status = subprocess.check_output(
              ['git', 'status', '--porcelain'],
              text=True,
          ).splitlines()
          changed = {
              line[3:]
              for line in status
              if len(line) >= 4
          }
          expected = {'alembic/versions/0020_contacts_hardened.py'}
          if changed != expected:
              raise SystemExit(
                  f'0020 candidate publication scope drift: observed={sorted(changed)!r}, expected={sorted(expected)!r}'
              )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alembic/versions/0020_contacts_hardened.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: harden contacts migration ownership and rollback candidate'
          git push origin HEAD:refs/heads/automation/0020-hardened-candidate-20260810
