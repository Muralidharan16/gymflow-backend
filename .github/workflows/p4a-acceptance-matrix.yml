name: P4A Acceptance Matrix

on:
  pull_request:
    branches:
      - hardening/p3e-background-worker-identity
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4a-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: P4A architecture hard stop
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Prove complete P4A contract suite
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p4a_external_effect_contracts.py \
            tests/test_p4a_external_effect_semantics.py \
            tests/test_p4a_no_false_success_contract.py \
            tests/test_p4a_inventory_schema.py \
            tests/test_p4a_recovery_runbook_contract.py \
            tests/test_p4a_contract_docs_linkage.py \
            tests/test_p4a_acceptance_matrix_contract.py

      - name: Reprove inherited P3E static contracts and bootstrap guard
        run: |
          set -euo pipefail
          python scripts/verify_head_workflow_bootstrap.py
