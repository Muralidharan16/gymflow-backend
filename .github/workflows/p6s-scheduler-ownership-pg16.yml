name: P6-S Scheduler Ownership and Duplicate Protection

on:
  push:
    branches:
      - hardening/p6-celery-redis-scheduler-production-readiness
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      certification_head:
        description: Exact immutable SHA required by a later P6 same-head fan-in
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6s-scheduler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scheduler-ownership:
    name: P6-S real Beat ownership and duplicate scheduler containment
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CERTIFICATION_HEAD: ${{ inputs.certification_head }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Guard optional same-head certification input
        run: |
          set -euo pipefail
          if [ -n "${CERTIFICATION_HEAD}" ]; then
            test "$(git rev-parse HEAD)" = "${CERTIFICATION_HEAD}"
          fi
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install locked environment and prove P6-S static contracts
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt
          python -m py_compile app/core/celery_beat_owner.py app/tasks/celery_app.py scripts/ci/p6s_runtime_fixture.py tests/test_p6s_scheduler_runtime.py tests/test_p6s_scheduler_static_contracts.py
          python -m pytest --noconftest -q --maxfail=1 tests/test_p6_governance_contracts.py tests/test_p6r_redis_production_contract.py tests/test_p6b_broker_reconnect_static_contracts.py tests/test_p6w_worker_shutdown_redelivery_static_contracts.py tests/test_p6p_poison_message_static_contracts.py tests/test_p6s_scheduler_static_contracts.py tests/test_p5d_dependency_loss_static_contracts.py tests/test_p5w2_worker_crash_static_contracts.py

      - name: Install PostgreSQL 16 and Redis runtime
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          sudo apt-get install -y redis-server
          redis-server --version

      - name: Prove real Beat ownership and duplicate scheduler effect safety
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q -s --maxfail=1 -p scripts.ci.p6s_runtime_fixture tests/test_p6s_scheduler_runtime.py

      - name: Emit P6-S decision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          echo "P6_BEAT_SINGLE_OWNER=PASS"
          echo "P6_DUPLICATE_SCHEDULER_EFFECT_SAFE=PASS"
          echo "P6_NO_LOST_DURABLE_BUSINESS_WORK=PASS"
          echo "P6_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED"
