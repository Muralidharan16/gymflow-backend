name: CERT-B Browser Credential Lifetime Gate

on:
  pull_request:
    branches:
      - hardening/production-attack-surface
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-credential-lifetime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+asyncpg://ci_api:ci_api@db.invalid:5432/doers
      AUTH_DATABASE_URL: postgresql+asyncpg://ci_auth:ci_auth@db.invalid:5432/doers
      WORKER_DATABASE_URL: ''
      MAINTENANCE_DATABASE_URL: ''
      REDIS_URL: redis://redis.invalid:6379/0
      CELERY_BROKER_URL: redis://redis.invalid:6379/1
      CELERY_RESULT_BACKEND: redis://redis.invalid:6379/2
      DOERS_PROCESS_PROFILE: api
      CELERY_WORKER_PROFILE: ''
      SECRET_KEY: ci-production-secret-key-0123456789abcdef
      INTERNAL_CONTROL_TOKEN: ci-internal-control-token-abcdef0123456789
      BACKEND_BASE_URL: https://api.example.invalid
      FRONTEND_URL: https://app.example.invalid
      CORS_ORIGINS: https://app.example.invalid
      AWS_ACCESS_KEY_ID: ci-test
      AWS_SECRET_ACCESS_KEY: ci-test
      ENVIRONMENT: production
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
      - name: Prove configured JWT and browser lifetimes cannot drift
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -m py_compile app/core/browser_session.py tests/security/test_cert_b_browser_cookie_ttl.py
          python -m pytest --noconftest -q tests/security/test_cert_b_browser_cookie_ttl.py
