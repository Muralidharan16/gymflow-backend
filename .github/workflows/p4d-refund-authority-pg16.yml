name: P4D Refund Authority PG16

on:
  pull_request:
    branches:
      - hardening/p4c-durable-notifications
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4d-refund-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refund-authority:
    name: Refund authority, Finance regression, and downgrade safety on PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIGRATION_PASSWORD: ci-migration-owner
      APP_RUNTIME_PASSWORD: ci-app-test-runtime
      WORKER_RUNTIME_PASSWORD: ci-worker-runtime
      MAINTENANCE_RUNTIME_PASSWORD: ci-lifecycle-maintenance-runtime
      FINANCE_RUNTIME_PASSWORD: ci-finance-runtime
      SYNTHETIC_RUNTIME_PASSWORD: ci-synthetic-runtime
      P4D_REFUND_TEST_DATABASE: gymflow_p4d_test
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_p4d_test
      TEST_DATABASE_URL: postgresql+asyncpg://finance_test_runtime:ci-finance-runtime@127.0.0.1:5432/gymflow_p4d_test
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_p4d_test
      FINANCE_CORE_TEST_DATABASE_URL: postgresql+asyncpg://finance_test_runtime:ci-finance-runtime@127.0.0.1:5432/gymflow_p4d_test
      FINANCE_CORE_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_p4d_test
      SYNTHETIC_ORG_TEST_DATABASE_URL: postgresql+asyncpg://synthetic_test_runtime:ci-synthetic-runtime@127.0.0.1:5432/gymflow_p4d_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-only-secret-key-not-for-production
      AWS_ACCESS_KEY_ID: ci-test
      AWS_SECRET_ACCESS_KEY: ci-test
      AWS_REGION_NAME: us-east-1
      S3_BUCKET_NAME: gymflow-ci-test
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Install PostgreSQL 16 and reduced identities
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-migration-owner';
          CREATE ROLE test_runner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE finance_test_runtime LOGIN PASSWORD 'ci-finance-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE synthetic_test_runtime LOGIN PASSWORD 'ci-synthetic-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_test_runtime LOGIN PASSWORD 'ci-app-test-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE worker_test_runtime LOGIN PASSWORD 'ci-worker-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE lifecycle_maintenance_test_runtime LOGIN PASSWORD 'ci-lifecycle-maintenance-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT app_runtime TO finance_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO finance_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT test_runner TO synthetic_test_runtime WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;
          GRANT app_runtime TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT worker_runtime TO worker_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT lifecycle_maintenance_runtime TO lifecycle_maintenance_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          ALTER ROLE finance_test_runtime SET row_security='on';
          ALTER ROLE synthetic_test_runtime SET row_security='on';
          ALTER ROLE app_test_runtime SET row_security='on';
          ALTER ROLE worker_test_runtime SET row_security='on';
          ALTER ROLE lifecycle_maintenance_test_runtime SET row_security='on';
          CREATE DATABASE gymflow_p4d_test OWNER migration_owner;
          REVOKE ALL ON DATABASE gymflow_p4d_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE gymflow_p4d_test TO migration_owner,finance_test_runtime,synthetic_test_runtime,app_test_runtime,worker_test_runtime,lifecycle_maintenance_test_runtime;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p4d_test

      - name: Prove static and inherited contracts
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1             tests/test_p4d_refund_authority_static_contracts.py             tests/test_migration_app_secure_owner_context_boundary.py             tests/test_p4c_inherited_contracts.py             tests/test_p4a_external_effect_contracts.py::test_finance_refund_foundation_exists_without_claiming_lifecycle_completion

      - name: Fresh root migration and reversible empty downgrade
        run: |
          set -euo pipefail
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = 'zc07d8e9f0a3d'
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads
          python -s -m alembic -c alembic.ini downgrade zb07d8e9f0a3c
          if python -s -m alembic -c alembic.ini current --check-heads; then
            echo 'downgraded database was incorrectly reported at head' >&2
            exit 1
          fi
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads

      - name: Grant bounded test-only Finance surfaces
        run: |
          set -euo pipefail
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1             -h 127.0.0.1 -U migration_owner -d gymflow_p4d_test <<'SQL'
          GRANT USAGE ON SCHEMA finance TO finance_test_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA finance TO finance_test_runtime;
          GRANT SELECT ON TABLE public.organizations TO finance_test_runtime;
          GRANT SELECT, INSERT, UPDATE ON TABLE public.organizations TO synthetic_test_runtime;
          GRANT SELECT, INSERT ON TABLE public.organization_creation_idempotency TO synthetic_test_runtime;
          GRANT SELECT ON TABLE public.owners, public.gyms, public.organization_users, public.organization_members, public.org_branches TO synthetic_test_runtime;
          GRANT USAGE ON SCHEMA finance TO synthetic_test_runtime;
          GRANT SELECT ON TABLE finance.billing_parties, finance.invoices, finance.payments TO synthetic_test_runtime;
          SQL

      - name: Run P4D authority and Finance regression suites
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 tests/test_p4d_refund_authority_runtime.py
          python -m pytest -q --maxfail=1 tests/finance_core

      - name: Prove protected evidence downgrade refusal
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1             tests/test_p4d_refund_authority_runtime.py::test_materialization_derives_authority_and_is_stable_across_transactions
          if python -s -m alembic -c alembic.ini downgrade zb07d8e9f0a3c; then
            echo 'zc07 downgrade destroyed durable refund execution evidence' >&2
            exit 1
          fi
          python -s -m alembic -c alembic.ini current --check-heads
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1             -h 127.0.0.1 -U migration_owner -d gymflow_p4d_test             -c "SELECT current_user,session_user,current_setting('role'),to_regclass('finance.refund_execution_commands');"
