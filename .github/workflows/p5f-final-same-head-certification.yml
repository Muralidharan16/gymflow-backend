name: P5-F Final Same-Head Certification

on:
  push:
    branches:
      - hardening/p5f-final-certification-temp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5f-final-same-head-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Frozen Final P5 scope and 27-gate topology
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/gymflow_p5f_contract_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-p5f-contract-not-production
      AWS_ACCESS_KEY_ID: ci-p5f-contract
      AWS_SECRET_ACCESS_KEY: ci-p5f-contract
      S3_BUCKET_NAME: gymflow-p5f-contract-test
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt
      - name: Validate immutable Final P5 contract
        run: |
          set -euo pipefail
          python -m json.tool docs/architecture/p5f_certification_matrix.json >/dev/null
          python -s scripts/verify_alembic_graph.py
          python -s scripts/migration_semantics_gate.py
          python -s scripts/verify_head_workflow_bootstrap.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = 'zj07d8e9f0a44'
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p5f_final_certification_contracts.py \
            tests/test_p5_governance_contracts.py \
            tests/test_p4f_final_certification_contracts.py
          git cat-file -e '4c21830edafda605b17194037ba0d78fe0492a86^{commit}'
          test "$(git rev-parse '4c21830edafda605b17194037ba0d78fe0492a86^{tree}')" = \
            'baef13057c8671e373255a9d9c2ab342e531b58d'
          git merge-base --is-ancestor 4c21830edafda605b17194037ba0d78fe0492a86 HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code

  architecture:
    name: Inherited architecture contracts
    uses: ./.github/workflows/architecture-hardening-contracts.yml
  migration_hardening:
    name: General, Platform Billing, and fresh-lineage regression
    uses: ./.github/workflows/hardening-ci.yml
  finance:
    name: Finance Core regression
    uses: ./.github/workflows/finance-hardening-ci.yml
  migration_lifecycle:
    name: Full migration lifecycle
    uses: ./.github/workflows/migration-lifecycle-ci.yml
  migration_preservation:
    name: Populated migration data preservation
    uses: ./.github/workflows/migration-data-preservation-ci.yml
  migration_adversarial:
    name: Adversarial migration recovery
    uses: ./.github/workflows/migration-adversarial-safety-ci.yml
  migration_contracts:
    name: Migration lifecycle contracts
    uses: ./.github/workflows/migration-lifecycle-contracts.yml
  migration_semantics:
    name: Migration semantics inventory
    uses: ./.github/workflows/migration-semantics-inventory.yml
  p3:
    name: Inherited P1, P2, and P3 certification
    uses: ./.github/workflows/p3e-certification.yml
    with:
      certification_head: zj07d8e9f0a44
  p3a_general:
    name: P3A broad inherited regression
    uses: ./.github/workflows/p3a-general-regressions.yml
  lifecycle_maintenance:
    name: Lifecycle maintenance production boundary
    uses: ./.github/workflows/lifecycle-maintenance-production-boundary.yml
  platform_maintenance:
    name: Platform maintenance production boundary
    uses: ./.github/workflows/platform-maintenance-production-boundary.yml
  p4b_opensearch:
    name: Real local OpenSearch behavior
    uses: ./.github/workflows/p4b-opensearch-live.yml
  p4b_evidence:
    name: P4B provider evidence and reconciliation
    uses: ./.github/workflows/p4b-search-evidence-pg16.yml
    with:
      certification_head: zj07d8e9f0a44
  p4b_drift:
    name: P4B search drift repair
    uses: ./.github/workflows/p4b-search-drift-pg16.yml
    with:
      certification_head: zj07d8e9f0a44
  p4c_general:
    name: P4C broad inherited regression
    uses: ./.github/workflows/p4c-general-regression.yml
    with:
      certification_head: zj07d8e9f0a44
  p4c_notification:
    name: P4C notification delivery and recovery
    uses: ./.github/workflows/p4c-notification-storage-pg16.yml
    with:
      certification_head: zj07d8e9f0a44
  p4d_refund:
    name: P4D refund-obligation authority without provider execution
    uses: ./.github/workflows/p4d-refund-authority-pg16.yml
    with:
      certification_head: zj07d8e9f0a44
  p4e_contract:
    name: P4E current-head external-effect contract
    uses: ./.github/workflows/p5f-inherited-p4e-contract.yml
    with:
      certification_head: zj07d8e9f0a44
  p4e_operational:
    name: P4E current-head operational observability
    uses: ./.github/workflows/p5f-inherited-p4e-operational-pg16.yml
    with:
      certification_head: zj07d8e9f0a44

  p5_governance:
    name: P5 governance and frozen fault matrix
    uses: ./.github/workflows/p5-governance-fault-matrix.yml
  p5_worker_fencing:
    name: P5-W1 monotonic worker fencing
    uses: ./.github/workflows/p5w-worker-fencing-pg16.yml
    with:
      certification_head: zj07d8e9f0a44
  p5_worker_crash_redelivery:
    name: P5-W2 real worker crash and redelivery
    uses: ./.github/workflows/p5w2-worker-crash-redelivery-pg16.yml
    with:
      certification_head: zj07d8e9f0a44
  p5_provider_ack:
    name: P5-E provider success and DB-ack ambiguity
    uses: ./.github/workflows/p5e-provider-ack-ambiguity-pg16.yml
    with:
      certification_head: zj07d8e9f0a44
  p5_dependency_loss:
    name: P5-D dependency and database loss
    uses: ./.github/workflows/p5d-dependency-loss-pg16.yml
    with:
      certification_head: zj07d8e9f0a44
  p5_race_deadlock:
    name: P5-R race and deadlock interleavings
    uses: ./.github/workflows/p5r-race-deadlock-pg16.yml
    with:
      certification_head: zj07d8e9f0a44
  p5_compensation:
    name: P5-C compensation crash and replay
    uses: ./.github/workflows/p5c-compensation-crash-replay-pg16.yml
    with:
      certification_head: zj07d8e9f0a44

  certify:
    name: Terminal immutable Final P5 decision
    if: ${{ always() }}
    needs:
      - contract
      - architecture
      - migration_hardening
      - finance
      - migration_lifecycle
      - migration_preservation
      - migration_adversarial
      - migration_contracts
      - migration_semantics
      - p3
      - p3a_general
      - lifecycle_maintenance
      - platform_maintenance
      - p4b_opensearch
      - p4b_evidence
      - p4b_drift
      - p4c_general
      - p4c_notification
      - p4d_refund
      - p4e_contract
      - p4e_operational
      - p5_governance
      - p5_worker_fencing
      - p5_worker_crash_redelivery
      - p5_provider_ack
      - p5_dependency_loss
      - p5_race_deadlock
      - p5_compensation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every inherited and P5 same-head gate
        env:
          REQUIRED_RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ["REQUIRED_RESULTS_JSON"])
          failures = {
              name: details["result"]
              for name, details in results.items()
              if details["result"] != "success"
          }
          if failures:
              raise SystemExit(f"Final P5 same-head gates failed: {failures}")
          print(f"Final P5 prerequisite gates passed: {len(results)}")
          PY

      - name: Reconfirm exact candidate and terminal hard stops
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Emit terminal P5 same-head certification
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "$(git write-tree)"
          test -z "$(git status --porcelain)"
          echo "P5F_NO_LOST_UPDATES=PASS"
          echo "P5F_NO_DUPLICATE_FINANCIAL_EFFECTS=PASS"
          echo "P5F_NO_STUCK_TRANSITIONS=PASS"
          echo "P5F_NO_UNRECOVERABLE_JOBS=PASS"
          echo "P5F_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED"
          echo "P5F_FINAL_SAME_HEAD_CERTIFICATION=PASS"
