name: P2D Runtime Principal Attestation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-principal-attestation:
    name: P2D runtime identity routing and live PG16 attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_p2d
      API_DATABASE_URL: postgresql+asyncpg://app_test_runtime:ci-app-runtime@127.0.0.1:5432/gymflow_p2d
      AUTH_DATABASE_URL: postgresql+asyncpg://auth_test_runtime:ci-auth-runtime@127.0.0.1:5432/gymflow_p2d
      FINANCE_PAYMENT_DATABASE_URL: postgresql+asyncpg://finance_payment_test_runtime:ci-finance-payment-runtime@127.0.0.1:5432/gymflow_p2d
      WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:ci-worker-runtime@127.0.0.1:5432/gymflow_p2d
      MAINTENANCE_DATABASE_URL: postgresql+asyncpg://maintenance_test_runtime:ci-maintenance-runtime@127.0.0.1:5432/gymflow_p2d
      FINANCE_CONFIG_DATABASE_URL: postgresql://finance_config_deployment:ci-finance-config-runtime@127.0.0.1:5432/gymflow_p2d
      ENTITLEMENT_DATABASE_URL: postgresql+asyncpg://entitlement_test_runtime:ci-entitlement-runtime@127.0.0.1:5432/gymflow_p2d
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-p2d-only-not-production
      AWS_ACCESS_KEY_ID: ci-p2d
      AWS_SECRET_ACCESS_KEY: ci-p2d
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Compile and certify static P2D contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m py_compile \
            app/core/runtime_principal_attestation.py \
            app/core/config.py \
            app/core/database.py \
            app/core/auth_database.py \
            app/core/celery_app.py \
            app/core/supervisor.py \
            alembic/versions/c47d8e9f0a1e_p3a_auth_runtime_decoupling.py \
            alembic/versions/zzd7d8e9f0a73_pay24f_live_checkout_environment.py \
            app/payment_activation/release_identity.py \
            app/finance_core/domain/razorpay_live.py \
            app/finance_core/services/razorpay_live.py \
            scripts/pay24f_terminal_canary.py \
            scripts/verify_runtime_principal_bindings.py \
            scripts/verify_runtime_identity_routing.py \
            tests/test_runtime_principal_attestation.py \
            tests/test_p3a_auth_runtime_decoupling.py \
            tests/test_pay24f_terminal_live_order_static.py \
            tests/test_pay24f_razorpay_live.py \
            tests/test_pay24f_live_order_pg16.py \
            alembic/versions/zze7d8e9f0a74_pay24g_live_payment_authority.py \
            app/finance_core/services/pay24g_live_payment_evidence.py \
            scripts/pay24g_terminal_payment_canary.py \
            tests/test_pay24g_live_payment_static.py \
            tests/test_pay24g_live_payment_evidence.py \
            tests/test_pay24g_terminal_canary_static.py \
            tests/test_pay24g_live_payment_pg16.py
          python -m pytest --noconftest -q \
            tests/test_runtime_principal_attestation.py \
            tests/test_p3a_auth_runtime_decoupling.py \
            tests/test_pay24f_terminal_live_order_static.py \
            tests/test_pay24f_razorpay_live.py \
            tests/test_pay24g_live_payment_static.py \
            tests/test_pay24g_live_payment_evidence.py \
            tests/test_pay24g_terminal_canary_static.py
          python -s scripts/verify_runtime_identity_routing.py
          bash -n scripts/ci/certify_runtime_principal_negative_paths.sh

      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-16 \
            postgresql-client-16 \
            postgresql-contrib \
            postgresql-16-partman \
            postgresql-16-postgis-3
          sudo systemctl start postgresql
          pg_config --version
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres -c 'SELECT version();'

      - name: Bootstrap canonical external PostgreSQL roles
        run: bash scripts/ci/bootstrap_cluster_roles.sh

      - name: Provision exact P2D deployment-login overlays
        run: |
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-migration-owner';
          ALTER ROLE postgres PASSWORD 'ci-p2d-postgres';
          CREATE ROLE app_test_runtime LOGIN PASSWORD 'ci-app-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE auth_test_runtime LOGIN PASSWORD 'ci-auth-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE finance_payment_test_runtime LOGIN PASSWORD 'ci-finance-payment-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE worker_test_runtime LOGIN PASSWORD 'ci-worker-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE maintenance_test_runtime LOGIN PASSWORD 'ci-maintenance-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE finance_config_deployment LOGIN PASSWORD 'ci-finance-config-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE entitlement_test_runtime LOGIN PASSWORD 'ci-entitlement-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;

          ALTER ROLE app_test_runtime SET row_security = 'on';
          ALTER ROLE app_test_runtime SET statement_timeout = '5s';
          ALTER ROLE app_test_runtime SET lock_timeout = '2s';
          ALTER ROLE app_test_runtime SET idle_in_transaction_session_timeout = '15s';
          ALTER ROLE auth_test_runtime SET row_security = 'on';
          ALTER ROLE auth_test_runtime SET statement_timeout = '5s';
          ALTER ROLE auth_test_runtime SET lock_timeout = '2s';
          ALTER ROLE auth_test_runtime SET idle_in_transaction_session_timeout = '15s';
          ALTER ROLE finance_payment_test_runtime SET row_security = 'on';
          ALTER ROLE finance_payment_test_runtime SET statement_timeout = '15s';
          ALTER ROLE finance_payment_test_runtime SET lock_timeout = '2s';
          ALTER ROLE finance_payment_test_runtime SET idle_in_transaction_session_timeout = '30s';
          ALTER ROLE worker_test_runtime SET row_security = 'on';
          ALTER ROLE worker_test_runtime SET statement_timeout = '15s';
          ALTER ROLE worker_test_runtime SET lock_timeout = '2s';
          ALTER ROLE worker_test_runtime SET idle_in_transaction_session_timeout = '30s';
          ALTER ROLE maintenance_test_runtime SET row_security = 'on';
          ALTER ROLE maintenance_test_runtime SET statement_timeout = '15s';
          ALTER ROLE maintenance_test_runtime SET lock_timeout = '2s';
          ALTER ROLE maintenance_test_runtime SET idle_in_transaction_session_timeout = '30s';
          ALTER ROLE finance_config_deployment SET row_security = 'on';
          ALTER ROLE finance_config_deployment SET statement_timeout = '15s';
          ALTER ROLE finance_config_deployment SET lock_timeout = '2s';
          ALTER ROLE finance_config_deployment SET idle_in_transaction_session_timeout = '30s';
          ALTER ROLE entitlement_test_runtime SET row_security = 'on';
          ALTER ROLE entitlement_test_runtime SET statement_timeout = '15s';
          ALTER ROLE entitlement_test_runtime SET lock_timeout = '2s';
          ALTER ROLE entitlement_test_runtime SET idle_in_transaction_session_timeout = '30s';

          GRANT app_runtime TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT auth_runtime TO auth_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO auth_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT finance_payment_runtime TO finance_payment_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT worker_runtime TO worker_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT lifecycle_maintenance_runtime TO maintenance_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT finance_config_runtime TO finance_config_deployment WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT entitlement_runtime TO entitlement_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;

          CREATE DATABASE gymflow_p2d OWNER migration_owner;
          GRANT CONNECT ON DATABASE gymflow_p2d TO app_test_runtime, auth_test_runtime, finance_payment_test_runtime, worker_test_runtime, maintenance_test_runtime, finance_config_deployment, entitlement_test_runtime;
          SQL

      - name: Verify P2B and P2C cluster contracts before HEAD
        env:
          DOERS_CLUSTER_VERIFY_DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
        run: |
          python -s scripts/verify_cluster_role_bootstrap.py
          python -s scripts/verify_cluster_identity_graph.py

      - name: Provision infrastructure-owned extensions
        run: |
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_p2d <<'SQL'
          CREATE SCHEMA IF NOT EXISTS partman AUTHORIZATION postgres;
          CREATE EXTENSION IF NOT EXISTS pg_partman SCHEMA partman;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE EXTENSION IF NOT EXISTS citext;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS postgis;
          GRANT USAGE ON SCHEMA partman TO migration_owner;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA partman TO migration_owner;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA partman TO migration_owner;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA partman TO migration_owner;
          GRANT EXECUTE ON ALL PROCEDURES IN SCHEMA partman TO migration_owner;
          SQL

      - name: Fresh Alembic lineage to HEAD
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
        run: python -s -m alembic -c alembic.ini upgrade head

      - name: PAY-24-G pristine migration downgrade and re-upgrade
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
        run: |
          python -s -m alembic -c alembic.ini downgrade zzd7d8e9f0a73
          python -s -m alembic -c alembic.ini upgrade head
          psql "postgresql://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_p2d" \
            -X -v ON_ERROR_STOP=1 -Atc "SELECT version_num FROM alembic_version" \
            | grep -Fx 'zze7d8e9f0a74'
          echo 'PAY24G_MIGRATION_ROUNDTRIP=PASS'

      - name: Verify exact live runtime principal bindings
        env:
          DATABASE_URL: ${{ env.API_DATABASE_URL }}
          ENVIRONMENT: production
        run: python -s scripts/verify_runtime_principal_bindings.py

      - name: PAY-24-C real PG16 entitlement state machine
        env:
          PAY4_APP_DATABASE_URL: postgresql://app_test_runtime:ci-app-runtime@127.0.0.1:5432/gymflow_p2d
          PAY4_WORKER_DATABASE_URL: postgresql://worker_test_runtime:ci-worker-runtime@127.0.0.1:5432/gymflow_p2d
          PAY4_MIGRATION_DATABASE_URL: postgresql://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_p2d
          PAY4_ADMIN_DATABASE_URL: postgresql://postgres:ci-p2d-postgres@127.0.0.1:5432/gymflow_p2d
          PAY24C_WORKER_DATABASE_URL: postgresql://worker_test_runtime:ci-worker-runtime@127.0.0.1:5432/gymflow_p2d
          PAY24C_ENTITLEMENT_DATABASE_URL: postgresql://entitlement_test_runtime:ci-entitlement-runtime@127.0.0.1:5432/gymflow_p2d
          PAY24C_ADMIN_DATABASE_URL: postgresql://postgres:ci-p2d-postgres@127.0.0.1:5432/gymflow_p2d
        run: |
          python -m pytest --noconftest -q --maxfail=1             tests/test_pay24c_entitlement_boundary_runtime.py
          echo 'PAY24C_RUNTIME_PG16=PASS'

      - name: PAY-24-F live-order database boundary on real PG16
        env:
          PAY24F_APP_DATABASE_URL: postgresql://app_test_runtime:ci-app-runtime@127.0.0.1:5432/gymflow_p2d
          PAY24F_PAYMENT_DATABASE_URL: postgresql://finance_payment_test_runtime:ci-finance-payment-runtime@127.0.0.1:5432/gymflow_p2d
          PAY24F_ADMIN_DATABASE_URL: postgresql://postgres:ci-p2d-postgres@127.0.0.1:5432/gymflow_p2d
        run: |
          python -m pytest --noconftest -q --maxfail=1 tests/test_pay24f_live_order_pg16.py
          echo 'PAY24F_LIVE_ORDER_PG16=PASS'
          echo 'PAY24F_LIVE_PROVIDER_NETWORK=0'
          echo 'PAY24F_REAL_MONEY_MOVEMENT=0'

      - name: Provision temporary PAY-24-G reconciliation login
        run: |
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          CREATE ROLE finance_reconciliation_test_runtime LOGIN PASSWORD 'ci-finance-reconciliation-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          ALTER ROLE finance_reconciliation_test_runtime SET row_security = 'on';
          ALTER ROLE finance_reconciliation_test_runtime SET statement_timeout = '15s';
          ALTER ROLE finance_reconciliation_test_runtime SET lock_timeout = '2s';
          ALTER ROLE finance_reconciliation_test_runtime SET idle_in_transaction_session_timeout = '30s';
          GRANT finance_reconciliation_runtime TO finance_reconciliation_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT CONNECT ON DATABASE gymflow_p2d TO finance_reconciliation_test_runtime;
          SQL

      - name: PAY-24-G live captured-payment authority on real PG16
        env:
          PAY24G_APP_DATABASE_URL: postgresql://app_test_runtime:ci-app-runtime@127.0.0.1:5432/gymflow_p2d
          PAY24G_RECONCILIATION_DATABASE_URL: postgresql://finance_reconciliation_test_runtime:ci-finance-reconciliation-runtime@127.0.0.1:5432/gymflow_p2d
          PAY24G_CONFIG_DATABASE_URL: postgresql://finance_config_deployment:ci-finance-config-runtime@127.0.0.1:5432/gymflow_p2d
          PAY24G_ADMIN_DATABASE_URL: postgresql://postgres:ci-p2d-postgres@127.0.0.1:5432/gymflow_p2d
        run: |
          python -m pytest --noconftest -q --maxfail=1 tests/test_pay24g_live_payment_pg16.py
          echo 'PAY24G_LIVE_PAYMENT_PG16=PASS'
          echo 'PAY24G_LIVE_PROVIDER_NETWORK=0'
          echo 'PAY24G_REAL_MONEY_MOVEMENT=0'

      - name: Remove temporary PAY-24-G reconciliation login
        if: always()
        run: |
          if command -v psql >/dev/null 2>&1 && command -v pg_isready >/dev/null 2>&1 && pg_isready -q; then
            sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
            DO $cleanup$
            BEGIN
              IF EXISTS (
                SELECT 1 FROM pg_catalog.pg_roles
                WHERE rolname='finance_reconciliation_test_runtime'
              ) THEN
                REVOKE CONNECT ON DATABASE gymflow_p2d
                  FROM finance_reconciliation_test_runtime;
                REVOKE finance_reconciliation_runtime
                  FROM finance_reconciliation_test_runtime;
                DROP ROLE finance_reconciliation_test_runtime;
              END IF;
            END
            $cleanup$;
            SQL
          else
            echo 'PAY24G_RECONCILIATION_LOGIN_CLEANUP=NOT_NEEDED'
          fi

      - name: Prove runtime principal drift rejects fail closed
        env:
          DATABASE_URL: ${{ env.API_DATABASE_URL }}
          ENVIRONMENT: production
        run: bash scripts/ci/certify_runtime_principal_negative_paths.sh

      - name: Reverify P2B and P2C after P2D adversarial restoration
        env:
          DOERS_CLUSTER_VERIFY_DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
          ENVIRONMENT: test
        run: |
          python -s scripts/verify_cluster_role_bootstrap.py
          python -s scripts/verify_cluster_identity_graph.py
