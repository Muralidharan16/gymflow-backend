name: One-shot remove duplicate 00f projection

on:
  push:
    branches:
      - hardening/complete-migration-lineage
    paths:
      - .github/workflows/one-shot-remove-00f-duplicate.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/complete-migration-lineage
          fetch-depth: 0

      - name: Remove only the redundant geolocation projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('alembic/versions/00f277c748ea_add_hyperscale_branch_name_and_address_.py')
          text = path.read_text(encoding='utf-8')

          insert_token = 'INSERT INTO public.branch_geolocation_state ('
          if text.count(insert_token) != 2:
              raise SystemExit(
                  f'expected exactly two pre-patch geolocation projections, found {text.count(insert_token)}'
              )

          start_marker = (
              '    # 0009-owned geocoding columns remain authoritative compatibility storage.\n'
              '    # The new state table is a lossless projection until a later contract phase.\n'
          )
          end_marker = '    with op.get_context().autocommit_block():\n'

          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('redundant 00f projection start marker not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('00f autocommit boundary after redundant projection not found')

          replacement = (
              '    # Legacy geolocation state is projected exactly once by\n'
              '    # _backfill_legacy_addresses(), which also proves one state row per address.\n\n'
          )
          updated = text[:start] + replacement + text[end:]

          if updated.count(insert_token) != 1:
              raise SystemExit(
                  f'expected exactly one post-patch geolocation projection, found {updated.count(insert_token)}'
              )
          if '00f geolocation projection did not create one state row per address' in updated:
              raise SystemExit('redundant projection postcondition still present')
          if '00f geolocation backfill did not create one state row per address' not in updated:
              raise SystemExit('authoritative backfill postcondition was accidentally removed')

          path.write_text(updated, encoding='utf-8')
          PY

          python -m py_compile alembic/versions/00f277c748ea_add_hyperscale_branch_name_and_address_.py
          git diff --check
          git diff -- alembic/versions/00f277c748ea_add_hyperscale_branch_name_and_address_.py

      - name: Commit source patch and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-remove-00f-duplicate.yml
          git add alembic/versions/00f277c748ea_add_hyperscale_branch_name_and_address_.py
          git diff --cached --check
          git commit -m 'fix: remove duplicate 00f geolocation projection'
          git push origin HEAD:hardening/complete-migration-lineage
