name: P3A c27 Schema Owner Repair

on:
  push:
    branches:
      - hardening/p3a-organization-profile-authorization
    paths:
      - .github/workflows/p3a-c27-schema-owner-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Move schema ACL mutation under app_security_owner
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          migration = Path('alembic/versions/c27d8e9f0a1c_organization_onboarding_authorization.py')
          text = migration.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          marker = '''def _direct_schema_usage(bind, role_name: str) -> bool:\n'''
          helper = '''def _schema_owner(bind) -> str:\n    return str(\n        _scalar(\n            bind,\n            """\n            SELECT pg_catalog.pg_get_userbyid(namespace_data.nspowner)::text\n            FROM pg_catalog.pg_namespace AS namespace_data\n            WHERE namespace_data.nspname = 'app_secure'\n            """,\n        )\n    )\n\n\n'''
          replace_once(marker, helper + marker)

          predecessor_marker = '''    if _direct_schema_usage(bind, _AUTH):\n        raise RuntimeError("auth_runtime unexpectedly has app_secure USAGE before c27")\n'''
          predecessor_new = '''    if _schema_owner(bind) != _SECURITY_OWNER:\n        raise RuntimeError("app_secure schema owner drift before c27")\n    if _direct_schema_usage(bind, _AUTH):\n        raise RuntimeError("auth_runtime unexpectedly has app_secure USAGE before c27")\n'''
          replace_once(predecessor_marker, predecessor_new)

          forward_marker = '''    if not _direct_schema_usage(bind, _AUTH):\n        raise RuntimeError("auth_runtime lacks app_secure USAGE")\n'''
          forward_new = '''    if _schema_owner(bind) != _SECURITY_OWNER:\n        raise RuntimeError("app_secure schema owner drift after c27")\n    if not _direct_schema_usage(bind, _AUTH):\n        raise RuntimeError("auth_runtime lacks app_secure USAGE")\n'''
          replace_once(forward_marker, forward_new)

          replace_once(
              '''    op.execute("GRANT USAGE ON SCHEMA app_secure TO auth_runtime")\n\n    _set_security_owner(bind)\n    try:\n        op.execute(_CREATE_FUNCTION)\n''',
              '''    _set_security_owner(bind)\n    try:\n        op.execute("GRANT USAGE ON SCHEMA app_secure TO auth_runtime")\n        op.execute(_CREATE_FUNCTION)\n'''
          )

          replace_once(
              '''    _set_security_owner(bind)\n    try:\n        op.execute(\n            "DROP FUNCTION "\n            "app_secure.complete_current_organization_onboarding_profile(jsonb) RESTRICT"\n        )\n    finally:\n        _reset_role(bind)\n\n    op.execute("REVOKE USAGE ON SCHEMA app_secure FROM auth_runtime")\n''',
              '''    _set_security_owner(bind)\n    try:\n        op.execute(\n            "DROP FUNCTION "\n            "app_secure.complete_current_organization_onboarding_profile(jsonb) RESTRICT"\n        )\n        op.execute("REVOKE USAGE ON SCHEMA app_secure FROM auth_runtime")\n    finally:\n        _reset_role(bind)\n\n'''
          )

          migration.write_text(text)

          test = Path('tests/test_organization_onboarding_authorization_boundary.py')
          t = test.read_text()
          anchor = '''def test_onboarding_reuses_exact_predecessor_owner_acl_without_accumulation() -> None:\n'''
          new_test = '''def test_app_secure_schema_acl_is_mutated_only_by_its_exact_owner() -> None:\n    source = _source(MIGRATION)\n    upgrade = _function_source(MIGRATION, "upgrade")\n    downgrade = _function_source(MIGRATION, "downgrade")\n    predecessor = _function_source(MIGRATION, "_require_predecessor")\n    forward = _function_source(MIGRATION, "_require_forward")\n\n    assert "_schema_owner" in source\n    assert "app_secure schema owner drift before c27" in predecessor\n    assert "app_secure schema owner drift after c27" in forward\n    assert upgrade.index("_set_security_owner(bind)") < upgrade.index(\n        "GRANT USAGE ON SCHEMA app_secure TO auth_runtime"\n    ) < upgrade.index("_reset_role(bind)")\n    assert downgrade.index("_set_security_owner(bind)") < downgrade.index(\n        "REVOKE USAGE ON SCHEMA app_secure FROM auth_runtime"\n    ) < downgrade.index("_reset_role(bind)")\n\n\n'''
          if t.count(anchor) != 1:
              raise SystemExit('expected one static-test insertion point')
          t = t.replace(anchor, new_test + anchor, 1)
          test.write_text(t)
          PY

          python -m py_compile alembic/versions/c27d8e9f0a1c_organization_onboarding_authorization.py tests/test_organization_onboarding_authorization_boundary.py
          git diff --check
          git diff -- alembic/versions/c27d8e9f0a1c_organization_onboarding_authorization.py tests/test_organization_onboarding_authorization_boundary.py

          git rm .github/workflows/p3a-c27-schema-owner-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alembic/versions/c27d8e9f0a1c_organization_onboarding_authorization.py tests/test_organization_onboarding_authorization_boundary.py
          git commit -m 'fix: mutate c27 schema ACL as security owner'
          git push origin HEAD:hardening/p3a-organization-profile-authorization
