name: P5-D Dependency and Database Loss PostgreSQL 16

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - hardening/p5-concurrency-crash-fault-tolerance
      - hardening/p5d-dependency-loss-temp
  workflow_call:
    inputs:
      certification_head:
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5d-dependency-loss-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-loss:
    name: Real Redis provider-network and PostgreSQL disconnect recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIGRATION_PASSWORD: ci-p5d-migration-owner
      AUTH_RUNTIME_PASSWORD: ci-p5d-auth-runtime
      APP_RUNTIME_PASSWORD: ci-p5d-app-runtime
      WORKER_RUNTIME_PASSWORD: ci-p5d-worker-runtime
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-p5d-migration-owner@127.0.0.1:5432/gymflow_p5d_test
      TEST_DATABASE_URL: postgresql+psycopg://app_test_runtime:ci-p5d-app-runtime@127.0.0.1:5432/gymflow_p5d_test
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://migration_owner:ci-p5d-migration-owner@127.0.0.1:5432/gymflow_p5d_test
      WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:ci-p5d-worker-runtime@127.0.0.1:5432/gymflow_p5d_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-p5d-not-production
      AWS_ACCESS_KEY_ID: ci-p5d-not-production
      AWS_SECRET_ACCESS_KEY: ci-p5d-not-production
      S3_BUCKET_NAME: gymflow-p5d-test
      ENVIRONMENT: test
      P5D_PROCESS_FAULTS: '1'
      P5D_DISPOSABLE_DATABASE: gymflow_p5d_test
      P5D_DISPOSABLE_BROKER: redis-db-1
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment and prove P5-D static contracts
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt
          python -m py_compile \
            scripts/ci/p5d_fault_worker.py \
            scripts/ci/p5d_fake_opensearch.py \
            scripts/ci/p5d_celery_fault_hooks.py \
            tests/test_p5d_dependency_loss_runtime.py \
            tests/test_p5d_dependency_loss_static_contracts.py \
            alembic/versions/zj07d8e9f0a44_p5d_app_outbox_enqueue_columns.py
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p5_governance_contracts.py \
            tests/test_p5w_worker_fencing_static_contracts.py \
            tests/test_p5w2_worker_crash_static_contracts.py \
            tests/test_p5e_provider_ack_ambiguity_static_contracts.py \
            tests/test_p5d_dependency_loss_static_contracts.py

      - name: Install PostgreSQL 16 and reduced runtime identities
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-p5d-migration-owner';
          CREATE ROLE auth_p5d_runtime LOGIN PASSWORD 'ci-p5d-auth-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_test_runtime LOGIN PASSWORD 'ci-p5d-app-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE worker_test_runtime LOGIN PASSWORD 'ci-p5d-worker-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT auth_runtime TO auth_p5d_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO auth_p5d_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_runtime TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT worker_runtime TO worker_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          ALTER ROLE auth_p5d_runtime SET row_security='on';
          ALTER ROLE auth_p5d_runtime SET statement_timeout='5s';
          ALTER ROLE auth_p5d_runtime SET lock_timeout='2s';
          ALTER ROLE auth_p5d_runtime SET idle_in_transaction_session_timeout='15s';
          ALTER ROLE app_test_runtime SET row_security='on';
          ALTER ROLE app_test_runtime SET statement_timeout='10s';
          ALTER ROLE app_test_runtime SET lock_timeout='3s';
          ALTER ROLE app_test_runtime SET idle_in_transaction_session_timeout='30s';
          ALTER ROLE worker_test_runtime SET row_security='on';
          ALTER ROLE worker_test_runtime SET statement_timeout='15s';
          ALTER ROLE worker_test_runtime SET lock_timeout='2s';
          ALTER ROLE worker_test_runtime SET idle_in_transaction_session_timeout='30s';
          CREATE DATABASE gymflow_p5d_test OWNER migration_owner;
          REVOKE ALL ON DATABASE gymflow_p5d_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE gymflow_p5d_test
            TO migration_owner,auth_p5d_runtime,app_test_runtime,worker_test_runtime;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p5d_test

      - name: Prove exact PostgreSQL 16 migration head
        env:
          CERTIFICATION_HEAD: ${{ inputs.certification_head }}
        run: |
          set -euo pipefail
          expected_head="${CERTIFICATION_HEAD:-zj07d8e9f0a44}"
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "${expected_head}"
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads
          PGPASSWORD="${WORKER_RUNTIME_PASSWORD}" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U worker_test_runtime -d gymflow_p5d_test \
            -c 'SELECT current_user,pg_catalog.current_setting('\''row_security'\'');'
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_p5d_test <<'SQL'
          DO $$
          DECLARE
            column_name text;
            required_columns text[] := ARRAY[
              'outbox_id','tenant_id','branch_id','event_type','payload','created_at',
              'process_after','status','attempt_count','max_attempts','correlation_id','lease_fence'
            ];
          BEGIN
            IF pg_catalog.has_table_privilege(
              'app_runtime','public.branch_outbox_events','INSERT'
            ) THEN
              RAISE EXCEPTION 'P5D app_runtime must not regain table-wide outbox INSERT';
            END IF;
            IF pg_catalog.has_table_privilege(
              'app_test_runtime','public.branch_outbox_events','INSERT'
            ) THEN
              RAISE EXCEPTION 'P5D app_test_runtime must not gain table-wide outbox INSERT';
            END IF;
            FOREACH column_name IN ARRAY required_columns LOOP
              IF NOT pg_catalog.has_column_privilege(
                'app_runtime','public.branch_outbox_events',column_name,'INSERT'
              ) THEN
                RAISE EXCEPTION 'P5D app_runtime missing outbox INSERT column %', column_name;
              END IF;
              IF NOT pg_catalog.has_column_privilege(
                'app_test_runtime','public.branch_outbox_events',column_name,'INSERT'
              ) THEN
                RAISE EXCEPTION 'P5D app_test_runtime missing inherited outbox INSERT column %', column_name;
              END IF;
              IF pg_catalog.has_column_privilege(
                'worker_runtime','public.branch_outbox_events',column_name,'INSERT'
              ) THEN
                RAISE EXCEPTION 'P5D worker_runtime leaked outbox INSERT column %', column_name;
              END IF;
            END LOOP;
          END
          $$;
          SELECT rolname,rolinherit
          FROM pg_catalog.pg_roles
          WHERE rolname IN ('app_runtime','app_test_runtime')
          ORDER BY rolname;
          SELECT
            pg_catalog.pg_get_userbyid(roleid) AS role_name,
            pg_catalog.pg_get_userbyid(member) AS member_name,
            admin_option,inherit_option,set_option
          FROM pg_catalog.pg_auth_members
          WHERE pg_catalog.pg_get_userbyid(roleid)='app_runtime'
            AND pg_catalog.pg_get_userbyid(member)='app_test_runtime';
          SQL

      - name: Prove real Redis provider-network and database disconnect recovery
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q -s --maxfail=1 \
            tests/test_p5d_dependency_loss_runtime.py

      - name: Reprove inherited P5-E and worker boundaries
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p5w_worker_fencing_runtime.py \
            tests/test_branch_hours_durable_worker_boundary.py \
            tests/test_branch_lifecycle_durable_worker_boundary.py \
            tests/test_branch_lifecycle_transaction_boundary.py \
            tests/test_celery_single_app_boundary.py \
            tests/test_p4a_external_effect_contracts.py \
            tests/test_p4d_refund_authority_static_contracts.py
          python -s scripts/verify_head_workflow_bootstrap.py

      - name: Emit same-head P5-D markers
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          echo "P5D_REDIS_LOSS=PASS"
          echo "P5D_PROVIDER_NETWORK_LOSS=PASS"
          echo "P5D_DB_CLAIM_DISCONNECT=PASS"
          echo "P5D_DB_MUTATION_DISCONNECT=PASS"
          echo "P5D_DB_ACK_DISCONNECT=PASS"
          echo "P5D_PROVIDER_REFUND_EXECUTION=DEFERRED_FAIL_CLOSED"
