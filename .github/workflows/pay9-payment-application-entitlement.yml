name: PAY-9 Payment Application Entitlement

on:
  push:
    branches:
      - hardening/pay9-payment-application-entitlement
  pull_request:
    branches:
      - hardening/pay8-durable-checkout-webhooks
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay9-payment-application-entitlement-${{ github.ref }}
  cancel-in-progress: true

env:
  PAY9_BASE_SHA: ad0292e48bccc8b5e99c1082d6b0f7933f42789c
  PAY9_BASE_TREE: 1508c5ac9936e4d462160e2e8bd246afb97b77ec
  PAY9_PREDECESSOR: zr07d8e9f0a52
  PAY9_HEAD: zs07d8e9f0a53
  PAY9_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: PAY-9 static settlement entitlement contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/pay9_static
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: pay9-static-not-production
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      S3_BUCKET_NAME: pay9-static
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY9_CANDIDATE_SHA }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
      - name: Exact PAY-9 scope and graph
        run: |
          set -euo pipefail
          test "$(git rev-parse "${PAY9_BASE_SHA}^{tree}")" = "${PAY9_BASE_TREE}"
          git merge-base --is-ancestor "${PAY9_BASE_SHA}" HEAD
          git diff --name-only "${PAY9_BASE_SHA}...HEAD" > /tmp/pay9-changed.txt
          python - <<'PY_SCOPE'
          from pathlib import Path
          allowed={
              ".github/workflows/pay9-payment-application-entitlement.yml",
              "alembic/versions/zs07d8e9f0a53_pay9_payment_application_entitlement.py",
              "app/finance_core/models/__init__.py",
              "app/finance_core/models/foundation.py",
              "app/finance_core/services/payment_settlement.py",
              "app/finance_core/services/razorpay_webhooks.py",
              "docs/architecture/PAY9_ACCEPTANCE_MATRIX.md",
              "docs/architecture/PAY9_PAYMENT_APPLICATION_SETTLEMENT_ENTITLEMENT.md",
              "docs/architecture/pay9_payment_application_entitlement_v1.json",
              "tests/test_pay9_payment_application_entitlement_runtime.py",
              "tests/test_pay9_payment_application_entitlement_static.py",
          }
          changed={x.strip() for x in Path("/tmp/pay9-changed.txt").read_text().splitlines() if x.strip()}
          if changed != allowed:
              raise SystemExit(
                  f"PAY-9 exact scope mismatch: missing={sorted(allowed-changed)}, "
                  f"unexpected={sorted(changed-allowed)}"
              )
          migrations=sorted(x for x in changed if x.startswith("alembic/versions/"))
          expected=["alembic/versions/zs07d8e9f0a53_pay9_payment_application_entitlement.py"]
          if migrations != expected:
              raise SystemExit(f"PAY-9 migration scope mismatch: {migrations}")
          print(f"PAY-9 exact allowlist paths: {len(changed)}")
          PY_SCOPE
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "${PAY9_HEAD}"
      - name: PAY-9 focused static contracts
        run: |
          set -euo pipefail
          python -m py_compile             alembic/versions/zs07d8e9f0a53_pay9_payment_application_entitlement.py             app/finance_core/models/foundation.py             app/finance_core/models/__init__.py             app/finance_core/services/payment_settlement.py             app/finance_core/services/razorpay_webhooks.py             tests/test_pay9_payment_application_entitlement_runtime.py             tests/test_pay9_payment_application_entitlement_static.py
          python -m json.tool             docs/architecture/pay9_payment_application_entitlement_v1.json             >/dev/null
          python -m pytest --noconftest -q --maxfail=1             tests/test_pay9_payment_application_entitlement_static.py             tests/test_cluster_role_contract_manifests.py             tests/test_migration_managed_role_boundary.py             tests/test_migration_app_secure_owner_context_boundary.py             tests/test_alembic_model_import_boundary.py
          echo 'PAY9_VERIFIED_CAPTURE_GATE=PASS'
          echo 'PAY9_CANONICAL_ALLOCATION=PASS'
          echo 'PAY9_DIRECT_DML_DENIAL=PASS'

  protocol_pg16:
    name: PAY-9 real PG16 settlement entitlement and migration proof
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay9-migration@127.0.0.1:5432/gymflow_pay9_test
      PAY9_APP_DATABASE_URL: postgresql://pay9_app_test:ci-pay9-app@127.0.0.1:5432/gymflow_pay9_test
      PAY9_PAYMENT_DATABASE_URL: postgresql://pay9_payment_test:ci-pay9-payment@127.0.0.1:5432/gymflow_pay9_test
      PAY9_WORKER_DATABASE_URL: postgresql://pay9_worker_test:ci-pay9-worker@127.0.0.1:5432/gymflow_pay9_test
      PAY9_ADMIN_DATABASE_URL: postgresql://postgres:ci-pay9-postgres@127.0.0.1:5432/gymflow_pay9_test
      PAY9_MIGRATION_DATABASE_URL: postgresql://migration_owner:ci-pay9-migration@127.0.0.1:5432/gymflow_pay9_test
      PAY4_APP_DATABASE_URL: postgresql://pay9_app_test:ci-pay9-app@127.0.0.1:5432/gymflow_pay9_test
      PAY4_WORKER_DATABASE_URL: postgresql://pay9_worker_test:ci-pay9-worker@127.0.0.1:5432/gymflow_pay9_test
      PAY4_ADMIN_DATABASE_URL: postgresql://postgres:ci-pay9-postgres@127.0.0.1:5432/gymflow_pay9_test
      PAY4_MIGRATION_DATABASE_URL: postgresql://migration_owner:ci-pay9-migration@127.0.0.1:5432/gymflow_pay9_test
      SECRET_KEY: pay9-pg16-not-production
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      S3_BUCKET_NAME: pay9-pg16
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY9_CANDIDATE_SHA }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
      - name: Install PG16 and canonical roles
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE postgres PASSWORD 'ci-pay9-postgres';
          ALTER ROLE migration_owner PASSWORD 'ci-pay9-migration';
          CREATE ROLE pay9_app_test LOGIN PASSWORD 'ci-pay9-app'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE pay9_payment_test LOGIN PASSWORD 'ci-pay9-payment'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE pay9_worker_test LOGIN PASSWORD 'ci-pay9-worker'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT app_runtime TO pay9_app_test WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT finance_payment_runtime TO pay9_payment_test WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT worker_runtime TO pay9_worker_test WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          CREATE DATABASE gymflow_pay9_test OWNER migration_owner;
          GRANT CONNECT ON DATABASE gymflow_pay9_test TO pay9_app_test;
          GRANT CONNECT ON DATABASE gymflow_pay9_test TO pay9_payment_test;
          GRANT CONNECT ON DATABASE gymflow_pay9_test TO pay9_worker_test;
          SQL
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_pay9_test
      - name: Upgrade certified PAY-8 predecessor and fingerprint
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade "${PAY9_PREDECESSOR}"
          PGPASSWORD=ci-pay9-migration psql -X -v ON_ERROR_STOP=1             -h 127.0.0.1 -U migration_owner -d gymflow_pay9_test -At <<'SQL' > /tmp/pay9-rel-before.txt
          SELECT n.nspname||'.'||c.relname||'|'||c.relfilenode
          FROM pg_catalog.pg_class c
          JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname IN ('public','finance')
            AND c.relkind IN ('r','p')
          ORDER BY 1;
          SQL
          PGPASSWORD=ci-pay9-migration psql -X -v ON_ERROR_STOP=1             -h 127.0.0.1 -U migration_owner -d gymflow_pay9_test -At <<'SQL' > /tmp/pay9-acl-before.txt
          SELECT table_schema||'.'||table_name||'|'||grantee||'|'||privilege_type
          FROM information_schema.role_table_grants
          WHERE table_schema IN ('public','finance')
            AND grantee IN (
              'app_security_owner','app_runtime','worker_runtime',
              'finance_payment_runtime','finance_reconciliation_runtime'
            )
          UNION ALL
          SELECT table_schema||'.'||table_name||'.'||column_name||'|'||grantee||'|'||privilege_type
          FROM information_schema.column_privileges
          WHERE table_schema IN ('public','finance')
            AND grantee IN (
              'app_security_owner','app_runtime','worker_runtime',
              'finance_payment_runtime','finance_reconciliation_runtime'
            )
          ORDER BY 1;
          SQL
      - name: Upgrade PAY-9 and prove no predecessor table rewrite
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade "${PAY9_HEAD}"
          PGPASSWORD=ci-pay9-migration psql -X -v ON_ERROR_STOP=1             -h 127.0.0.1 -U migration_owner -d gymflow_pay9_test -At <<'SQL' > /tmp/pay9-rel-after.txt
          SELECT n.nspname||'.'||c.relname||'|'||c.relfilenode
          FROM pg_catalog.pg_class c
          JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname IN ('public','finance')
            AND c.relkind IN ('r','p')
            AND NOT (
              n.nspname='finance'
              AND c.relname='payment_application_records'
            )
          ORDER BY 1;
          SQL
          diff -u /tmp/pay9-rel-before.txt /tmp/pay9-rel-after.txt
      - name: Real PAY-9 payment application and entitlement proof
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1             tests/test_pay9_payment_application_entitlement_runtime.py
          echo 'PAY9_VERIFIED_CAPTURE_GATE=PASS'
          echo 'PAY9_CANONICAL_ALLOCATION=PASS'
          echo 'PAY9_PARTIAL_PAYMENT=PASS'
          echo 'PAY9_SPLIT_TENDER=PASS'
          echo 'PAY9_OVERPAYMENT_CREDIT=PASS'
          echo 'PAY9_UNAPPLIED_PAYMENT=PASS'
          echo 'PAY9_DUPLICATE_EFFECT_FENCING=PASS'
          echo 'PAY9_ENTITLEMENT_GATE=PASS'
          echo 'PAY9_DIRECT_DML_DENIAL=PASS'
      - name: Populated downgrade fails closed
        run: |
          set -euo pipefail
          python - <<'PY'
          from tests.test_pay9_payment_application_entitlement_runtime import (
              _seed,_apply,_admin_scalar
          )
          _seed()
          _apply()
          assert _admin_scalar(
              "SELECT count(*) FROM finance.payment_application_records"
          ) == 1
          PY
          if OUTPUT="$(python -s -m alembic -c alembic.ini downgrade "${PAY9_PREDECESSOR}" 2>&1)"; then
            printf '%s\n' "$OUTPUT"
            echo 'PAY-9 populated downgrade unexpectedly succeeded' >&2
            exit 1
          else
            RC=$?
            printf '%s\n' "$OUTPUT"
            test "$RC" -ne 0
          fi
          python - <<'PY'
          from tests.test_pay9_payment_application_entitlement_runtime import _admin_scalar
          state=(
              _admin_scalar("SELECT version_num FROM public.alembic_version"),
              _admin_scalar("SELECT count(*) FROM finance.payment_application_records"),
              _admin_scalar(
                  "SELECT pg_catalog.to_regclass("
                  "'finance.payment_application_records') IS NOT NULL"
              ),
          )
          print(f"PAY9_POST_FAILED_DOWNGRADE_STATE={state!r}")
          assert state == ("zs07d8e9f0a53",1,True)
          PY
          echo 'PAY9_POPULATED_DOWNGRADE_FAIL_CLOSED=PASS'
          python - <<'PY'
          from tests.test_pay9_payment_application_entitlement_runtime import _cleanup
          _cleanup()
          PY
      - name: Empty downgrade restores PAY-8 then re-upgrade
        run: |
          set -euo pipefail
          PGPASSWORD=ci-pay9-migration psql -X -v ON_ERROR_STOP=1             -h 127.0.0.1 -U migration_owner -d gymflow_pay9_test -At <<'SQL' > /tmp/pay9-rel-pre-downgrade.txt
          SELECT n.nspname||'.'||c.relname||'|'||c.relfilenode
          FROM pg_catalog.pg_class c
          JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname IN ('public','finance')
            AND c.relkind IN ('r','p')
            AND NOT (
              n.nspname='finance'
              AND c.relname='payment_application_records'
            )
          ORDER BY 1;
          SQL
          python -s -m alembic -c alembic.ini downgrade "${PAY9_PREDECESSOR}"
          PGPASSWORD=ci-pay9-migration psql -X -v ON_ERROR_STOP=1             -h 127.0.0.1 -U migration_owner -d gymflow_pay9_test -At <<'SQL' > /tmp/pay9-rel-restored.txt
          SELECT n.nspname||'.'||c.relname||'|'||c.relfilenode
          FROM pg_catalog.pg_class c
          JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname IN ('public','finance')
            AND c.relkind IN ('r','p')
          ORDER BY 1;
          SQL
          PGPASSWORD=ci-pay9-migration psql -X -v ON_ERROR_STOP=1             -h 127.0.0.1 -U migration_owner -d gymflow_pay9_test -At <<'SQL' > /tmp/pay9-acl-restored.txt
          SELECT table_schema||'.'||table_name||'|'||grantee||'|'||privilege_type
          FROM information_schema.role_table_grants
          WHERE table_schema IN ('public','finance')
            AND grantee IN (
              'app_security_owner','app_runtime','worker_runtime',
              'finance_payment_runtime','finance_reconciliation_runtime'
            )
          UNION ALL
          SELECT table_schema||'.'||table_name||'.'||column_name||'|'||grantee||'|'||privilege_type
          FROM information_schema.column_privileges
          WHERE table_schema IN ('public','finance')
            AND grantee IN (
              'app_security_owner','app_runtime','worker_runtime',
              'finance_payment_runtime','finance_reconciliation_runtime'
            )
          ORDER BY 1;
          SQL
          diff -u /tmp/pay9-rel-pre-downgrade.txt /tmp/pay9-rel-restored.txt
          diff -u /tmp/pay9-acl-before.txt /tmp/pay9-acl-restored.txt
          python -s -m alembic -c alembic.ini upgrade "${PAY9_HEAD}"
          echo 'PAY9_MIGRATION_LIFECYCLE=PASS'

  architecture:
    uses: ./.github/workflows/architecture-hardening-contracts.yml
  general_platform:
    uses: ./.github/workflows/hardening-ci.yml
  finance:
    uses: ./.github/workflows/finance-hardening-ci.yml
  migration_lifecycle:
    uses: ./.github/workflows/migration-lifecycle-ci.yml
  migration_preservation:
    uses: ./.github/workflows/migration-data-preservation-ci.yml
  migration_adversarial:
    uses: ./.github/workflows/migration-adversarial-safety-ci.yml
  migration_contracts:
    uses: ./.github/workflows/migration-lifecycle-contracts.yml
  migration_semantics:
    uses: ./.github/workflows/migration-semantics-inventory.yml

  certify:
    name: Terminal immutable PAY-9 decision
    if: ${{ always() }}
    needs:
      - contract
      - protocol_pg16
      - architecture
      - general_platform
      - finance
      - migration_lifecycle
      - migration_preservation
      - migration_adversarial
      - migration_contracts
      - migration_semantics
    runs-on: ubuntu-24.04
    steps:
      - name: Require all PAY-9 gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          data=json.loads(os.environ["RESULTS"])
          bad={k:v["result"] for k,v in data.items() if v["result"]!="success"}
          if bad:
              raise SystemExit(f"PAY-9 prerequisite failure: {bad}")
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY9_CANDIDATE_SHA }}
      - name: Bind exact PAY-9 candidate
        run: |
          set -euo pipefail
          mkdir -p pay9-evidence
          test "$(git rev-parse "${PAY9_BASE_SHA}^{tree}")" = "${PAY9_BASE_TREE}"
          git merge-base --is-ancestor "${PAY9_BASE_SHA}" HEAD
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          decision={
            "phase":"PAY-9",
            "candidate_sha":os.environ["PAY9_CANDIDATE_SHA"],
            "candidate_tree":subprocess.check_output(
              ["git","rev-parse","HEAD^{tree}"],text=True
            ).strip(),
            "inherited_pay8_sha":os.environ["PAY9_BASE_SHA"],
            "alembic_head":os.environ["PAY9_HEAD"],
            "live_provider":False,
            "live_money_movement":False,
            "refund_provider_execution":"DEFERRED_FAIL_CLOSED",
            "merge_authorized":False,
            "release_authorized":False,
            "deployment_authorized":False,
            "decision":"PASS",
          }
          Path("pay9-evidence/decision.json").write_text(
              json.dumps(decision,indent=2,sort_keys=True)+"\n"
          )
          PY
          cat pay9-evidence/decision.json
          echo 'PAY9_VERIFIED_CAPTURE_GATE=PASS'
          echo 'PAY9_CANONICAL_ALLOCATION=PASS'
          echo 'PAY9_PARTIAL_PAYMENT=PASS'
          echo 'PAY9_SPLIT_TENDER=PASS'
          echo 'PAY9_OVERPAYMENT_CREDIT=PASS'
          echo 'PAY9_UNAPPLIED_PAYMENT=PASS'
          echo 'PAY9_DUPLICATE_EFFECT_FENCING=PASS'
          echo 'PAY9_ENTITLEMENT_GATE=PASS'
          echo 'PAY9_DIRECT_DML_DENIAL=PASS'
          echo 'PAY9_MIGRATION_LIFECYCLE=PASS'
          echo 'PAY9_PAY8_INHERITED=PASS'
          echo 'PAY9_LIVE_PROVIDER=DISABLED'
          echo 'PAY9_LIVE_MONEY_MOVEMENT=DISABLED'
          echo 'PAY9_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'
          echo 'PAY9_SETTLEMENT_AND_ENTITLEMENT=PASS'
          echo 'PAY9_FINAL=PASS'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pay9-final-${{ github.sha }}
          path: pay9-evidence/
          if-no-files-found: error
          retention-days: 30
