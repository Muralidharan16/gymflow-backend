      - p9_migration
      - p9_lock
      - p9_backup
      - p9_recovery
      - p9_rolling
      - p9_rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P10F_CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - name: Require all 53 inherited P1-P9 same-head gates
        env:
          REQUIRED_RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          mkdir -p p10f-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          results = json.loads(os.environ["REQUIRED_RESULTS_JSON"])
          expected = int(os.environ["P10F_INHERITED_JOB_COUNT"])
          if len(results) != expected:
              raise SystemExit(f"P10-F inherited topology changed: {len(results)} != {expected}")
          failures = {name: details["result"] for name, details in results.items() if details["result"] != "success"}
          if failures:
              raise SystemExit(f"P10-F inherited P1-P9 gates failed: {failures}")
          Path("p10f-evidence/inherited-needs.json").write_text(
              json.dumps(results, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(f"P10-F inherited P1-P9 gates passed: {len(results)}")
          PY

      - name: Checkout exact final P10 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Bind eight canonical P10 slice runs and evidence archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path

          api=os.environ["GITHUB_API_URL"]; repo=os.environ["GITHUB_REPOSITORY"]
          sha=os.environ["GITHUB_SHA"]; token=os.environ["GH_TOKEN"]
          expected={
              ".github/workflows/p10-governance-performance-security.yml":"P10-G",
              ".github/workflows/p10b-performance-budget-freeze.yml":"P10-B",
              ".github/workflows/p10l-representative-load-concurrency.yml":"P10-L",
              ".github/workflows/p10q-queue-backlog-recovery.yml":"P10-Q",
              ".github/workflows/p10d-query-performance.yml":"P10-D",
              ".github/workflows/p10s-long-soak.yml":"P10-S",
              ".github/workflows/p10x-security-scans.yml":"P10-X",
              ".github/workflows/p10h-container-hardening.yml":"P10-H",
          }
          artifact_required={"P10-L","P10-Q","P10-D","P10-S","P10-X","P10-H"}
          headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}","X-GitHub-Api-Version":"2022-11-28"}
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)

          selected=None; last_missing=[]; last_pending=[]
          for _ in range(80):
              runs=get_json(f"{api}/repos/{repo}/actions/runs?head_sha={sha}&event=push&per_page=100").get("workflow_runs",[])
              current={}; missing=[]; pending=[]; failed={}
              for path,label in expected.items():
                  candidates=[r for r in runs if r.get("path")==path and r.get("head_sha")==sha and r.get("event")=="push"]
                  if not candidates:
                      missing.append(label); continue
                  run=max(candidates,key=lambda item:item["id"])
                  current[label]={k:run.get(k) for k in ("id","name","path","event","head_sha","status","conclusion","artifacts_url")}
                  if run["status"]!="completed": pending.append(label)
                  elif run["conclusion"]!="success": failed[label]=run["conclusion"]
              if failed: raise SystemExit(f"P10-F exact-head P10 slice failures: {failed}")
              if not missing and not pending and len(current)==8:
                  selected=current; break
              last_missing,last_pending=missing,pending
              time.sleep(15)
          if selected is None:
              raise SystemExit(f"P10-F P10 slice evidence incomplete; missing={last_missing}, pending={last_pending}")

          artifact_evidence={}
          for label in sorted(artifact_required):
              run=selected[label]
              payload=get_json(run["artifacts_url"]+"?per_page=100")
              artifacts=[a for a in payload.get("artifacts",[]) if not a.get("expired")]
              if not artifacts: raise SystemExit(f"{label} produced no retained evidence artifact")
              rows=[]
              for artifact in artifacts:
                  req=urllib.request.Request(artifact["archive_download_url"],headers=headers)
                  digest=hashlib.sha256(); count=0
                  with urllib.request.urlopen(req,timeout=120) as response:
                      while True:
                          chunk=response.read(1024*1024)
                          if not chunk: break
                          digest.update(chunk); count+=len(chunk)
                  rows.append({
                      "id":artifact["id"],"name":artifact["name"],
                      "size_in_bytes":artifact.get("size_in_bytes"),
                      "archive_bytes_downloaded":count,
                      "archive_sha256":digest.hexdigest(),
                      "github_digest":artifact.get("digest"),
                  })
              artifact_evidence[label]=rows
          root=Path("p10f-evidence"); root.mkdir(exist_ok=True)
          (root/"p10-same-head-runs.json").write_text(json.dumps(selected,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          (root/"p10-artifacts.json").write_text(json.dumps(artifact_evidence,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("P10-F exact-head P10 slice workflows passed: 8")
          PY

      - name: Emit final machine-readable P10 decision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${P10F_CANDIDATE_SHA}"
          test "$(git rev-parse "${P9_MERGE_BASE}^{tree}")" = "${P9_CERTIFIED_TREE}"
          git merge-base --is-ancestor "${P9_MERGE_BASE}" HEAD
          test "$(cat docs/architecture/p10_performance_budgets.v1.sha256)" = "${P10_PERFORMANCE_BUDGET_DIGEST}"
          test "$(git rev-parse HEAD^{tree})" = "$(git write-tree)"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          inherited=json.loads(Path("p10f-evidence/inherited-needs.json").read_text())
          slices=json.loads(Path("p10f-evidence/p10-same-head-runs.json").read_text())
          artifact_evidence=json.loads(Path("p10f-evidence/p10-artifacts.json").read_text())
          decision={
              "schema_version":1,"phase":"P10-F",
              "candidate_sha":os.environ["P10F_CANDIDATE_SHA"],
              "candidate_tree":subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip(),
              "p9_merged_base_sha":os.environ["P9_MERGE_BASE"],
              "p9_merged_base_tree":os.environ["P9_CERTIFIED_TREE"],
              "alembic_head":os.environ["P10_ALEMBIC_HEAD"],
              "budget_digest":os.environ["P10_PERFORMANCE_BUDGET_DIGEST"],
              "inherited_p1_p9_gate_count":len(inherited),
              "p10_slice_gate_count":len(slices),
              "p10_runs":slices,"artifact_evidence":artifact_evidence,
              "refund_provider_execution":"DEFERRED_FAIL_CLOSED",
              "release_authorized":False,"deployment_authorized":False,"decision":"PASS",
          }
          assert decision["inherited_p1_p9_gate_count"]==53
          assert decision["p10_slice_gate_count"]==8
          assert decision["candidate_sha"]==os.environ["GITHUB_SHA"]
          Path("p10f-evidence/decision.json").write_text(json.dumps(decision,indent=2,sort_keys=True)+"\n")
          PY
          cat p10f-evidence/decision.json
          echo 'P10_P1_P9_INHERITED=PASS'
          echo 'P10_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'
          echo 'P10_FINAL_PRODUCTION_CERTIFICATION=PASS'

      - name: Upload terminal P10-F evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p10f-final-${{ github.sha }}
          path: p10f-evidence/
          if-no-files-found: error
          retention-days: 30
