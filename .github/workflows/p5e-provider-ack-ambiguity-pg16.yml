name: P5-E Provider Acknowledgement Ambiguity PostgreSQL 16

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - hardening/p5-concurrency-crash-fault-tolerance
  workflow_call:
    inputs:
      certification_head:
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5e-provider-ack-ambiguity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-ack-ambiguity:
    name: Durable provider success and failed local acknowledgement recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MIGRATION_PASSWORD: ci-p5e-migration-owner
      AUTH_RUNTIME_PASSWORD: ci-p5e-auth-runtime
      WORKER_RUNTIME_PASSWORD: ci-p5e-worker-runtime
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-p5e-migration-owner@127.0.0.1:5432/gymflow_p5e_test
      TEST_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:ci-p5e-worker-runtime@127.0.0.1:5432/gymflow_p5e_test
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://migration_owner:ci-p5e-migration-owner@127.0.0.1:5432/gymflow_p5e_test
      SECRET_KEY: ci-p5e-not-production
      AWS_ACCESS_KEY_ID: ci-p5e-not-production
      AWS_SECRET_ACCESS_KEY: ci-p5e-not-production
      S3_BUCKET_NAME: gymflow-p5e-test
      ENVIRONMENT: test
      P5E_PROCESS_FAULTS: '1'
      P5E_DISPOSABLE_DATABASE: gymflow_p5e_test
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment and prove P5-E static contracts
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt
          python -m py_compile \
            alembic/versions/zi07d8e9f0a43_p5e_provider_capability_fences.py \
            app/services/notification_delivery_service.py \
            app/tasks/branch_outbox_poller.py \
            scripts/ci/p5e_provider_ack_worker.py \
            tests/test_p5e_provider_ack_ambiguity_runtime.py \
            tests/test_p5e_provider_ack_ambiguity_static_contracts.py
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p5_governance_contracts.py \
            tests/test_p5w_worker_fencing_static_contracts.py \
            tests/test_p5w2_worker_crash_static_contracts.py \
            tests/test_p5e_provider_ack_ambiguity_static_contracts.py

      - name: Install PostgreSQL 16 and reduced runtime identities
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-p5e-migration-owner';
          CREATE ROLE auth_p5e_runtime LOGIN PASSWORD 'ci-p5e-auth-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE worker_test_runtime LOGIN PASSWORD 'ci-p5e-worker-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT auth_runtime TO auth_p5e_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO auth_p5e_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT worker_runtime TO worker_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          ALTER ROLE auth_p5e_runtime SET row_security='on';
          ALTER ROLE auth_p5e_runtime SET statement_timeout='5s';
          ALTER ROLE auth_p5e_runtime SET lock_timeout='2s';
          ALTER ROLE auth_p5e_runtime SET idle_in_transaction_session_timeout='15s';
          ALTER ROLE worker_test_runtime SET row_security='on';
          ALTER ROLE worker_test_runtime SET statement_timeout='15s';
          ALTER ROLE worker_test_runtime SET lock_timeout='2s';
          ALTER ROLE worker_test_runtime SET idle_in_transaction_session_timeout='30s';
          CREATE DATABASE gymflow_p5e_test OWNER migration_owner;
          REVOKE ALL ON DATABASE gymflow_p5e_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE gymflow_p5e_test
            TO migration_owner,auth_p5e_runtime,worker_test_runtime;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p5e_test

      - name: Prove exact PostgreSQL 16 migration head
        env:
          CERTIFICATION_HEAD: ${{ inputs.certification_head }}
        run: |
          set -euo pipefail
          expected_head="${CERTIFICATION_HEAD:-zi07d8e9f0a43}"
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "${expected_head}"
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads
          if [[ "${expected_head}" == 'zi07d8e9f0a43' ]]; then
            python -s -m alembic -c alembic.ini downgrade zh07d8e9f0a42
            test "$(python -s -m alembic -c alembic.ini current | awk '{print $1}')" = 'zh07d8e9f0a42'
            python -s -m alembic -c alembic.ini upgrade head
            python -s -m alembic -c alembic.ini current --check-heads
          fi
          PGPASSWORD="${WORKER_RUNTIME_PASSWORD}" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U worker_test_runtime -d gymflow_p5e_test \
            -c 'SELECT current_user,pg_catalog.current_setting('\''row_security'\'');'

      - name: Prove provider success and real acknowledgement transaction failure
        env:
          REDIS_URL: redis://p5e-cache.invalid:6379/0
          CELERY_BROKER_URL: redis://p5e-broker.invalid:6379/1
          CELERY_RESULT_BACKEND: redis://p5e-result.invalid:6379/2
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q -s --maxfail=1 \
            tests/test_p5e_provider_ack_ambiguity_runtime.py

      - name: Reprove inherited search notification and worker boundaries
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p4a_external_effect_contracts.py \
            tests/test_p4b_search_evidence_static_contracts.py \
            tests/test_p4b_search_provider.py \
            tests/test_p4b_search_provider_adversarial.py \
            tests/test_p4b_search_drift_repair.py \
            tests/test_p4c_notification_static_contracts.py \
            tests/test_p4c_notification_provider.py \
            tests/test_p4c_inherited_contracts.py \
            tests/test_branch_lifecycle_durable_worker_boundary.py \
            tests/test_p5w_worker_fencing_runtime.py
          python -s scripts/verify_head_workflow_bootstrap.py

      - name: Emit same-head P5-E markers
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          echo "P5E_SEARCH_INDEX_ACK_FAILURE=PASS"
          echo "P5E_SEARCH_DELETE_ACK_FAILURE=PASS"
          echo "P5E_NOTIFICATION_ACK_FAILURE=PASS"
          echo "P5E_PROVIDER_CAPABILITY_FENCE=PASS"
          echo "P5E_SINGLE_PROVIDER_EFFECT=PASS"
          echo "P5E_PROVIDER_REFUND_EXECUTION=DEFERRED_FAIL_CLOSED"
