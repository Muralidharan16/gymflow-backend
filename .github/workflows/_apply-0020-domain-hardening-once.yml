name: One-shot 0020 domain hardening

on:
  push:
    branches: [hardening/complete-migration-lineage]
    paths:
      - .github/_apply_0020_domain_hardening_once_trigger

permissions:
  contents: write

concurrency:
  group: apply-0020-domain-hardening-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/complete-migration-lineage
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and verify hardened 0020 migration
        run: |
          set -euo pipefail
          test -f .github/_apply_0020_domain_hardening_once_trigger
          python scripts/apply_0020_domain_hardening.py
          python -m py_compile scripts/apply_0020_domain_hardening.py alembic/versions/0020_contacts_hardened.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          p = Path('alembic/versions/0020_contacts_hardened.py')
          s = p.read_text(encoding='utf-8')
          d = s[s.index('def downgrade():'):]
          assert 'CASCADE' not in d
          assert 'IF EXISTS' not in d
          assert d.count(' RESTRICT;') == 16
          assert '_0020_preflight_upgrade_domain()' in s
          assert '_0020_preflight_downgrade_domain()' in s
          assert 'CREATE EXTENSION IF NOT EXISTS citext' not in s[s.index('def upgrade():'):s.index('def downgrade():')]
          assert 'DROP TABLE public.branch_contacts_audit RESTRICT' in d
          assert 'DROP TYPE public.contact_kind_enum RESTRICT' in d
          PY

      - name: Publish generated migration and remove one-shot controls
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-0020-domain-hardening-once.yml
          git rm .github/_apply_0020_domain_hardening_once_trigger
          git add alembic/versions/0020_contacts_hardened.py scripts/apply_0020_domain_hardening.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'Expected hardened 0020 diff is empty' >&2; exit 1; }
          git commit -m "harden migration 0020 domain ownership and rollback"
          git push origin HEAD:hardening/complete-migration-lineage
