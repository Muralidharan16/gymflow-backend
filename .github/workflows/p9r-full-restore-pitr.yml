name: P9-R Full Restore PITR and Recovery Objectives

on:
  push:
    branches:
      - hardening/p9-data-protection-disaster-recovery
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p9r-full-restore-pitr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recovery_rehearsal:
    name: Real PG16 full restore PITR and measured RPO RTO
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      P9R_PREDECESSOR: zj07d8e9f0a44
      P9R_HEAD: zk07d8e9f0a45
      P9R_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      P9R_SOURCE_DB: gymflow_p9r_source
      P9R_WAL_ARCHIVE: /tmp/p9r-wal-archive
      P9R_PHYSICAL_BASE: /tmp/p9r-physical-base
      P9R_FULL_RESTORE: /tmp/p9r-full-restore
      P9R_FULL_SOCKET: /tmp/p9r-full-socket
      P9R_FULL_PORT: '55434'
      P9R_PITR_RESTORE: /tmp/p9r-pitr-restore
      P9R_PITR_SOCKET: /tmp/p9r-pitr-socket
      P9R_PITR_PORT: '55435'
      P9R_RPO_TARGET_MS: '10000'
      P9R_RTO_TARGET_MS: '120000'
      P9R_REDIS_PORT: '16380'
      P9R_APP_PORT: '18081'
      P9R_METRICS_PORT: '4319'
      MIGRATION_PASSWORD: ci-p9r-migration-owner
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-p9r-migration-owner@127.0.0.1:5432/gymflow_p9r_source
      EVIDENCE_DIR: p9r-evidence
      PYTHONDONTWRITEBYTECODE: '1'
      ENVIRONMENT: test

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked test environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/p9r-resolved.txt
          diff -u requirements-test.lock /tmp/p9r-resolved.txt

      - name: Validate exact candidate and P9-R static contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${P9R_CANDIDATE_SHA}"
          mkdir -p "$EVIDENCE_DIR"
          printf 'candidate_sha=%s\n' "$P9R_CANDIDATE_SHA" > "$EVIDENCE_DIR/candidate.txt"
          python -m json.tool docs/architecture/p9_data_protection_recovery_matrix.json >/dev/null
          python -m py_compile \
            tests/test_p9_governance_contracts.py \
            tests/test_p9m_populated_migration_contracts.py \
            tests/test_p9l_lock_rewrite_contracts.py \
            tests/test_p9b_backup_integrity_contracts.py \
            tests/test_p9r_full_restore_pitr_contracts.py
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p9_governance_contracts.py \
            tests/test_p9m_populated_migration_contracts.py \
            tests/test_p9l_lock_rewrite_contracts.py \
            tests/test_p9b_backup_integrity_contracts.py \
            tests/test_p9r_full_restore_pitr_contracts.py
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "${P9R_HEAD}"

      - name: Install PostgreSQL 16 Redis and isolation utilities
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-16 \
            postgresql-client-16 \
            postgresql-contrib \
            postgresql-16-partman \
            postgresql-16-postgis-3 \
            redis-server \
            iptables \
            curl
          sudo systemctl start postgresql
          pg_config --version | tee "$EVIDENCE_DIR/postgresql-version.txt"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres -c 'SELECT version();' \
            | tee -a "$EVIDENCE_DIR/postgresql-version.txt"
          test -x /usr/lib/postgresql/16/bin/pg_basebackup
          test -x /usr/lib/postgresql/16/bin/pg_verifybackup

      - name: Enable private WAL archive before source construction
        run: |
          set -euo pipefail
          sudo rm -rf "$P9R_WAL_ARCHIVE"
          sudo install -d -m 0700 -o postgres -g postgres "$P9R_WAL_ARCHIVE"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres \
            -c "ALTER SYSTEM SET archive_mode = 'on';"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres \
            -c "ALTER SYSTEM SET archive_command = 'test -f /tmp/p9r-wal-archive/%f || cp %p /tmp/p9r-wal-archive/%f';"
          sudo systemctl restart postgresql
          test "$(sudo -u postgres psql -X -qAt -d postgres -c 'SHOW archive_mode')" = 'on'
          test "$(sudo -u postgres psql -X -qAt -d postgres -c 'SHOW wal_level')" = 'replica'
          sudo -u postgres psql -X -qAt -d postgres \
            -c "SELECT current_setting('archive_command')" \
            > "$EVIDENCE_DIR/archive-command.txt"
          grep -q '/tmp/p9r-wal-archive' "$EVIDENCE_DIR/archive-command.txt"

      - name: Bootstrap canonical reduced roles and source database
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<SQL
          ALTER ROLE migration_owner PASSWORD 'ci-p9r-migration-owner';
          CREATE DATABASE ${P9R_SOURCE_DB} OWNER migration_owner;
          SQL
          bash scripts/ci/verify_cluster_roles.sh

      - name: Provision infrastructure-owned extension boundary
        run: |
          set -euo pipefail
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$P9R_SOURCE_DB" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS partman AUTHORIZATION postgres;
          CREATE EXTENSION IF NOT EXISTS pg_partman SCHEMA partman;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE EXTENSION IF NOT EXISTS citext;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS postgis;

          GRANT USAGE ON SCHEMA partman TO migration_owner;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA partman TO migration_owner;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA partman TO migration_owner;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA partman TO migration_owner;
          GRANT EXECUTE ON ALL PROCEDURES IN SCHEMA partman TO migration_owner;
          SQL

      - name: Build exact populated predecessor and upgrade to HEAD
        run: |
          set -euo pipefail
          set -o pipefail
          python -s -m alembic -c alembic.ini upgrade "${P9R_PREDECESSOR}" 2>&1 \
            | tee "$EVIDENCE_DIR/upgrade-to-predecessor.log"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 \
            -d "$P9R_SOURCE_DB" \
            -f scripts/ci/p9m_seed_populated_predecessor.sql \
            | tee "$EVIDENCE_DIR/seed.log"
          grep -q 'P9M_SYNTHETIC_PRODUCTION_SHAPE=PASS' "$EVIDENCE_DIR/seed.log"
          python -s -m alembic -c alembic.ini upgrade "${P9R_HEAD}" 2>&1 \
            | tee "$EVIDENCE_DIR/upgrade-to-head.log"
          python -s -m alembic -c alembic.ini current 2>&1 \
            | tee "$EVIDENCE_DIR/current-source-head.log"
          grep -q "${P9R_HEAD}" "$EVIDENCE_DIR/current-source-head.log"

      - name: Create recovery-only sentinel boundary and source fingerprint
        run: |
          set -euo pipefail
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$P9R_SOURCE_DB" <<'SQL'
          CREATE SCHEMA p9r_ci AUTHORIZATION postgres;
          REVOKE ALL ON SCHEMA p9r_ci FROM PUBLIC;
          CREATE TABLE p9r_ci.recovery_sentinels (
              marker text PRIMARY KEY,
              committed_at timestamptz NOT NULL DEFAULT clock_timestamp()
          );
          REVOKE ALL ON p9r_ci.recovery_sentinels FROM PUBLIC;
          SQL
          sudo -u postgres psql -X -qAt -v ON_ERROR_STOP=1 \
            -d "$P9R_SOURCE_DB" \
            -f scripts/ci/p9m_stable_snapshot.sql \
            > "$EVIDENCE_DIR/source-stable.txt"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 \
            -d "$P9R_SOURCE_DB" \
            -f scripts/ci/p9m_verify_head_capability.sql \
            | tee "$EVIDENCE_DIR/source-head-capability.log"
          grep -q 'P9M_EXPECTED_CAPABILITY_DELTA=PASS' "$EVIDENCE_DIR/source-head-capability.log"
          sha256sum "$EVIDENCE_DIR/source-stable.txt" > "$EVIDENCE_DIR/source-stable.sha256"
          echo 'P9R_SOURCE_RECOVERY_BASELINE=PASS'

      - name: Create and verify physical recovery base backup
        run: |
          set -euo pipefail
          sudo -u postgres rm -rf "$P9R_PHYSICAL_BASE"
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_basebackup \
            --pgdata="$P9R_PHYSICAL_BASE" \
            --format=plain \
            --wal-method=stream \
            --checkpoint=fast \
            --manifest-checksums=SHA256 \
            --dbname='dbname=postgres' \
            --verbose \
            2>&1 | tee "$EVIDENCE_DIR/pg-basebackup.log"
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_verifybackup \
            "$P9R_PHYSICAL_BASE" \
            2>&1 | tee "$EVIDENCE_DIR/pg-verifybackup.log"
          grep -q 'backup successfully verified' "$EVIDENCE_DIR/pg-verifybackup.log"
          sudo -u postgres test -s "$P9R_PHYSICAL_BASE/backup_manifest"
          sudo -u postgres sha256sum "$P9R_PHYSICAL_BASE/backup_manifest" \
            > "$EVIDENCE_DIR/physical-backup-manifest.sha256"
          sudo -u postgres du -sb "$P9R_PHYSICAL_BASE" \
            > "$EVIDENCE_DIR/physical-backup-size.txt"
          echo 'P9R_RECOVERY_BASE_BACKUP=PASS'

      - name: Boot isolated full restore
        run: |
          set -euo pipefail
          sudo -u postgres rm -rf "$P9R_FULL_RESTORE" "$P9R_FULL_SOCKET"
          sudo -u postgres cp -a "$P9R_PHYSICAL_BASE" "$P9R_FULL_RESTORE"
          sudo install -d -m 0770 -o postgres -g postgres "$P9R_FULL_SOCKET"
          sudo tee /tmp/p9r-full-postgresql.conf >/dev/null <<EOF
          port = ${P9R_FULL_PORT}
          listen_addresses = ''
          unix_socket_directories = '${P9R_FULL_SOCKET}'
          unix_socket_group = 'postgres'
          unix_socket_permissions = 0770
          shared_buffers = '128MB'
          max_connections = 50
          EOF
          sudo tee /tmp/p9r-full-hba.conf >/dev/null <<'EOF'
          local all all trust
          EOF
          sudo chown postgres:postgres /tmp/p9r-full-postgresql.conf /tmp/p9r-full-hba.conf
          sudo chmod 0600 /tmp/p9r-full-postgresql.conf /tmp/p9r-full-hba.conf
          sudo -u postgres rm -f /tmp/p9r-full-postgres.log
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl \
            -D "$P9R_FULL_RESTORE" \
            -l /tmp/p9r-full-postgres.log \
            -o "-c config_file=/tmp/p9r-full-postgresql.conf -c hba_file=/tmp/p9r-full-hba.conf -c archive_mode=off" \
            -w start
          sudo -u postgres test -s /tmp/p9r-full-postgres.log
          sudo cat /tmp/p9r-full-postgres.log > "$EVIDENCE_DIR/full-restore-start.log"
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_isready \
            -h "$P9R_FULL_SOCKET" -p "$P9R_FULL_PORT" \
            | tee "$EVIDENCE_DIR/full-restore-ready.txt"

      - name: Prove full restore business security and application readiness
        run: |
          set -euo pipefail
          cleanup_app() {
            sudo pkill -u p9rapp -f 'uvicorn app.main:app' >/dev/null 2>&1 || true
          }
          cleanup_support() {
            cleanup_app
            if [ -s /tmp/p9r-metrics.pid ]; then
              kill "$(cat /tmp/p9r-metrics.pid)" >/dev/null 2>&1 || true
            fi
            if [ -s /tmp/p9r-redis.pid ]; then
              kill "$(cat /tmp/p9r-redis.pid)" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_support EXIT

          test "$(sudo -u postgres psql -X -qAt -h "$P9R_FULL_SOCKET" -p "$P9R_FULL_PORT" -d "$P9R_SOURCE_DB" -c 'SELECT version_num FROM alembic_version')" = "${P9R_HEAD}"
          test "$(sudo -u postgres psql -X -qAt -h "$P9R_FULL_SOCKET" -p "$P9R_FULL_PORT" -d postgres -c 'SHOW listen_addresses')" = ''
          sudo -u postgres psql -X -qAt -v ON_ERROR_STOP=1 \
            -h "$P9R_FULL_SOCKET" -p "$P9R_FULL_PORT" -d "$P9R_SOURCE_DB" \
            -f scripts/ci/p9m_stable_snapshot.sql \
            > "$EVIDENCE_DIR/full-restore-stable.txt"
          cmp "$EVIDENCE_DIR/source-stable.txt" "$EVIDENCE_DIR/full-restore-stable.txt"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 \
            -h "$P9R_FULL_SOCKET" -p "$P9R_FULL_PORT" -d "$P9R_SOURCE_DB" \
            -f scripts/ci/p9m_verify_head_capability.sql \
            | tee "$EVIDENCE_DIR/full-restore-capability.log"
          grep -q 'P9M_EXPECTED_CAPABILITY_DELTA=PASS' "$EVIDENCE_DIR/full-restore-capability.log"
          echo 'P9R_FULL_RESTORE_FINGERPRINT=PASS'

          if ! id p9rapp >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin p9rapp
          fi
          sudo usermod -a -G postgres p9rapp
          P9R_APP_UID="$(id -u p9rapp)"
          echo "$P9R_APP_UID" > "$EVIDENCE_DIR/p9r-app-uid.txt"
          sudo install -d -m 0750 -o p9rapp -g p9rapp /tmp/p9r-app-work /tmp/p9r-app-home

          redis-server \
            --port "$P9R_REDIS_PORT" \
            --bind 127.0.0.1 \
            --save '' \
            --appendonly no \
            --daemonize yes \
            --pidfile /tmp/p9r-redis.pid
          redis-cli -h 127.0.0.1 -p "$P9R_REDIS_PORT" ping \
            | tee "$EVIDENCE_DIR/redis-ready.txt"
          grep -qx 'PONG' "$EVIDENCE_DIR/redis-ready.txt"

          python -s scripts/ci/p8o_otlp_collector.py \
            --host 127.0.0.1 \
            --port "$P9R_METRICS_PORT" \
            --capture "$EVIDENCE_DIR/p9r-app-metrics.jsonl" \
            > "$EVIDENCE_DIR/metrics-collector.log" 2>&1 &
          echo "$!" > /tmp/p9r-metrics.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${P9R_METRICS_PORT}/healthz" >/dev/null; then
              break
            fi
            sleep 0.2
          done
          curl --fail --silent "http://127.0.0.1:${P9R_METRICS_PORT}/healthz" \
            > "$EVIDENCE_DIR/metrics-health.txt"

          sudo iptables -I OUTPUT 1 -m owner --uid-owner "$P9R_APP_UID" ! -d 127.0.0.0/8 -j REJECT
          echo "$P9R_APP_UID" > /tmp/p9r-firewall-uid
          if sudo -u p9rapp /usr/bin/curl --fail --silent --show-error --connect-timeout 2 http://1.1.1.1 \
              > "$EVIDENCE_DIR/provider-egress.stdout" \
              2> "$EVIDENCE_DIR/provider-egress.stderr"; then
            echo 'P9-R recovery identity unexpectedly reached non-loopback network.' >&2
            exit 1
          fi
          echo 'P9R_LIVE_PROVIDER_EGRESS_BLOCKED=PASS'

          PYTHON_BIN="$(command -v python)"
          APP_DB_URL="postgresql+asyncpg://app_runtime@/${P9R_SOURCE_DB}?host=${P9R_FULL_SOCKET}"
          (
            cd /tmp/p9r-app-work
            exec sudo -u p9rapp env -i \
              HOME=/tmp/p9r-app-home \
              PATH="$PATH" \
              PYTHONPATH="$GITHUB_WORKSPACE" \
              PYTHONDONTWRITEBYTECODE=1 \
              ENVIRONMENT=test \
              DATABASE_URL="$APP_DB_URL" \
              REDIS_URL="redis://127.0.0.1:${P9R_REDIS_PORT}/0" \
              CELERY_BROKER_URL="redis://127.0.0.1:${P9R_REDIS_PORT}/1" \
              CELERY_RESULT_BACKEND="redis://127.0.0.1:${P9R_REDIS_PORT}/2" \
              SECRET_KEY=p9r-synthetic-ci-secret \
              AWS_ACCESS_KEY_ID=p9r-synthetic \
              AWS_SECRET_ACCESS_KEY=p9r-synthetic \
              S3_BUCKET_NAME=p9r-synthetic \
              P8_METRICS_OTLP_ENDPOINT="http://127.0.0.1:${P9R_METRICS_PORT}/v1/metrics" \
              P8_METRICS_EXPORT_INTERVAL_SECONDS=1 \
              P8_METRICS_EXPORT_TIMEOUT_SECONDS=2 \
              NOTIFICATION_EMAIL_PROVIDER_MODE=disabled \
              SEARCH_PROVIDER_MODE=disabled \
              PLATFORM_BILLING_PROVIDER_MODE=disabled \
              PLATFORM_BILLING_CHECKOUT=false \
              PLATFORM_BILLING_WEBHOOK_PROCESSING=false \
              PLATFORM_BILLING_DUNNING_TRANSITIONS=false \
              PLATFORM_BILLING_NOTIFICATIONS=false \
              "$PYTHON_BIN" -m uvicorn app.main:app --host 127.0.0.1 --port "$P9R_APP_PORT"
          ) > "$EVIDENCE_DIR/full-app.log" 2>&1 &
          echo "$!" > /tmp/p9r-full-app-launcher.pid

          full_ready=0
          for attempt in $(seq 1 120); do
            if curl --fail --silent "http://127.0.0.1:${P9R_APP_PORT}/_system/ready" \
                > "$EVIDENCE_DIR/full-app-ready.json"; then
              full_ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$full_ready" -ne 1 ]; then
            cat "$EVIDENCE_DIR/full-app.log" >&2 || true
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path("p9r-evidence/full-app-ready.json").read_text()) == {"status": "ready"}
          PY
          echo 'P9R_FULL_RESTORE_APP_READINESS=PASS'
          cleanup_app
          trap - EXIT

      - name: Stop full restore before destructive source timeline
        run: |
          set -euo pipefail
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl \
            -D "$P9R_FULL_RESTORE" -m fast -w stop \
            | tee "$EVIDENCE_DIR/full-restore-stop.log"

      - name: Build destructive PITR timeline
        run: |
          set -euo pipefail
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$P9R_SOURCE_DB" \
            -c "INSERT INTO p9r_ci.recovery_sentinels(marker) VALUES ('pre_target');"
          pre_committed_epoch_ms="$(sudo -u postgres psql -X -qAt -d "$P9R_SOURCE_DB" \
            -c "SELECT (extract(epoch FROM committed_at) * 1000)::bigint FROM p9r_ci.recovery_sentinels WHERE marker = 'pre_target'")"
          target_epoch_ms="$(sudo -u postgres psql -X -qAt -d "$P9R_SOURCE_DB" \
            -c "SELECT (extract(epoch FROM clock_timestamp()) * 1000)::bigint")"
          target_lsn="$(sudo -u postgres psql -X -qAt -d "$P9R_SOURCE_DB" \
            -c "SELECT pg_create_restore_point('p9r_target')")"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$P9R_SOURCE_DB" \
            -c "INSERT INTO p9r_ci.recovery_sentinels(marker) VALUES ('post_target');"
          post_committed_epoch_ms="$(sudo -u postgres psql -X -qAt -d "$P9R_SOURCE_DB" \
            -c "SELECT (extract(epoch FROM committed_at) * 1000)::bigint FROM p9r_ci.recovery_sentinels WHERE marker = 'post_target'")"
          test "$(sudo -u postgres psql -X -qAt -d "$P9R_SOURCE_DB" -c "SELECT count(*) FROM p9r_ci.recovery_sentinels")" = '2'

          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$P9R_SOURCE_DB" \
            -c "TRUNCATE p9r_ci.recovery_sentinels;"
          failure_epoch_ms="$(sudo -u postgres psql -X -qAt -d "$P9R_SOURCE_DB" \
            -c "SELECT (extract(epoch FROM clock_timestamp()) * 1000)::bigint")"
          test "$(sudo -u postgres psql -X -qAt -d "$P9R_SOURCE_DB" -c "SELECT count(*) FROM p9r_ci.recovery_sentinels")" = '0'

          rpo_ms="$((failure_epoch_ms - target_epoch_ms))"
          test "$rpo_ms" -ge 0
          test "$rpo_ms" -le "$P9R_RPO_TARGET_MS"
          printf '%s\n' "$rpo_ms" > "$EVIDENCE_DIR/measured-rpo-ms.txt"
          cat > "$EVIDENCE_DIR/recovery-timeline.json" <<EOF
          {
            "pre_target_committed_epoch_ms": ${pre_committed_epoch_ms},
            "target_boundary_epoch_ms": ${target_epoch_ms},
            "target_lsn": "${target_lsn}",
            "post_target_committed_epoch_ms": ${post_committed_epoch_ms},
            "failure_boundary_epoch_ms": ${failure_epoch_ms},
            "measured_rpo_ms": ${rpo_ms},
            "rpo_target_ms": ${P9R_RPO_TARGET_MS}
          }
          EOF

          loss_wal="$(sudo -u postgres psql -X -qAt -d postgres \
            -c "SELECT pg_walfile_name(pg_current_wal_lsn())")"
          echo "$loss_wal" > "$EVIDENCE_DIR/loss-wal-segment.txt"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres -c 'SELECT pg_switch_wal();' \
            | tee "$EVIDENCE_DIR/wal-switch-after-loss.txt"
          archived=0
          for attempt in $(seq 1 60); do
            if sudo -u postgres test -f "$P9R_WAL_ARCHIVE/$loss_wal"; then
              archived=1
              break
            fi
            sleep 0.5
          done
          test "$archived" -eq 1
          sudo -u postgres find "$P9R_WAL_ARCHIVE" -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > "$EVIDENCE_DIR/wal-archive-files.txt"
          sudo -u postgres bash -c '
            set -euo pipefail
            while IFS= read -r -d "" path; do
              sha256sum "$path"
            done < <(find "$1" -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
          ' _ "$P9R_WAL_ARCHIVE" > "$EVIDENCE_DIR/wal-archive.sha256"
          test -s "$EVIDENCE_DIR/wal-archive.sha256"
          echo 'P9_RPO_MEASURED=PASS'

      - name: Recover to named PITR target and measure RTO
        run: |
          set -euo pipefail
          rto_start_ns="$(python -c 'import time; print(time.monotonic_ns())')"
          printf '%s\n' "$rto_start_ns" > "$EVIDENCE_DIR/rto-start-monotonic-ns.txt"

          sudo -u postgres rm -rf "$P9R_PITR_RESTORE" "$P9R_PITR_SOCKET"
          sudo -u postgres cp -a "$P9R_PHYSICAL_BASE" "$P9R_PITR_RESTORE"
          sudo install -d -m 0770 -o postgres -g postgres "$P9R_PITR_SOCKET"
          sudo -u postgres touch "$P9R_PITR_RESTORE/recovery.signal"
          sudo tee /tmp/p9r-pitr-postgresql.conf >/dev/null <<EOF
          port = ${P9R_PITR_PORT}
          listen_addresses = ''
          unix_socket_directories = '${P9R_PITR_SOCKET}'
          unix_socket_group = 'postgres'
          unix_socket_permissions = 0770
          shared_buffers = '128MB'
          max_connections = 50
          restore_command = 'cp /tmp/p9r-wal-archive/%f %p'
          recovery_target_name = 'p9r_target'
          recovery_target_action = 'promote'
          EOF
          sudo tee /tmp/p9r-pitr-hba.conf >/dev/null <<'EOF'
          local all all trust
          EOF
          sudo chown postgres:postgres /tmp/p9r-pitr-postgresql.conf /tmp/p9r-pitr-hba.conf
          sudo chmod 0600 /tmp/p9r-pitr-postgresql.conf /tmp/p9r-pitr-hba.conf
          sudo -u postgres rm -f /tmp/p9r-pitr-postgres.log
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl \
            -D "$P9R_PITR_RESTORE" \
            -l /tmp/p9r-pitr-postgres.log \
            -o "-c config_file=/tmp/p9r-pitr-postgresql.conf -c hba_file=/tmp/p9r-pitr-hba.conf -c archive_mode=off" \
            -w start
          sudo -u postgres test -s /tmp/p9r-pitr-postgres.log
          sudo cat /tmp/p9r-pitr-postgres.log > "$EVIDENCE_DIR/pitr-start.log"
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_isready \
            -h "$P9R_PITR_SOCKET" -p "$P9R_PITR_PORT" \
            | tee "$EVIDENCE_DIR/pitr-ready.txt"

          test "$(sudo -u postgres psql -X -qAt -h "$P9R_PITR_SOCKET" -p "$P9R_PITR_PORT" -d "$P9R_SOURCE_DB" -c 'SELECT version_num FROM alembic_version')" = "${P9R_HEAD}"
          test "$(sudo -u postgres psql -X -qAt -h "$P9R_PITR_SOCKET" -p "$P9R_PITR_PORT" -d postgres -c 'SHOW listen_addresses')" = ''
          test "$(sudo -u postgres psql -X -qAt -h "$P9R_PITR_SOCKET" -p "$P9R_PITR_PORT" -d postgres -c 'SELECT pg_is_in_recovery()')" = 'f'

          pre_count="$(sudo -u postgres psql -X -qAt -h "$P9R_PITR_SOCKET" -p "$P9R_PITR_PORT" -d "$P9R_SOURCE_DB" -c "SELECT count(*) FROM p9r_ci.recovery_sentinels WHERE marker = 'pre_target'")"
          post_count="$(sudo -u postgres psql -X -qAt -h "$P9R_PITR_SOCKET" -p "$P9R_PITR_PORT" -d "$P9R_SOURCE_DB" -c "SELECT count(*) FROM p9r_ci.recovery_sentinels WHERE marker = 'post_target'")"
          test "$pre_count" = '1'
          test "$post_count" = '0'
          printf 'pre_target=%s\npost_target=%s\n' "$pre_count" "$post_count" \
            > "$EVIDENCE_DIR/pitr-sentinel-counts.txt"
          echo 'P9R_PRE_TARGET_SURVIVES=PASS'
          echo 'P9R_POST_TARGET_EXCLUDED=PASS'

          sudo -u postgres psql -X -qAt -v ON_ERROR_STOP=1 \
            -h "$P9R_PITR_SOCKET" -p "$P9R_PITR_PORT" -d "$P9R_SOURCE_DB" \
            -f scripts/ci/p9m_stable_snapshot.sql \
            > "$EVIDENCE_DIR/pitr-stable.txt"
          cmp "$EVIDENCE_DIR/source-stable.txt" "$EVIDENCE_DIR/pitr-stable.txt"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 \
            -h "$P9R_PITR_SOCKET" -p "$P9R_PITR_PORT" -d "$P9R_SOURCE_DB" \
            -f scripts/ci/p9m_verify_head_capability.sql \
            | tee "$EVIDENCE_DIR/pitr-capability.log"
          grep -q 'P9M_EXPECTED_CAPABILITY_DELTA=PASS' "$EVIDENCE_DIR/pitr-capability.log"

          test -s /tmp/p9r-firewall-uid
          P9R_APP_UID="$(cat /tmp/p9r-firewall-uid)"
          sudo iptables -C OUTPUT -m owner --uid-owner "$P9R_APP_UID" ! -d 127.0.0.0/8 -j REJECT
          if sudo -u p9rapp /usr/bin/curl --fail --silent --show-error --connect-timeout 2 http://1.1.1.1 \
              > "$EVIDENCE_DIR/pitr-provider-egress.stdout" \
              2> "$EVIDENCE_DIR/pitr-provider-egress.stderr"; then
            echo 'P9-R PITR application identity unexpectedly reached non-loopback network.' >&2
            exit 1
          fi

          PYTHON_BIN="$(command -v python)"
          APP_DB_URL="postgresql+asyncpg://app_runtime@/${P9R_SOURCE_DB}?host=${P9R_PITR_SOCKET}"
          (
            cd /tmp/p9r-app-work
            exec sudo -u p9rapp env -i \
              HOME=/tmp/p9r-app-home \
              PATH="$PATH" \
              PYTHONPATH="$GITHUB_WORKSPACE" \
              PYTHONDONTWRITEBYTECODE=1 \
              ENVIRONMENT=test \
              DATABASE_URL="$APP_DB_URL" \
              REDIS_URL="redis://127.0.0.1:${P9R_REDIS_PORT}/0" \
              CELERY_BROKER_URL="redis://127.0.0.1:${P9R_REDIS_PORT}/1" \
              CELERY_RESULT_BACKEND="redis://127.0.0.1:${P9R_REDIS_PORT}/2" \
              SECRET_KEY=p9r-synthetic-ci-secret \
              AWS_ACCESS_KEY_ID=p9r-synthetic \
              AWS_SECRET_ACCESS_KEY=p9r-synthetic \
              S3_BUCKET_NAME=p9r-synthetic \
              P8_METRICS_OTLP_ENDPOINT="http://127.0.0.1:${P9R_METRICS_PORT}/v1/metrics" \
              P8_METRICS_EXPORT_INTERVAL_SECONDS=1 \
              P8_METRICS_EXPORT_TIMEOUT_SECONDS=2 \
              NOTIFICATION_EMAIL_PROVIDER_MODE=disabled \
              SEARCH_PROVIDER_MODE=disabled \
              PLATFORM_BILLING_PROVIDER_MODE=disabled \
              PLATFORM_BILLING_CHECKOUT=false \
              PLATFORM_BILLING_WEBHOOK_PROCESSING=false \
              PLATFORM_BILLING_DUNNING_TRANSITIONS=false \
              PLATFORM_BILLING_NOTIFICATIONS=false \
              "$PYTHON_BIN" -m uvicorn app.main:app --host 127.0.0.1 --port "$P9R_APP_PORT"
          ) > "$EVIDENCE_DIR/pitr-app.log" 2>&1 &
          echo "$!" > /tmp/p9r-pitr-app-launcher.pid

          pitr_ready=0
          for attempt in $(seq 1 120); do
            if curl --fail --silent "http://127.0.0.1:${P9R_APP_PORT}/_system/ready" \
                > "$EVIDENCE_DIR/pitr-app-ready.json"; then
              pitr_ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$pitr_ready" -ne 1 ]; then
            cat "$EVIDENCE_DIR/pitr-app.log" >&2 || true
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path("p9r-evidence/pitr-app-ready.json").read_text()) == {"status": "ready"}
          PY
          sudo pkill -u p9rapp -f 'uvicorn app.main:app' >/dev/null 2>&1 || true
          echo 'P9R_PITR_APP_READINESS=PASS'

          rto_end_ns="$(python -c 'import time; print(time.monotonic_ns())')"
          rto_ms="$(((rto_end_ns - rto_start_ns) / 1000000))"
          test "$rto_ms" -ge 0
          test "$rto_ms" -le "$P9R_RTO_TARGET_MS"
          printf '%s\n' "$rto_end_ns" > "$EVIDENCE_DIR/rto-end-monotonic-ns.txt"
          printf '%s\n' "$rto_ms" > "$EVIDENCE_DIR/measured-rto-ms.txt"
          echo 'P9_FULL_RESTORE=PASS'
          echo 'P9_PITR=PASS'
          echo 'P9_RTO_MEASURED=PASS'
          echo 'P9_DATA_LOSS_RECOVERY=PASS'

      - name: Produce machine-readable P9-R decision
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE_DIR"])

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          timeline = json.loads((evidence / "recovery-timeline.json").read_text())
          measured_rpo = int((evidence / "measured-rpo-ms.txt").read_text().strip())
          measured_rto = int((evidence / "measured-rto-ms.txt").read_text().strip())
          rpo_target = int(os.environ["P9R_RPO_TARGET_MS"])
          rto_target = int(os.environ["P9R_RTO_TARGET_MS"])
          source_fp = digest(evidence / "source-stable.txt")
          full_fp = digest(evidence / "full-restore-stable.txt")
          pitr_fp = digest(evidence / "pitr-stable.txt")

          payload = {
              "candidate_sha": os.environ["P9R_CANDIDATE_SHA"],
              "postgresql_major": 16,
              "alembic_head": os.environ["P9R_HEAD"],
              "full_restore": True,
              "pitr": True,
              "pre_target_survives": True,
              "post_target_excluded": True,
              "rpo_target_ms": rpo_target,
              "measured_rpo_ms": measured_rpo,
              "rpo_within_target": measured_rpo <= rpo_target,
              "rto_target_ms": rto_target,
              "measured_rto_ms": measured_rto,
              "rto_within_target": measured_rto <= rto_target,
              "source_fingerprint_sha256": source_fp,
              "full_restore_fingerprint_sha256": full_fp,
              "pitr_fingerprint_sha256": pitr_fp,
              "full_restore_app_ready": True,
              "pitr_app_ready": True,
              "provider_egress_blocked": True,
              "recovery_target_lsn": timeline["target_lsn"],
              "refund_provider_execution": "deferred_fail_closed",
          }
          if len({source_fp, full_fp, pitr_fp}) != 1:
              raise SystemExit("P9-R source/full/PITR fingerprint mismatch")
          if not payload["rpo_within_target"] or not payload["rto_within_target"]:
              raise SystemExit("P9-R frozen recovery objective exceeded")
          (evidence / "p9r-decision.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat "$EVIDENCE_DIR/p9r-decision.json"
          grep -q '"full_restore": true' "$EVIDENCE_DIR/p9r-decision.json"
          grep -q '"pitr": true' "$EVIDENCE_DIR/p9r-decision.json"
          grep -q '"rpo_within_target": true' "$EVIDENCE_DIR/p9r-decision.json"
          grep -q '"rto_within_target": true' "$EVIDENCE_DIR/p9r-decision.json"
          grep -q '"provider_egress_blocked": true' "$EVIDENCE_DIR/p9r-decision.json"
          grep -q '"refund_provider_execution": "deferred_fail_closed"' "$EVIDENCE_DIR/p9r-decision.json"

      - name: Reprove inherited P9 and P8 boundaries
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p9_governance_contracts.py \
            tests/test_p9m_populated_migration_contracts.py \
            tests/test_p9l_lock_rewrite_contracts.py \
            tests/test_p9b_backup_integrity_contracts.py \
            tests/test_p9r_full_restore_pitr_contracts.py \
            tests/test_p8_governance_contracts.py \
            tests/test_migration_app_secure_owner_context_boundary.py \
            tests/test_pg_dump_normalizer.py
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "${P9R_HEAD}"

      - name: Emit P9-R decision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${P9R_CANDIDATE_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          grep -q '"full_restore": true' "$EVIDENCE_DIR/p9r-decision.json"
          grep -q '"pitr": true' "$EVIDENCE_DIR/p9r-decision.json"
          grep -q '"rpo_within_target": true' "$EVIDENCE_DIR/p9r-decision.json"
          grep -q '"rto_within_target": true' "$EVIDENCE_DIR/p9r-decision.json"
          echo 'P9R_FULL_RESTORE_FINGERPRINT=PASS'
          echo 'P9R_FULL_RESTORE_APP_READINESS=PASS'
          echo 'P9R_LIVE_PROVIDER_EGRESS_BLOCKED=PASS'
          echo 'P9R_PRE_TARGET_SURVIVES=PASS'
          echo 'P9R_POST_TARGET_EXCLUDED=PASS'
          echo 'P9R_PITR_APP_READINESS=PASS'
          echo 'P9_FULL_RESTORE=PASS'
          echo 'P9_PITR=PASS'
          echo 'P9_RPO_MEASURED=PASS'
          echo 'P9_RTO_MEASURED=PASS'
          echo 'P9_DATA_LOSS_RECOVERY=PASS'
          echo 'P9_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'

      - name: Cleanup disposable recovery processes
        if: always()
        run: |
          set +e
          sudo pkill -u p9rapp -f 'uvicorn app.main:app' >/dev/null 2>&1 || true
          if [ -s /tmp/p9r-firewall-uid ]; then
            uid="$(cat /tmp/p9r-firewall-uid)"
            sudo iptables -D OUTPUT -m owner --uid-owner "$uid" ! -d 127.0.0.0/8 -j REJECT >/dev/null 2>&1 || true
          fi
          if [ -s /tmp/p9r-metrics.pid ]; then
            kill "$(cat /tmp/p9r-metrics.pid)" >/dev/null 2>&1 || true
          fi
          if [ -s /tmp/p9r-redis.pid ]; then
            kill "$(cat /tmp/p9r-redis.pid)" >/dev/null 2>&1 || true
          fi
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl \
            -D "$P9R_FULL_RESTORE" -m immediate stop >/dev/null 2>&1 || true
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl \
            -D "$P9R_PITR_RESTORE" -m immediate stop >/dev/null 2>&1 || true

      - name: Upload P9-R recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p9r-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: p9r-evidence/
          if-no-files-found: error
          retention-days: 14
