name: P9-R Full Restore PITR and Recovery Objectives

on:
  pull_request:
    branches:
      - main
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: p9r-full-restore-pitr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recovery_rehearsal:
    name: Apply exact P9-R promotion-wait repair
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout P9 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: hardening/p9-data-protection-disaster-recovery

      - name: Restore full workflow and patch promotion wait
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('scripts/ci/p9r-full-restore-pitr.base.yml')
          target_path = Path('.github/workflows/p9r-full-restore-pitr.yml')
          source = source_path.read_text(encoding='utf-8')
          old = '''          test "$(sudo -u postgres psql -X -qAt -h "$P9R_PITR_SOCKET" -p "$P9R_PITR_PORT" -d postgres -c 'SELECT pg_is_in_recovery()')" = 'f'
'''
          new = '''          promotion_wait_deadline_ns="$((rto_start_ns + P9R_RTO_TARGET_MS * 1000000))"
          pitr_promoted=0
          while [ "$(python -c 'import time; print(time.monotonic_ns())')" -le "$promotion_wait_deadline_ns" ]; do
            recovery_state="$(sudo -u postgres psql -X -qAt -v ON_ERROR_STOP=1 \\
              -h "$P9R_PITR_SOCKET" -p "$P9R_PITR_PORT" -d postgres \\
              -c 'SELECT pg_is_in_recovery()' 2>/dev/null || true)"
            if [ "$recovery_state" = 'f' ]; then
              pitr_promoted=1
              break
            fi
            sleep 0.1
          done
          if [ "$pitr_promoted" -ne 1 ]; then
            sudo cat /tmp/p9r-pitr-postgres.log \\
              | tee "$EVIDENCE_DIR/pitr-promotion-timeout.log" >&2
            exit 1
          fi
          sudo cat /tmp/p9r-pitr-postgres.log > "$EVIDENCE_DIR/pitr-start.log"
          echo 'P9R_PITR_PROMOTION_WAIT=PASS'
          test "$(sudo -u postgres psql -X -qAt -h "$P9R_PITR_SOCKET" -p "$P9R_PITR_PORT" -d postgres -c 'SELECT pg_is_in_recovery()')" = 'f'
'''

          if source.count(old) != 1:
              raise SystemExit('expected exactly one immediate pg_is_in_recovery assertion in preserved P9-R workflow')
          source = source.replace(old, new, 1)
          target_path.write_text(source, encoding='utf-8')
          PY

          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p9r_recovery_compatibility_contracts.py \
            tests/test_p9r_full_restore_pitr_contracts.py
          git diff --check

      - name: Commit real repair and delete bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/p9r-full-restore-pitr.yml
          git rm -- scripts/ci/p9r-full-restore-pitr.base.yml
          git diff --cached --check
          git commit -m 'fix(p9r): wait for PITR promotion before recovery assertions'
          git push origin HEAD:hardening/p9-data-protection-disaster-recovery
