name: Migration Hardening CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-hardening-contracts:
    name: Static hardening contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Compile hardened migration/runtime surface
        run: |
          python -m py_compile \
            alembic/env.py \
            alembic/versions/0020_contacts_hardened.py \
            alembic/versions/0021_staff_roles.py \
            alembic/versions/0022_rbac_phase1_roles_extensions.py \
            alembic/versions/0024_rbac_p3_org_members.py \
            alembic/versions/0025_rbac_p4_bsr_expand.py \
            alembic/versions/0026_rbac_p5_audit_log.py \
            alembic/versions/0027_rbac_p6_perm_snapshots.py \
            alembic/versions/0028_rbac_p7_role_events.py \
            alembic/versions/0029_rbac_p8_contract.py \
            alembic/versions/a1b2c3d4e5f6_rbac_hardening_phase_15_to_18.py \
            alembic/versions/dafd2b02005e_add_branch_staff_roles_deactivation_.py \
            alembic/versions/66a95af89112_init_partman_for_branch_lifecycle_events.py \
            alembic/versions/371b1a44a333_add_spatial_and_filtering_indexes.py \
            alembic/versions/361c32e72e93_add_geo_fields_to_branches.py \
            app/core/database.py

      - name: Run migration hardening static regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest --noconftest -q \
            tests/test_0027_complete_owner_context_boundary.py \
            tests/test_66a_pg_partman_boundary.py \
            tests/test_371b333_spatial_index_lineage.py \
            tests/test_database_sync_driver_boundary.py \
            tests/test_database_session_guc_boundary.py \
            tests/test_alembic_env_config_boundary.py \
            tests/test_alembic_model_import_boundary.py \
            tests/test_dafd_app_private_owner_context_boundary.py \
            tests/test_migration_app_private_owner_context_boundary.py \
            tests/test_migration_app_secure_owner_context_boundary.py \
            tests/test_migration_managed_role_boundary.py \
            tests/test_migration_shared_infrastructure_boundary.py \
            tests/test_platform_billing_cleanup_boundary.py \
            tests/test_address_audit_rls_context_boundary.py \
            tests/test_rbac_expand_contract_root_cause.py

  fresh-lineage-and-regressions:
    name: Fresh PG16 lineage and general regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      MIGRATION_PASSWORD: ci-migration-owner
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_migration_test
      TEST_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-only-secret-key-not-for-production
      AWS_ACCESS_KEY_ID: ci-test
      AWS_SECRET_ACCESS_KEY: ci-test
      AWS_REGION_NAME: us-east-1
      S3_BUCKET_NAME: gymflow-ci-test
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Install PostgreSQL 16 extension packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-16 \
            postgresql-client-16 \
            postgresql-contrib \
            postgresql-16-partman \
            postgresql-16-postgis-3
          sudo systemctl start postgresql
          pg_config --version
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres -c 'SELECT version();'
          test -f /usr/share/postgresql/16/extension/pg_partman.control

      - name: Bootstrap reduced migration/test roles and databases
        run: |
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          CREATE ROLE migration_owner
            LOGIN PASSWORD 'ci-migration-owner'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;

          CREATE ROLE app_rls_executor
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_security_owner
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_runtime
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_user
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE audit_writer
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE branch_admin
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE branch_viewer
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE internal_billing_worker
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE ops_support
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE readonly_analytics
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE test_runner
            LOGIN PASSWORD 'ci-test-runner'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;

          ALTER ROLE app_runtime SET statement_timeout = '5s';
          ALTER ROLE app_runtime SET lock_timeout = '2s';
          ALTER ROLE app_runtime SET row_security = 'on';

          GRANT app_rls_executor TO migration_owner
            WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;
          GRANT app_security_owner TO migration_owner
            WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;

          -- Test-harness-only downward role edge. migration_owner does not
          -- inherit test_runner and has no ADMIN option; it may only assume
          -- the reduced test identity for explicit negative/security proofs.
          GRANT test_runner TO migration_owner
            WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;

          CREATE DATABASE gymflow_migration_test OWNER migration_owner;
          CREATE DATABASE gymflow_test OWNER migration_owner;
          SQL

      - name: Provision infrastructure-owned extensions
        run: |
          for database in gymflow_migration_test gymflow_test; do
            sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$database" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS partman AUTHORIZATION postgres;
          CREATE EXTENSION IF NOT EXISTS pg_partman SCHEMA partman;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE EXTENSION IF NOT EXISTS citext;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS postgis;

          GRANT USAGE ON SCHEMA partman TO migration_owner;
          GRANT SELECT, INSERT, UPDATE, DELETE
            ON ALL TABLES IN SCHEMA partman TO migration_owner;
          GRANT USAGE, SELECT, UPDATE
            ON ALL SEQUENCES IN SCHEMA partman TO migration_owner;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA partman TO migration_owner;
          GRANT EXECUTE ON ALL PROCEDURES IN SCHEMA partman TO migration_owner;
          SQL
          done

      - name: Prove reduced roles and bounded test edge
        run: |
          PGPASSWORD="$MIGRATION_PASSWORD" psql \
            -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner \
            -d gymflow_migration_test <<'SQL'
          DO $$
          DECLARE
            migration_record record;
            test_record record;
          BEGIN
            SELECT * INTO migration_record
            FROM pg_catalog.pg_roles
            WHERE rolname = 'migration_owner';

            SELECT * INTO test_record
            FROM pg_catalog.pg_roles
            WHERE rolname = 'test_runner';

            IF migration_record.rolsuper
               OR migration_record.rolcreatedb
               OR migration_record.rolcreaterole
               OR migration_record.rolinherit
               OR migration_record.rolreplication
               OR migration_record.rolbypassrls THEN
              RAISE EXCEPTION 'migration_owner is over-privileged';
            END IF;

            IF test_record.rolsuper
               OR test_record.rolcreatedb
               OR test_record.rolcreaterole
               OR test_record.rolinherit
               OR test_record.rolreplication
               OR test_record.rolbypassrls THEN
              RAISE EXCEPTION 'test_runner is over-privileged';
            END IF;

            IF NOT pg_catalog.pg_has_role(
                'migration_owner',
                'test_runner',
                'SET'
            ) THEN
              RAISE EXCEPTION 'missing bounded SET test_runner edge';
            END IF;
          END
          $$;
          SQL

      - name: Fresh Alembic lineage on migration database
        run: |
          python -s -m alembic -c alembic.ini upgrade head

      - name: Fresh Alembic lineage on test database
        env:
          DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
        run: |
          python -s -m alembic -c alembic.ini upgrade head

      - name: Run general regression suite fail-fast
        run: |
          python -m pytest -q --maxfail=1 --ignore=tests/platform_billing

  platform-billing-regressions:
    name: Isolated Platform Billing regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      MIGRATION_PASSWORD: ci-migration-owner
      PLATFORM_BILLING_RUNTIME_PASSWORD: ci-platform-billing-runtime
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
      TEST_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
      PLATFORM_BILLING_TEST_DATABASE_URL: postgresql+asyncpg://platform_billing_test_runtime:ci-platform-billing-runtime@127.0.0.1:5432/gymflow_platform_billing_test_ci
      PLATFORM_BILLING_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_platform_billing_test_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-only-secret-key-not-for-production
      AWS_ACCESS_KEY_ID: ci-test
      AWS_SECRET_ACCESS_KEY: ci-test
      AWS_REGION_NAME: us-east-1
      S3_BUCKET_NAME: gymflow-ci-test
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Install PostgreSQL 16 extension packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-16 \
            postgresql-client-16 \
            postgresql-contrib \
            postgresql-16-partman \
            postgresql-16-postgis-3
          sudo systemctl start postgresql
          pg_config --version
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres -c 'SELECT version();'
          test -f /usr/share/postgresql/16/extension/pg_partman.control

      - name: Bootstrap isolated Platform Billing identities and databases
        run: |
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          CREATE ROLE migration_owner
            LOGIN PASSWORD 'ci-migration-owner'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;

          CREATE ROLE app_rls_executor
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_security_owner
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_runtime
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_user
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE audit_writer
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE branch_admin
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE branch_viewer
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE internal_billing_worker
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE ops_support
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE readonly_analytics
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE test_runner
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE platform_billing_test_runtime
            LOGIN PASSWORD 'ci-platform-billing-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;

          ALTER ROLE app_runtime SET statement_timeout = '5s';
          ALTER ROLE app_runtime SET lock_timeout = '2s';
          ALTER ROLE app_runtime SET row_security = 'on';
          ALTER ROLE platform_billing_test_runtime SET row_security = 'on';
          ALTER ROLE platform_billing_test_runtime SET statement_timeout = '30s';
          ALTER ROLE platform_billing_test_runtime SET lock_timeout = '5s';

          GRANT app_rls_executor TO migration_owner
            WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;
          GRANT app_security_owner TO migration_owner
            WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;

          CREATE DATABASE gymflow_test OWNER migration_owner;
          CREATE DATABASE gymflow_platform_billing_test_ci OWNER migration_owner;
          SQL

      - name: Provision Platform Billing infrastructure-owned extensions
        run: |
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_platform_billing_test_ci <<'SQL'
          CREATE SCHEMA IF NOT EXISTS partman AUTHORIZATION postgres;
          CREATE EXTENSION IF NOT EXISTS pg_partman SCHEMA partman;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE EXTENSION IF NOT EXISTS citext;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS postgis;

          GRANT USAGE ON SCHEMA partman TO migration_owner;
          GRANT SELECT, INSERT, UPDATE, DELETE
            ON ALL TABLES IN SCHEMA partman TO migration_owner;
          GRANT USAGE, SELECT, UPDATE
            ON ALL SEQUENCES IN SCHEMA partman TO migration_owner;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA partman TO migration_owner;
          GRANT EXECUTE ON ALL PROCEDURES IN SCHEMA partman TO migration_owner;
          SQL

      - name: Fresh Alembic lineage on isolated Platform Billing database
        env:
          DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_platform_billing_test_ci
        run: |
          python -s -m alembic -c alembic.ini upgrade head

      - name: Grant test-only Platform Billing DML surface
        run: |
          PGPASSWORD="$MIGRATION_PASSWORD" psql \
            -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner \
            -d gymflow_platform_billing_test_ci <<'SQL'
          DO $$
          DECLARE
            target record;
          BEGIN
            FOR target IN
              SELECT n.nspname AS schema_name, c.relname AS relation_name
              FROM pg_catalog.pg_class AS c
              JOIN pg_catalog.pg_namespace AS n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public'
                AND c.relkind IN ('r', 'p')
                AND (
                  c.relname = 'organizations'
                  OR c.relname LIKE 'platform\_%' ESCAPE '\'
                )
            LOOP
              EXECUTE format(
                'GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE %I.%I TO platform_billing_test_runtime',
                target.schema_name,
                target.relation_name
              );
            END LOOP;
          END
          $$;
          SQL

      - name: Prove isolated Platform Billing runtime posture
        run: |
          PGPASSWORD="$PLATFORM_BILLING_RUNTIME_PASSWORD" psql \
            -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U platform_billing_test_runtime \
            -d gymflow_platform_billing_test_ci <<'SQL'
          DO $$
          DECLARE
            runtime_record record;
          BEGIN
            SELECT * INTO runtime_record
            FROM pg_catalog.pg_roles
            WHERE rolname = current_user;

            IF current_user <> 'platform_billing_test_runtime' THEN
              RAISE EXCEPTION 'unexpected Platform Billing runtime identity';
            END IF;

            IF current_database() <> 'gymflow_platform_billing_test_ci' THEN
              RAISE EXCEPTION 'unexpected Platform Billing runtime database';
            END IF;

            IF runtime_record.rolsuper
               OR runtime_record.rolcreatedb
               OR runtime_record.rolcreaterole
               OR runtime_record.rolinherit
               OR runtime_record.rolreplication
               OR runtime_record.rolbypassrls THEN
              RAISE EXCEPTION 'Platform Billing runtime is over-privileged';
            END IF;

            IF EXISTS (
              SELECT 1
              FROM pg_catalog.pg_database
              WHERE datname = current_database()
                AND pg_catalog.pg_get_userbyid(datdba) = current_user
            ) THEN
              RAISE EXCEPTION 'Platform Billing runtime owns its database';
            END IF;

            IF pg_catalog.has_schema_privilege(current_user, 'public', 'CREATE') THEN
              RAISE EXCEPTION 'Platform Billing runtime may create in public schema';
            END IF;

            IF EXISTS (
              SELECT 1
              FROM information_schema.table_privileges
              WHERE grantee = current_user
                AND table_schema = 'public'
                AND (
                  (table_name <> 'organizations' AND table_name NOT LIKE 'platform\_%' ESCAPE '\')
                  OR privilege_type NOT IN ('SELECT', 'INSERT', 'UPDATE', 'DELETE')
                )
            ) THEN
              RAISE EXCEPTION 'Platform Billing runtime has out-of-bound table privileges';
            END IF;

            IF pg_catalog.has_table_privilege(current_user, 'public.organizations', 'TRUNCATE') THEN
              RAISE EXCEPTION 'Platform Billing runtime may truncate organizations';
            END IF;
          END
          $$;
          SQL

      - name: Run isolated Platform Billing regressions fail-fast
        run: |
          python -m pytest -q --maxfail=1 tests/platform_billing
