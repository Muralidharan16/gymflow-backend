name: Migration Hardening CI

on:
  push:
    branches:
      - hardening/complete-migration-lineage
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: migration-hardening-${{ github.ref }}
  cancel-in-progress: true

env:
  HARDENING_PR_NUMBER: '2'

jobs:
  static-hardening-contracts:
    name: Static hardening contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        id: tooling
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee /tmp/static-tooling.log
          python -m pip install -r requirements-test.txt 2>&1 | tee -a /tmp/static-tooling.log

      - name: Compile hardened migration surface
        id: compile
        run: |
          set -o pipefail
          python -m py_compile \
            alembic/env.py \
            alembic/versions/0020_contacts_hardened.py \
            alembic/versions/0021_staff_roles.py \
            alembic/versions/0022_rbac_phase1_roles_extensions.py \
            alembic/versions/0024_rbac_p3_org_members.py \
            alembic/versions/0025_rbac_p4_bsr_expand.py \
            alembic/versions/0026_rbac_p5_audit_log.py \
            alembic/versions/0027_rbac_p6_perm_snapshots.py \
            alembic/versions/0028_rbac_p7_role_events.py \
            alembic/versions/0029_rbac_p8_contract.py \
            alembic/versions/a1b2c3d4e5f6_rbac_hardening_phase_15_to_18.py \
            alembic/versions/dafd2b02005e_add_branch_staff_roles_deactivation_.py \
            alembic/versions/66a95af89112_init_partman_for_branch_lifecycle_events.py \
            alembic/versions/371b1a44a333_add_spatial_and_filtering_indexes.py \
            alembic/versions/361c32e72e93_add_geo_fields_to_branches.py \
            app/core/database.py \
            2>&1 | tee /tmp/static-compile.log

      - name: Run migration hardening static regressions
        id: static_tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -o pipefail
          python -m pytest --noconftest -q \
            tests/test_0027_complete_owner_context_boundary.py \
            tests/test_66a_pg_partman_boundary.py \
            tests/test_371b333_spatial_index_lineage.py \
            tests/test_database_sync_driver_boundary.py \
            tests/test_alembic_env_config_boundary.py \
            tests/test_alembic_model_import_boundary.py \
            tests/test_dafd_app_private_owner_context_boundary.py \
            tests/test_migration_app_private_owner_context_boundary.py \
            tests/test_migration_app_secure_owner_context_boundary.py \
            tests/test_migration_managed_role_boundary.py \
            tests/test_migration_shared_infrastructure_boundary.py \
            tests/test_rbac_expand_contract_root_cause.py \
            2>&1 | tee /tmp/static-tests.log

      - name: Report static hardening result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          TOOLING_OUTCOME: ${{ steps.tooling.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TEST_OUTCOME: ${{ steps.static_tests.outcome }}
        run: |
          python3 - <<'PY' >/tmp/static-report.json
          import json
          import os
          from pathlib import Path

          def tail(path: str, limit: int = 100) -> str:
              candidate = Path(path)
              if not candidate.exists():
                  return "(no captured log)"
              return "\n".join(
                  candidate.read_text(errors="replace").splitlines()[-limit:]
              )

          outcomes = {
              "checkout": os.environ.get("CHECKOUT_OUTCOME", "unknown"),
              "python": os.environ.get("PYTHON_OUTCOME", "unknown"),
              "tooling": os.environ.get("TOOLING_OUTCOME", "unknown"),
              "compile": os.environ.get("COMPILE_OUTCOME", "unknown"),
              "static_tests": os.environ.get("TEST_OUTCOME", "unknown"),
          }
          log = tail("/tmp/static-tests.log")
          if outcomes["static_tests"] in {"skipped", "unknown"}:
              log = tail("/tmp/static-compile.log") + "\n" + tail("/tmp/static-tooling.log")
          body = (
              "### Migration Hardening CI — static contracts\n"
              f"Commit: `{os.environ.get('GITHUB_SHA', '')}`\n\n"
              f"Outcomes: `{json.dumps(outcomes, sort_keys=True)}`\n\n"
              "<details><summary>Captured tail</summary>\n\n```text\n"
              + log[:16000]
              + "\n```\n</details>"
          )
          print(json.dumps({"body": body}))
          PY
          curl --fail-with-body -sS -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$HARDENING_PR_NUMBER/comments" \
            --data-binary @/tmp/static-report.json

  fresh-lineage-and-regressions:
    name: Fresh PG16 lineage and full regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      MIGRATION_PASSWORD: ci-migration-owner
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_migration_test
      TEST_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-only-secret-key-not-for-production
      AWS_ACCESS_KEY_ID: ci-test
      AWS_SECRET_ACCESS_KEY: ci-test
      AWS_REGION_NAME: us-east-1
      S3_BUCKET_NAME: gymflow-ci-test
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        id: dependencies
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee /tmp/dependencies.log
          python -m pip install -r requirements-test.txt 2>&1 | tee -a /tmp/dependencies.log

      - name: Install PostgreSQL 16 extension packages
        id: postgres_packages
        run: |
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get install -y \
              postgresql-16 \
              postgresql-client-16 \
              postgresql-contrib \
              postgresql-16-partman \
              postgresql-16-postgis-3
            sudo systemctl start postgresql
            pg_config --version
            sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres -c 'SELECT version();'
            test -f /usr/share/postgresql/16/extension/pg_partman.control
            cat /usr/share/postgresql/16/extension/pg_partman.control
          } 2>&1 | tee /tmp/postgres-packages.log

      - name: Bootstrap reduced migration roles and databases
        id: bootstrap
        run: |
          set -o pipefail
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres 2>&1 <<'SQL' | tee /tmp/bootstrap.log
          CREATE ROLE migration_owner
            LOGIN PASSWORD 'ci-migration-owner'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;

          CREATE ROLE app_rls_executor
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_security_owner
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_runtime
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_user
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE audit_writer
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE branch_admin
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE branch_viewer
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE internal_billing_worker
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE ops_support
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE readonly_analytics
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          CREATE ROLE test_runner
            LOGIN PASSWORD 'ci-test-runner'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;

          ALTER ROLE app_runtime SET statement_timeout = '5s';
          ALTER ROLE app_runtime SET lock_timeout = '2s';
          ALTER ROLE app_runtime SET row_security = 'on';

          GRANT app_rls_executor TO migration_owner
            WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;
          GRANT app_security_owner TO migration_owner
            WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;

          CREATE DATABASE gymflow_migration_test OWNER migration_owner;
          CREATE DATABASE gymflow_test OWNER migration_owner;
          SQL

      - name: Provision infrastructure-owned extensions
        id: extensions
        run: |
          set -o pipefail
          {
            for database in gymflow_migration_test gymflow_test; do
              sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$database" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS partman AUTHORIZATION postgres;
          CREATE EXTENSION IF NOT EXISTS pg_partman SCHEMA partman;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE EXTENSION IF NOT EXISTS citext;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS postgis;

          GRANT USAGE ON SCHEMA partman TO migration_owner;
          GRANT SELECT, INSERT, UPDATE, DELETE
            ON ALL TABLES IN SCHEMA partman TO migration_owner;
          GRANT USAGE, SELECT, UPDATE
            ON ALL SEQUENCES IN SCHEMA partman TO migration_owner;
          GRANT EXECUTE
            ON ALL FUNCTIONS IN SCHEMA partman TO migration_owner;
          GRANT EXECUTE
            ON ALL PROCEDURES IN SCHEMA partman TO migration_owner;
          SQL
            done
          } 2>&1 | tee /tmp/extensions.log

      - name: Prove migration role is reduced
        id: reduced_role
        run: |
          set -o pipefail
          PGPASSWORD="$MIGRATION_PASSWORD" psql \
            -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner \
            -d gymflow_migration_test 2>&1 <<'SQL' | tee /tmp/reduced-role.log
          SELECT
            current_user,
            rolsuper,
            rolcreatedb,
            rolcreaterole,
            rolinherit,
            rolreplication,
            rolbypassrls
          FROM pg_catalog.pg_roles
          WHERE rolname = current_user;

          DO $$
          DECLARE
            role_record record;
          BEGIN
            SELECT * INTO role_record
            FROM pg_catalog.pg_roles
            WHERE rolname = current_user;

            IF role_record.rolsuper
               OR role_record.rolcreatedb
               OR role_record.rolcreaterole
               OR role_record.rolinherit
               OR role_record.rolreplication
               OR role_record.rolbypassrls THEN
              RAISE EXCEPTION 'migration_owner is over-privileged';
            END IF;
          END
          $$;
          SQL

      - name: Fresh Alembic lineage on migration database
        id: migration_lineage
        run: |
          set -o pipefail
          python -s -m alembic -c alembic.ini upgrade head 2>&1 | tee /tmp/migration-lineage.log

      - name: Fresh Alembic lineage on test database
        id: test_lineage
        env:
          DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
        run: |
          set -o pipefail
          python -s -m alembic -c alembic.ini upgrade head 2>&1 | tee /tmp/test-lineage.log

      - name: Run full regression suite
        id: regression
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee /tmp/full-regression.log

      - name: Report runtime hardening result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          PACKAGES_OUTCOME: ${{ steps.postgres_packages.outcome }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          EXTENSIONS_OUTCOME: ${{ steps.extensions.outcome }}
          REDUCED_ROLE_OUTCOME: ${{ steps.reduced_role.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration_lineage.outcome }}
          TEST_LINEAGE_OUTCOME: ${{ steps.test_lineage.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          python3 - <<'PY' >/tmp/runtime-report.json
          import json
          import os
          from pathlib import Path

          stages = [
              ("checkout", os.environ.get("CHECKOUT_OUTCOME"), None),
              ("python", os.environ.get("PYTHON_OUTCOME"), None),
              ("dependencies", os.environ.get("DEPENDENCIES_OUTCOME"), "/tmp/dependencies.log"),
              ("postgres_packages", os.environ.get("PACKAGES_OUTCOME"), "/tmp/postgres-packages.log"),
              ("bootstrap", os.environ.get("BOOTSTRAP_OUTCOME"), "/tmp/bootstrap.log"),
              ("extensions", os.environ.get("EXTENSIONS_OUTCOME"), "/tmp/extensions.log"),
              ("reduced_role", os.environ.get("REDUCED_ROLE_OUTCOME"), "/tmp/reduced-role.log"),
              ("migration_lineage", os.environ.get("MIGRATION_OUTCOME"), "/tmp/migration-lineage.log"),
              ("test_lineage", os.environ.get("TEST_LINEAGE_OUTCOME"), "/tmp/test-lineage.log"),
              ("regression", os.environ.get("REGRESSION_OUTCOME"), "/tmp/full-regression.log"),
          ]
          outcomes = {name: outcome or "unknown" for name, outcome, _ in stages}
          failed = [
              (name, path)
              for name, outcome, path in stages
              if outcome == "failure" and path
          ]
          selected = failed
          if not selected:
              for name, outcome, path in reversed(stages):
                  if path and outcome not in {None, "skipped", "unknown"}:
                      selected = [(name, path)]
                      break

          excerpts = []
          for name, path in selected:
              candidate = Path(path)
              text = "(no captured log)"
              if candidate.exists():
                  text = "\n".join(
                      candidate.read_text(errors="replace").splitlines()[-150:]
                  )
              excerpts.append(f"[{name}]\n{text}")

          body = (
              "### Migration Hardening CI — runtime lineage/regressions\n"
              f"Commit: `{os.environ.get('GITHUB_SHA', '')}`\n\n"
              f"Outcomes: `{json.dumps(outcomes, sort_keys=True)}`\n\n"
              "<details><summary>Failure/current-stage tail</summary>\n\n```text\n"
              + "\n\n".join(excerpts)[:20000]
              + "\n```\n</details>"
          )
          print(json.dumps({"body": body}))
          PY
          curl --fail-with-body -sS -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$HARDENING_PR_NUMBER/comments" \
            --data-binary @/tmp/runtime-report.json
