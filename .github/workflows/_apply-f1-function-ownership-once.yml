name: One-shot Platform Billing Phase 1 function ownership

on:
  push:
    branches: [hardening/complete-migration-lineage]
    paths:
      - .github/_apply_f1_function_ownership_once_trigger

permissions:
  contents: write

concurrency:
  group: apply-f1-function-ownership-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/complete-migration-lineage
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce strict revision-owned function creation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('alembic/versions/f1a2b3c4d5e6_platform_billing_phase_1_foundation.py')
          names = (
              'platform_billing_touch_updated_at',
              'prevent_platform_product_invalid_mutation',
              'prevent_platform_policy_version_immutable_update',
              'prevent_platform_plan_version_immutable_update',
              'prevent_platform_price_immutable_update',
              'validate_platform_plan_entitlement',
              'prevent_platform_plan_entitlement_immutable_update',
              'prevent_platform_append_only_update',
          )
          source = path.read_text(encoding='utf-8')
          for name in names:
              old = f'CREATE OR REPLACE FUNCTION public.{name}()'
              new = f'CREATE FUNCTION public.{name}()'
              if source.count(old) != 1:
                  raise SystemExit(f'{name}: expected exactly one revision-owned OR REPLACE definition')
              if new in source:
                  raise SystemExit(f'{name}: strict definition already present unexpectedly')
              source = source.replace(old, new, 1)
          for name in names:
              if f'CREATE OR REPLACE FUNCTION public.{name}()' in source:
                  raise SystemExit(f'{name}: OR REPLACE remains')
              if source.count(f'CREATE FUNCTION public.{name}()') != 1:
                  raise SystemExit(f'{name}: strict creation count drift')
          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile alembic/versions/f1a2b3c4d5e6_platform_billing_phase_1_foundation.py
          git diff --check

      - name: Publish and remove one-shot controls
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-f1-function-ownership-once.yml
          git rm .github/_apply_f1_function_ownership_once_trigger
          test ! -e .github/_ci_revalidate_extension_boundary_head || git rm .github/_ci_revalidate_extension_boundary_head
          git add alembic/versions/f1a2b3c4d5e6_platform_billing_phase_1_foundation.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'Expected Phase 1 ownership hardening diff is empty' >&2; exit 1; }
          git commit -m "make platform billing phase 1 functions strictly owned"
          git push origin HEAD:hardening/complete-migration-lineage
