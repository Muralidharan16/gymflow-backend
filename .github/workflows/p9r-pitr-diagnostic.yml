name: P9-R PITR Startup Diagnostic

on:
  push:
    branches:
      - hardening/p9-data-protection-disaster-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pitr_diagnostic:
    name: Synthetic PG16 named-target PITR diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARCHIVE: /tmp/p9r-diag-archive
      BASE: /tmp/p9r-diag-base
      RESTORE: /tmp/p9r-diag-restore
      SOCKET: /tmp/p9r-diag-socket
      PORT: '55436'
    steps:
      - name: Install PostgreSQL 16
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          sudo systemctl start postgresql
          /usr/lib/postgresql/16/bin/postgres --version

      - name: Enable archive and build synthetic recovery timeline
        run: |
          set -euo pipefail
          sudo rm -rf "$ARCHIVE" "$BASE" "$RESTORE" "$SOCKET"
          sudo install -d -m 0700 -o postgres -g postgres "$ARCHIVE"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres \
            -c "ALTER SYSTEM SET archive_mode = 'on';"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres \
            -c "ALTER SYSTEM SET archive_command = 'test -f /tmp/p9r-diag-archive/%f || cp %p /tmp/p9r-diag-archive/%f';"
          sudo systemctl restart postgresql

          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          CREATE TABLE p9r_diag_sentinel(marker text PRIMARY KEY);
          INSERT INTO p9r_diag_sentinel(marker) VALUES ('base');
          SQL

          sudo -u postgres /usr/lib/postgresql/16/bin/pg_basebackup \
            --pgdata="$BASE" \
            --format=plain \
            --wal-method=stream \
            --checkpoint=fast \
            --manifest-checksums=SHA256 \
            --dbname='dbname=postgres' \
            --verbose
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_verifybackup "$BASE"

          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres \
            -c "INSERT INTO p9r_diag_sentinel(marker) VALUES ('pre_target');"
          target_lsn="$(sudo -u postgres psql -X -qAt -d postgres -c "SELECT pg_create_restore_point('p9r_diag_target')")"
          echo "target_lsn=$target_lsn"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres \
            -c "INSERT INTO p9r_diag_sentinel(marker) VALUES ('post_target');"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres \
            -c "TRUNCATE p9r_diag_sentinel;"

          target_wal="$(sudo -u postgres psql -X -qAt -d postgres -c "SELECT pg_walfile_name('$target_lsn'::pg_lsn)")"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres -c 'SELECT pg_switch_wal();'
          for attempt in $(seq 1 60); do
            if sudo -u postgres test -f "$ARCHIVE/$target_wal"; then
              break
            fi
            sleep 0.5
          done
          sudo -u postgres test -f "$ARCHIVE/$target_wal"
          echo "target_wal=$target_wal"
          sudo -u postgres find "$ARCHIVE" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort

      - name: Start named-target PITR and always print server log
        run: |
          set -euo pipefail
          sudo -u postgres cp -a "$BASE" "$RESTORE"
          sudo install -d -m 0770 -o postgres -g postgres "$SOCKET"
          sudo -u postgres touch "$RESTORE/recovery.signal"
          sudo tee /tmp/p9r-diag-postgresql.conf >/dev/null <<EOF
          port = ${PORT}
          listen_addresses = ''
          unix_socket_directories = '${SOCKET}'
          unix_socket_group = 'postgres'
          unix_socket_permissions = 0770
          shared_buffers = '128MB'
          max_connections = 30
          restore_command = 'cp /tmp/p9r-diag-archive/%f %p'
          recovery_target_name = 'p9r_diag_target'
          recovery_target_action = 'promote'
          EOF
          sudo tee /tmp/p9r-diag-hba.conf >/dev/null <<'EOF'
          local all all trust
          EOF
          sudo chown postgres:postgres /tmp/p9r-diag-postgresql.conf /tmp/p9r-diag-hba.conf
          sudo chmod 0600 /tmp/p9r-diag-postgresql.conf /tmp/p9r-diag-hba.conf
          sudo -u postgres rm -f /tmp/p9r-diag-postgres.log

          set +e
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl \
            -D "$RESTORE" \
            -l /tmp/p9r-diag-postgres.log \
            -o "-c config_file=/tmp/p9r-diag-postgresql.conf -c hba_file=/tmp/p9r-diag-hba.conf -c archive_mode=off" \
            -w start
          rc=$?
          set -e
          echo "pg_ctl_rc=$rc"
          sudo cat /tmp/p9r-diag-postgres.log || true
          test "$rc" -eq 0

          test "$(sudo -u postgres psql -X -qAt -h "$SOCKET" -p "$PORT" -d postgres -c "SELECT count(*) FROM p9r_diag_sentinel WHERE marker='pre_target'")" = '1'
          test "$(sudo -u postgres psql -X -qAt -h "$SOCKET" -p "$PORT" -d postgres -c "SELECT count(*) FROM p9r_diag_sentinel WHERE marker='post_target'")" = '0'
          test "$(sudo -u postgres psql -X -qAt -h "$SOCKET" -p "$PORT" -d postgres -c 'SELECT pg_is_in_recovery()')" = 'f'
          echo 'P9R_PITR_DIAGNOSTIC=PASS'

      - name: Cleanup
        if: always()
        run: |
          set +e
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl -D "$RESTORE" -m immediate stop >/dev/null 2>&1 || true
