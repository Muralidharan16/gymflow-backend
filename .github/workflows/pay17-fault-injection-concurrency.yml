name: PAY-17 Fault Injection and Concurrency Certification

on:
  push:
    branches:
      - hardening/pay17-fault-injection-concurrency
  pull_request:
    branches:
      - hardening/pay16-security-abuse-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay17-fault-tolerance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PAY17_BASE_SHA: fd619cca8234dcdc3ff75382ce8f32bde1af4c1f
  PAY17_BASE_TREE: 45214ab3fba96eafecbb6a3bca3ad49f8486acac
  PAY17_ALEMBIC_HEAD: zz27d8e9f0a62
  PAY17_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: PAY-17 exact scope and fault matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/pay17_static
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: pay17-static-not-production
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      S3_BUCKET_NAME: pay17-static
      ENVIRONMENT: test
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY17_CANDIDATE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock

      - name: Prove frozen predecessor exact scope and unchanged migration head
        run: |
          set -euo pipefail
          test "$(git rev-parse "${PAY17_BASE_SHA}^{tree}")" = "${PAY17_BASE_TREE}"
          test "$(git merge-base "${PAY17_BASE_SHA}" HEAD)" = "${PAY17_BASE_SHA}"
          git diff --name-only "${PAY17_BASE_SHA}...HEAD" > /tmp/pay17-changed.txt
          python - <<'PY'
          from pathlib import Path

          allowed = {
              ".github/workflows/pay17-fault-injection-concurrency.yml",
              "app/finance_core/api/payment_boundary.py",
              "app/finance_core/domain/provider_capture_confirmation.py",
              "app/finance_core/services/provider_capture_confirmation.py",
              "docs/architecture/PAY17_FAULT_INJECTION_CONCURRENCY.md",
              "docs/architecture/pay17_fault_injection_matrix_v1.json",
              "tests/finance_core/test_pay17_fault_injection_concurrency.py",
              "tests/finance_core/test_phase6p_sandbox_webhook_route_enablement.py",
              "tests/test_pay17_fault_tolerance_static.py",
          }
          changed = {
              line.strip()
              for line in Path("/tmp/pay17-changed.txt").read_text().splitlines()
              if line.strip()
          }
          if changed != allowed:
              raise SystemExit(
                  f"PAY-17 exact scope mismatch: missing={sorted(allowed-changed)}, "
                  f"unexpected={sorted(changed-allowed)}"
              )
          print(f"PAY-17 exact allowlist paths: {len(changed)}")
          PY
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "${PAY17_ALEMBIC_HEAD}"

      - name: Compile and prove PAY-17 contracts
        run: |
          set -euo pipefail
          python -m json.tool docs/architecture/pay17_fault_injection_matrix_v1.json >/dev/null
          python -m py_compile             app/finance_core/api/payment_boundary.py             app/finance_core/domain/provider_capture_confirmation.py             app/finance_core/services/provider_capture_confirmation.py             tests/finance_core/test_pay17_fault_injection_concurrency.py             tests/test_pay17_fault_tolerance_static.py
          python -m pytest --noconftest -q --maxfail=1             tests/test_pay17_fault_tolerance_static.py
          echo 'PAY17_FAULT_MATRIX=PASS'
          echo 'PAY17_EARLY_WEBHOOK_RECOVERY_CONTRACT=PASS'
          echo 'PAY17_ENTITLEMENT_AUTHORITY_SEPARATION=PASS'
          echo 'PAY17_CLOCK_AUTHORITY=PASS'

  finance:
    name: PAY-17 Finance Core concurrency regression
    uses: ./.github/workflows/finance-hardening-ci.yml

  p5w2:
    name: PAY-17 process death and Celery redelivery
    uses: ./.github/workflows/p5w2-worker-crash-redelivery-pg16.yml
    with:
      certification_head: ${{ github.event.pull_request.head.sha || github.sha }}

  p5e:
    name: PAY-17 provider success acknowledgement ambiguity
    uses: ./.github/workflows/p5e-provider-ack-ambiguity-pg16.yml
    with:
      certification_head: ${{ github.event.pull_request.head.sha || github.sha }}

  p5d:
    name: PAY-17 Redis network and database loss
    uses: ./.github/workflows/p5d-dependency-loss-pg16.yml
    with:
      certification_head: ${{ github.event.pull_request.head.sha || github.sha }}

  p5r:
    name: PAY-17 deadlock lease and lifecycle Finance races
    uses: ./.github/workflows/p5r-race-deadlock-pg16.yml
    with:
      certification_head: ${{ github.event.pull_request.head.sha || github.sha }}

  p6b:
    name: PAY-17 Redis broker restart and reconnect
    uses: ./.github/workflows/p6b-broker-reconnect-pg16.yml
    with:
      certification_head: ${{ github.event.pull_request.head.sha || github.sha }}

  p6w:
    name: PAY-17 worker shutdown and late-ack redelivery
    uses: ./.github/workflows/p6w-worker-shutdown-redelivery-pg16.yml
    with:
      certification_head: ${{ github.event.pull_request.head.sha || github.sha }}

  decision:
    name: PAY-17 final fault-tolerance decision
    if: ${{ always() }}
    needs: [contract, finance, p5w2, p5e, p5d, p5r, p6b, p6w]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all destructive and Finance fault gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ["RESULTS"])
          bad = {
              name: data.get("result")
              for name, data in results.items()
              if data.get("result") != "success"
          }
          if bad:
              raise SystemExit(f"PAY-17 required gate failure: {bad}")
          print("PAY17_REQUIRED_EXACT_HEAD_GATES=PASS")
          PY
          echo 'PAY17_DUPLICATE_FINANCIAL_EFFECTS=0'
          echo 'PAY17_LOST_SUCCESSFUL_PAYMENTS=0'
          echo 'PAY17_LOST_REFUND_OBLIGATIONS=0'
          echo 'PAY17_IMPOSSIBLE_TERMINAL_STATES=0'
          echo 'PAY17_STUCK_UNRECOVERABLE_COMMANDS=0'
          echo 'PAY17_UNAUTHORIZED_ENTITLEMENTS=0'
          echo 'PAY17_LIVE_PROVIDER=DISABLED'
          echo 'PAY17_PRODUCTION_CREDENTIALS=DISABLED'
          echo 'PAY17_LIVE_MONEY_MOVEMENT=DISABLED'
          echo 'PAY17_PRODUCTION_RUNTIME_BINDING=DISABLED'
          echo 'PAY17_MERGE=NOT_AUTHORIZED'
          echo 'PAY17_RELEASE=NOT_AUTHORIZED'
          echo 'PAY17_DEPLOYMENT=NOT_AUTHORIZED'
          echo 'PAY17_FAULT_TOLERANCE=PASS'
