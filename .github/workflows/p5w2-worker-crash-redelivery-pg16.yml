name: P5-W2 Worker Crash and Redelivery PostgreSQL 16

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - hardening/p5-concurrency-crash-fault-tolerance
  workflow_call:
    inputs:
      certification_head:
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5w2-worker-crash-redelivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker-crash-redelivery:
    name: Real prefork death, Redis redelivery and duplicate convergence
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIGRATION_PASSWORD: ci-p5w2-migration-owner
      AUTH_RUNTIME_PASSWORD: ci-p5w2-auth-runtime
      APP_RUNTIME_PASSWORD: ci-p5w2-app-runtime
      WORKER_RUNTIME_PASSWORD: ci-p5w2-worker-runtime
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-p5w2-migration-owner@127.0.0.1:5432/gymflow_p5w2_test
      TEST_DATABASE_URL: postgresql+psycopg://app_test_runtime:ci-p5w2-app-runtime@127.0.0.1:5432/gymflow_p5w2_test
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://migration_owner:ci-p5w2-migration-owner@127.0.0.1:5432/gymflow_p5w2_test
      WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:ci-p5w2-worker-runtime@127.0.0.1:5432/gymflow_p5w2_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-p5w2-not-production
      AWS_ACCESS_KEY_ID: ci-p5w2-not-production
      AWS_SECRET_ACCESS_KEY: ci-p5w2-not-production
      S3_BUCKET_NAME: gymflow-p5w2-test
      ENVIRONMENT: test
      P5W2_PROCESS_FAULTS: '1'
      P5W2_DISPOSABLE_DATABASE: gymflow_p5w2_test
      P5W2_DISPOSABLE_BROKER: redis-db-1
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment and prove static contracts
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt
          python -m py_compile \
            scripts/ci/p5w2_celery_fault_hooks.py \
            tests/test_p5w2_worker_crash_redelivery_runtime.py \
            tests/test_p5w2_worker_crash_static_contracts.py
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p5_governance_contracts.py \
            tests/test_p5w_worker_fencing_static_contracts.py \
            tests/test_p5w2_worker_crash_static_contracts.py \
            tests/test_celery_single_app_boundary.py

      - name: Install PostgreSQL 16 and reduced runtime identities
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-p5w2-migration-owner';
          CREATE ROLE auth_p5w2_runtime LOGIN PASSWORD 'ci-p5w2-auth-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_test_runtime LOGIN PASSWORD 'ci-p5w2-app-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE worker_test_runtime LOGIN PASSWORD 'ci-p5w2-worker-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT auth_runtime TO auth_p5w2_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO auth_p5w2_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_runtime TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT worker_runtime TO worker_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          ALTER ROLE auth_p5w2_runtime SET row_security='on';
          ALTER ROLE auth_p5w2_runtime SET statement_timeout='5s';
          ALTER ROLE auth_p5w2_runtime SET lock_timeout='2s';
          ALTER ROLE auth_p5w2_runtime SET idle_in_transaction_session_timeout='15s';
          ALTER ROLE app_test_runtime SET row_security='on';
          ALTER ROLE app_test_runtime SET statement_timeout='10s';
          ALTER ROLE app_test_runtime SET lock_timeout='3s';
          ALTER ROLE app_test_runtime SET idle_in_transaction_session_timeout='30s';
          ALTER ROLE worker_test_runtime SET row_security='on';
          ALTER ROLE worker_test_runtime SET statement_timeout='15s';
          ALTER ROLE worker_test_runtime SET lock_timeout='2s';
          ALTER ROLE worker_test_runtime SET idle_in_transaction_session_timeout='30s';
          CREATE DATABASE gymflow_p5w2_test OWNER migration_owner;
          REVOKE ALL ON DATABASE gymflow_p5w2_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE gymflow_p5w2_test TO migration_owner,auth_p5w2_runtime,app_test_runtime,worker_test_runtime;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p5w2_test

      - name: Prove exact PostgreSQL 16 migration head
        env:
          CERTIFICATION_HEAD: ${{ inputs.certification_head }}
        run: |
          set -euo pipefail
          expected_head="${CERTIFICATION_HEAD:-zg07d8e9f0a41}"
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "${expected_head}"
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads
          PGPASSWORD="${WORKER_RUNTIME_PASSWORD}" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U worker_test_runtime -d gymflow_p5w2_test \
            -c 'SELECT current_user,pg_catalog.current_setting('\''row_security'\'');'

      - name: Prove real worker death, redelivery and duplicate convergence
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q -s --maxfail=1 \
            tests/test_p5w2_worker_crash_redelivery_runtime.py

      - name: Reprove P5-W1 stale-owner fences and inherited worker boundaries
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p5w_worker_fencing_runtime.py \
            tests/test_branch_hours_durable_worker_boundary.py \
            tests/test_branch_lifecycle_durable_worker_boundary.py \
            tests/test_branch_lifecycle_transaction_boundary.py \
            tests/test_celery_single_app_boundary.py \
            tests/test_p4a_external_effect_contracts.py \
            tests/test_p4d_refund_authority_static_contracts.py
          python -s scripts/verify_head_workflow_bootstrap.py

      - name: Emit same-head P5-W2 markers
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          echo "P5W_PROVIDER_REFUND_EXECUTION=DEFERRED_FAIL_CLOSED"
          echo "P5W2_SEPARATE_PROCESS_CRASH=PASS"
          echo "P5W2_REAL_REDIS_REDELIVERY=PASS"
          echo "P5W2_DUPLICATE_DELIVERY=PASS"
