name: Temporary Auth Test Boundary Patch Artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-patch:
    if: github.event.pull_request.head.ref == 'hardening/complete-migration-lineage'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/complete-migration-lineage

      - name: Build bounded auth test-harness patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_auth_register.py')
          text = path.read_text()

          old_import = 'from app.core.database import AsyncSessionLocal, get_db\n'
          new_import = 'from conftest import AdminTestSessionLocal, cleanup_test_database_tables\n'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('BLOCK: auth test database import anchor drifted')

          start = text.index('@pytest_asyncio.fixture(autouse=True)\nasync def cleanup_database_and_redis():')
          end_marker = '    yield\n    await close_redis()\n'
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''_AUTH_TEST_TABLES = [
    "auth_sessions",
    "auth_session_families",
    "gyms",
    "owners",
    "organizations",
]


async def _clear_auth_test_data() -> None:
    # Destructive fixture administration belongs only to the guarded test-admin
    # identity. Never widen app_runtime/auth_runtime to make cleanup convenient.
    await cleanup_test_database_tables(_AUTH_TEST_TABLES)


@pytest_asyncio.fixture(autouse=True)
async def cleanup_database_and_redis():
    """Reset disposable auth state without borrowing application privileges."""
    from app.core.redis import init_redis, get_redis_utils, close_redis

    await close_redis()
    await init_redis()
    redis_utils = get_redis_utils()
    await redis_utils.client.flushdb()
    await _clear_auth_test_data()

    yield

    await _clear_auth_test_data()
    await close_redis()
'''
          text = text[:start] + replacement + text[end:]

          runtime_reads = text.count('async with AsyncSessionLocal() as session:')
          if runtime_reads != 2:
              raise SystemExit(f'BLOCK: expected exactly 2 auth evidence runtime reads, found {runtime_reads}')
          text = text.replace(
              'async with AsyncSessionLocal() as session:',
              'async with AdminTestSessionLocal() as session:',
          )
          if 'AsyncSessionLocal' in text:
              raise SystemExit('BLOCK: General AsyncSessionLocal still appears in auth registration tests')

          path.write_text(text)

          contract = Path('tests/test_auth_test_harness_identity_boundary.py')
          contract.write_text('''from __future__ import annotations\n\nimport ast\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\nAUTH_TEST = ROOT / "tests/test_auth_register.py"\nAUTH_ROUTER = ROOT / "app/routers/auth.py"\n\n\ndef _source(path: Path) -> str:\n    return path.read_text(encoding="utf-8")\n\n\ndef test_auth_registration_fixture_cleanup_is_admin_only_and_symmetric():\n    source = _source(AUTH_TEST)\n    assert "from app.core.database import AsyncSessionLocal" not in source\n    assert "from conftest import AdminTestSessionLocal, cleanup_test_database_tables" in source\n    assert "await cleanup_test_database_tables(_AUTH_TEST_TABLES)" in source\n\n    module = ast.parse(source, filename=str(AUTH_TEST))\n    fixture = next(\n        node for node in module.body\n        if isinstance(node, ast.AsyncFunctionDef) and node.name == "cleanup_database_and_redis"\n    )\n    fixture_source = ast.unparse(fixture)\n    assert fixture_source.count("await _clear_auth_test_data()") == 2\n    assert "AsyncSessionLocal" not in fixture_source\n\n\ndef test_auth_registration_database_evidence_never_uses_general_runtime():\n    source = _source(AUTH_TEST)\n    assert "AsyncSessionLocal" not in source\n    assert source.count("async with AdminTestSessionLocal() as session:") == 2\n    assert "select(Owner)" in source\n    assert "select(Organization)" in source\n\n\ndef test_auth_routes_keep_dedicated_auth_database_dependency():\n    source = _source(AUTH_ROUTER)\n    assert "from app.core.auth_database import get_auth_db" in source\n    for signature in (\n        'db: AsyncSession = Depends(get_auth_db)',\n    ):\n        assert signature in source\n    assert '@router.post("/signup")' in source\n    assert '@router.get("/verify")' in source\n''')
          PY

          python -m py_compile tests/test_auth_register.py tests/test_auth_test_harness_identity_boundary.py
          git diff --check
          test "$(git diff --name-only | sort)" = $'tests/test_auth_register.py\ntests/test_auth_test_harness_identity_boundary.py'

      - uses: actions/upload-artifact@v4
        with:
          name: auth-test-boundary-patch
          path: |
            tests/test_auth_register.py
            tests/test_auth_test_harness_identity_boundary.py
          if-no-files-found: error
