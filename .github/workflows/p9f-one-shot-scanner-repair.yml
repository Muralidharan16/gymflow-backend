name: P9-F One-Shot Scanner Repair

on:
  push:
    branches:
      - hardening/p9-data-protection-disaster-recovery

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.head_commit.message == 'stage-p9f-scanner-repair-v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Patch and self-test mixed-file SQL scanner
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/p9f_scanner_repair.py
          python -m py_compile tests/test_migration_shared_infrastructure_boundary.py
          git diff --check
          git diff -- tests/test_migration_shared_infrastructure_boundary.py

      - name: Commit scanner repair
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- tests/test_migration_shared_infrastructure_boundary.py)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_migration_shared_infrastructure_boundary.py
          git commit -m 'fix(p9f): scope pgcrypto scan to SQL fragments'
          git push origin "HEAD:${GITHUB_REF_NAME}"
