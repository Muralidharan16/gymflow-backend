name: P9-F One-Shot Scanner Repair

on:
  push:
    branches:
      - hardening/p9-data-protection-disaster-recovery

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore(p9f): stage scanner repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Patch mixed-file SQL scanner deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_migration_shared_infrastructure_boundary.py')
          source = path.read_text(encoding='utf-8')

          old_anchor = '''def _fenced_sql_blocks(source: str) -> list[str]:
              return re.findall(
                  r"```(?:sql|postgresql|plpgsql)\\s*(.*?)```",
                  source,
                  flags=re.IGNORECASE | re.DOTALL,
              )


          def _repository_sql_fragments() -> list[tuple[Path, str]]:
          '''

          new_anchor = '''def _fenced_sql_blocks(source: str) -> list[str]:
              return re.findall(
                  r"```(?:sql|postgresql|plpgsql)\\s*(.*?)```",
                  source,
                  flags=re.IGNORECASE | re.DOTALL,
              )


          def _shell_sql_heredoc_blocks(source: str) -> list[str]:
              opener = re.compile(
                  r"<<-?\\s*['\\\"]?([A-Za-z_][A-Za-z0-9_]*)['\\\"]?"
              )
              lines = source.splitlines()
              blocks: list[str] = []
              index = 0
              while index < len(lines):
                  opener_line = lines[index]
                  match = opener.search(opener_line)
                  if match is None:
                      index += 1
                      continue
                  delimiter = match.group(1)
                  sql_target = (
                      "sql" in delimiter.lower()
                      or re.search(r"\\bpsql\\b", opener_line, re.IGNORECASE)
                      is not None
                  )
                  index += 1
                  body: list[str] = []
                  while (
                      index < len(lines)
                      and lines[index].strip() != delimiter
                  ):
                      body.append(lines[index])
                      index += 1
                  if sql_target:
                      fragment = "\\n".join(body)
                      if SQL_HINT_RE.search(fragment):
                          blocks.append(fragment)
                  if index < len(lines):
                      index += 1
              return blocks


          def _mixed_text_sql_fragments(source: str) -> list[str]:
              strong_sql_hint = re.compile(
                  r"\\b(?:SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|"
                  r"GRANT|REVOKE)\\b",
                  re.IGNORECASE,
              )
              fragments = _shell_sql_heredoc_blocks(source)
              fragments.extend(
                  line
                  for line in source.splitlines()
                  if strong_sql_hint.search(line)
              )
              return fragments


          def _repository_sql_fragments() -> list[tuple[Path, str]]:
          '''

          old_else = '''        else:
              values = [
                  source
                  for _ in [0]
                  if SQL_HINT_RE.search(source)
              ]
          '''
          new_else = '''        else:
              values = _mixed_text_sql_fragments(source)
          '''

          if source.count(old_anchor) != 1:
              raise SystemExit('expected fenced-SQL anchor exactly once')
          if source.count(old_else) != 1:
              raise SystemExit('expected mixed-file catch-all exactly once')

          source = source.replace(old_anchor, new_anchor, 1)
          source = source.replace(old_else, new_else, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Prove scanner keeps SQL and ignores embedded Python helpers
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/test_migration_shared_infrastructure_boundary.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('tests/test_migration_shared_infrastructure_boundary.py')
          spec = importlib.util.spec_from_file_location('scanner_contract', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          mixed = """run: |
            psql -c 'SELECT 1'
            python - <<'PYBLOCK'
            def digest(name: str) -> str:
                return name
            evidence = 'finance-before-rollback.sql'
            PYBLOCK
          """
          mixed_fragments = module._mixed_text_sql_fragments(mixed)
          assert not any('def digest' in value for value in mixed_fragments)

          function_name = 'dig' + 'est'
          sql = (
              "run: |\n"
              "  psql <<'SQL'\n"
              f"  SELECT {function_name}('payload', 'sha256');\n"
              "  SQL\n"
          )
          sql_fragments = module._mixed_text_sql_fragments(sql)
          assert any(function_name + '(' in value for value in sql_fragments)

          module.test_pgcrypto_lifecycle_is_absent_repository_wide()
          module.test_pgcrypto_only_sql_functions_are_absent()
          print('P9F_PGCRYPTO_SCANNER_REPAIR=PASS')
          PY

      - name: Commit scanner repair
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- tests/test_migration_shared_infrastructure_boundary.py)"
          git diff --check
          git diff -- tests/test_migration_shared_infrastructure_boundary.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_migration_shared_infrastructure_boundary.py
          git commit -m 'fix(p9f): scope pgcrypto scan to SQL fragments'
          git push origin "HEAD:${GITHUB_REF_NAME}"
