name: P3A General Regression Certification

on:
  pull_request:
    branches: [main, hardening/complete-migration-lineage]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3a-general-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  general-regressions:
    name: Fresh PG16 lineage and general regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      MIGRATION_PASSWORD: ci-migration-owner
      GENERAL_RUNTIME_PASSWORD: ci-app-test-runtime
      AUTH_RUNTIME_PASSWORD: ci-auth-test-runtime
      MAINTENANCE_RUNTIME_PASSWORD: ci-lifecycle-maintenance-runtime
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_migration_test
      TEST_DATABASE_URL: postgresql+asyncpg://app_test_runtime:ci-app-test-runtime@127.0.0.1:5432/gymflow_test
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
      AUTH_DATABASE_URL: postgresql+asyncpg://auth_test_runtime:ci-auth-test-runtime@127.0.0.1:5432/gymflow_test
      MAINTENANCE_DATABASE_URL: postgresql+asyncpg://lifecycle_maintenance_test_runtime:ci-lifecycle-maintenance-runtime@127.0.0.1:5432/gymflow_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-p3a-general-not-production
      AWS_ACCESS_KEY_ID: ci-test
      AWS_SECRET_ACCESS_KEY: ci-test
      AWS_REGION_NAME: us-east-1
      S3_BUCKET_NAME: gymflow-ci-test
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Install PostgreSQL 16
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh

      - name: Bootstrap canonical roles and general test logins
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-migration-owner';

          CREATE ROLE test_runner LOGIN PASSWORD 'ci-test-runner'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_test_runtime LOGIN PASSWORD 'ci-app-test-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE auth_test_runtime LOGIN PASSWORD 'ci-auth-test-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE lifecycle_maintenance_test_runtime LOGIN PASSWORD 'ci-lifecycle-maintenance-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;

          ALTER ROLE app_test_runtime SET row_security='on';
          ALTER ROLE app_test_runtime SET statement_timeout='5s';
          ALTER ROLE app_test_runtime SET lock_timeout='2s';
          ALTER ROLE app_test_runtime SET idle_in_transaction_session_timeout='15s';
          ALTER ROLE auth_test_runtime SET row_security='on';
          ALTER ROLE auth_test_runtime SET statement_timeout='5s';
          ALTER ROLE auth_test_runtime SET lock_timeout='2s';
          ALTER ROLE auth_test_runtime SET idle_in_transaction_session_timeout='15s';
          ALTER ROLE lifecycle_maintenance_test_runtime SET row_security='on';
          ALTER ROLE lifecycle_maintenance_test_runtime SET statement_timeout='15s';
          ALTER ROLE lifecycle_maintenance_test_runtime SET lock_timeout='2s';
          ALTER ROLE lifecycle_maintenance_test_runtime SET idle_in_transaction_session_timeout='30s';

          GRANT app_runtime TO app_test_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO app_test_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT auth_runtime TO auth_test_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_runtime TO auth_test_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO auth_test_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT lifecycle_maintenance_runtime TO lifecycle_maintenance_test_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;

          CREATE DATABASE gymflow_migration_test OWNER migration_owner;
          CREATE DATABASE gymflow_test OWNER migration_owner;
          GRANT CONNECT ON DATABASE gymflow_test
            TO app_test_runtime, auth_test_runtime, lifecycle_maintenance_test_runtime;
          SQL
          bash scripts/ci/verify_cluster_roles.sh

      - name: Provision infrastructure-owned extensions
        run: |
          set -euo pipefail
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_migration_test
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_test

      - name: Fresh Alembic HEAD on migration and test databases
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads
          DATABASE_URL='postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test' \
            python -s -m alembic -c alembic.ini upgrade head
          DATABASE_URL='postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test' \
            python -s -m alembic -c alembic.ini current --check-heads

      - name: Prove P3A production-shaped runtime separation
        run: |
          set -euo pipefail
          PGPASSWORD="$GENERAL_RUNTIME_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U app_test_runtime -d gymflow_test <<'SQL'
          DO $$
          DECLARE runtime_record record;
          BEGIN
            SELECT * INTO runtime_record FROM pg_catalog.pg_roles WHERE rolname=current_user;
            IF current_user <> 'app_test_runtime' OR current_database() <> 'gymflow_test' THEN
              RAISE EXCEPTION 'unexpected general runtime identity/database';
            END IF;
            IF NOT runtime_record.rolcanlogin OR runtime_record.rolsuper
               OR runtime_record.rolcreatedb OR runtime_record.rolcreaterole
               OR runtime_record.rolinherit OR runtime_record.rolreplication
               OR runtime_record.rolbypassrls THEN
              RAISE EXCEPTION 'general runtime role attributes are unsafe';
            END IF;
            IF pg_catalog.has_database_privilege(current_user,current_database(),'CREATE')
               OR pg_catalog.has_schema_privilege(current_user,'public','CREATE') THEN
              RAISE EXCEPTION 'general runtime has object-creation capability';
            END IF;
            IF pg_catalog.pg_has_role(current_user,'auth_runtime','MEMBER')
               OR pg_catalog.pg_has_role(current_user,'worker_runtime','MEMBER')
               OR pg_catalog.pg_has_role(current_user,'lifecycle_maintenance_runtime','MEMBER') THEN
              RAISE EXCEPTION 'general runtime crossed process boundary';
            END IF;
            IF pg_catalog.has_table_privilege(current_user,'public.organizations','SELECT')
               OR pg_catalog.has_table_privilege(current_user,'public.organizations','INSERT')
               OR pg_catalog.has_table_privilege(current_user,'public.organizations','UPDATE')
               OR pg_catalog.has_table_privilege(current_user,'public.organizations','DELETE') THEN
              RAISE EXCEPTION 'general runtime has forbidden direct tenant-root privilege';
            END IF;
            IF NOT pg_catalog.has_function_privilege(
                current_user,
                'app_secure.current_organization_profile()',
                'EXECUTE'
            ) OR NOT pg_catalog.has_function_privilege(
                current_user,
                'app_secure.update_current_organization_profile(jsonb)',
                'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'general runtime lacks P3A bounded profile capabilities';
            END IF;
          END
          $$;
          SQL

          PGPASSWORD="$AUTH_RUNTIME_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U auth_test_runtime -d gymflow_test <<'SQL'
          DO $$
          DECLARE runtime_record record;
          BEGIN
            SELECT * INTO runtime_record FROM pg_catalog.pg_roles WHERE rolname=current_user;
            IF current_user <> 'auth_test_runtime' OR current_database() <> 'gymflow_test' THEN
              RAISE EXCEPTION 'unexpected auth runtime identity/database';
            END IF;
            IF NOT runtime_record.rolcanlogin OR runtime_record.rolsuper
               OR runtime_record.rolcreatedb OR runtime_record.rolcreaterole
               OR runtime_record.rolinherit OR runtime_record.rolreplication
               OR runtime_record.rolbypassrls THEN
              RAISE EXCEPTION 'auth runtime role attributes are unsafe';
            END IF;
            IF NOT pg_catalog.has_table_privilege(current_user,'public.organizations','SELECT')
               OR NOT pg_catalog.has_table_privilege(current_user,'public.organizations','INSERT') THEN
              RAISE EXCEPTION 'auth runtime lost certified bootstrap read/create authority';
            END IF;
            IF pg_catalog.has_table_privilege(current_user,'public.organizations','UPDATE')
               OR pg_catalog.has_table_privilege(current_user,'public.organizations','DELETE')
               OR pg_catalog.has_table_privilege(current_user,'public.organizations','TRUNCATE') THEN
              RAISE EXCEPTION 'auth runtime retained forbidden direct tenant-root mutation';
            END IF;
            IF NOT pg_catalog.has_function_privilege(
                current_user,
                'app_secure.complete_current_organization_onboarding_profile(jsonb)',
                'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'auth runtime lacks bounded onboarding capability';
            END IF;
            IF pg_catalog.has_function_privilege(
                current_user,
                'app_secure.update_current_organization_profile(jsonb)',
                'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'auth runtime leaked ordinary profile mutation capability';
            END IF;
          END
          $$;
          SQL

          PGPASSWORD="$MAINTENANCE_RUNTIME_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U lifecycle_maintenance_test_runtime -d gymflow_test <<'SQL'
          DO $$
          DECLARE runtime_record record;
          BEGIN
            SELECT * INTO runtime_record FROM pg_catalog.pg_roles WHERE rolname=current_user;
            IF current_user <> 'lifecycle_maintenance_test_runtime'
               OR current_database() <> 'gymflow_test' THEN
              RAISE EXCEPTION 'unexpected maintenance runtime identity/database';
            END IF;
            IF NOT runtime_record.rolcanlogin OR runtime_record.rolsuper
               OR runtime_record.rolcreatedb OR runtime_record.rolcreaterole
               OR runtime_record.rolinherit OR runtime_record.rolreplication
               OR runtime_record.rolbypassrls THEN
              RAISE EXCEPTION 'maintenance runtime role attributes are unsafe';
            END IF;
            IF pg_catalog.has_table_privilege(current_user,'public.organizations','INSERT')
               OR pg_catalog.has_table_privilege(current_user,'public.organizations','UPDATE')
               OR pg_catalog.has_function_privilege(
                    current_user,
                    'app_secure.update_current_organization_profile(jsonb)',
                    'EXECUTE'
               ) THEN
              RAISE EXCEPTION 'maintenance runtime crossed tenant-root profile boundary';
            END IF;
          END
          $$;
          SQL

      - name: Run P3A HTTP/session static contracts explicitly
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q \
            tests/test_p3a_profile_http_authorization.py \
            tests/test_organization_profile_authorization_boundary.py \
            tests/test_organization_profile_principal_binding.py \
            tests/test_organization_onboarding_authorization_boundary.py

      - name: Run general regression suite fail-fast
        run: |
          set -euo pipefail
          python -m pytest -q --maxfail=1 --ignore=tests/platform_billing

      - name: Reprove cluster identity graph after regressions
        env:
          DOERS_CLUSTER_VERIFY_DATABASE_URL: postgresql+psycopg://migration_owner:ci-migration-owner@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          python -s scripts/verify_cluster_role_bootstrap.py
          python -s scripts/verify_cluster_identity_graph.py
