name: PAY-21 Pre-Production Certification

on:
  push:
    branches:
      - hardening/pay21-preproduction-certification
  pull_request:
    branches:
      - hardening/pay20-payment-performance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay21-preproduction-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAY21_BASE_SHA: 5abfeb7a9a3cee44fc362e1a80f74599a6f694ee
  PAY21_BASE_TREE: 996da603e4cdd088e91e0fef1ecc0dc7d7cddfea
  PAY21_ALEMBIC_HEAD: zz47d8e9f0a64
  PAY21_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: PAY-21 exact scope and pre-production contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/pay21_static_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: pay21-static-not-production
      AWS_ACCESS_KEY_ID: pay21-static
      AWS_SECRET_ACCESS_KEY: pay21-static
      S3_BUCKET_NAME: pay21-static
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY21_CANDIDATE_SHA }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
      - name: Prove frozen PAY-20 predecessor and exact PAY-21 scope
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PAY21_BASE_SHA^{tree}")" = "$PAY21_BASE_TREE"
          test "$(git merge-base "$PAY21_BASE_SHA" HEAD)" = "$PAY21_BASE_SHA"
          git diff --name-only "$PAY21_BASE_SHA...HEAD" > /tmp/pay21-changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              ".github/workflows/pay21-preproduction-certification.yml",
              "docs/architecture/PAY21_PREPRODUCTION_CERTIFICATION.md",
              "docs/architecture/pay21_preproduction_contract_v1.json",
              "scripts/ci/pay21_razorpay_test_mode_probe.py",
              "scripts/ci/run_pay21_preproduction_runtime.sh",
              "tests/test_pay21_preproduction_certification_static.py",
          }
          changed = {
              line.strip()
              for line in Path("/tmp/pay21-changed.txt").read_text().splitlines()
              if line.strip()
          }
          if changed != allowed:
              raise SystemExit(
                  f"PAY-21 exact scope mismatch: missing={sorted(allowed-changed)}, "
                  f"unexpected={sorted(changed-allowed)}"
              )
          migrations = sorted(path for path in changed if path.startswith("alembic/versions/"))
          if migrations:
              raise SystemExit(f"PAY-21 must not add a migration: {migrations}")
          print(f"PAY-21 exact allowlist paths: {len(changed)}")
          PY
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "$PAY21_ALEMBIC_HEAD"
      - name: Compile and prove PAY-21 contracts
        run: |
          set -euo pipefail
          python -m json.tool docs/architecture/pay21_preproduction_contract_v1.json >/dev/null
          bash -n scripts/ci/run_pay21_preproduction_runtime.sh
          python -m py_compile scripts/ci/pay21_razorpay_test_mode_probe.py tests/test_pay21_preproduction_certification_static.py
          python -m pytest --noconftest -q --maxfail=1 tests/test_pay21_preproduction_certification_static.py
          echo 'PAY21_PREPRODUCTION_CONTRACT=PASS'
          echo 'PAY21_NO_MIGRATION=PASS'
          echo 'PAY21_NO_NEW_MONEY_AUTHORITY=PASS'

  provider_test_mode:
    name: PAY-21 real Razorpay test-account HTTPS proof
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RAZORPAY_PROVIDER_MODE: test
      RAZORPAY_KEY_ID: ${{ secrets.PAY21_RAZORPAY_TEST_KEY_ID || secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.PAY21_RAZORPAY_TEST_KEY_SECRET || secrets.RAZORPAY_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.PAY21_RAZORPAY_TEST_WEBHOOK_SECRET || secrets.RAZORPAY_WEBHOOK_SECRET }}
      PAY21_PROVIDER_EVIDENCE: pay21-provider-evidence/razorpay-test-account.json
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY21_CANDIDATE_SHA }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
      - name: Prove encrypted test credentials and real Razorpay HTTPS
        run: |
          set -euo pipefail
          mkdir -p pay21-provider-evidence
          PYTHONPATH="$GITHUB_WORKSPACE" python -s scripts/ci/pay21_razorpay_test_mode_probe.py | tee pay21-provider-evidence/provider.log
          grep -q '^PAY21_RAZORPAY_TEST_ACCOUNT=PASS$' pay21-provider-evidence/provider.log
          grep -q '^PAY21_RAZORPAY_REAL_HTTPS=PASS$' pay21-provider-evidence/provider.log
          grep -q '^PAY21_RAZORPAY_LIVE_KEY=REJECTED$' pay21-provider-evidence/provider.log
          grep -q '^PAY21_REAL_MONEY_MOVEMENT=0$' pay21-provider-evidence/provider.log
          test -n "$RAZORPAY_KEY_SECRET"
          test -n "$RAZORPAY_WEBHOOK_SECRET"
          if grep -Fq "$RAZORPAY_KEY_SECRET" pay21-provider-evidence/provider.log; then
            echo 'PAY-21 Razorpay key secret leaked into provider log' >&2
            exit 1
          fi
          if grep -Fq "$RAZORPAY_WEBHOOK_SECRET" pay21-provider-evidence/provider.log; then
            echo 'PAY-21 Razorpay webhook secret leaked into provider log' >&2
            exit 1
          fi
      - name: Upload provider evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pay21-provider-${{ env.PAY21_CANDIDATE_SHA }}
          path: pay21-provider-evidence/
          if-no-files-found: error
          retention-days: 30

  production_runtime:
    name: PAY-21 production-image TLS PostgreSQL Redis Celery runtime
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PAY21_RUNTIME_EVIDENCE: pay21-runtime-evidence/runtime.json
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY21_CANDIDATE_SHA }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
      - name: Run production-shaped private-network runtime
        run: |
          set -euo pipefail
          mkdir -p pay21-runtime-evidence
          bash scripts/ci/run_pay21_preproduction_runtime.sh | tee pay21-runtime-evidence/runtime.log
          for marker in             PAY21_REAL_POSTGRESQL=PASS             PAY21_REAL_REDIS_TLS=PASS             PAY21_REAL_CELERY=PASS             PAY21_REAL_TLS_INGRESS=PASS             PAY21_REAL_OTLP_EXPORT=PASS             PAY21_PRODUCTION_IMAGE=PASS             PAY21_PRODUCTION_DB_ROLES=PASS             PAY21_NETWORK_CONTROLS=PASS             PAY21_BAD_DEPLOYMENT_ROLLBACK=PASS
          do
            grep -q "^$marker$" pay21-runtime-evidence/runtime.log
          done
      - name: Upload runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pay21-runtime-${{ env.PAY21_CANDIDATE_SHA }}
          path: pay21-runtime-evidence/
          if-no-files-found: error
          retention-days: 30

  finance_regression:
    name: PAY-21 exact-head Finance end-to-end matrix
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/finance-hardening-ci.yml

  member_payment_scenarios:
    name: PAY-21 member admission cash partial and renewal
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PAY20_ALEMBIC_HEAD: zz47d8e9f0a64
      PAY20_SYSTEM_DB: gymflow_pay21_member_test
      PAY20_MIGRATION_DB: gymflow_pay21_member_migration_test
      MIGRATION_PASSWORD: ci-pay21-member-migration
      GENERAL_RUNTIME_PASSWORD: ci-pay21-member-app
      AUTH_RUNTIME_PASSWORD: ci-pay21-member-auth
      WORKER_RUNTIME_PASSWORD: ci-pay21-member-worker
      MAINTENANCE_RUNTIME_PASSWORD: ci-pay21-member-maintenance
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay21-member-migration@127.0.0.1:5432/gymflow_pay21_member_test
      TEST_DATABASE_URL: postgresql+asyncpg://app_test_runtime:ci-pay21-member-app@127.0.0.1:5432/gymflow_pay21_member_test
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay21-member-migration@127.0.0.1:5432/gymflow_pay21_member_test
      AUTH_DATABASE_URL: postgresql+asyncpg://auth_test_runtime:ci-pay21-member-auth@127.0.0.1:5432/gymflow_pay21_member_test
      MAINTENANCE_DATABASE_URL: postgresql+asyncpg://lifecycle_maintenance_test_runtime:ci-pay21-member-maintenance@127.0.0.1:5432/gymflow_pay21_member_test
      PAY4_APP_DATABASE_URL: postgresql://app_test_runtime:ci-pay21-member-app@127.0.0.1:5432/gymflow_pay21_member_test
      PAY4_WORKER_DATABASE_URL: postgresql://worker_test_runtime:ci-pay21-member-worker@127.0.0.1:5432/gymflow_pay21_member_test
      PAY4_MIGRATION_DATABASE_URL: postgresql://migration_owner:ci-pay21-member-migration@127.0.0.1:5432/gymflow_pay21_member_test
      PAY4_ADMIN_DATABASE_URL: postgresql://postgres:ci-pay21-member-postgres@127.0.0.1:5432/gymflow_pay21_member_test
      PAY6_APP_DATABASE_URL: postgresql://app_test_runtime:ci-pay21-member-app@127.0.0.1:5432/gymflow_pay21_member_test
      PAY6_MIGRATION_DATABASE_URL: postgresql://migration_owner:ci-pay21-member-migration@127.0.0.1:5432/gymflow_pay21_member_test
      PAY6_ADMIN_DATABASE_URL: postgresql://postgres:ci-pay21-member-postgres@127.0.0.1:5432/gymflow_pay21_member_test
      PAY5_WORKER_DATABASE_URL: postgresql://worker_test_runtime:ci-pay21-member-worker@127.0.0.1:5432/gymflow_pay21_member_test
      PAY5_ADMIN_DATABASE_URL: postgresql://postgres:ci-pay21-member-postgres@127.0.0.1:5432/gymflow_pay21_member_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: pay21-member-not-production
      AWS_ACCESS_KEY_ID: pay21-member
      AWS_SECRET_ACCESS_KEY: pay21-member
      S3_BUCKET_NAME: pay21-member
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY21_CANDIDATE_SHA }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install and provision exact current head
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          bash scripts/ci/pay20_prepare_system_pg16.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres             -c "ALTER ROLE postgres PASSWORD 'ci-pay21-member-postgres';"
          test "$(python -s -m alembic -c alembic.ini current | awk '{print $1}')" = "$PAY21_ALEMBIC_HEAD"
      - name: Execute member-commerce pre-production matrix
        run: |
          set -euo pipefail
          python -m pytest -q --maxfail=1 \
            tests/test_pay4_member_finance_binding_runtime.py::test_pending_admission_and_binding_are_canonical_and_runtime_table_blind \
            tests/test_pay5_finance_event_delivery_runtime.py::test_two_consumers_racing_same_live_claim_converge_to_one_effect \
            tests/test_pay6_offline_payments_runtime.py::test_checker_approval_creates_canonical_payment_allocation_ledger_and_paid_event \
            tests/test_pay6_offline_payments_runtime.py::test_partial_offline_payment_updates_invoice_but_does_not_emit_paid_event
          # Re-seed one current-head pending admission outside pytest cleanup,
          # then materialize a true scheduled renewal child through the bounded
          # app_security_owner capability on the exact current schema. This
          # avoids a predecessor downgrade rehearsal in a PAY-21 runtime gate.
          PYTHONPATH="$GITHUB_WORKSPACE" python - <<'PY'
          from tests import test_pay4_member_finance_binding_runtime as pay4
          pay4._cleanup()
          parent_term = pay4._seed_pending()
          print(f"PAY21_RENEWAL_PARENT_TERM={parent_term}")
          PY
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d "$PAY20_SYSTEM_DB" <<'SQL'
          BEGIN;
          SELECT pg_catalog.set_config(
            'app.current_org_id',
            '44000000-0000-4000-8000-000000000001',
            true
          );
          SET LOCAL ROLE app_security_owner;

          WITH parent AS (
            SELECT *
            FROM public.subscription_terms
            WHERE legacy_member_subscription_v2_id =
              '44000000-0000-4000-8000-000000000041'::uuid
          ),
          child AS (
            INSERT INTO public.subscription_terms(
              id,org_id,branch_id,series_id,sequence_number,term_code,
              renewed_from_term_id,source_type,plan_id,
              plan_code_snapshot,plan_name_snapshot,duration_unit_snapshot,
              duration_value_snapshot,capacity_snapshot,currency_code,
              list_price_amount,discount_amount,tax_amount,final_amount,
              starts_on,base_ends_on,effective_ends_on,status,
              source_metadata,version
            )
            SELECT
              pg_catalog.gen_random_uuid(),org_id,branch_id,series_id,2,
              'PAY21-RENEWAL-2',id,'renewal',plan_id,
              plan_code_snapshot,plan_name_snapshot,duration_unit_snapshot,
              duration_value_snapshot,capacity_snapshot,currency_code,
              list_price_amount,discount_amount,tax_amount,final_amount,
              effective_ends_on + 1,effective_ends_on + 30,
              effective_ends_on + 30,'scheduled',
              pg_catalog.jsonb_build_object(
                'pay21','preproduction-renewal',
                'renewed_from_term_id',id::text
              ),1
            FROM parent
            RETURNING id,org_id,branch_id,series_id,renewed_from_term_id,
                      starts_on,effective_ends_on
          ),
          slot AS (
            INSERT INTO public.subscription_term_slots(
              id,org_id,term_id,slot_index,slot_role
            )
            SELECT pg_catalog.gen_random_uuid(),org_id,id,1,'primary'
            FROM child
            RETURNING id,org_id,term_id
          ),
          assignment AS (
            INSERT INTO public.subscription_slot_assignments(
              id,org_id,term_id,term_slot_id,member_id,
              effective_from,effective_until,assignment_state
            )
            SELECT
              pg_catalog.gen_random_uuid(),c.org_id,c.id,s.id,
              ser.primary_member_id,c.starts_on,c.effective_ends_on,'active'
            FROM child c
            JOIN slot s ON s.term_id=c.id
            JOIN public.subscription_series ser
              ON ser.id=c.series_id AND ser.org_id=c.org_id
            RETURNING id
          )
          INSERT INTO public.subscription_events(
            id,org_id,branch_id,series_id,term_id,event_type,
            event_source,correlation_id,idempotency_key,metadata
          )
          SELECT
            pg_catalog.gen_random_uuid(),org_id,branch_id,series_id,id,
            'renewal_scheduled','pay21_preproduction',
            'PAY21-RENEWAL-2','pay21:renewal:2',
            pg_catalog.jsonb_build_object(
              'renewed_from_term_id',renewed_from_term_id::text,
              'scheduled',true
            )
          FROM child;
          RESET ROLE;
          COMMIT;
          SQL
          renewal_state="$(sudo -u postgres psql -X -qAt -v ON_ERROR_STOP=1 \
            -d "$PAY20_SYSTEM_DB" -c "
              SELECT
                t.source_type::text||'|'||t.status::text||'|'||
                (t.renewed_from_term_id IS NOT NULL)::int||'|'||
                count(e.id)::text
              FROM public.subscription_terms t
              LEFT JOIN public.subscription_events e
                ON e.term_id=t.id AND e.event_type='renewal_scheduled'
              WHERE t.term_code='PAY21-RENEWAL-2'
              GROUP BY t.source_type,t.status,t.renewed_from_term_id
            ")"
          test "$renewal_state" = "renewal|scheduled|1|1"
          echo 'PAY21_MEMBER_ADMISSION=PASS'
          echo 'PAY21_MEMBER_ENTITLEMENT_EXACT_ONCE=PASS'
          echo 'PAY21_CASH_PAYMENT=PASS'
          echo 'PAY21_PARTIAL_PAYMENT=PASS'
          echo 'PAY21_RENEWAL=PASS'

  finance_matrix_decision:
    name: PAY-21 online payment refund settlement and failed-payment decision
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs:
      - provider_test_mode
      - finance_regression
    runs-on: ubuntu-24.04
    steps:
      - name: Require provider and full Finance matrix
        env:
          PROVIDER_RESULT: ${{ needs.provider_test_mode.result }}
          FINANCE_RESULT: ${{ needs.finance_regression.result }}
        run: |
          set -euo pipefail
          test "$PROVIDER_RESULT" = success
          test "$FINANCE_RESULT" = success
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY21_CANDIDATE_SHA }}
      - name: Bind scenario coverage to current Finance tests
        run: |
          set -euo pipefail
          grep -q 'test_phase6v_sandbox_checkout_route_uses_razorpay_test_mode_adapter_with_injected_transport' tests/finance_core/test_phase6v_test_mode_checkout_route_integration.py
          grep -q 'test_phase6w_sandbox_webhook_route_verifies_raw_body_signature_and_updates_state_only' tests/finance_core/test_phase6w_test_mode_webhook_route_signature.py
          grep -q 'test_create_refund_intent_for_eligible_payment_without_provider_execution' tests/finance_core/test_phase5j_refund_credit_note_reversal.py
          grep -q 'test_concurrent_refund_intents_serialize_on_payment_and_cannot_over_refund' tests/finance_core/test_phase5j_refund_credit_note_reversal.py
          grep -q 'test_partial_and_full_explicit_settlement_update_invoice_status' tests/finance_core/test_phase5h_invoice_settlement_gate.py
          grep -q 'test_non_captured_or_non_settled_payment_cannot_be_applied' tests/finance_core/test_phase5h_invoice_settlement_gate.py
          echo 'PAY21_ONLINE_PAYMENT=PASS'
          echo 'PAY21_REFUND=PASS'
          echo 'PAY21_PARTIAL_REFUND=PASS'
          echo 'PAY21_SETTLEMENT=PASS'
          echo 'PAY21_FAILED_PAYMENT=PASS'

  platform_scenarios:
    name: PAY-21 platform subscription recurring dunning mandate dispute reconciliation
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay21-platform-migration@127.0.0.1:5432/gymflow_platform_billing_test_pay21
      PLATFORM_BILLING_TEST_DATABASE_URL: postgresql+asyncpg://pay21_platform_fixture:ci-pay21-platform-fixture@127.0.0.1:5432/gymflow_platform_billing_test_pay21
      PLATFORM_BILLING_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay21-platform-migration@127.0.0.1:5432/gymflow_platform_billing_test_pay21
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: pay21-platform-not-production
      AWS_ACCESS_KEY_ID: pay21-platform
      AWS_SECRET_ACCESS_KEY: pay21-platform
      S3_BUCKET_NAME: pay21-platform
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY21_CANDIDATE_SHA }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Provision Platform Billing database
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-pay21-platform-migration';
          CREATE ROLE pay21_platform_fixture LOGIN PASSWORD 'ci-pay21-platform-fixture'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          ALTER ROLE pay21_platform_fixture SET row_security='on';
          ALTER ROLE pay21_platform_fixture SET statement_timeout='15s';
          ALTER ROLE pay21_platform_fixture SET lock_timeout='3s';
          ALTER ROLE pay21_platform_fixture SET idle_in_transaction_session_timeout='30s';
          CREATE DATABASE gymflow_platform_billing_test_pay21 OWNER migration_owner;
          REVOKE ALL ON DATABASE gymflow_platform_billing_test_pay21 FROM PUBLIC;
