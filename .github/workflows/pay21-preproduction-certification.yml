          echo 'PAY21_LIVE_RAZORPAY_KEY=0'
          echo 'PAY21_PRODUCTION_DEPLOYMENT=NOT_AUTHORIZED'
          echo 'PAY21_PREPRODUCTION_CERTIFICATION=PASS'
