      AUTH_RUNTIME_PASSWORD: ci-pay21-recovery-auth
      APP_RUNTIME_PASSWORD: ci-pay21-recovery-app
      WORKER_RUNTIME_PASSWORD: ci-pay21-recovery-worker
      MAINTENANCE_RUNTIME_PASSWORD: ci-pay21-recovery-maintenance
      FINANCE_CONFIG_RUNTIME_PASSWORD: ci-pay21-recovery-config
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay21-recovery-migration@127.0.0.1:5432/gymflow_pay21_recovery_test
      FINANCE_CORE_TEST_DATABASE_URL: postgresql+asyncpg://finance_core_test_subject:ci-pay21-recovery-finance@127.0.0.1:5432/gymflow_pay21_recovery_test
      FINANCE_CORE_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay21-recovery-migration@127.0.0.1:5432/gymflow_pay21_recovery_test
      TEST_DATABASE_URL: postgresql+asyncpg://app_test_runtime:ci-pay21-recovery-app@127.0.0.1:5432/gymflow_pay21_recovery_test
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay21-recovery-migration@127.0.0.1:5432/gymflow_pay21_recovery_test
      FINANCE_CONFIG_DATABASE_URL: postgresql://finance_config_deployment:ci-pay21-recovery-config@127.0.0.1:5432/gymflow_pay21_recovery_test
      PAY17_RECON_DATABASE_URL: postgresql+asyncpg://pay17_recon_test:ci-pay21-recovery-recon@127.0.0.1:5432/gymflow_pay21_recovery_test
      PAY9_APP_DATABASE_URL: postgresql://app_test_runtime:ci-pay21-recovery-app@127.0.0.1:5432/gymflow_pay21_recovery_test
      PAY9_PAYMENT_DATABASE_URL: postgresql://pay9_payment_test:ci-pay21-recovery-payment@127.0.0.1:5432/gymflow_pay21_recovery_test
      PAY9_WORKER_DATABASE_URL: postgresql://worker_test_runtime:ci-pay21-recovery-worker@127.0.0.1:5432/gymflow_pay21_recovery_test
      PAY9_ADMIN_DATABASE_URL: postgresql://postgres:ci-pay21-recovery-postgres@127.0.0.1:5432/gymflow_pay21_recovery_test
      PAY9_MIGRATION_DATABASE_URL: postgresql://migration_owner:ci-pay21-recovery-migration@127.0.0.1:5432/gymflow_pay21_recovery_test
      PAY4_APP_DATABASE_URL: postgresql://app_test_runtime:ci-pay21-recovery-app@127.0.0.1:5432/gymflow_pay21_recovery_test
      PAY4_WORKER_DATABASE_URL: postgresql://worker_test_runtime:ci-pay21-recovery-worker@127.0.0.1:5432/gymflow_pay21_recovery_test
      PAY4_ADMIN_DATABASE_URL: postgresql://postgres:ci-pay21-recovery-postgres@127.0.0.1:5432/gymflow_pay21_recovery_test
      PAY4_MIGRATION_DATABASE_URL: postgresql://migration_owner:ci-pay21-recovery-migration@127.0.0.1:5432/gymflow_pay21_recovery_test
      PAY5_WORKER_DATABASE_URL: postgresql://worker_test_runtime:ci-pay21-recovery-worker@127.0.0.1:5432/gymflow_pay21_recovery_test
      PAY5_ADMIN_DATABASE_URL: postgresql://postgres:ci-pay21-recovery-postgres@127.0.0.1:5432/gymflow_pay21_recovery_test
      WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:ci-pay21-recovery-worker@127.0.0.1:5432/gymflow_pay21_recovery_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: pay21-recovery-not-production
      AWS_ACCESS_KEY_ID: pay21-recovery
      AWS_SECRET_ACCESS_KEY: pay21-recovery
      S3_BUCKET_NAME: pay21-recovery
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY21_CANDIDATE_SHA }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Provision recovery source
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          mkdir -p "$EVIDENCE_DIR"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE postgres PASSWORD 'ci-pay21-recovery-postgres';
          ALTER ROLE migration_owner PASSWORD 'ci-pay21-recovery-migration';
          CREATE ROLE test_runner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE finance_core_test_subject LOGIN PASSWORD 'ci-pay21-recovery-finance' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_test_runtime LOGIN PASSWORD 'ci-pay21-recovery-app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE worker_test_runtime LOGIN PASSWORD 'ci-pay21-recovery-worker' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE lifecycle_maintenance_test_runtime LOGIN PASSWORD 'ci-pay21-recovery-maintenance' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE finance_config_deployment LOGIN PASSWORD 'ci-pay21-recovery-config' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE pay17_recon_test LOGIN PASSWORD 'ci-pay21-recovery-recon' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE pay9_payment_test LOGIN PASSWORD 'ci-pay21-recovery-payment' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT test_runner TO finance_core_test_subject WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_runtime TO finance_core_test_subject WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO finance_core_test_subject WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_runtime TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT worker_runtime TO worker_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT lifecycle_maintenance_runtime TO lifecycle_maintenance_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT finance_config_runtime TO finance_config_deployment WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT finance_reconciliation_runtime TO pay17_recon_test WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT finance_payment_runtime TO pay9_payment_test WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          ALTER ROLE finance_core_test_subject SET row_security='on';
          ALTER ROLE app_test_runtime SET row_security='on';
          ALTER ROLE worker_test_runtime SET row_security='on';
          ALTER ROLE lifecycle_maintenance_test_runtime SET row_security='on';
          ALTER ROLE finance_config_deployment SET row_security='on';
          ALTER ROLE pay17_recon_test SET row_security='on';
          ALTER ROLE pay9_payment_test SET row_security='on';
          CREATE DATABASE gymflow_pay21_recovery_test OWNER migration_owner;
          REVOKE ALL ON DATABASE gymflow_pay21_recovery_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE gymflow_pay21_recovery_test TO finance_core_test_subject,app_test_runtime,worker_test_runtime,lifecycle_maintenance_test_runtime,finance_config_deployment,pay17_recon_test,pay9_payment_test;
          SQL
          bash scripts/ci/provision_infrastructure_extensions.sh "$SOURCE_DB"
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads
          DATABASE_URL="$FINANCE_CORE_TEST_DATABASE_URL" PAY19_SEED_EVIDENCE="$EVIDENCE_DIR/seed.json" PYTHONPATH="$GITHUB_WORKSPACE"             python -s scripts/ci/pay19_seed_financial_state.py | tee "$EVIDENCE_DIR/seed.log"
          grep -q '^PAY19_SYNTHETIC_FINANCIAL_STATE=PASS$' "$EVIDENCE_DIR/seed.log"
          sudo -u postgres psql -X -qAt -v ON_ERROR_STOP=1 -d "$SOURCE_DB"             -f scripts/ci/pay19_financial_fingerprint.sql > "$EVIDENCE_DIR/source-finance.txt"
      - name: Backup restore and compare financial fingerprint
        run: |
          set -euo pipefail
          sudo -u postgres pg_dump --format=custom --dbname="$SOURCE_DB" --file="$BACKUP_FILE"
          sudo -u postgres test -s "$BACKUP_FILE"
          sudo -u postgres sha256sum "$BACKUP_FILE" > "$EVIDENCE_DIR/backup.sha256"
          sudo -u postgres pg_restore --list "$BACKUP_FILE" > "$EVIDENCE_DIR/backup-toc.txt"
          grep -q 'payment_application_records' "$EVIDENCE_DIR/backup-toc.txt"
          grep -q 'refund_execution_commands' "$EVIDENCE_DIR/backup-toc.txt"
          sudo -u postgres createdb -T template0 -O migration_owner "$RESTORE_DB"
          # Disaster restore is an infrastructure-admin operation. Preserve the
          # dump's protected owners/ACLs and extension ownership exactly; do
          # not incorrectly elevate migration_owner into cluster/extension
          # authority just to make a restore green.
          sudo -u postgres pg_restore --exit-on-error --dbname="$RESTORE_DB" "$BACKUP_FILE" \
            > "$EVIDENCE_DIR/restore.log"
          test "$(sudo -u postgres psql -X -qAt -v ON_ERROR_STOP=1 -d "$RESTORE_DB" -c "
            SELECT r.rolname
            FROM pg_catalog.pg_extension e
            JOIN pg_catalog.pg_roles r ON r.oid=e.extowner
            WHERE e.extname='pg_partman'
          ")" = "postgres"
          test "$(sudo -u postgres psql -X -qAt -v ON_ERROR_STOP=1 -d postgres -c "
            SELECT (NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND
                    NOT rolinherit AND NOT rolreplication AND NOT rolbypassrls)::int
            FROM pg_catalog.pg_roles WHERE rolname='migration_owner'
          ")" = "1"
          sudo -u postgres psql -X -qAt -v ON_ERROR_STOP=1 -d "$RESTORE_DB"             -f scripts/ci/pay19_financial_fingerprint.sql > "$EVIDENCE_DIR/restored-finance.txt"
          diff -u "$EVIDENCE_DIR/source-finance.txt" "$EVIDENCE_DIR/restored-finance.txt"
          echo 'PAY21_RECOVERY_INFRA_AUTHORITY=PASS'
          echo 'PAY21_BACKUP_RESTORE=PASS'
          echo 'PAY21_FINANCIAL_FINGERPRINT_PRESERVED=PASS'
      - name: Upload recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pay21-recovery-${{ env.PAY21_CANDIDATE_SHA }}
          path: pay21-recovery-evidence/
          if-no-files-found: error
          retention-days: 30

  certify:
    name: PAY-21 final pre-production decision
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs:
      - contract
      - provider_test_mode
      - production_runtime
      - finance_regression
      - member_payment_scenarios
      - finance_matrix_decision
      - platform_scenarios
      - backup_restore
    runs-on: ubuntu-24.04
    steps:
      - name: Require every exact-head PAY-21 gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          data = json.loads(os.environ["RESULTS"])
          bad = {key: value["result"] for key, value in data.items() if value["result"] != "success"}
          if bad:
              raise SystemExit(f"PAY-21 prerequisite failure: {bad}")
          print("PAY21_REQUIRED_EXACT_HEAD_GATES=PASS")
          PY
      - name: Bind terminal decision to exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY21_CANDIDATE_SHA }}
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PAY21_CANDIDATE_SHA"
          test "$(git rev-parse "$PAY21_BASE_SHA^{tree}")" = "$PAY21_BASE_TREE"
          test "$(git merge-base "$PAY21_BASE_SHA" HEAD)" = "$PAY21_BASE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          echo 'PAY21_REAL_POSTGRESQL=PASS'
          echo 'PAY21_REAL_REDIS=PASS'
          echo 'PAY21_REAL_CELERY=PASS'
          echo 'PAY21_REAL_TLS=PASS'
