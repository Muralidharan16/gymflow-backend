          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_platform_billing_test_pay21
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_platform_billing_test_pay21 <<'SQL'
