      - name: Execute Platform Billing pre-production matrix
        run: |
          set -euo pipefail
          python -m pytest -q --maxfail=1             tests/platform_billing/test_pay11_production_model.py::test_pay11_provider_invoice_payment_credit_and_refund_invariants             tests/platform_billing/test_pay12_recurring_dunning_pg16.py::test_pay12_pg16_durable_lifecycle_invariants             tests/platform_billing/test_pay12_recurring_dunning_pg16.py::test_pay12_recurring_job_final_attempt_crash_reclaim_and_exact_owner             tests/platform_billing/test_pay13_disputes_pg16.py::test_pay13_open_dispute_preserves_capture_and_freezes_money_actions             tests/platform_billing/test_pay14_reconciliation_accounting_pg16.py::test_pay14_authoritative_three_way_match_closes_without_money_mutation
          echo 'PAY21_PLATFORM_SUBSCRIPTION=PASS'
          echo 'PAY21_RECURRING_ATTEMPT=PASS'
          echo 'PAY21_DUNNING=PASS'
          echo 'PAY21_MANDATE_REVOCATION=PASS'
          echo 'PAY21_DISPUTE_SIMULATION=PASS'
          echo 'PAY21_SETTLEMENT_RECONCILIATION=PASS'

  backup_restore:
    name: PAY-21 current-head financial backup and restore
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SOURCE_DB: gymflow_pay21_recovery_test
      RESTORE_DB: gymflow_pay21_recovery_restore_test
