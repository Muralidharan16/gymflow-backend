name: P3B Migration Certification

on:
  pull_request:
    branches:
      - hardening/p3a-organization-profile-authorization
      - hardening/complete-migration-lineage
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3b-migration-cert-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p3b-migration-certification:
    name: P3A boundary to P3B HEAD to boundary to HEAD equivalence
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      MIGRATION_PASSWORD: ci-migration-owner
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_p3b_migration_cert
      P3B_MIGRATION_DSN: postgresql://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_p3b_migration_cert
      PGPASSWORD: ci-migration-owner
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-p3b-migration-not-production
      AWS_ACCESS_KEY_ID: ci-p3b
      AWS_SECRET_ACCESS_KEY: ci-p3b
      AWS_REGION_NAME: us-east-1
      S3_BUCKET_NAME: gymflow-p3b-test
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install locked test environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check

      - name: Install PostgreSQL 16
        run: bash scripts/ci/install_pg16_test_stack.sh

      - name: Bootstrap canonical reduced roles and certification database
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-migration-owner';
          CREATE DATABASE gymflow_p3b_migration_cert OWNER migration_owner;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p3b_migration_cert

      - name: Verify migration graph and static semantics
        run: |
          set -euo pipefail
          python -s scripts/verify_alembic_graph.py
          python -s scripts/migration_semantics_gate.py

      - name: Establish certified P3A Alembic boundary and preservation sentinel
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade c87d8e9f0a22
          test "$(psql -X -At -h 127.0.0.1 -U migration_owner \
            -d gymflow_p3b_migration_cert \
            -c 'SELECT version_num FROM alembic_version')" = 'c87d8e9f0a22'
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U migration_owner \
            -d gymflow_p3b_migration_cert <<'SQL'
          INSERT INTO public.organizations (id, name, slug, tier, is_active)
          VALUES (
            '77777777-7777-4777-8777-777777777771',
            'P3B Migration Preservation',
            'p3b-migration-preservation',
            'basic',
            TRUE
          );
          SQL

      - name: Capture normalized P3A boundary schema and ACL fingerprint
        run: |
          set -euo pipefail
          # Schema fingerprinting is infrastructure introspection, not a
          # migration/runtime capability. Keep reduced migration_owner untouched.
          # PostgreSQL 16 emits per-dump random \restrict/\unrestrict guard
          # tokens; strip only those non-semantic guards before equivalence diff.
          sudo -u postgres pg_dump \
            -d gymflow_p3b_migration_cert \
            --schema-only --no-owner --no-comments \
            | sed '/^--/d;/^$/d' \
            | grep -v -E '^\\(restrict|unrestrict) ' > /tmp/p3b-base-1.sql
          test -s /tmp/p3b-base-1.sql

      - name: Upgrade to final P3B HEAD and capture final fingerprint
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads
          python -s scripts/ci/verify_p3b_registration_contract_boundary.py --expect final
          test "$(psql -X -At -h 127.0.0.1 -U migration_owner \
            -d gymflow_p3b_migration_cert \
            -c "SELECT count(*) FROM public.organizations WHERE id='77777777-7777-4777-8777-777777777771'::uuid")" = '1'
          sudo -u postgres pg_dump \
            -d gymflow_p3b_migration_cert \
            --schema-only --no-owner --no-comments \
            | sed '/^--/d;/^$/d' \
            | grep -v -E '^\\(restrict|unrestrict) ' > /tmp/p3b-head-1.sql
          test -s /tmp/p3b-head-1.sql

      - name: Downgrade exactly to P3A boundary and prove equivalence
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini downgrade c87d8e9f0a22
          test "$(psql -X -At -h 127.0.0.1 -U migration_owner \
            -d gymflow_p3b_migration_cert \
            -c 'SELECT version_num FROM alembic_version')" = 'c87d8e9f0a22'
          test "$(psql -X -At -h 127.0.0.1 -U migration_owner \
            -d gymflow_p3b_migration_cert \
            -c "SELECT count(*) FROM public.organizations WHERE id='77777777-7777-4777-8777-777777777771'::uuid")" = '1'
          sudo -u postgres pg_dump \
            -d gymflow_p3b_migration_cert \
            --schema-only --no-owner --no-comments \
            | sed '/^--/d;/^$/d' \
            | grep -v -E '^\\(restrict|unrestrict) ' > /tmp/p3b-base-2.sql
          diff -u /tmp/p3b-base-1.sql /tmp/p3b-base-2.sql

      - name: Reupgrade to final P3B HEAD and prove equivalence
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads
          python -s scripts/ci/verify_p3b_registration_contract_boundary.py --expect final
          test "$(psql -X -At -h 127.0.0.1 -U migration_owner \
            -d gymflow_p3b_migration_cert \
            -c "SELECT count(*) FROM public.organizations WHERE id='77777777-7777-4777-8777-777777777771'::uuid")" = '1'
          sudo -u postgres pg_dump \
            -d gymflow_p3b_migration_cert \
            --schema-only --no-owner --no-comments \
            | sed '/^--/d;/^$/d' \
            | grep -v -E '^\\(restrict|unrestrict) ' > /tmp/p3b-head-2.sql
          diff -u /tmp/p3b-head-1.sql /tmp/p3b-head-2.sql

      - name: Reprove cluster identity graph
        env:
          DOERS_CLUSTER_VERIFY_DATABASE_URL: postgresql+psycopg://migration_owner:ci-migration-owner@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          python -s scripts/verify_cluster_role_bootstrap.py
          python -s scripts/verify_cluster_identity_graph.py
