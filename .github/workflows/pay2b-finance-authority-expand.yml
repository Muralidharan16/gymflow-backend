name: PAY-2B Finance Authority Expand

on:
  push:
    branches:
      - hardening/pay2b-finance-authority-expand
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay2b-finance-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: PAY-2B focused PG16 authority migration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MIGRATION_PASSWORD: ci-migration-owner
      PAY2B_DATABASE: gymflow_pay2b
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_pay2b
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check

      - name: Exact scope and static migration proof
        run: |
          set -euo pipefail
          BASE=b529916020a03cfc3d9875fec0462944deea8622
          test "$(git rev-parse "${BASE}^{tree}")" = "da83cea04820096dc6e46008570381a387b3ba02"
          git merge-base --is-ancestor "${BASE}" HEAD
          git diff --name-only "${BASE}...HEAD" > /tmp/pay2b-changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              ".github/workflows/pay2b-finance-authority-expand.yml",
              "alembic/versions/zl07d8e9f0a46_pay2_finance_authority_expand.py",
              "docs/architecture/PAY2_FINANCIAL_AUTHORITY_DB_SECURITY.md",
              "docs/architecture/pay2_financial_authority_v1.json",
              "scripts/ci/pay2b_finance_authority_runtime.py",
              "tests/test_pay2b_finance_authority_expand.py",
          }
          changed = {line.strip() for line in Path("/tmp/pay2b-changed.txt").read_text().splitlines() if line.strip()}
          if changed != allowed:
              raise SystemExit(f"PAY-2B exact scope mismatch: {sorted(changed)}")
          migrations = sorted(path for path in changed if path.startswith("alembic/versions/"))
          if migrations != ["alembic/versions/zl07d8e9f0a46_pay2_finance_authority_expand.py"]:
              raise SystemExit(f"PAY-2B migration scope mismatch: {migrations}")
          PY
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "zl07d8e9f0a46"
          python -m pytest --noconftest -q             tests/test_pay2a_finance_identity_isolation.py             tests/test_pay2b_finance_authority_expand.py
          echo 'PAY2B_STATIC_AUTHORITY=PASS'

      - name: Install PostgreSQL 16 stack
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-migration-owner';
          CREATE DATABASE gymflow_pay2b OWNER migration_owner;
          SQL
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_pay2b
          DOERS_CLUSTER_VERIFY_DATABASE_URL='postgresql+psycopg://migration_owner:ci-migration-owner@127.0.0.1:5432/postgres'             python -s scripts/verify_cluster_role_bootstrap.py
          DOERS_CLUSTER_VERIFY_DATABASE_URL='postgresql+psycopg://migration_owner:ci-migration-owner@127.0.0.1:5432/postgres'             python -s scripts/verify_cluster_identity_graph.py

      - name: Upgrade exact predecessor then PAY-2B
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade zk07d8e9f0a45
          python -s -m alembic -c alembic.ini current
          python -s -m alembic -c alembic.ini upgrade zl07d8e9f0a46
          python -s -m alembic -c alembic.ini current --check-heads

      - name: Provision disposable Finance login overlays
        run: |
          set -euo pipefail
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          CREATE ROLE pay2b_finance_login LOGIN PASSWORD 'ci-finance' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE pay2b_finance_read_login LOGIN PASSWORD 'ci-read' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE pay2b_payment_worker_login LOGIN PASSWORD 'ci-payment' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE pay2b_refund_login LOGIN PASSWORD 'ci-refund' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE pay2b_recon_login LOGIN PASSWORD 'ci-recon' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE pay2b_maintenance_login LOGIN PASSWORD 'ci-maint' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT finance_runtime TO pay2b_finance_login WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT finance_read_runtime TO pay2b_finance_read_login WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT payment_worker_runtime TO pay2b_payment_worker_login WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT refund_runtime TO pay2b_refund_login WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT finance_reconciliation_runtime TO pay2b_recon_login WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT finance_maintenance_runtime TO pay2b_maintenance_login WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT CONNECT ON DATABASE gymflow_pay2b TO
            pay2b_finance_login,pay2b_finance_read_login,pay2b_payment_worker_login,
            pay2b_refund_login,pay2b_recon_login,pay2b_maintenance_login;
          SQL

      - name: Prove runtime capability and tenant isolation
        run: |
          set -euo pipefail
          python scripts/ci/pay2b_finance_authority_runtime.py
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_pay2b <<'SQL'
          DO $$
          DECLARE role_name text;
          BEGIN
            FOREACH role_name IN ARRAY ARRAY[
              'finance_runtime','finance_read_runtime','payment_worker_runtime',
              'refund_runtime','finance_reconciliation_runtime','finance_maintenance_runtime'
            ] LOOP
              IF pg_catalog.has_schema_privilege(role_name,'finance','USAGE')
                 OR pg_catalog.has_schema_privilege(role_name,'finance','CREATE') THEN
                RAISE EXCEPTION 'direct Finance schema authority leaked to %', role_name;
              END IF;
              IF EXISTS (
                SELECT 1 FROM information_schema.role_table_grants
                WHERE grantee=role_name AND table_schema='finance'
              ) THEN
                RAISE EXCEPTION 'direct Finance table authority leaked to %', role_name;
              END IF;
            END LOOP;
          END
          $$;
          SQL
          echo 'PAY2B_RUNTIME_AUTHORITY=PASS'

      - name: Focused downgrade and re-upgrade
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini downgrade zk07d8e9f0a45
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 \
            -U migration_owner -d gymflow_pay2b -Atqc \
            "SELECT pg_catalog.to_regprocedure('app_secure.require_finance_capability(text,boolean)') IS NULL;" \
            | grep -qx t
          python -s -m alembic -c alembic.ini upgrade zl07d8e9f0a46
          python scripts/ci/pay2b_finance_authority_runtime.py
          echo 'PAY2B_DOWNGRADE_REUPGRADE=PASS'

  migration_lifecycle:
    name: Inherited migration lifecycle
    uses: ./.github/workflows/migration-lifecycle-ci.yml

  migration_preservation:
    name: Inherited populated migration preservation
    uses: ./.github/workflows/migration-data-preservation-ci.yml

  migration_adversarial:
    name: Inherited adversarial migration safety
    uses: ./.github/workflows/migration-adversarial-safety-ci.yml

  migration_contracts:
    name: Inherited migration ownership/rollback contracts
    uses: ./.github/workflows/migration-lifecycle-contracts.yml

  migration_semantics:
    name: Inherited migration semantics
    uses: ./.github/workflows/migration-semantics-inventory.yml

  certify:
    name: Terminal PAY-2B expand decision
    if: ${{ always() }}
    needs:
      - focused
      - migration_lifecycle
      - migration_preservation
      - migration_adversarial
      - migration_contracts
      - migration_semantics
    runs-on: ubuntu-24.04
    steps:
      - name: Require all gates
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          needs=json.loads(os.environ["NEEDS_JSON"])
          bad={k:v["result"] for k,v in needs.items() if v["result"]!="success"}
          if bad:
              raise SystemExit(f"PAY-2B prerequisite failure: {bad}")
          PY
          echo 'PAY2B_FINANCE_AUTHORITY_EXPAND=PASS'
          echo 'PAY2B_MIGRATION_LIFECYCLE=PASS'
          echo 'PAY2_LIVE_MONEY_MOVEMENT=DISABLED'
          echo 'PAY2_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'
