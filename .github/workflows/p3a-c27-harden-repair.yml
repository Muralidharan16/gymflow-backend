name: P3A c27 Input Contract Repair

on:
  push:
    branches:
      - hardening/p3a-organization-profile-authorization
    paths:
      - .github/workflows/p3a-c27-harden-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Apply exact source repair
        run: |
          set -euo pipefail
          python scripts/p3a_c27_harden_repair.py
          python -m py_compile alembic/versions/c27d8e9f0a1c_organization_onboarding_authorization.py tests/test_organization_onboarding_authorization_boundary.py
          git diff --check
          grep -n "organization onboarding phone is invalid" alembic/versions/c27d8e9f0a1c_organization_onboarding_authorization.py
          git rm scripts/p3a_c27_harden_repair.py .github/workflows/p3a-c27-harden-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alembic/versions/c27d8e9f0a1c_organization_onboarding_authorization.py tests/test_organization_onboarding_authorization_boundary.py
          git commit -m 'fix: mirror onboarding input invariants in DB capability'
          git push origin HEAD:hardening/p3a-organization-profile-authorization
