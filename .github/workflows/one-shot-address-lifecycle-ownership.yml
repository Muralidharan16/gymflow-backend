name: One-shot address lifecycle ownership patch

on:
  push:
    branches:
      - hardening/complete-migration-lineage
    paths:
      - .github/workflows/one-shot-address-lifecycle-ownership.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/complete-migration-lineage
          fetch-depth: 0

      - name: Correct 00f rollback order and 6f RLS ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          m00f = Path('alembic/versions/00f277c748ea_add_hyperscale_branch_name_and_address_.py')
          text = m00f.read_text(encoding='utf-8')
          old = '''    op.execute("DROP VIEW v_public_branch_addresses;")
    op.execute("REVOKE SELECT ON v_public_branch_addresses FROM branch_viewer;")
    # The REVOKE above is intentionally harmless if ownership already dropped
    # with the view; privileges on a dropped view cannot survive.
'''
          new = '''    # Remove the explicit reader ACL while the relation still exists, then
    # remove the 00f-owned view.  Revoke-after-drop is not a valid inverse and
    # must fail rather than be hidden behind IF EXISTS.
    op.execute("REVOKE SELECT ON v_public_branch_addresses FROM branch_viewer;")
    op.execute("DROP VIEW v_public_branch_addresses;")
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one 00f revoke/drop block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          if text.index('REVOKE SELECT ON v_public_branch_addresses') > text.index('DROP VIEW v_public_branch_addresses'):
              raise SystemExit('00f public-view ACL is still revoked after the view is dropped')
          m00f.write_text(text, encoding='utf-8')

          m6f = Path('alembic/versions/6f708192a3b4_address_runtime_privilege_boundary.py')
          text = m6f.read_text(encoding='utf-8')

          old_doc = '''The historical address hardening revision created tenant policies and set FORCE
ROW LEVEL SECURITY, but never ENABLEd RLS on the protected relations. This left
the policy catalog present while enforcement remained disabled. It also granted
address writes only to the legacy NOLOGIN ``branch_admin`` role even though the
production address API uses the ordinary application database pool.

Forward contract:
* ENABLE + FORCE RLS on the five address relations that already have tenant
  policies;
* grant app_runtime only SELECT/INSERT/UPDATE on organization_addresses;
'''
          new_doc = '''The repaired 00f expand/compatibility revision owns creation of the address
security surface and already ENABLEs + FORCEs RLS on its protected relations.
This revision therefore adopts that enforced predecessor state and owns only the
runtime execution boundary that follows it.  Keeping a single RLS owner prevents
later migrations from disabling and re-enabling tenant isolation as an incidental
side effect.  The historical surface also granted address writes only to the
legacy NOLOGIN ``branch_admin`` role even though the production address API uses
the ordinary application database pool.

Forward contract:
* require ENABLE + FORCE RLS on the five protected address relations without
  toggling those predecessor-owned flags;
* grant app_runtime only SELECT/INSERT/UPDATE on organization_addresses;
'''
          if text.count(old_doc) != 1:
              raise SystemExit('6f forward ownership doc block drifted')
          text = text.replace(old_doc, new_doc, 1)

          old_down_doc = '''Downgrade restores the exact predecessor flag/ACL/trigger state: FORCE remains
set, RLS is disabled, hardened functions/policy/ACLs are removed, and predecessor
triggers are restored.
'''
          new_down_doc = '''Downgrade restores the exact predecessor ACL/trigger state: ENABLE + FORCE RLS
remain untouched as 00f-owned security state, hardened functions/policy/ACLs are
removed, and predecessor triggers are restored.
'''
          if text.count(old_down_doc) != 1:
              raise SystemExit('6f downgrade ownership doc block drifted')
          text = text.replace(old_down_doc, new_down_doc, 1)

          old_pred = '''def _require_predecessor(bind) -> None:
    _require_rls_flags(bind, enabled=False)
'''
          new_pred = '''def _require_predecessor(bind) -> None:
    # 00f owns the RLS security surface.  A valid predecessor must already be
    # enforcing it; 6f must never create a temporary non-RLS window.
    _require_rls_flags(bind, enabled=True)
'''
          if text.count(old_pred) != 1:
              raise SystemExit('6f predecessor RLS expectation drifted')
          text = text.replace(old_pred, new_pred, 1)

          old_upgrade = '''    for relation_name in _RLS_RELATIONS:
        op.execute(f"ALTER TABLE public.{relation_name} ENABLE ROW LEVEL SECURITY")

'''
          if text.count(old_upgrade) != 1:
              raise SystemExit('6f upgrade RLS toggle block drifted')
          text = text.replace(old_upgrade, '', 1)

          old_downgrade = '''    for relation_name in reversed(_RLS_RELATIONS):
        op.execute(f"ALTER TABLE public.{relation_name} DISABLE ROW LEVEL SECURITY")

'''
          if text.count(old_downgrade) != 1:
              raise SystemExit('6f downgrade RLS toggle block drifted')
          text = text.replace(old_downgrade, '', 1)

          if 'enabled=False' in text:
              raise SystemExit('6f still contains disabled-RLS predecessor semantics')
          if 'DISABLE ROW LEVEL SECURITY' in text:
              raise SystemExit('6f still disables predecessor-owned RLS')
          if text.count('ENABLE ROW LEVEL SECURITY') != 0:
              raise SystemExit('6f still mutates predecessor-owned RLS enable state')
          m6f.write_text(text, encoding='utf-8')
          PY

          python -m py_compile \
            alembic/versions/00f277c748ea_add_hyperscale_branch_name_and_address_.py \
            alembic/versions/6f708192a3b4_address_runtime_privilege_boundary.py
          git diff --check
          git diff -- \
            alembic/versions/00f277c748ea_add_hyperscale_branch_name_and_address_.py \
            alembic/versions/6f708192a3b4_address_runtime_privilege_boundary.py

      - name: Commit source patch and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-address-lifecycle-ownership.yml
          git add \
            alembic/versions/00f277c748ea_add_hyperscale_branch_name_and_address_.py \
            alembic/versions/6f708192a3b4_address_runtime_privilege_boundary.py
          git diff --cached --check
          git commit -m 'fix: align address lifecycle security ownership'
          git push origin HEAD:hardening/complete-migration-lineage

# Triggered after creation so GitHub registers this branch-local one-shot workflow.