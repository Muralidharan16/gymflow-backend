name: P2F Frozen Lifecycle Runtime Certification

on:
  push:
    branches:
      - certification/p2f-0346c73
    paths:
      - .github/workflows/p2f-lifecycle-runtime-certification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2f-lifecycle-0346c73
  cancel-in-progress: false

env:
  EXPECTED_HEAD: 0346c73aaee5013eb43b4c90c257a81fba7f5c9c
  EXPECTED_TREE: 48ce9c2ea616f4efab84ff430d290a3424d11fb3
  EXPECTED_BASE: 43e03954723583601ee123505c5ce155b0bba162
  HARDENING_BRANCH: hardening/complete-migration-lineage
  PR_NUMBER: '2'
  PIP_VERSION: 26.2.1
  PYTHONDONTWRITEBYTECODE: '1'
  REDIS_URL: redis://127.0.0.1:6379/0
  CELERY_BROKER_URL: redis://127.0.0.1:6379/1
  CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
  SECRET_KEY: p2f-certification-only-not-production
  AWS_ACCESS_KEY_ID: p2f-ci
  AWS_SECRET_ACCESS_KEY: p2f-ci
  AWS_REGION_NAME: us-east-1
  S3_BUCKET_NAME: gymflow-p2f-certification
  ENVIRONMENT: test

jobs:
  lifecycle_runtime_data:
    name: Literal candidate clean-cluster lifecycle runtime and populated-data proof
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      MIGRATION_PASSWORD: p2f-migration-owner
      DATABASE_URL: postgresql+asyncpg://migration_owner:p2f-migration-owner@127.0.0.1:5432/gymflow_p2f_lifecycle
      EVIDENCE_DIR: /tmp/p2f-lifecycle-evidence
    steps:
      - name: Checkout literal candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 0346c73aaee5013eb43b4c90c257a81fba7f5c9c
          fetch-depth: 0
          persist-credentials: false

      - name: Prove candidate base and merge provenance
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1)"
          git fsck --strict
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/p2f-main" \
            "+refs/heads/${HARDENING_BRANCH}:refs/remotes/origin/p2f-hardening" \
            "+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/p2f-merge"
          test "$(git rev-parse refs/remotes/origin/p2f-main)" = "$EXPECTED_BASE"
          test "$(git rev-parse refs/remotes/origin/p2f-hardening)" = "$EXPECTED_HEAD"
          test "$(git rev-parse refs/remotes/origin/p2f-merge^{tree})" = "$EXPECTED_TREE"
          read -r merge_sha merge_base merge_head < <(git rev-list --parents -n 1 refs/remotes/origin/p2f-merge)
          test "$merge_base" = "$EXPECTED_BASE"
          test "$merge_head" = "$EXPECTED_HEAD"
          printf '%s\n' "$EXPECTED_HEAD" > "$EVIDENCE_DIR/candidate-sha.txt"
          printf '%s\n' "$EXPECTED_TREE" > "$EVIDENCE_DIR/candidate-tree.txt"
          printf '%s\n' "$EXPECTED_BASE" > "$EVIDENCE_DIR/base-sha.txt"
          printf '%s\n' "$merge_sha" > "$EVIDENCE_DIR/merge-sha.txt"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Reproduce dependency environment and source contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -m pip install "pip==$PIP_VERSION"
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > "$EVIDENCE_DIR/resolved-test-environment.txt"
          diff -u requirements-test.lock "$EVIDENCE_DIR/resolved-test-environment.txt"
          ! python -m pip freeze | grep -qi '^psycopg2'
          python -s scripts/verify_alembic_graph.py | tee "$EVIDENCE_DIR/alembic-graph.log"
          python -s scripts/migration_semantics_gate.py | tee "$EVIDENCE_DIR/migration-semantics.log"
          python -s scripts/verify_runtime_identity_routing.py | tee "$EVIDENCE_DIR/runtime-routing.log"
          python -m pytest --noconftest -q \
            tests/test_process_database_profile_boundary.py \
            tests/test_process_profile_deployment_contract.py \
            tests/test_pytest_db_context_fidelity_boundary.py \
            tests/test_auth_database_boundary.py \
            tests/test_lifecycle_maintenance_runtime_boundary.py \
            tests/test_runtime_principal_attestation.py \
            | tee "$EVIDENCE_DIR/static-contracts.log"

      - name: Install clean PostgreSQL 16 and Redis and prove virgin state
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
          redis-cli ping
          pg_config --version > "$EVIDENCE_DIR/pg-config-version.txt"
          sudo -u postgres psql -X -At -d postgres -c 'SHOW server_version' > "$EVIDENCE_DIR/postgresql-version.txt"
          redis-server --version > "$EVIDENCE_DIR/redis-version.txt"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          DO $$
          DECLARE n text;
          BEGIN
            FOREACH n IN ARRAY ARRAY[
              'migration_owner','app_runtime','auth_runtime','worker_runtime',
              'lifecycle_maintenance_runtime','app_rls_executor','app_security_owner',
              'app_user','audit_writer','branch_admin','branch_viewer','ops_support',
              'readonly_analytics','app_test_runtime','auth_test_runtime',
              'worker_test_runtime','maintenance_test_runtime'
            ] LOOP
              IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname=n) THEN
                RAISE EXCEPTION 'unclean certification cluster role %',n;
              END IF;
            END LOOP;
            IF EXISTS (SELECT 1 FROM pg_catalog.pg_database WHERE datname LIKE 'gymflow_p2f_%') THEN
              RAISE EXCEPTION 'unclean certification database state';
            END IF;
          END $$;
          SQL

      - name: Bootstrap canonical roles and exact deployment logins
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'p2f-migration-owner';
          CREATE ROLE app_test_runtime LOGIN PASSWORD 'p2f-api-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE auth_test_runtime LOGIN PASSWORD 'p2f-auth-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE worker_test_runtime LOGIN PASSWORD 'p2f-worker-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE maintenance_test_runtime LOGIN PASSWORD 'p2f-maint-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          ALTER ROLE app_test_runtime SET row_security='on'; ALTER ROLE app_test_runtime SET statement_timeout='5s'; ALTER ROLE app_test_runtime SET lock_timeout='2s'; ALTER ROLE app_test_runtime SET idle_in_transaction_session_timeout='15s';
          ALTER ROLE auth_test_runtime SET row_security='on'; ALTER ROLE auth_test_runtime SET statement_timeout='5s'; ALTER ROLE auth_test_runtime SET lock_timeout='2s'; ALTER ROLE auth_test_runtime SET idle_in_transaction_session_timeout='15s';
          ALTER ROLE worker_test_runtime SET row_security='on'; ALTER ROLE worker_test_runtime SET statement_timeout='15s'; ALTER ROLE worker_test_runtime SET lock_timeout='2s'; ALTER ROLE worker_test_runtime SET idle_in_transaction_session_timeout='30s';
          ALTER ROLE maintenance_test_runtime SET row_security='on'; ALTER ROLE maintenance_test_runtime SET statement_timeout='15s'; ALTER ROLE maintenance_test_runtime SET lock_timeout='2s'; ALTER ROLE maintenance_test_runtime SET idle_in_transaction_session_timeout='30s';
          GRANT app_runtime TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT auth_runtime TO auth_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_runtime TO auth_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO auth_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT worker_runtime TO worker_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT lifecycle_maintenance_runtime TO maintenance_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          CREATE DATABASE gymflow_p2f_lifecycle OWNER migration_owner;
          GRANT CONNECT ON DATABASE gymflow_p2f_lifecycle TO app_test_runtime,auth_test_runtime,worker_test_runtime,maintenance_test_runtime;
          SQL

      - name: Prove identity graph before Alembic and provision extensions
        env:
          DOERS_CLUSTER_VERIFY_DATABASE_URL: postgresql+psycopg://migration_owner:p2f-migration-owner@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          bash scripts/ci/verify_cluster_roles.sh
          python -s scripts/verify_cluster_role_bootstrap.py | tee "$EVIDENCE_DIR/p2b-before.log"
          python -s scripts/verify_cluster_identity_graph.py | tee "$EVIDENCE_DIR/p2c-before.log"
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p2f_lifecycle
          sudo -u postgres psql -X -At -d gymflow_p2f_lifecycle -c "SELECT extname||'='||extversion FROM pg_catalog.pg_extension ORDER BY extname" > "$EVIDENCE_DIR/extensions.txt"

      - name: Prove base HEAD base HEAD deterministic equivalence
        run: |
          set -euo pipefail
          python scripts/migration_lifecycle_snapshot.py --mode database --output "$EVIDENCE_DIR/database-baseline.json"
          python scripts/migration_lifecycle_snapshot.py --mode cluster --output "$EVIDENCE_DIR/cluster-baseline.json"
          python -s -m alembic -c alembic.ini upgrade head 2>&1 | tee "$EVIDENCE_DIR/upgrade-head-1.log"
          python -s -m alembic -c alembic.ini current --check-heads
          python scripts/migration_lifecycle_snapshot.py --mode database --output "$EVIDENCE_DIR/database-head-1.json"
          python scripts/migration_lifecycle_snapshot.py --mode cluster --output "$EVIDENCE_DIR/cluster-head-1.json"
          sudo -u postgres pg_dump --schema-only --no-comments --restrict-key=P2FExact --dbname=gymflow_p2f_lifecycle > "$EVIDENCE_DIR/schema-head-1.sql"
          cmp "$EVIDENCE_DIR/cluster-baseline.json" "$EVIDENCE_DIR/cluster-head-1.json"
          python -s -m alembic -c alembic.ini downgrade base 2>&1 | tee "$EVIDENCE_DIR/downgrade-base.log"
          python scripts/migration_lifecycle_snapshot.py --mode database --output "$EVIDENCE_DIR/database-base-restored.json"
          python scripts/migration_lifecycle_snapshot.py --mode cluster --output "$EVIDENCE_DIR/cluster-base-restored.json"
          cmp "$EVIDENCE_DIR/database-baseline.json" "$EVIDENCE_DIR/database-base-restored.json"
          cmp "$EVIDENCE_DIR/cluster-baseline.json" "$EVIDENCE_DIR/cluster-base-restored.json"
          python -s -m alembic -c alembic.ini upgrade head 2>&1 | tee "$EVIDENCE_DIR/upgrade-head-2.log"
          python -s -m alembic -c alembic.ini current --check-heads
          python scripts/migration_lifecycle_snapshot.py --mode database --output "$EVIDENCE_DIR/database-head-2.json"
          python scripts/migration_lifecycle_snapshot.py --mode cluster --output "$EVIDENCE_DIR/cluster-head-2.json"
          sudo -u postgres pg_dump --schema-only --no-comments --restrict-key=P2FExact --dbname=gymflow_p2f_lifecycle > "$EVIDENCE_DIR/schema-head-2.sql"
          cmp "$EVIDENCE_DIR/database-head-1.json" "$EVIDENCE_DIR/database-head-2.json"
          cmp "$EVIDENCE_DIR/schema-head-1.sql" "$EVIDENCE_DIR/schema-head-2.sql"
          cmp "$EVIDENCE_DIR/cluster-baseline.json" "$EVIDENCE_DIR/cluster-head-2.json"

      - name: Prove live principal bindings fail closed
        env:
          DATABASE_URL: postgresql+asyncpg://app_test_runtime:p2f-api-runtime@127.0.0.1:5432/gymflow_p2f_lifecycle
          AUTH_DATABASE_URL: postgresql+asyncpg://auth_test_runtime:p2f-auth-runtime@127.0.0.1:5432/gymflow_p2f_lifecycle
          WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:p2f-worker-runtime@127.0.0.1:5432/gymflow_p2f_lifecycle
          MAINTENANCE_DATABASE_URL: postgresql+asyncpg://maintenance_test_runtime:p2f-maint-runtime@127.0.0.1:5432/gymflow_p2f_lifecycle
          ENVIRONMENT: production
        run: |
          set -euo pipefail
          python -s scripts/verify_runtime_principal_bindings.py | tee "$EVIDENCE_DIR/runtime-bindings.log"
          bash scripts/ci/certify_runtime_principal_negative_paths.sh | tee "$EVIDENCE_DIR/runtime-negative-paths.log"

      - name: Real process composition smoke with compartmentalized secrets
        run: |
          set -euo pipefail
          API_DB='postgresql+asyncpg://app_test_runtime:p2f-api-runtime@127.0.0.1:5432/gymflow_p2f_lifecycle'
          AUTH_DB='postgresql+asyncpg://auth_test_runtime:p2f-auth-runtime@127.0.0.1:5432/gymflow_p2f_lifecycle'
          WORKER_DB='postgresql+asyncpg://worker_test_runtime:p2f-worker-runtime@127.0.0.1:5432/gymflow_p2f_lifecycle'
          MAINT_DB='postgresql+asyncpg://maintenance_test_runtime:p2f-maint-runtime@127.0.0.1:5432/gymflow_p2f_lifecycle'
          env -u WORKER_DATABASE_URL -u MAINTENANCE_DATABASE_URL DOERS_PROCESS_PROFILE=api CELERY_WORKER_PROFILE='' ENVIRONMENT=production DATABASE_URL="$API_DB" AUTH_DATABASE_URL="$AUTH_DB" python -c "from app.main import app; assert app"
          env -u DATABASE_URL -u AUTH_DATABASE_URL -u MAINTENANCE_DATABASE_URL DOERS_PROCESS_PROFILE=worker CELERY_WORKER_PROFILE=worker ENVIRONMENT=production WORKER_DATABASE_URL="$WORKER_DB" python -c "import app.core.celery_app"
          env -u DATABASE_URL -u AUTH_DATABASE_URL -u WORKER_DATABASE_URL DOERS_PROCESS_PROFILE=maintenance CELERY_WORKER_PROFILE=maintenance ENVIRONMENT=production MAINTENANCE_DATABASE_URL="$MAINT_DB" python -c "import app.core.celery_app"
          env -u DATABASE_URL -u AUTH_DATABASE_URL -u WORKER_DATABASE_URL -u MAINTENANCE_DATABASE_URL DOERS_PROCESS_PROFILE=beat CELERY_WORKER_PROFILE='' ENVIRONMENT=production python -c "import app.core.celery_app"
          env -u WORKER_DATABASE_URL -u MAINTENANCE_DATABASE_URL DOERS_PROCESS_PROFILE=api CELERY_WORKER_PROFILE='' ENVIRONMENT=production DATABASE_URL="$API_DB" AUTH_DATABASE_URL="$AUTH_DB" uvicorn app.main:app --host 127.0.0.1 --port 8765 > "$EVIDENCE_DIR/uvicorn.log" 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/openapi.json > "$EVIDENCE_DIR/openapi.json"; then ok=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then cat "$EVIDENCE_DIR/uvicorn.log"; kill "$pid" 2>/dev/null || true; exit 1; fi
          kill "$pid"; wait "$pid" || true

      - name: Exact populated legacy-address preservation through 0009 to 00f and back
        env:
          DATABASE_URL: postgresql+asyncpg://migration_owner:p2f-migration-owner@127.0.0.1:5432/gymflow_p2f_data
        run: |
          set -euo pipefail
          DATA="$EVIDENCE_DIR/data-preservation"; mkdir -p "$DATA"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE gymflow_p2f_data OWNER migration_owner"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_p2f_data <<'SQL'
          CREATE EXTENSION btree_gist; CREATE EXTENSION citext; CREATE EXTENSION pg_trgm; CREATE EXTENSION postgis;
          SQL
          python -s -m alembic -c alembic.ini upgrade 0004_google_maps_integration
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U migration_owner -d gymflow_p2f_data <<'SQL'
          INSERT INTO public.organizations(id,name,tier,is_active,country,profile_completed,slug,business_type) VALUES('11111111-1111-4111-8111-111111111111','P2F Legacy Gym','basic',TRUE,'India',TRUE,'p2f-legacy-gym','gym');
          INSERT INTO public.organization_addresses(id,org_id,address_type,address_line1,address_line2,city,state_province,postal_code,country_code,label,effective_from,effective_until,is_verified,verified_at,verification_source,coordinates,coordinates_source,latitude,longitude,maps_embed_allowed,maps_verification_status,maps_verification_source,maps_last_verified_at,maps_updated_at,maps_next_retry_at,maps_retry_count,is_primary,formatted_address) VALUES('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111','operational','enc:123 Heritage Road','Suite 4','Puducherry','Puducherry','605001','IN','Legacy Main','2026-05-01 00:00:00+00','2027-05-01 00:00:00+00',TRUE,'2026-05-18 08:00:00+00','google',ST_SetSRID(ST_MakePoint(79.8083,11.9416),4326)::geography,'google',11.9416,79.8083,FALSE,'verified','google_places_api','2026-05-18 10:00:00+00','2026-05-18 09:00:00+00','2026-05-19 09:00:00+00',3,TRUE,'123 Heritage Road, Puducherry 605001');
          SQL
          python -s -m alembic -c alembic.ini upgrade 0009_view_security_invoker
          sudo -u postgres pg_dump --schema-only --no-comments --dbname=gymflow_p2f_data > "$DATA/schema-before.sql"
          python scripts/normalize_pg_dump.py "$DATA/schema-before.sql" "$DATA/schema-before.canonical.sql"
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -qAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -U migration_owner -d gymflow_p2f_data -c "SELECT row_to_json(s)::text FROM (SELECT id,org_id,address_type,address_line1,address_line2,city,state_province,postal_code,country_code,label,effective_from,effective_until,is_verified,verified_at,verification_source,ST_AsEWKT(coordinates::geometry) coordinates_ewkt,coordinates_source,latitude,longitude,maps_embed_allowed,maps_verification_status,maps_verification_error,maps_verification_source,maps_last_verified_at,maps_updated_at,maps_next_retry_at,maps_retry_count,is_primary,formatted_address,geocoding_failed FROM public.organization_addresses WHERE id='22222222-2222-4222-8222-222222222222') s" > "$DATA/address-before.json"
          python -s -m alembic -c alembic.ini upgrade 00f277c748ea
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U migration_owner -d gymflow_p2f_data <<'SQL'
          DO $$ DECLARE a record; g record; BEGIN
            PERFORM pg_catalog.set_config('app.current_org_id','11111111-1111-4111-8111-111111111111',true);
            SELECT * INTO a FROM public.organization_addresses WHERE id='22222222-2222-4222-8222-222222222222';
            IF NOT FOUND OR a.address_line1<>'enc:123 Heritage Road' OR a.formatted_address<>'123 Heritage Road, Puducherry 605001' OR a.branch_id IS NULL THEN RAISE EXCEPTION 'legacy address not preserved'; END IF;
            SELECT * INTO g FROM public.branch_geolocation_state WHERE address_id=a.id;
            IF NOT FOUND OR g.validation_status<>'success' OR g.geocode_attempts<>3 OR g.geocode_provider<>'google_places_api' THEN RAISE EXCEPTION 'legacy geolocation state not preserved'; END IF;
          END $$;
          SQL
          python -s -m alembic -c alembic.ini downgrade 0009_view_security_invoker
          sudo -u postgres pg_dump --schema-only --no-comments --dbname=gymflow_p2f_data > "$DATA/schema-after.sql"
          python scripts/normalize_pg_dump.py "$DATA/schema-after.sql" "$DATA/schema-after.canonical.sql"
          cmp "$DATA/schema-before.canonical.sql" "$DATA/schema-after.canonical.sql"
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -qAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -U migration_owner -d gymflow_p2f_data -c "SELECT row_to_json(s)::text FROM (SELECT id,org_id,address_type,address_line1,address_line2,city,state_province,postal_code,country_code,label,effective_from,effective_until,is_verified,verified_at,verification_source,ST_AsEWKT(coordinates::geometry) coordinates_ewkt,coordinates_source,latitude,longitude,maps_embed_allowed,maps_verification_status,maps_verification_error,maps_verification_source,maps_last_verified_at,maps_updated_at,maps_next_retry_at,maps_retry_count,is_primary,formatted_address,geocoding_failed FROM public.organization_addresses WHERE id='22222222-2222-4222-8222-222222222222') s" > "$DATA/address-after.json"
          cmp "$DATA/address-before.json" "$DATA/address-after.json"

      - name: Final identity and drift seal
        env:
          DOERS_CLUSTER_VERIFY_DATABASE_URL: postgresql+psycopg://migration_owner:p2f-migration-owner@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          python -s scripts/verify_cluster_role_bootstrap.py | tee "$EVIDENCE_DIR/p2b-final.log"
          python -s scripts/verify_cluster_identity_graph.py | tee "$EVIDENCE_DIR/p2c-final.log"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1)"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/p2f-main-final" "+refs/heads/${HARDENING_BRANCH}:refs/remotes/origin/p2f-hardening-final"
          test "$(git rev-parse refs/remotes/origin/p2f-main-final)" = "$EXPECTED_BASE"
          test "$(git rev-parse refs/remotes/origin/p2f-hardening-final)" = "$EXPECTED_HEAD"
          printf 'success\n' > "$EVIDENCE_DIR/status.txt"
          find "$EVIDENCE_DIR" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/SHA256SUMS"

      - name: Upload P2F lifecycle runtime data evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: p2f-lifecycle-runtime-data-${{ env.EXPECTED_HEAD }}
          path: /tmp/p2f-lifecycle-evidence/
          if-no-files-found: error
          retention-days: 30
