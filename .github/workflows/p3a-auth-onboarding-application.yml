name: P3A Auth Onboarding Application Boundary

on:
  pull_request:
    branches: [main, hardening/complete-migration-lineage]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3a-auth-onboarding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth-onboarding:
    name: Full onboarding under decoupled auth DB identity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_p3a_onboarding
      AUTH_DATABASE_URL: postgresql+asyncpg://auth_p3a_runtime:ci-auth-runtime@127.0.0.1:5432/gymflow_p3a_onboarding
      MIGRATION_PASSWORD: ci-migration-owner
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-p3a-onboarding-not-production
      AWS_ACCESS_KEY_ID: ci-p3a
      AWS_SECRET_ACCESS_KEY: ci-p3a
      AWS_REGION_NAME: us-east-1
      S3_BUCKET_NAME: gymflow-p3a-onboarding-test
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Install PG16 and provision reduced auth login
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-migration-owner';
          CREATE ROLE auth_p3a_runtime LOGIN PASSWORD 'ci-auth-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          ALTER ROLE auth_p3a_runtime SET row_security='on';
          ALTER ROLE auth_p3a_runtime SET statement_timeout='5s';
          ALTER ROLE auth_p3a_runtime SET lock_timeout='2s';
          ALTER ROLE auth_p3a_runtime SET idle_in_transaction_session_timeout='15s';
          GRANT auth_runtime TO auth_p3a_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO auth_p3a_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          CREATE DATABASE gymflow_p3a_onboarding OWNER migration_owner;
          GRANT CONNECT ON DATABASE gymflow_p3a_onboarding TO auth_p3a_runtime;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p3a_onboarding

      - name: Fresh Alembic HEAD
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads

      - name: Prove exact auth process boundary
        run: |
          set -euo pipefail
          PGPASSWORD='ci-auth-runtime' psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U auth_p3a_runtime -d gymflow_p3a_onboarding <<'SQL'
          DO $$
          BEGIN
            IF pg_catalog.pg_has_role(current_user,'app_runtime','MEMBER') THEN
              RAISE EXCEPTION 'auth login inherited app_runtime';
            END IF;
            IF pg_catalog.has_function_privilege(
                current_user,'app_secure.current_organization_profile()','EXECUTE'
            ) OR pg_catalog.has_function_privilege(
                current_user,'app_secure.update_current_organization_profile(jsonb)','EXECUTE'
            ) THEN
              RAISE EXCEPTION 'auth login inherited ordinary profile capability';
            END IF;
            IF NOT pg_catalog.has_function_privilege(
                current_user,
                'app_secure.complete_current_organization_onboarding_profile(jsonb)',
                'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'auth login lacks onboarding capability';
            END IF;
            IF NOT pg_catalog.has_table_privilege(
                current_user,'public.organization_addresses','SELECT'
            ) OR NOT pg_catalog.has_table_privilege(
                current_user,'public.organization_addresses','INSERT'
            ) OR pg_catalog.has_table_privilege(
                current_user,'public.organization_addresses','UPDATE'
            ) OR pg_catalog.has_table_privilege(
                current_user,'public.organization_addresses','DELETE'
            ) THEN
              RAISE EXCEPTION 'auth address capability is not exact';
            END IF;
          END
          $$;
          SQL

      - name: Seed two pre-onboarding tenants
        run: |
          set -euo pipefail
          PGPASSWORD='ci-migration-owner' psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p3a_onboarding <<'SQL'
          INSERT INTO public.organizations (id,name,slug,tier,is_active)
          VALUES
            ('41111111-1111-4111-8111-111111111111','Onboarding Alpha','onboarding-alpha','basic',TRUE),
            ('42222222-2222-4222-8222-222222222222','Onboarding Beta','onboarding-beta','basic',TRUE);
          INSERT INTO public.owners (
              id,org_id,owner_name,email,hashed_password,email_verified,onboarding_completed
          ) VALUES
            ('daaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
             '41111111-1111-4111-8111-111111111111','Onboarding Alpha Owner',
             'onboarding-alpha@example.test','not-a-real-password',TRUE,FALSE),
            ('dbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
             '42222222-2222-4222-8222-222222222222','Onboarding Beta Owner',
             'onboarding-beta@example.test','not-a-real-password',TRUE,FALSE);
          SQL

      - name: Prove address capability remains tenant-bound
        run: |
          set -euo pipefail
          if PGPASSWORD='ci-auth-runtime' psql -X -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 -U auth_p3a_runtime -d gymflow_p3a_onboarding <<'SQL'; then
          BEGIN;
          SELECT pg_catalog.set_config(
              'app.current_org_id','41111111-1111-4111-8111-111111111111',true
          );
          INSERT INTO public.organization_addresses (
              id,org_id,address_type,address_line1,city,state_province,
              postal_code,country_code,is_primary,effective_from
          ) VALUES (
              '49999999-9999-4999-8999-999999999999',
              '42222222-2222-4222-8222-222222222222',
              'physical','enc:cross-tenant','x','x','605002','IN',TRUE,now()
          );
          COMMIT;
          SQL
            echo 'auth address INSERT crossed tenant boundary' >&2
            exit 1
          fi

      - name: Complete onboarding through real FastAPI route and auth DB pool
        env:
          DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_p3a_onboarding
          AUTH_DATABASE_URL: postgresql+asyncpg://auth_p3a_runtime:ci-auth-runtime@127.0.0.1:5432/gymflow_p3a_onboarding
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import logging
          import traceback

          from httpx import ASGITransport, AsyncClient

          from app.core.security import create_access_token
          from app.main import app

          ORG_ID = '41111111-1111-4111-8111-111111111111'
          OWNER_ID = 'daaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'

          class CaptureHandler(logging.Handler):
              def __init__(self) -> None:
                  super().__init__()
                  self.messages: list[str] = []

              def emit(self, record: logging.LogRecord) -> None:
                  message = self.format(record)
                  if record.exc_info:
                      message += '\n' + ''.join(traceback.format_exception(*record.exc_info))
                  self.messages.append(message)

          capture = CaptureHandler()
          capture.setFormatter(logging.Formatter('%(levelname)s %(name)s: %(message)s'))
          onboarding_logger = logging.getLogger('app.services.onboarding_service')
          onboarding_logger.addHandler(capture)

          def annotate_failure(message: str) -> None:
              safe = (
                  message.replace('%', '%25')
                  .replace('\r', '%0D')
                  .replace('\n', '%0A')
              )
              print(f'::error title=P3A onboarding runtime failure::{safe[-12000:]}')

          token = create_access_token(
              owner_id=OWNER_ID,
              org_id=ORG_ID,
              email='onboarding-alpha@example.test',
              role='owner',
              principal_type='owner',
          )

          async def main() -> None:
              async with AsyncClient(
                  transport=ASGITransport(app=app, raise_app_exceptions=False),
                  base_url='http://p3a-onboarding.test',
              ) as client:
                  response = await client.post(
                      '/onboarding/complete',
                      headers={
                          'Authorization': f'Bearer {token}',
                          'User-Agent': 'p3a-onboarding-certification',
                      },
                      json={
                          'phone': '+919876543210',
                          'country_code': 'IN',
                          'address_line_1': '10 Production Street',
                          'address_line_2': None,
                          'city': 'Puducherry',
                          'state': 'Puducherry',
                          'pincode': '605001',
                          'tagline': 'production-ready',
                          'description': 'P3A reduced-auth onboarding proof',
                          'year_established': 2020,
                          'website_url': 'https://onboarding-alpha.example.test',
                          'social_links': {'instagram': 'alpha'},
                      },
                  )
                  if response.status_code != 200:
                      captured = '\n\n'.join(capture.messages[-3:])
                      annotate_failure(
                          f'HTTP {response.status_code}: {response.text}\n{captured}'
                      )
                  assert response.status_code == 200, response.text
                  payload = response.json()
                  assert payload['status'] == 'success', payload
                  assert payload['days_remaining'] == 7, payload

                  repeat = await client.post(
                      '/onboarding/complete',
                      headers={'Authorization': f'Bearer {token}'},
                      json={
                          'phone': '+919876543210',
                          'address_line_1': '10 Production Street',
                          'city': 'Puducherry',
                          'state': 'Puducherry',
                          'pincode': '605001',
                      },
                  )
                  if repeat.status_code != 409:
                      annotate_failure(
                          f'repeat onboarding returned HTTP {repeat.status_code}: {repeat.text}'
                      )
                  assert repeat.status_code == 409, (repeat.status_code, repeat.text)

          asyncio.run(main())
          PY

      - name: Verify atomic durable onboarding state and untouched second tenant
        run: |
          set -euo pipefail

          # Tenant-root and onboarding-owned state remains directly inspectable by
          # migration_owner. Do not re-grant it access to tenant RLS relations.
          PGPASSWORD='ci-migration-owner' psql -X -A -t -F '|' -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p3a_onboarding <<'SQL' > /tmp/state.txt
          SELECT
              o.id,
              o.profile_completed,
              COALESCE(o.phone,'<NULL>'),
              COALESCE(o.tagline,'<NULL>'),
              ow.onboarding_completed,
              (SELECT count(*) FROM public.trial_subscriptions t WHERE t.organization_id=o.id),
              (SELECT count(*) FROM public.org_branches b WHERE b.org_id=o.id),
              (SELECT count(*) FROM public.organization_addresses a WHERE a.org_id=o.id),
              (SELECT count(*) FROM public.org_branch_state s WHERE s.org_id=o.id),
              (SELECT count(*) FROM public.audit_logs al
                 WHERE al.organization_id=o.id AND al.action='ONBOARDING_COMPLETED')
          FROM public.organizations o
          JOIN public.owners ow ON ow.org_id=o.id
          ORDER BY o.id;
          SQL
          cat /tmp/state.txt
          grep -Fqx '41111111-1111-4111-8111-111111111111|t|+919876543210|production-ready|t|1|1|1|1|1' /tmp/state.txt
          grep -Fqx '42222222-2222-4222-8222-222222222222|f|<NULL>|<NULL>|f|0|0|0|0|0' /tmp/state.txt

          # branch_contacts is a FORCE-RLS tenant relation. Verify it through the
          # existing bounded RLS execution role with explicit per-tenant context,
          # exactly as the hardened 0020 migration verifies populated contact state.
          PGPASSWORD='ci-migration-owner' psql -X -A -t -F '|' -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p3a_onboarding <<'SQL' > /tmp/contact-counts.txt
          BEGIN;
          SET LOCAL ROLE app_rls_executor;
          SELECT pg_catalog.set_config(
              'app.current_org_id','41111111-1111-4111-8111-111111111111',true
          );
          SELECT '41111111-1111-4111-8111-111111111111', count(*)
          FROM public.branch_contacts
          WHERE org_id='41111111-1111-4111-8111-111111111111'::uuid;
          SELECT pg_catalog.set_config(
              'app.current_org_id','42222222-2222-4222-8222-222222222222',true
          );
          SELECT '42222222-2222-4222-8222-222222222222', count(*)
          FROM public.branch_contacts
          WHERE org_id='42222222-2222-4222-8222-222222222222'::uuid;
          ROLLBACK;
          SQL
          cat /tmp/contact-counts.txt
          grep -Fqx '41111111-1111-4111-8111-111111111111|2' /tmp/contact-counts.txt
          grep -Fqx '42222222-2222-4222-8222-222222222222|0' /tmp/contact-counts.txt

      - name: Reprove cluster identity graph
        env:
          DOERS_CLUSTER_VERIFY_DATABASE_URL: postgresql+psycopg://migration_owner:ci-migration-owner@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          python -s scripts/verify_cluster_role_bootstrap.py
          python -s scripts/verify_cluster_identity_graph.py
