name: P2F 8bec826 Exact Finance Core Certification

on:
  push:
    branches:
      - certification/p2f-8bec826
    paths:
      - .github/workflows/p2f-8bec-finance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2f-finance-8bec826
  cancel-in-progress: false

env:
  EXPECTED_HEAD: 8bec826b979f6cac14fb17603b4cd645f4779ec8
  EXPECTED_TREE: 1f0648a89a2b23d35110956d7f278966984e3f78
  EXPECTED_BASE: 43e03954723583601ee123505c5ce155b0bba162
  HARDENING_BRANCH: hardening/complete-migration-lineage
  PIP_VERSION: 26.2.1
  PYTHONDONTWRITEBYTECODE: '1'
  SECRET_KEY: p2f-certification-only-not-production
  AWS_ACCESS_KEY_ID: p2f-ci
  AWS_SECRET_ACCESS_KEY: p2f-ci
  AWS_REGION_NAME: us-east-1
  S3_BUCKET_NAME: gymflow-p2f-certification
  ENVIRONMENT: test

jobs:
  finance:
    name: Literal SHA isolated Finance Core regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIGRATION_PASSWORD: p2f-migration-owner
      FINANCE_RUNTIME_PASSWORD: p2f-finance-runtime
      SYNTHETIC_RUNTIME_PASSWORD: p2f-synthetic-runtime
      DATABASE_URL: postgresql+asyncpg://migration_owner:p2f-migration-owner@127.0.0.1:5432/gymflow_p2f_finance_test
      TEST_DATABASE_URL: postgresql+asyncpg://finance_test_runtime:p2f-finance-runtime@127.0.0.1:5432/gymflow_p2f_finance_test
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:p2f-migration-owner@127.0.0.1:5432/gymflow_p2f_finance_test
      FINANCE_CORE_TEST_DATABASE_URL: postgresql+asyncpg://finance_test_runtime:p2f-finance-runtime@127.0.0.1:5432/gymflow_p2f_finance_test
      FINANCE_CORE_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:p2f-migration-owner@127.0.0.1:5432/gymflow_p2f_finance_test
      SYNTHETIC_ORG_TEST_DATABASE_URL: postgresql+asyncpg://synthetic_test_runtime:p2f-synthetic-runtime@127.0.0.1:5432/gymflow_p2f_finance_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      EVIDENCE_DIR: /tmp/p2f-8bec/finance
    steps:
      - name: Checkout literal candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 8bec826b979f6cac14fb17603b4cd645f4779ec8
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Prove exact source and locked dependency environment
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1)"
          python -m pip install "pip==$PIP_VERSION"
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > "$EVIDENCE_DIR/resolved-test-environment.txt"
          diff -u requirements-test.lock "$EVIDENCE_DIR/resolved-test-environment.txt"
      - name: Install PostgreSQL 16
        run: bash scripts/ci/install_pg16_test_stack.sh
      - name: Bootstrap canonical roles Finance runtime and synthetic bootstrap overlay
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'p2f-migration-owner';
          CREATE ROLE test_runner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE finance_test_runtime LOGIN PASSWORD 'p2f-finance-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE synthetic_test_runtime LOGIN PASSWORD 'p2f-synthetic-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          ALTER ROLE finance_test_runtime SET row_security='on';
          ALTER ROLE finance_test_runtime SET statement_timeout='10s';
          ALTER ROLE finance_test_runtime SET lock_timeout='3s';
          ALTER ROLE finance_test_runtime SET idle_in_transaction_session_timeout='15s';
          ALTER ROLE synthetic_test_runtime SET row_security='on';
          ALTER ROLE synthetic_test_runtime SET statement_timeout='10s';
          ALTER ROLE synthetic_test_runtime SET lock_timeout='3s';
          ALTER ROLE synthetic_test_runtime SET idle_in_transaction_session_timeout='15s';
          GRANT app_runtime TO finance_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO finance_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT test_runner TO synthetic_test_runtime WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;
          CREATE DATABASE gymflow_p2f_finance_test OWNER migration_owner;
          GRANT CONNECT ON DATABASE gymflow_p2f_finance_test TO finance_test_runtime, synthetic_test_runtime;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p2f_finance_test
      - name: Prove worker role is isolated from Finance identities
        run: |
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U migration_owner -d postgres <<'SQL'
          DO $$
          DECLARE worker_record record;
          BEGIN
            SELECT * INTO worker_record FROM pg_catalog.pg_roles WHERE rolname='worker_runtime';
            IF NOT FOUND OR worker_record.rolcanlogin OR worker_record.rolsuper OR worker_record.rolcreatedb OR worker_record.rolcreaterole OR worker_record.rolinherit OR worker_record.rolreplication OR worker_record.rolbypassrls THEN RAISE EXCEPTION 'worker_runtime posture unsafe'; END IF;
            IF pg_catalog.pg_has_role('migration_owner','worker_runtime','MEMBER') OR pg_catalog.pg_has_role('migration_owner','worker_runtime','SET') OR pg_catalog.pg_has_role('finance_test_runtime','worker_runtime','MEMBER') OR pg_catalog.pg_has_role('synthetic_test_runtime','worker_runtime','MEMBER') THEN RAISE EXCEPTION 'worker_runtime leaked into Finance identities'; END IF;
          END $$;
          SQL
      - name: Fresh Alembic HEAD on isolated Finance database
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads
      - name: Grant bounded test-only Finance surfaces
        run: |
          PGPASSWORD="$MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U migration_owner -d gymflow_p2f_finance_test <<'SQL'
          GRANT USAGE ON SCHEMA finance TO finance_test_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA finance TO finance_test_runtime;
          GRANT SELECT ON TABLE public.organizations TO finance_test_runtime;
          GRANT SELECT, INSERT, UPDATE ON TABLE public.organizations TO synthetic_test_runtime;
          GRANT SELECT, INSERT ON TABLE public.organization_creation_idempotency TO synthetic_test_runtime;
          GRANT SELECT ON TABLE public.owners, public.gyms, public.organization_users, public.organization_members, public.org_branches TO synthetic_test_runtime;
          GRANT USAGE ON SCHEMA finance TO synthetic_test_runtime;
          GRANT SELECT ON TABLE finance.billing_parties, finance.invoices, finance.payments TO synthetic_test_runtime;
          SQL
      - name: Prove bounded Finance and synthetic runtime posture
        run: |
          set -euo pipefail
          PGPASSWORD="$FINANCE_RUNTIME_PASSWORD" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U finance_test_runtime -d gymflow_p2f_finance_test <<'SQL'
          DO $$ DECLARE r record; BEGIN
            SELECT * INTO r FROM pg_catalog.pg_roles WHERE rolname=current_user;
            IF current_user<>'finance_test_runtime' OR current_database()<>'gymflow_p2f_finance_test' THEN RAISE EXCEPTION 'unexpected Finance identity'; END IF;
            IF r.rolsuper OR r.rolcreatedb OR r.rolcreaterole OR r.rolinherit OR r.rolreplication OR r.rolbypassrls THEN RAISE EXCEPTION 'Finance runtime unsafe'; END IF;
            IF pg_catalog.has_database_privilege(current_user,current_database(),'CREATE') OR pg_catalog.has_schema_privilege(current_user,'public','CREATE') OR pg_catalog.has_schema_privilege(current_user,'finance','CREATE') THEN RAISE EXCEPTION 'Finance runtime can create objects'; END IF;
            IF pg_catalog.pg_has_role(current_user,'app_runtime','SET') OR pg_catalog.pg_has_role(current_user,'app_user','SET') OR pg_catalog.pg_has_role(current_user,'auth_runtime','MEMBER') OR pg_catalog.pg_has_role(current_user,'worker_runtime','MEMBER') OR pg_catalog.pg_has_role(current_user,'test_runner','MEMBER') THEN RAISE EXCEPTION 'Finance runtime has invalid role edge'; END IF;
            IF EXISTS (SELECT 1 FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='finance' AND c.relkind IN ('r','p') AND (NOT pg_catalog.has_table_privilege(current_user,c.oid,'SELECT') OR NOT pg_catalog.has_table_privilege(current_user,c.oid,'INSERT') OR NOT pg_catalog.has_table_privilege(current_user,c.oid,'UPDATE') OR NOT pg_catalog.has_table_privilege(current_user,c.oid,'DELETE'))) THEN RAISE EXCEPTION 'Finance DML incomplete'; END IF;
            IF EXISTS (SELECT 1 FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='finance' AND c.relkind IN ('r','p') AND pg_catalog.has_table_privilege(current_user,c.oid,'TRUNCATE')) THEN RAISE EXCEPTION 'Finance runtime may TRUNCATE'; END IF;
          END $$;
          SQL
          PGPASSWORD="$SYNTHETIC_RUNTIME_PASSWORD" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U synthetic_test_runtime -d gymflow_p2f_finance_test <<'SQL'
          DO $$ DECLARE r record; m record; BEGIN
            SELECT * INTO r FROM pg_catalog.pg_roles WHERE rolname=current_user;
            IF r.rolsuper OR r.rolcreatedb OR r.rolcreaterole OR r.rolinherit OR r.rolreplication OR r.rolbypassrls THEN RAISE EXCEPTION 'synthetic runtime unsafe'; END IF;
            IF pg_catalog.pg_has_role(current_user,'auth_runtime','MEMBER') OR pg_catalog.pg_has_role(current_user,'app_runtime','MEMBER') OR pg_catalog.pg_has_role(current_user,'worker_runtime','MEMBER') OR pg_catalog.pg_has_role(current_user,'app_user','MEMBER') THEN RAISE EXCEPTION 'synthetic runtime unrelated membership'; END IF;
            SELECT am.* INTO m FROM pg_catalog.pg_auth_members am JOIN pg_catalog.pg_roles g ON g.oid=am.roleid JOIN pg_catalog.pg_roles mr ON mr.oid=am.member WHERE g.rolname='test_runner' AND mr.rolname=current_user;
            IF NOT FOUND OR m.admin_option OR m.inherit_option OR NOT m.set_option THEN RAISE EXCEPTION 'test_runner edge not SET-only'; END IF;
            IF NOT pg_catalog.has_table_privilege(current_user,'public.organizations','SELECT') OR NOT pg_catalog.has_table_privilege(current_user,'public.organizations','INSERT') OR NOT pg_catalog.has_table_privilege(current_user,'public.organizations','UPDATE') OR pg_catalog.has_table_privilege(current_user,'public.organizations','DELETE') OR pg_catalog.has_table_privilege(current_user,'public.organizations','TRUNCATE') THEN RAISE EXCEPTION 'synthetic organizations ACL drifted'; END IF;
          END $$;
          SQL
      - name: Run complete Finance Core regressions fail-fast
        run: |
          set -euo pipefail
          set -o pipefail
          python -m pytest -q --maxfail=1 tests/finance_core 2>&1 | tee "$EVIDENCE_DIR/pytest-finance.log"
          printf 'success\n' > "$EVIDENCE_DIR/status.txt"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/p2f-main-final" "+refs/heads/${HARDENING_BRANCH}:refs/remotes/origin/p2f-hardening-final"
          test "$(git rev-parse refs/remotes/origin/p2f-main-final)" = "$EXPECTED_BASE"
          test "$(git rev-parse refs/remotes/origin/p2f-hardening-final)" = "$EXPECTED_HEAD"
          find "$EVIDENCE_DIR" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/SHA256SUMS"
      - name: Upload Finance evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: p2f-finance-final-${{ env.EXPECTED_HEAD }}
          path: /tmp/p2f-8bec/finance/
          if-no-files-found: error
          retention-days: 30
