name: P3A Final Hardening Repair

on:
  push:
    branches:
      - hardening/p3a-organization-profile-authorization
    paths:
      - .github/workflows/p3a-final-hardening-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Harden c27 validation and P3A-only application certification
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          # -----------------------------------------------------------------
          # c27: privileged onboarding command must mirror API invariants.
          # -----------------------------------------------------------------
          migration = Path('alembic/versions/c27d8e9f0a1c_organization_onboarding_authorization.py')
          m = migration.read_text()

          old_validation = '''    IF p_patch->'address_line2' <> 'null'::jsonb
       AND pg_catalog.jsonb_typeof(p_patch->'address_line2') <> 'string' THEN
        RAISE EXCEPTION 'organization onboarding address_line2 is invalid'
            USING ERRCODE = '22023';
    END IF;
    IF p_patch ? 'social_links' AND (
        p_patch->'social_links' = 'null'::jsonb
        OR pg_catalog.jsonb_typeof(p_patch->'social_links') <> 'object'
    ) THEN
        RAISE EXCEPTION 'organization onboarding social_links must be an object'
            USING ERRCODE = '22023';
    END IF;
    IF p_patch ? 'year_established'
       AND p_patch->'year_established' <> 'null'::jsonb
       AND pg_catalog.jsonb_typeof(p_patch->'year_established') <> 'number' THEN
        RAISE EXCEPTION 'organization onboarding year_established is invalid'
            USING ERRCODE = '22023';
    END IF;
'''
          new_validation = '''    IF p_patch->'address_line2' <> 'null'::jsonb
       AND pg_catalog.jsonb_typeof(p_patch->'address_line2') <> 'string' THEN
        RAISE EXCEPTION 'organization onboarding address_line2 is invalid'
            USING ERRCODE = '22023';
    END IF;

    IF (p_patch->>'phone') !~ '^(\\+91)?[6-9][0-9]{9}$' THEN
        RAISE EXCEPTION 'organization onboarding phone is invalid'
            USING ERRCODE = '22023';
    END IF;
    IF pg_catalog.char_length(p_patch->>'address_line1') < 3 THEN
        RAISE EXCEPTION 'organization onboarding address_line1 is invalid'
            USING ERRCODE = '22023';
    END IF;
    IF (p_patch->>'pincode') !~ '^[1-9][0-9]{5}$' THEN
        RAISE EXCEPTION 'organization onboarding pincode is invalid'
            USING ERRCODE = '22023';
    END IF;

    IF p_patch ? 'tagline'
       AND p_patch->'tagline' <> 'null'::jsonb
       AND (
            pg_catalog.jsonb_typeof(p_patch->'tagline') <> 'string'
            OR pg_catalog.char_length(p_patch->>'tagline') > 150
       ) THEN
        RAISE EXCEPTION 'organization onboarding tagline is invalid'
            USING ERRCODE = '22023';
    END IF;
    IF p_patch ? 'description'
       AND p_patch->'description' <> 'null'::jsonb
       AND pg_catalog.jsonb_typeof(p_patch->'description') <> 'string' THEN
        RAISE EXCEPTION 'organization onboarding description is invalid'
            USING ERRCODE = '22023';
    END IF;
    IF p_patch ? 'website_url'
       AND p_patch->'website_url' <> 'null'::jsonb
       AND pg_catalog.jsonb_typeof(p_patch->'website_url') <> 'string' THEN
        RAISE EXCEPTION 'organization onboarding website_url is invalid'
            USING ERRCODE = '22023';
    END IF;
    IF p_patch ? 'social_links' AND (
        p_patch->'social_links' = 'null'::jsonb
        OR pg_catalog.jsonb_typeof(p_patch->'social_links') <> 'object'
    ) THEN
        RAISE EXCEPTION 'organization onboarding social_links must be an object'
            USING ERRCODE = '22023';
    END IF;
    IF p_patch ? 'year_established'
       AND p_patch->'year_established' <> 'null'::jsonb THEN
        IF pg_catalog.jsonb_typeof(p_patch->'year_established') <> 'number'
           OR (p_patch->>'year_established')::numeric
                <> pg_catalog.trunc((p_patch->>'year_established')::numeric)
           OR (p_patch->>'year_established')::numeric < 1800
           OR (p_patch->>'year_established')::numeric
                > pg_catalog.date_part('year', CURRENT_DATE) THEN
            RAISE EXCEPTION 'organization onboarding year_established is invalid'
                USING ERRCODE = '22023';
        END IF;
    END IF;
'''
          m = replace_once(m, old_validation, new_validation, 'c27 validation block')

          old_tokens = '''        "unknown organization onboarding fields",
    ):
'''
          new_tokens = '''        "unknown organization onboarding fields",
        "organization onboarding phone is invalid",
        "organization onboarding address_line1 is invalid",
        "organization onboarding pincode is invalid",
        "organization onboarding tagline is invalid",
        "pg_catalog.trunc",
        "pg_catalog.date_part",
    ):
'''
          m = replace_once(m, old_tokens, new_tokens, 'c27 source-contract tokens')
          migration.write_text(m)

          # Static guard for the direct-call integrity boundary.
          test_path = Path('tests/test_organization_onboarding_authorization_boundary.py')
          t = test_path.read_text()
          anchor = 'def test_security_owner_receives_only_onboarding_specific_extra_update_authority() -> None:\n'
          addition = '''def test_auth_onboarding_capability_mirrors_application_input_invariants() -> None:
    source = _source(MIGRATION)

    for token in (
        "organization onboarding phone is invalid",
        "'^(\\\\+91)?[6-9][0-9]{9}$'",
        "organization onboarding address_line1 is invalid",
        "pg_catalog.char_length(p_patch->>'address_line1') < 3",
        "organization onboarding pincode is invalid",
        "'^[1-9][0-9]{5}$'",
        "organization onboarding tagline is invalid",
        "pg_catalog.char_length(p_patch->>'tagline') > 150",
        "organization onboarding description is invalid",
        "organization onboarding website_url is invalid",
        "pg_catalog.trunc((p_patch->>'year_established')::numeric)",
        "(p_patch->>'year_established')::numeric < 1800",
        "pg_catalog.date_part('year', CURRENT_DATE)",
    ):
        assert token in source


'''
          if t.count(anchor) != 1:
              raise SystemExit('c27 static guard insertion point drift')
          t = t.replace(anchor, addition + anchor, 1)
          test_path.write_text(t)

          # -----------------------------------------------------------------
          # SQL runtime gate: malformed auth-runtime direct calls must fail.
          # -----------------------------------------------------------------
          sql_gate = Path('.github/workflows/p3a-organization-profile-boundary.yml')
          w = sql_gate.read_text()
          section_start = w.index('      - name: Prove auth onboarding is bounded and direct auth UPDATE is denied\n')
          section_end = w.index('      - name: Verify durable state and protected columns\n', section_start)
          section = w[section_start:section_end]
          marker = '''          printf '%s\\n' "$result" | grep -qx 't'

          if PGPASSWORD='ci-auth-runtime' psql -X -v ON_ERROR_STOP=1 \\
'''
          if section.count(marker) != 1:
              raise SystemExit('auth runtime insertion marker drift')
          runtime_negative = '''          printf '%s\\n' "$result" | grep -qx 't'

          for invalid_patch in \\
            '{"phone":"123","address_line1":"1 Alpha Street","address_line2":null,"city":"Puducherry","state":"Puducherry","pincode":"605001"}' \\
            '{"phone":"+919876543210","address_line1":"x","address_line2":null,"city":"Puducherry","state":"Puducherry","pincode":"605001"}' \\
            '{"phone":"+919876543210","address_line1":"1 Alpha Street","address_line2":null,"city":"Puducherry","state":"Puducherry","pincode":"012345"}' \\
            '{"phone":"+919876543210","address_line1":"1 Alpha Street","address_line2":null,"city":"Puducherry","state":"Puducherry","pincode":"605001","year_established":1799}' \\
            '{"phone":"+919876543210","address_line1":"1 Alpha Street","address_line2":null,"city":"Puducherry","state":"Puducherry","pincode":"605001","year_established":2000.5}' \\
            '{"phone":"+919876543210","address_line1":"1 Alpha Street","address_line2":null,"city":"Puducherry","state":"Puducherry","pincode":"605001","year_established":9999}'
          do
            if PGPASSWORD='ci-auth-runtime' psql -X -v ON_ERROR_STOP=1 \\
                -h 127.0.0.1 -U auth_p3a_runtime -d gymflow_p3a_test \\
                -v invalid_patch="$invalid_patch" <<'SQL'; then
          BEGIN;
          SELECT pg_catalog.set_config('app.current_org_id','11111111-1111-4111-8111-111111111111',true);
          SELECT pg_catalog.set_config('app.current_user_id','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',true);
          SELECT pg_catalog.set_config('app.current_principal_type','owner',true);
          SELECT pg_catalog.set_config('app.current_role','owner',true);
          SELECT app_secure.complete_current_organization_onboarding_profile(
              CAST(:'invalid_patch' AS jsonb)
          );
          COMMIT;
          SQL
              echo "auth onboarding capability accepted invalid patch: $invalid_patch" >&2
              exit 1
            fi
          done

          if PGPASSWORD='ci-auth-runtime' psql -X -v ON_ERROR_STOP=1 \\
'''
          section = section.replace(marker, runtime_negative, 1)
          w = w[:section_start] + section + w[section_end:]
          sql_gate.write_text(w)

          # -----------------------------------------------------------------
          # Application gate: keep P3B registration surface explicitly out of
          # P3A while exercising real middleware + get_db + repo + DB identity.
          # -----------------------------------------------------------------
          app_gate = Path('.github/workflows/p3a-organization-profile-application.yml')
          a = app_gate.read_text()
          step_start = a.index('      - name: Exercise FastAPI profile GET and PATCH through the real API login\n')
          step_end = a.index('      - name: Verify application path persisted only allowed Alpha state\n', step_start)
          replacement = '''      - name: Prove P3B registration access is not broadened by P3A
        run: |
          set -euo pipefail
          observed=$(PGPASSWORD='ci-migration-owner' psql -X -A -t -v ON_ERROR_STOP=1 \\
            -h 127.0.0.1 -U migration_owner -d gymflow_p3a_app_test \\
            -c "SELECT pg_catalog.has_table_privilege('app_p3a_runtime','public.organization_registrations','SELECT')")
          test "$observed" = 'f'

      - name: Exercise P3A organization-only FastAPI boundary through the real API login
        env:
          DATABASE_URL: postgresql+asyncpg://app_p3a_runtime:ci-api-runtime@127.0.0.1:5432/gymflow_p3a_app_test
          AUTH_DATABASE_URL: postgresql+asyncpg://auth_p3a_runtime:ci-auth-runtime@127.0.0.1:5432/gymflow_p3a_app_test
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio

          from fastapi import Depends
          from httpx import ASGITransport, AsyncClient
          from sqlalchemy.ext.asyncio import AsyncSession

          from app.core.database import get_db
          from app.core.deps import Staff, require_org_admin
          from app.core.security import create_access_token
          from app.main import app
          from app.repositories.organization_profile import (
              get_current_organization_profile,
              update_current_organization_profile,
          )
          from app.schemas.organization import OrganizationUpdate

          ALPHA_ORG = '31111111-1111-4111-8111-111111111111'
          BETA_ORG = '32222222-2222-4222-8222-222222222222'
          ALPHA_OWNER = 'caaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
          PROFILE_FIELDS = {
              'name', 'business_type', 'tagline', 'description',
              'year_established', 'website_url', 'social_links',
          }

          @app.get('/__p3a/profile-only')
          async def p3a_profile_only(
              current_staff: Staff = Depends(require_org_admin),
              db: AsyncSession = Depends(get_db),
          ):
              del current_staff
              return await get_current_organization_profile(db)

          @app.patch('/__p3a/profile-only')
          async def p3a_update_profile_only(
              data: OrganizationUpdate,
              current_staff: Staff = Depends(require_org_admin),
              db: AsyncSession = Depends(get_db),
          ):
              del current_staff
              update_data = data.model_dump(exclude_unset=True)
              organization_updates = {
                  key: value
                  for key, value in update_data.items()
                  if key in PROFILE_FIELDS
              }
              return await update_current_organization_profile(
                  db, organization_updates
              )

          def token(*, org_id: str = ALPHA_ORG, role: str = 'owner') -> str:
              return create_access_token(
                  owner_id=ALPHA_OWNER,
                  org_id=org_id,
                  email='app-alpha-owner@example.test',
                  role=role,
                  principal_type='owner',
              )

          async def main() -> None:
              async with AsyncClient(
                  transport=ASGITransport(app=app, raise_app_exceptions=False),
                  base_url='http://p3a.test',
              ) as client:
                  headers = {'Authorization': f'Bearer {token()}'}

                  response = await client.get('/__p3a/profile-only', headers=headers)
                  assert response.status_code == 200, response.text
                  payload = response.json()
                  assert payload['id'] == ALPHA_ORG, payload
                  assert payload['name'] == 'Application Alpha', payload
                  assert payload['tagline'] == 'alpha-before', payload
                  assert payload['year_established'] == 2001, payload

                  response = await client.patch(
                      '/__p3a/profile-only',
                      headers=headers,
                      json={
                          'name': 'Application Alpha Hardened',
                          'tagline': None,
                          'year_established': 2003,
                          'website_url': 'https://alpha.example.test',
                      },
                  )
                  assert response.status_code == 200, response.text
                  payload = response.json()
                  assert payload['name'] == 'Application Alpha Hardened', payload
                  assert payload['tagline'] is None, payload
                  assert payload['year_established'] == 2003, payload

                  for body in (
                      {'year_established': 1799},
                      {'year_established': 9999},
                      {'tier': 'elite'},
                  ):
                      response = await client.patch(
                          '/__p3a/profile-only', headers=headers, json=body
                      )
                      assert response.status_code == 422, (
                          body, response.status_code, response.text
                      )

                  response = await client.patch(
                      '/__p3a/profile-only',
                      headers={'Authorization': f'Bearer {token(role="trainer")}'},
                      json={'tagline': 'wrong-role'},
                  )
                  assert response.status_code == 403, response.text

                  response = await client.patch(
                      '/__p3a/profile-only',
                      headers={'Authorization': f'Bearer {token(org_id=BETA_ORG)}'},
                      json={'tagline': 'cross-tenant'},
                  )
                  assert response.status_code >= 400, response.text

          asyncio.run(main())
          PY

'''
          a = a[:step_start] + replacement + a[step_end:]
          app_gate.write_text(a)
          PY

          python -m py_compile \
            alembic/versions/c27d8e9f0a1c_organization_onboarding_authorization.py \
            tests/test_organization_onboarding_authorization_boundary.py
          git diff --check
          grep -n "organization onboarding phone is invalid" alembic/versions/c27d8e9f0a1c_organization_onboarding_authorization.py
          grep -n "P3B registration access is not broadened" .github/workflows/p3a-organization-profile-application.yml
          grep -n "auth onboarding capability accepted invalid patch" .github/workflows/p3a-organization-profile-boundary.yml

          git rm .github/workflows/p3a-final-hardening-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alembic/versions/c27d8e9f0a1c_organization_onboarding_authorization.py \
            tests/test_organization_onboarding_authorization_boundary.py \
            .github/workflows/p3a-organization-profile-boundary.yml \
            .github/workflows/p3a-organization-profile-application.yml
          git commit -m 'fix: harden P3A privileged input and application boundaries'
          git push origin HEAD:hardening/p3a-organization-profile-authorization
