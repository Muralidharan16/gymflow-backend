name: P10-L Representative Load and Concurrency Stress

on:
  push:
    branches:
      - hardening/p10-performance-security-final-production-certification
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p10l-load-concurrency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CERTIFICATION_HEAD: zk07d8e9f0a45
  MIGRATION_PASSWORD: ci-migration-owner
  GENERAL_RUNTIME_PASSWORD: ci-app-test-runtime
  AUTH_RUNTIME_PASSWORD: ci-auth-test-runtime
  WORKER_RUNTIME_PASSWORD: ci-worker-test-runtime
  MAINTENANCE_RUNTIME_PASSWORD: ci-lifecycle-maintenance-runtime
  DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_migration_test
  TEST_DATABASE_URL: postgresql+asyncpg://app_test_runtime:ci-app-test-runtime@127.0.0.1:5432/gymflow_test
  TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
  AUTH_DATABASE_URL: postgresql+asyncpg://auth_test_runtime:ci-auth-test-runtime@127.0.0.1:5432/gymflow_test
  WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:ci-worker-test-runtime@127.0.0.1:5432/gymflow_test
  MAINTENANCE_DATABASE_URL: postgresql+asyncpg://lifecycle_maintenance_test_runtime:ci-lifecycle-maintenance-runtime@127.0.0.1:5432/gymflow_test
  REDIS_URL: redis://127.0.0.1:6379/0
  CELERY_BROKER_URL: redis://127.0.0.1:6379/1
  CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
  SECRET_KEY: p10l-load-synthetic-secret-not-production
  AWS_ACCESS_KEY_ID: p10l-synthetic
  AWS_SECRET_ACCESS_KEY: p10l-synthetic
  S3_BUCKET_NAME: p10l-synthetic
  ENVIRONMENT: test
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  representative_load:
    name: Bind same-head production load against frozen P10-B budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P10L_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      P10L_SOURCE_EVENT: ${{ github.event_name == 'pull_request' && 'pull_request' || 'push' }}
      EVIDENCE_DIR: p10l-evidence

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install contract-only pytest
        run: python -m pip install 'pytest==9.1.1'

      - name: Prove P10-L static and frozen-budget contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/ci/p10l_bind_same_head_baseline.py \
            scripts/ci/p10l_verify_representative_load.py \
            tests/test_p10l_contracts.py
          python -m pytest --noconftest -q --maxfail=1 tests/test_p10l_contracts.py
          python scripts/ci/verify_p10_performance_budgets.py | tee /tmp/p10-budget-freeze.log
          grep -q '^P10_BASELINE_BUDGETS=PASS$' /tmp/p10-budget-freeze.log

      - name: Bind canonical same-head P10-B production load evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -s scripts/ci/p10l_bind_same_head_baseline.py \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${P10L_CANDIDATE_SHA}" \
            --event "${P10L_SOURCE_EVENT}" \
            --output-dir "${EVIDENCE_DIR}" \
            | tee "${EVIDENCE_DIR}/p10l-bind.log"
          grep -q '^P10L_SAME_HEAD_BASELINE_BOUND=PASS$' "${EVIDENCE_DIR}/p10l-bind.log"

      - name: Enforce frozen representative load budgets and dependency health
        run: |
          set -euo pipefail
          python -s scripts/ci/p10l_verify_representative_load.py \
            --http "${EVIDENCE_DIR}/http-calibration.json" \
            --resources "${EVIDENCE_DIR}/resource-calibration.json" \
            --postgres "${EVIDENCE_DIR}/postgres-after.txt" \
            --redis-stats "${EVIDENCE_DIR}/redis-stats.txt" \
            --redis-ping "${EVIDENCE_DIR}/redis-ping.txt" \
            --output "${EVIDENCE_DIR}/p10l-load-decision.json" \
            | tee "${EVIDENCE_DIR}/p10l-load-decision.log"
          grep -q '^P10_REPRESENTATIVE_LOAD=PASS$' "${EVIDENCE_DIR}/p10l-load-decision.log"
          test "$(git rev-parse HEAD)" = "${P10L_CANDIDATE_SHA}"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload P10-L load evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p10l-load-${{ github.event.pull_request.head.sha || github.sha }}
          path: p10l-evidence/
          if-no-files-found: error
          retention-days: 14

  concurrency_stress:
    name: Real lifecycle Finance and deadlock contention
    uses: ./.github/workflows/p5r-race-deadlock-pg16.yml
    with:
      certification_head: zk07d8e9f0a45

  terminal:
    name: P10-L exact-head terminal decision
    if: always()
    needs: [representative_load, concurrency_stress]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P10L_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Require both P10-L prerequisite jobs
        run: |
          set -euo pipefail
          test "${{ needs.representative_load.result }}" = "success"
          test "${{ needs.concurrency_stress.result }}" = "success"

      - name: Checkout exact P10-L candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up terminal Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install terminal pytest
        run: python -m pip install 'pytest==9.1.1'

      - name: Reprove immutable budget and emit P10-L markers
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${P10L_CANDIDATE_SHA}"
          python scripts/ci/verify_p10_performance_budgets.py | tee p10l-terminal.log
          grep -q '^P10_BASELINE_BUDGETS=PASS$' p10l-terminal.log
          python -m pytest --noconftest -q --maxfail=1 tests/test_p10l_contracts.py
          git diff --exit-code
          git diff --cached --exit-code
          echo 'P10_REPRESENTATIVE_LOAD=PASS'
          echo 'P10_CONCURRENCY_STRESS=PASS'
          echo 'P10_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'
