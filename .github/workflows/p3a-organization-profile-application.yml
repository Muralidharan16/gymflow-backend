name: P3A Organization Profile Application Boundary

on:
  pull_request:
    branches: [main, hardening/complete-migration-lineage]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3a-org-profile-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p3a-application-boundary:
    name: FastAPI profile path under reduced API database identity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_p3a_app_test
      MIGRATION_PASSWORD: ci-migration-owner
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-p3a-application-not-production
      AWS_ACCESS_KEY_ID: ci-p3a
      AWS_SECRET_ACCESS_KEY: ci-p3a
      AWS_REGION_NAME: us-east-1
      S3_BUCKET_NAME: gymflow-p3a-app-test
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt

      - name: Install PostgreSQL 16 and bootstrap canonical roles
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-migration-owner';

          CREATE ROLE app_p3a_runtime LOGIN PASSWORD 'ci-api-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE auth_p3a_runtime LOGIN PASSWORD 'ci-auth-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;

          ALTER ROLE app_p3a_runtime SET row_security='on';
          ALTER ROLE app_p3a_runtime SET statement_timeout='5s';
          ALTER ROLE app_p3a_runtime SET lock_timeout='2s';
          ALTER ROLE app_p3a_runtime SET idle_in_transaction_session_timeout='15s';
          ALTER ROLE auth_p3a_runtime SET row_security='on';
          ALTER ROLE auth_p3a_runtime SET statement_timeout='5s';
          ALTER ROLE auth_p3a_runtime SET lock_timeout='2s';
          ALTER ROLE auth_p3a_runtime SET idle_in_transaction_session_timeout='15s';

          GRANT app_runtime TO app_p3a_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO app_p3a_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT auth_runtime TO auth_p3a_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_runtime TO auth_p3a_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO auth_p3a_runtime
            WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;

          CREATE DATABASE gymflow_p3a_app_test OWNER migration_owner;
          GRANT CONNECT ON DATABASE gymflow_p3a_app_test
            TO app_p3a_runtime, auth_p3a_runtime;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p3a_app_test

      - name: Fresh Alembic HEAD
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads

      - name: Seed two organizations and owner principals
        run: |
          set -euo pipefail
          PGPASSWORD='ci-migration-owner' psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p3a_app_test <<'SQL'
          INSERT INTO public.organizations (
              id, name, slug, tier, is_active, tagline, year_established
          ) VALUES
            ('31111111-1111-4111-8111-111111111111',
             'Application Alpha', 'application-alpha', 'basic', TRUE, 'alpha-before', 2001),
            ('32222222-2222-4222-8222-222222222222',
             'Application Beta', 'application-beta', 'basic', TRUE, 'beta-before', 2002);

          INSERT INTO public.owners (
              id, org_id, owner_name, email, hashed_password,
              email_verified, onboarding_completed
          ) VALUES
            ('caaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
             '31111111-1111-4111-8111-111111111111',
             'Application Alpha Owner', 'app-alpha-owner@example.test',
             'not-a-real-password', TRUE, TRUE),
            ('cbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
             '32222222-2222-4222-8222-222222222222',
             'Application Beta Owner', 'app-beta-owner@example.test',
             'not-a-real-password', TRUE, TRUE);
          SQL

      - name: Prove database year invariant cannot be bypassed directly
        run: |
          set -euo pipefail
          for patch in \
            '{"year_established":1799}' \
            '{"year_established":2000.5}' \
            '{"year_established":9999}'
          do
            if PGPASSWORD='ci-api-runtime' psql -X -v ON_ERROR_STOP=1 \
                -h 127.0.0.1 -U app_p3a_runtime -d gymflow_p3a_app_test \
                -v patch="$patch" <<'SQL'; then
          BEGIN;
          SELECT pg_catalog.set_config(
              'app.current_org_id','31111111-1111-4111-8111-111111111111',true
          );
          SELECT pg_catalog.set_config(
              'app.current_user_id','caaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',true
          );
          SELECT pg_catalog.set_config('app.current_principal_type','owner',true);
          SELECT pg_catalog.set_config('app.current_role','owner',true);
          SELECT *
          FROM app_secure.update_current_organization_profile(
              CAST(:'patch' AS jsonb)
          );
          COMMIT;
          SQL
              echo "database accepted invalid year patch: $patch" >&2
              exit 1
            fi
          done

          observed=$(PGPASSWORD='ci-migration-owner' psql -X -A -t -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p3a_app_test \
            -c "SELECT year_established FROM public.organizations WHERE id='31111111-1111-4111-8111-111111111111'")
          test "$observed" = '2001'

      - name: Exercise FastAPI profile GET and PATCH through the real API login
        env:
          DATABASE_URL: postgresql+asyncpg://app_p3a_runtime:ci-api-runtime@127.0.0.1:5432/gymflow_p3a_app_test
          AUTH_DATABASE_URL: postgresql+asyncpg://auth_p3a_runtime:ci-auth-runtime@127.0.0.1:5432/gymflow_p3a_app_test
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio

          from httpx import ASGITransport, AsyncClient

          from app.core.security import create_access_token
          from app.main import app

          ALPHA_ORG = '31111111-1111-4111-8111-111111111111'
          BETA_ORG = '32222222-2222-4222-8222-222222222222'
          ALPHA_OWNER = 'caaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'

          def token(*, org_id: str = ALPHA_ORG, role: str = 'owner') -> str:
              return create_access_token(
                  owner_id=ALPHA_OWNER,
                  org_id=org_id,
                  email='app-alpha-owner@example.test',
                  role=role,
                  principal_type='owner',
              )

          async def main() -> None:
              async with AsyncClient(
                  transport=ASGITransport(app=app),
                  base_url='http://p3a.test',
              ) as client:
                  headers = {'Authorization': f'Bearer {token()}'}

                  response = await client.get('/organizations/profile', headers=headers)
                  assert response.status_code == 200, response.text
                  payload = response.json()['data']
                  assert payload['id'] == ALPHA_ORG, payload
                  assert payload['name'] == 'Application Alpha', payload
                  assert payload['tagline'] == 'alpha-before', payload
                  assert payload['year_established'] == 2001, payload

                  response = await client.patch(
                      '/organizations/profile',
                      headers=headers,
                      json={
                          'name': 'Application Alpha Hardened',
                          'tagline': None,
                          'year_established': 2003,
                          'website_url': 'https://alpha.example.test',
                      },
                  )
                  assert response.status_code == 200, response.text
                  payload = response.json()['data']
                  assert payload['name'] == 'Application Alpha Hardened', payload
                  assert payload['tagline'] is None, payload
                  assert payload['year_established'] == 2003, payload

                  for body in (
                      {'year_established': 1799},
                      {'year_established': 9999},
                      {'tier': 'elite'},
                  ):
                      response = await client.patch(
                          '/organizations/profile', headers=headers, json=body
                      )
                      assert response.status_code == 422, (body, response.status_code, response.text)

                  response = await client.patch(
                      '/organizations/profile',
                      headers={'Authorization': f'Bearer {token(role="trainer")}'},
                      json={'tagline': 'wrong-role'},
                  )
                  assert response.status_code == 403, response.text

                  # A server-signed but stale/mismatched tenant claim must still
                  # fail closed at the principal-membership database boundary.
                  response = await client.patch(
                      '/organizations/profile',
                      headers={'Authorization': f'Bearer {token(org_id=BETA_ORG)}'},
                      json={'tagline': 'cross-tenant'},
                  )
                  assert response.status_code >= 400, response.text
                  assert response.status_code != 404, response.text

          asyncio.run(main())
          PY

      - name: Verify application path persisted only allowed Alpha state
        run: |
          set -euo pipefail
          observed=$(PGPASSWORD='ci-migration-owner' psql -X -A -t -F '|' -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p3a_app_test \
            -c "SELECT id,name,COALESCE(tagline,'<NULL>'),year_established,tier,is_active FROM public.organizations ORDER BY id")
          printf '%s\n' "$observed"
          printf '%s\n' "$observed" | grep -Fqx \
            '31111111-1111-4111-8111-111111111111|Application Alpha Hardened|<NULL>|2003|basic|t'
          printf '%s\n' "$observed" | grep -Fqx \
            '32222222-2222-4222-8222-222222222222|Application Beta|beta-before|2002|basic|t'

      - name: Reprove cluster identity graph
        env:
          DOERS_CLUSTER_VERIFY_DATABASE_URL: postgresql+psycopg://migration_owner:ci-migration-owner@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          python -s scripts/verify_cluster_role_bootstrap.py
          python -s scripts/verify_cluster_identity_graph.py
