name: P3A Downgrade Verifier Repair

on:
  push:
    branches:
      - hardening/p3a-organization-profile-authorization
    paths:
      - .github/workflows/p3a-downgrade-verifier-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Replace privilege-sensitive predecessor verification
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/p3a-organization-profile-boundary.yml')
          text = path.read_text()
          old = '''          PGPASSWORD='ci-migration-owner' psql -X -v ON_ERROR_STOP=1 \\
            -h 127.0.0.1 -U migration_owner -d gymflow_p3a_test <<'SQL'\n          DO $$\n          BEGIN\n            IF pg_catalog.to_regprocedure('app_secure.current_organization_profile()') IS NOT NULL\n               OR pg_catalog.to_regprocedure('app_secure.update_current_organization_profile(jsonb)') IS NOT NULL\n               OR pg_catalog.to_regprocedure('app_secure.complete_current_organization_onboarding_profile(jsonb)') IS NOT NULL THEN\n              RAISE EXCEPTION 'P3A function remains at certified predecessor';\n            END IF;\n            IF NOT pg_catalog.has_table_privilege('auth_runtime','public.organizations','UPDATE') THEN\n              RAISE EXCEPTION 'auth_runtime predecessor UPDATE was not restored';\n            END IF;\n          END\n          $$;\n          SQL\n'''
          new = '''          PGPASSWORD='ci-migration-owner' psql -X -v ON_ERROR_STOP=1 \\
            -h 127.0.0.1 -U migration_owner -d gymflow_p3a_test <<'SQL'\n          DO $$\n          DECLARE\n            auth_relation_acl text[];\n            security_org_columns text[];\n            security_owner_columns text[];\n          BEGIN\n            -- Do not use to_regprocedure()/has_function_privilege() here.\n            -- migration_owner intentionally has no app_secure schema USAGE at\n            -- the certified predecessor, so name resolution itself must not be\n            -- a prerequisite for proving object absence.\n            IF EXISTS (\n                SELECT 1\n                FROM pg_catalog.pg_proc AS procedure_data\n                JOIN pg_catalog.pg_namespace AS namespace_data\n                  ON namespace_data.oid = procedure_data.pronamespace\n                WHERE namespace_data.nspname = 'app_secure'\n                  AND procedure_data.proname = ANY (ARRAY[\n                      'current_organization_profile',\n                      'update_current_organization_profile',\n                      'current_organization_profile_internal',\n                      'update_current_organization_profile_internal',\n                      'complete_current_organization_onboarding_profile'\n                  ]::text[])\n            ) THEN\n              RAISE EXCEPTION 'P3A function remains at certified predecessor';\n            END IF;\n\n            SELECT COALESCE(\n                       pg_catalog.array_agg(acl_data.privilege_type::text ORDER BY acl_data.privilege_type),\n                       ARRAY[]::text[]\n                   )\n              INTO auth_relation_acl\n              FROM pg_catalog.pg_class AS relation_data\n              CROSS JOIN LATERAL pg_catalog.aclexplode(relation_data.relacl) AS acl_data\n              JOIN pg_catalog.pg_roles AS grantee_role\n                ON grantee_role.oid = acl_data.grantee\n              WHERE relation_data.oid = 'public.organizations'::regclass\n                AND grantee_role.rolname = 'auth_runtime';\n            IF auth_relation_acl IS DISTINCT FROM ARRAY['INSERT','SELECT','UPDATE']::text[] THEN\n              RAISE EXCEPTION 'auth_runtime predecessor relation ACL drift: %', auth_relation_acl;\n            END IF;\n\n            IF EXISTS (\n                SELECT 1\n                FROM pg_catalog.pg_attribute AS attribute_data\n                CROSS JOIN LATERAL pg_catalog.aclexplode(attribute_data.attacl) AS acl_data\n                JOIN pg_catalog.pg_roles AS grantee_role\n                  ON grantee_role.oid = acl_data.grantee\n                WHERE attribute_data.attrelid = 'public.organizations'::regclass\n                  AND attribute_data.attnum > 0\n                  AND NOT attribute_data.attisdropped\n                  AND grantee_role.rolname = 'auth_runtime'\n            ) THEN\n              RAISE EXCEPTION 'auth_runtime predecessor retained direct organization column ACL';\n            END IF;\n\n            IF EXISTS (\n                SELECT 1\n                FROM pg_catalog.pg_class AS relation_data\n                CROSS JOIN LATERAL pg_catalog.aclexplode(relation_data.relacl) AS acl_data\n                JOIN pg_catalog.pg_roles AS grantee_role\n                  ON grantee_role.oid = acl_data.grantee\n                WHERE relation_data.oid = 'public.organizations'::regclass\n                  AND grantee_role.rolname IN ('app_runtime','app_security_owner')\n            ) THEN\n              RAISE EXCEPTION 'P3A predecessor gained forbidden organization relation ACL';\n            END IF;\n\n            IF EXISTS (\n                SELECT 1\n                FROM pg_catalog.pg_attribute AS attribute_data\n                CROSS JOIN LATERAL pg_catalog.aclexplode(attribute_data.attacl) AS acl_data\n                JOIN pg_catalog.pg_roles AS grantee_role\n                  ON grantee_role.oid = acl_data.grantee\n                WHERE attribute_data.attrelid = 'public.organizations'::regclass\n                  AND attribute_data.attnum > 0\n                  AND NOT attribute_data.attisdropped\n                  AND grantee_role.rolname = 'app_runtime'\n            ) THEN\n              RAISE EXCEPTION 'app_runtime predecessor gained direct organization column ACL';\n            END IF;\n\n            SELECT COALESCE(\n                       pg_catalog.array_agg(\n                           attribute_data.attname::text || ':' || acl_data.privilege_type::text\n                           ORDER BY attribute_data.attname, acl_data.privilege_type\n                       ),\n                       ARRAY[]::text[]\n                   )\n              INTO security_org_columns\n              FROM pg_catalog.pg_attribute AS attribute_data\n              CROSS JOIN LATERAL pg_catalog.aclexplode(attribute_data.attacl) AS acl_data\n              JOIN pg_catalog.pg_roles AS grantee_role\n                ON grantee_role.oid = acl_data.grantee\n              WHERE attribute_data.attrelid = 'public.organizations'::regclass\n                AND attribute_data.attnum > 0\n                AND NOT attribute_data.attisdropped\n                AND grantee_role.rolname = 'app_security_owner';\n            IF security_org_columns IS DISTINCT FROM ARRAY[\n                'default_currency_code:SELECT',\n                'id:SELECT',\n                'slug:SELECT'\n            ]::text[] THEN\n              RAISE EXCEPTION 'app_security_owner predecessor organization column ACL drift: %', security_org_columns;\n            END IF;\n\n            SELECT COALESCE(\n                       pg_catalog.array_agg(\n                           attribute_data.attname::text || ':' || acl_data.privilege_type::text || ':' ||\n                           acl_data.is_grantable::text || ':' || grantor_role.rolname::text\n                           ORDER BY attribute_data.attname, acl_data.privilege_type,\n                                    acl_data.is_grantable, grantor_role.rolname\n                       ),\n                       ARRAY[]::text[]\n                   )\n              INTO security_owner_columns\n              FROM pg_catalog.pg_attribute AS attribute_data\n              CROSS JOIN LATERAL pg_catalog.aclexplode(attribute_data.attacl) AS acl_data\n              JOIN pg_catalog.pg_roles AS grantee_role\n                ON grantee_role.oid = acl_data.grantee\n              LEFT JOIN pg_catalog.pg_roles AS grantor_role\n                ON grantor_role.oid = acl_data.grantor\n              WHERE attribute_data.attrelid = 'public.owners'::regclass\n                AND attribute_data.attnum > 0\n                AND NOT attribute_data.attisdropped\n                AND grantee_role.rolname = 'app_security_owner';\n            IF security_owner_columns IS DISTINCT FROM ARRAY[\n                'email_verified:SELECT:false:migration_owner',\n                'id:SELECT:false:migration_owner',\n                'onboarding_completed:SELECT:false:migration_owner',\n                'org_id:SELECT:false:migration_owner'\n            ]::text[] THEN\n              RAISE EXCEPTION 'app_security_owner predecessor owners ACL drift: %', security_owner_columns;\n            END IF;\n\n            IF EXISTS (\n                SELECT 1\n                FROM pg_catalog.pg_attribute AS attribute_data\n                CROSS JOIN LATERAL pg_catalog.aclexplode(attribute_data.attacl) AS acl_data\n                JOIN pg_catalog.pg_roles AS grantee_role\n                  ON grantee_role.oid = acl_data.grantee\n                WHERE attribute_data.attrelid = 'public.organization_users'::regclass\n                  AND attribute_data.attnum > 0\n                  AND NOT attribute_data.attisdropped\n                  AND grantee_role.rolname = 'app_security_owner'\n            ) THEN\n              RAISE EXCEPTION 'c37 organization_users ACL remained after downgrade';\n            END IF;\n\n            IF EXISTS (\n                SELECT 1\n                FROM pg_catalog.pg_namespace AS namespace_data\n                CROSS JOIN LATERAL pg_catalog.aclexplode(namespace_data.nspacl) AS acl_data\n                JOIN pg_catalog.pg_roles AS grantee_role\n                  ON grantee_role.oid = acl_data.grantee\n                WHERE namespace_data.nspname = 'app_secure'\n                  AND grantee_role.rolname = 'auth_runtime'\n                  AND acl_data.privilege_type = 'USAGE'\n            ) THEN\n              RAISE EXCEPTION 'auth_runtime app_secure USAGE remained after downgrade';\n            END IF;\n          END\n          $$;\n          SQL\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one predecessor verifier block, got {count}')
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          grep -n "Do not use to_regprocedure" .github/workflows/p3a-organization-profile-boundary.yml
          ! grep -n "to_regprocedure('app_secure.current_organization_profile" .github/workflows/p3a-organization-profile-boundary.yml

          git rm .github/workflows/p3a-downgrade-verifier-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Muralidharan16@users.noreply.github.com'
          git add .github/workflows/p3a-organization-profile-boundary.yml
          git commit -m 'test: prove exact P3A predecessor ACL restoration'
          git push origin HEAD:hardening/p3a-organization-profile-authorization
