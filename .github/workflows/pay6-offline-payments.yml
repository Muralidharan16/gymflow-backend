name: PAY-6 Offline Payments

on:
  push:
    branches:
      - hardening/pay6-offline-payments
  pull_request:
    branches:
      - hardening/pay5-finance-event-delivery
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay6-offline-payments-${{ github.ref }}
  cancel-in-progress: true

env:
  PAY6_BASE_SHA: 1247f357c68246ce442e75ff0a43470524440e9f
  PAY6_BASE_TREE: 016ee5baa80b594cb75ef28f499fb42bc38fca8c
  PAY6_PREDECESSOR: zp07d8e9f0a50
  PAY6_HEAD: zq07d8e9f0a51
  PAY6_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: PAY-6 static offline payment authority
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/pay6_static
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: pay6-static-not-production
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      S3_BUCKET_NAME: pay6-static
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY6_CANDIDATE_SHA }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
      - name: Exact PAY-6 scope and graph
        run: |
          set -euo pipefail
          test "$(git rev-parse "${PAY6_BASE_SHA}^{tree}")" = "${PAY6_BASE_TREE}"
          git merge-base --is-ancestor "${PAY6_BASE_SHA}" HEAD
          git diff --name-only "${PAY6_BASE_SHA}...HEAD" > /tmp/pay6-changed.txt
          python - <<'PY_SCOPE'
          from pathlib import Path
          allowed={
              ".github/workflows/pay6-offline-payments.yml",
              "alembic/versions/zq07d8e9f0a51_pay6_offline_payments.py",
              "app/finance_core/api/offline_payments.py",
              "app/finance_core/api/schemas.py",
              "app/finance_core/models/__init__.py",
              "app/finance_core/models/foundation.py",
              "app/finance_core/services/offline_payments.py",
              "app/main.py",
              "docs/architecture/PAY6_ACCEPTANCE_MATRIX.md",
              "docs/architecture/PAY6_OFFLINE_PAYMENTS.md",
              "docs/architecture/pay6_offline_payments_v1.json",
              "security/cluster_role_bootstrap/ownership.v1.json",
              "tests/finance_core/admin_database.py",
              "tests/finance_core/test_phase5b_foundation.py",
              "tests/test_cluster_role_contract_manifests.py",
              "tests/test_migration_app_secure_owner_context_boundary.py",
              "tests/test_pay6_offline_payments_runtime.py",
              "tests/test_pay6_offline_payments_static.py",
          }
          changed={x.strip() for x in Path("/tmp/pay6-changed.txt").read_text().splitlines() if x.strip()}
          if changed != allowed:
              raise SystemExit(
                  f"PAY-6 exact scope mismatch: missing={sorted(allowed-changed)}, "
                  f"unexpected={sorted(changed-allowed)}"
              )
          migrations=sorted(x for x in changed if x.startswith("alembic/versions/"))
          if migrations != ["alembic/versions/zq07d8e9f0a51_pay6_offline_payments.py"]:
              raise SystemExit(f"PAY-6 migration scope mismatch: {migrations}")
          print(f"PAY-6 exact allowlist paths: {len(changed)}")
          PY_SCOPE
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "${PAY6_HEAD}"
      - name: PAY-6 static contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            app/finance_core/api/offline_payments.py \
            app/finance_core/api/schemas.py \
            app/finance_core/services/offline_payments.py \
            app/finance_core/models/foundation.py \
            alembic/versions/zq07d8e9f0a51_pay6_offline_payments.py
          python -m json.tool docs/architecture/pay6_offline_payments_v1.json >/dev/null
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_pay6_offline_payments_static.py \
            tests/test_cluster_role_contract_manifests.py \
            tests/test_migration_managed_role_boundary.py \
            tests/test_migration_app_secure_owner_context_boundary.py \
            tests/test_alembic_model_import_boundary.py
          echo 'PAY6_OFFLINE_PAYMENT_AUTHORITY=PASS'
          echo 'PAY6_PROOF_REFERENCE_REQUIRED=PASS'
          echo 'PAY6_MAKER_CHECKER=PASS'
          echo 'PAY6_DIRECT_DML_DENIAL=PASS'

  protocol_pg16:
    name: PAY-6 real PG16 offline payment and migration proof
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-pay6-migration@127.0.0.1:5432/gymflow_pay6_test
      PAY6_APP_DATABASE_URL: postgresql://pay6_app_test:ci-pay6-app@127.0.0.1:5432/gymflow_pay6_test
      PAY6_MIGRATION_DATABASE_URL: postgresql://migration_owner:ci-pay6-migration@127.0.0.1:5432/gymflow_pay6_test
      PAY6_ADMIN_DATABASE_URL: postgresql://postgres:ci-pay6-postgres@127.0.0.1:5432/gymflow_pay6_test
      PAY4_APP_DATABASE_URL: postgresql://pay6_app_test:ci-pay6-app@127.0.0.1:5432/gymflow_pay6_test
      PAY4_WORKER_DATABASE_URL: postgresql://pay6_worker_test:ci-pay6-worker@127.0.0.1:5432/gymflow_pay6_test
      PAY4_MIGRATION_DATABASE_URL: postgresql://migration_owner:ci-pay6-migration@127.0.0.1:5432/gymflow_pay6_test
      PAY4_ADMIN_DATABASE_URL: postgresql://postgres:ci-pay6-postgres@127.0.0.1:5432/gymflow_pay6_test
      WORKER_DATABASE_URL: postgresql+asyncpg://pay6_worker_test:ci-pay6-worker@127.0.0.1:5432/gymflow_pay6_test
      SECRET_KEY: pay6-pg16-not-production
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      S3_BUCKET_NAME: pay6-pg16
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY6_CANDIDATE_SHA }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
      - name: Install PG16 and canonical roles
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE postgres PASSWORD 'ci-pay6-postgres';
          ALTER ROLE migration_owner PASSWORD 'ci-pay6-migration';
          CREATE ROLE pay6_app_test LOGIN PASSWORD 'ci-pay6-app'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE pay6_worker_test LOGIN PASSWORD 'ci-pay6-worker'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT app_runtime TO pay6_app_test WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT worker_runtime TO pay6_worker_test WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          CREATE DATABASE gymflow_pay6_test OWNER migration_owner;
          SQL
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_pay6_test
      - name: Upgrade certified PAY-5 predecessor and fingerprint it
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade "${PAY6_PREDECESSOR}"
          PGPASSWORD=ci-pay6-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay6_test -At <<'SQL' > /tmp/pay6-rel-before.txt
          SELECT n.nspname||'.'||c.relname||'|'||c.relfilenode
          FROM pg_catalog.pg_class c
          JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname IN ('public','finance')
            AND c.relkind IN ('r','p')
          ORDER BY 1;
          SQL
          PGPASSWORD=ci-pay6-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay6_test -At <<'SQL' > /tmp/pay6-acl-before.txt
          SELECT table_schema||'.'||table_name||'|'||grantee||'|'||privilege_type
          FROM information_schema.role_table_grants
          WHERE table_schema IN ('public','finance')
            AND grantee IN ('app_security_owner','app_runtime','worker_runtime')
          UNION ALL
          SELECT table_schema||'.'||table_name||'.'||column_name||'|'||grantee||'|'||privilege_type
          FROM information_schema.column_privileges
          WHERE table_schema IN ('public','finance')
            AND grantee IN ('app_security_owner','app_runtime','worker_runtime')
          ORDER BY 1;
          SQL
      - name: Upgrade PAY-6 and prove no predecessor table rewrite
        run: |
          set -euo pipefail
          python -s -m alembic -c alembic.ini upgrade "${PAY6_HEAD}"
          PGPASSWORD=ci-pay6-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay6_test -At <<'SQL' > /tmp/pay6-rel-after.txt
          SELECT n.nspname||'.'||c.relname||'|'||c.relfilenode
          FROM pg_catalog.pg_class c
          JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname IN ('public','finance')
            AND c.relkind IN ('r','p')
            AND NOT (
              n.nspname='finance'
              AND c.relname IN ('offline_payment_requests','offline_payment_events')
            )
          ORDER BY 1;
          SQL
          diff -u /tmp/pay6-rel-before.txt /tmp/pay6-rel-after.txt
      - name: Real PAY-6 maker-checker, reconciliation and concurrency proof
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_pay6_offline_payments_runtime.py
          echo 'PAY6_IDEMPOTENT_RECORDING=PASS'
          echo 'PAY6_INVOICE_RECONCILIATION=PASS'
          echo 'PAY6_IMMUTABLE_AUDIT=PASS'
      - name: Populated downgrade fails closed
        run: |
          set -euo pipefail
          python - <<'PY'
          from tests.test_pay6_offline_payments_runtime import (
              _cleanup_pay6,_seed_invoice,_prepare
          )
          _cleanup_pay6()
          _seed_invoice()
          _prepare(
              key="pay6:downgrade:prepared",
              reference="UTR-DOWNGRADE-PAY6",
          )
          PY
          set +e
          OUTPUT="$(python -s -m alembic -c alembic.ini downgrade "${PAY6_PREDECESSOR}" 2>&1)"
          RC=$?
          set -e
          test "$RC" -ne 0
          printf '%s\n' "$OUTPUT" | grep -F \
            'PAY-6 downgrade blocked: offline payment evidence exists'
          python - <<'PY'
          from tests.test_pay6_offline_payments_runtime import _cleanup_pay6
          _cleanup_pay6()
          PY
      - name: Empty downgrade restores exact predecessor then re-upgrade
        run: |
          set -euo pipefail
          PGPASSWORD=ci-pay6-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay6_test -At <<'SQL' > /tmp/pay6-rel-pre-downgrade.txt
          SELECT n.nspname||'.'||c.relname||'|'||c.relfilenode
          FROM pg_catalog.pg_class c
          JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname IN ('public','finance')
            AND c.relkind IN ('r','p')
            AND NOT (
              n.nspname='finance'
              AND c.relname IN ('offline_payment_requests','offline_payment_events')
            )
          ORDER BY 1;
          SQL

          python -s -m alembic -c alembic.ini downgrade "${PAY6_PREDECESSOR}"

          PGPASSWORD=ci-pay6-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay6_test -At <<'SQL' > /tmp/pay6-rel-restored.txt
          SELECT n.nspname||'.'||c.relname||'|'||c.relfilenode
          FROM pg_catalog.pg_class c
          JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname IN ('public','finance')
            AND c.relkind IN ('r','p')
          ORDER BY 1;
          SQL
          PGPASSWORD=ci-pay6-migration psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_pay6_test -At <<'SQL' > /tmp/pay6-acl-restored.txt
          SELECT table_schema||'.'||table_name||'|'||grantee||'|'||privilege_type
          FROM information_schema.role_table_grants
          WHERE table_schema IN ('public','finance')
            AND grantee IN ('app_security_owner','app_runtime','worker_runtime')
          UNION ALL
          SELECT table_schema||'.'||table_name||'.'||column_name||'|'||grantee||'|'||privilege_type
          FROM information_schema.column_privileges
          WHERE table_schema IN ('public','finance')
            AND grantee IN ('app_security_owner','app_runtime','worker_runtime')
          ORDER BY 1;
          SQL
          diff -u /tmp/pay6-rel-pre-downgrade.txt /tmp/pay6-rel-restored.txt
          diff -u /tmp/pay6-acl-before.txt /tmp/pay6-acl-restored.txt
          python -s -m alembic -c alembic.ini upgrade "${PAY6_HEAD}"
          echo 'PAY6_MIGRATION_LIFECYCLE=PASS'

  architecture:
    uses: ./.github/workflows/architecture-hardening-contracts.yml
  general_platform:
    uses: ./.github/workflows/hardening-ci.yml
  finance:
    uses: ./.github/workflows/finance-hardening-ci.yml
  migration_lifecycle:
    uses: ./.github/workflows/migration-lifecycle-ci.yml
  migration_preservation:
    uses: ./.github/workflows/migration-data-preservation-ci.yml
  migration_adversarial:
    uses: ./.github/workflows/migration-adversarial-safety-ci.yml
  migration_contracts:
    uses: ./.github/workflows/migration-lifecycle-contracts.yml
  migration_semantics:
    uses: ./.github/workflows/migration-semantics-inventory.yml

  certify:
    name: Terminal immutable PAY-6 decision
    if: ${{ always() }}
    needs:
      - contract
      - protocol_pg16
      - architecture
      - general_platform
      - finance
      - migration_lifecycle
      - migration_preservation
      - migration_adversarial
      - migration_contracts
      - migration_semantics
    runs-on: ubuntu-24.04
    steps:
      - name: Require all PAY-6 gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          data=json.loads(os.environ["RESULTS"])
          bad={k:v["result"] for k,v in data.items() if v["result"]!="success"}
          if bad:
              raise SystemExit(f"PAY-6 prerequisite failure: {bad}")
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.PAY6_CANDIDATE_SHA }}
      - name: Bind exact PAY-6 candidate
        run: |
          set -euo pipefail
          mkdir -p pay6-evidence
          test "$(git rev-parse "${PAY6_BASE_SHA}^{tree}")" = "${PAY6_BASE_TREE}"
          git merge-base --is-ancestor "${PAY6_BASE_SHA}" HEAD
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          decision={
            "phase":"PAY-6",
            "candidate_sha":os.environ["PAY6_CANDIDATE_SHA"],
            "candidate_tree":subprocess.check_output(
              ["git","rev-parse","HEAD^{tree}"],text=True
            ).strip(),
            "inherited_pay5_sha":os.environ["PAY6_BASE_SHA"],
            "alembic_head":os.environ["PAY6_HEAD"],
            "live_money_movement":False,
            "refund_provider_execution":"DEFERRED_FAIL_CLOSED",
            "merge_authorized":False,
            "release_authorized":False,
            "deployment_authorized":False,
            "decision":"PASS",
          }
          Path("pay6-evidence/decision.json").write_text(
              json.dumps(decision,indent=2,sort_keys=True)+"\n"
          )
          PY
          cat pay6-evidence/decision.json
          echo 'PAY6_OFFLINE_PAYMENT_AUTHORITY=PASS'
          echo 'PAY6_PROOF_REFERENCE_REQUIRED=PASS'
          echo 'PAY6_MAKER_CHECKER=PASS'
          echo 'PAY6_IDEMPOTENT_RECORDING=PASS'
          echo 'PAY6_INVOICE_RECONCILIATION=PASS'
          echo 'PAY6_IMMUTABLE_AUDIT=PASS'
          echo 'PAY6_DIRECT_DML_DENIAL=PASS'
          echo 'PAY6_MIGRATION_LIFECYCLE=PASS'
          echo 'PAY6_PAY5_INHERITED=PASS'
          echo 'PAY6_LIVE_MONEY_MOVEMENT=DISABLED'
          echo 'PAY6_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'
          echo 'PAY6_FINAL=PASS'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pay6-final-${{ github.sha }}
          path: pay6-evidence/
          if-no-files-found: error
          retention-days: 30
