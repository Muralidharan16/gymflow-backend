name: P5-W Worker Fencing PostgreSQL 16

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - hardening/p5-concurrency-crash-fault-tolerance
  workflow_call:
    inputs:
      certification_head:
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5w-worker-fencing-pg16-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker-fencing:
    name: Monotonic claims, stale-owner rejection and final-attempt recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MIGRATION_PASSWORD: ci-p5w-migration-owner
      APP_RUNTIME_PASSWORD: ci-p5w-app-runtime
      WORKER_RUNTIME_PASSWORD: ci-p5w-worker-runtime
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-p5w-migration-owner@127.0.0.1:5432/gymflow_p5w_test
      TEST_DATABASE_URL: postgresql+psycopg://migration_owner:ci-p5w-migration-owner@127.0.0.1:5432/gymflow_p5w_test
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://migration_owner:ci-p5w-migration-owner@127.0.0.1:5432/gymflow_p5w_test
      WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:ci-p5w-worker-runtime@127.0.0.1:5432/gymflow_p5w_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECRET_KEY: ci-p5w-not-production
      AWS_ACCESS_KEY_ID: ci-p5w-not-production
      AWS_SECRET_ACCESS_KEY: ci-p5w-not-production
      S3_BUCKET_NAME: gymflow-p5w-test
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment and prove static contracts
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt
          python -m py_compile \
            alembic/versions/zg07d8e9f0a41_p5w_worker_claim_fences.py \
            app/models/branch_lifecycle.py \
            app/models/outbox.py \
            app/tasks/branch_outbox_poller.py \
            app/tasks/outbox_poller.py \
            tests/test_p5w_worker_fencing_runtime.py \
            tests/test_p5w_worker_fencing_static_contracts.py
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p5_governance_contracts.py \
            tests/test_p5w_worker_fencing_static_contracts.py

      - name: Install PostgreSQL 16 and reduced runtime identities
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-p5w-migration-owner';
          CREATE ROLE app_test_runtime LOGIN PASSWORD 'ci-p5w-app-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE worker_test_runtime LOGIN PASSWORD 'ci-p5w-worker-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT app_runtime TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT worker_runtime TO worker_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          ALTER ROLE app_test_runtime SET row_security='on';
          ALTER ROLE worker_test_runtime SET row_security='on';
          ALTER ROLE worker_test_runtime SET statement_timeout='20s';
          ALTER ROLE worker_test_runtime SET lock_timeout='3s';
          ALTER ROLE worker_test_runtime SET idle_in_transaction_session_timeout='30s';
          CREATE DATABASE gymflow_p5w_test OWNER migration_owner;
          REVOKE ALL ON DATABASE gymflow_p5w_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE gymflow_p5w_test TO migration_owner,app_test_runtime,worker_test_runtime;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p5w_test

      - name: Prove empty migration lifecycle at exact P5-W head
        env:
          CERTIFICATION_HEAD: ${{ inputs.certification_head }}
        run: |
          set -euo pipefail
          expected_head="${CERTIFICATION_HEAD:-zg07d8e9f0a41}"
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "${expected_head}"
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads
          python -s -m alembic -c alembic.ini downgrade zf07d8e9f0a40
          if python -s -m alembic -c alembic.ini current --check-heads; then
            echo 'P5-W downgraded database was incorrectly reported at head' >&2
            exit 1
          fi
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads

      - name: Prove claim-fence ACL partition
        run: |
          set -euo pipefail
          PGPASSWORD="${MIGRATION_PASSWORD}" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p5w_test <<'SQL'
          DO $$
          DECLARE relation_name text; role_name text;
          BEGIN
            FOREACH relation_name IN ARRAY ARRAY[
              'public.branch_outbox_events',
              'public.transactional_outbox'
            ] LOOP
              IF NOT pg_catalog.has_column_privilege(
                'worker_runtime',relation_name,'lease_fence','UPDATE'
              ) THEN
                RAISE EXCEPTION 'worker lease_fence UPDATE is absent: %',relation_name;
              END IF;
              FOREACH role_name IN ARRAY ARRAY[
                'app_runtime','app_user','app_security_owner','auth_runtime',
                'finance_config_runtime','lifecycle_maintenance_runtime',
                'worker_runtime','app_test_runtime','worker_test_runtime'
              ] LOOP
                IF pg_catalog.has_column_privilege(
                  role_name,relation_name,'lease_fence','INSERT'
                ) THEN
                  RAISE EXCEPTION 'claim-fence INSERT leaked: % %',role_name,relation_name;
                END IF;
              END LOOP;
              FOREACH role_name IN ARRAY ARRAY[
                'app_runtime','app_user','auth_runtime','finance_config_runtime',
                'lifecycle_maintenance_runtime'
              ] LOOP
                IF pg_catalog.has_column_privilege(
                  role_name,relation_name,'lease_fence','UPDATE'
                ) THEN
                  RAISE EXCEPTION 'non-worker lease_fence UPDATE leaked: % %',role_name,relation_name;
                END IF;
              END LOOP;
            END LOOP;
            IF pg_catalog.has_table_privilege(
              'app_runtime','public.branch_outbox_events','INSERT'
            ) OR NOT pg_catalog.has_column_privilege(
              'app_runtime','public.branch_outbox_events','outbox_id','INSERT'
            ) THEN
              RAISE EXCEPTION 'app_runtime branch outbox INSERT confinement drifted';
            END IF;
          END
          $$;
          SQL

      - name: Prove ABA rejection and expired-final-attempt recovery on PostgreSQL 16
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p5w_worker_fencing_runtime.py

      - name: Reprove inherited worker and P4 contracts
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_branch_hours_durable_worker_boundary.py \
            tests/test_branch_lifecycle_durable_worker_boundary.py \
            tests/test_branch_lifecycle_transaction_boundary.py \
            tests/test_celery_single_app_boundary.py \
            tests/test_p4a_external_effect_contracts.py \
            tests/test_p4d_refund_authority_static_contracts.py
          python -s scripts/verify_head_workflow_bootstrap.py

      - name: Prove downgrade refuses durable claim-generation evidence loss
        run: |
          set -euo pipefail
          if python -s -m alembic -c alembic.ini downgrade zf07d8e9f0a40; then
            echo 'P5-W downgrade destroyed durable claim-generation evidence' >&2
            exit 1
          fi
          python -s -m alembic -c alembic.ini current --check-heads

      - name: Emit same-head P5-W1 marker
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          echo "P5W_PROVIDER_REFUND_EXECUTION=DEFERRED_FAIL_CLOSED"
          echo "P5W_WORKER_FENCING_PG16=PASS"
