name: P3A ACL Catalog Repair

on:
  push:
    branches:
      - hardening/p3a-organization-profile-authorization
    paths:
      - .github/workflows/p3a-acl-catalog-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: hardening/p3a-organization-profile-authorization
          fetch-depth: 0

      - name: Replace only invalid raw ACL empty-array fallbacks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('alembic/versions/c17d8e9f0a1b_organization_profile_authorization.py'),
              Path('alembic/versions/c27d8e9f0a1c_organization_onboarding_authorization.py'),
              Path('alembic/versions/c37d8e9f0a1d_organization_profile_principal_binding.py'),
          ]
          replacements = {
              "COALESCE(relation_data.relacl, '{}'::aclitem[])": "relation_data.relacl",
              "COALESCE(attribute_data.attacl, '{}'::aclitem[])": "attribute_data.attacl",
              "COALESCE(namespace_data.nspacl, '{}'::aclitem[])": "namespace_data.nspacl",
          }

          total = 0
          for path in paths:
              text = path.read_text(encoding='utf-8')
              before = text
              for old, new in replacements.items():
                  count = text.count(old)
                  total += count
                  text = text.replace(old, new)
              if text != before:
                  path.write_text(text, encoding='utf-8')

          if total == 0:
              raise SystemExit('no invalid direct ACL fallback found; refusing empty repair')

          # Function ACL checks intentionally use acldefault and must remain.
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if "COALESCE(attribute_data.attacl, '{}'::aclitem[])" in text:
                  raise SystemExit(f'column ACL fallback remains in {path}')
              if "COALESCE(relation_data.relacl, '{}'::aclitem[])" in text:
                  raise SystemExit(f'relation ACL fallback remains in {path}')
              if "COALESCE(namespace_data.nspacl, '{}'::aclitem[])" in text:
                  raise SystemExit(f'schema ACL fallback remains in {path}')

          print(f'repaired {total} raw ACL fallback occurrence(s)')
          PY

          git diff --check
          git diff -- \
            alembic/versions/c17d8e9f0a1b_organization_profile_authorization.py \
            alembic/versions/c27d8e9f0a1c_organization_onboarding_authorization.py \
            alembic/versions/c37d8e9f0a1d_organization_profile_principal_binding.py

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alembic/versions/c17d8e9f0a1b_organization_profile_authorization.py \
            alembic/versions/c27d8e9f0a1c_organization_onboarding_authorization.py \
            alembic/versions/c37d8e9f0a1d_organization_profile_principal_binding.py
          git diff --cached --quiet && { echo 'expected repair diff is empty' >&2; exit 1; }
          git commit -m 'P3A: fix direct ACL catalog inspection on PG16'
          git push origin HEAD:hardening/p3a-organization-profile-authorization
