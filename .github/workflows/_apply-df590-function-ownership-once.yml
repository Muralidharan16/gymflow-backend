name: One-shot DF590 function ownership

on:
  push:
    branches: [hardening/complete-migration-lineage]
    paths:
      - .github/_apply_df590_function_ownership_once_trigger

permissions:
  contents: write

concurrency:
  group: apply-df590-function-ownership-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/complete-migration-lineage
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce DF590-owned domain creation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('alembic/versions/df59095a360e_branch_lifecycle_control_plane.py')
          source = path.read_text(encoding='utf-8')

          schema_old = '    op.execute("CREATE SCHEMA IF NOT EXISTS auth;")\n'
          schema_new = '''    # DF590 owns the auth schema at this lineage boundary. Refuse silent\n    # adoption so downgrade may safely restore the DBEB predecessor exactly.\n    op.execute("""\n    DO $df590_auth_schema_preflight$\n    BEGIN\n        IF pg_catalog.to_regnamespace('auth') IS NOT NULL THEN\n            RAISE EXCEPTION\n                'DF590 refuses to adopt pre-existing auth schema';\n        END IF;\n    END\n    $df590_auth_schema_preflight$;\n    """)\n    op.execute("CREATE SCHEMA auth;")\n'''
          if source.count(schema_old) != 1:
              raise SystemExit('expected exactly one DF590 auth CREATE SCHEMA IF NOT EXISTS')
          source = source.replace(schema_old, schema_new, 1)

          functions = (
              'auth.role',
              'sync_branch_operational_state',
              'validate_scheduled_transition',
              'guard_worm_immutability',
              'enforce_branch_transition_freeze',
              'prevent_history_mutation',
              'validate_history_correlation',
          )
          for name in functions:
              old = f'CREATE OR REPLACE FUNCTION {name}()'
              new = f'CREATE FUNCTION {name}()'
              if source.count(old) != 1:
                  raise SystemExit(f'{name}: expected one OR REPLACE definition')
              source = source.replace(old, new, 1)

          if 'CREATE SCHEMA IF NOT EXISTS auth' in source:
              raise SystemExit('DF590 auth schema adoption remains')
          for name in functions:
              if f'CREATE OR REPLACE FUNCTION {name}()' in source:
                  raise SystemExit(f'{name}: OR REPLACE remains')
              if source.count(f'CREATE FUNCTION {name}()') != 1:
                  raise SystemExit(f'{name}: strict creation count drift')

          path.write_text(source, encoding='utf-8')
          PY

          python -m py_compile alembic/versions/df59095a360e_branch_lifecycle_control_plane.py
          git diff --check

      - name: Publish and remove one-shot controls
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-df590-function-ownership-once.yml
          git rm .github/_apply_df590_function_ownership_once_trigger
          test ! -e .github/_ci_revalidate_f1_function_ownership_head || git rm .github/_ci_revalidate_f1_function_ownership_head
          git add alembic/versions/df59095a360e_branch_lifecycle_control_plane.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'Expected DF590 ownership hardening diff is empty' >&2; exit 1; }
          git commit -m "make DF590 lifecycle functions strictly owned"
          git push origin HEAD:hardening/complete-migration-lineage
