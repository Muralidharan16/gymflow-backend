name: P4C Notification Storage PG16

on:
  pull_request:
    branches:
      - hardening/p4b-search-integration
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4c-notification-storage-pg16-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  notification-storage:
    name: Durable notification authority and adversarial recovery on PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIGRATION_PASSWORD: ci-migration-owner
      APP_RUNTIME_PASSWORD: ci-app-test-runtime
      WORKER_RUNTIME_PASSWORD: ci-worker-test-runtime
      MAINTENANCE_RUNTIME_PASSWORD: ci-maintenance-test-runtime
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_p4c_test
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment and prove static contracts
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt
          python -m py_compile \
            alembic/versions/w07d8e9f0a37_p4c_notification_delivery.py \
            alembic/versions/x07d8e9f0a38_p4c_notification_reconciliation.py \
            alembic/versions/y07d8e9f0a39_p4c_notification_crash_recovery.py \
            alembic/versions/z07d8e9f0a3a_p4c_notification_operations.py \
            alembic/versions/za07d8e9f0a3b_p4c_notification_history_read_boundary.py \
            alembic/versions/zb07d8e9f0a3c_p4c_notification_member_read_boundary.py
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p4c_notification_static_contracts.py \
            tests/test_p4c_notification_history_boundary.py \
            tests/test_p4c_notification_member_boundary.py

      - name: Install PostgreSQL 16 and reduced identities
        run: |
          set -euo pipefail
          bash scripts/ci/install_pg16_test_stack.sh
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-migration-owner';
          CREATE ROLE app_test_runtime LOGIN PASSWORD 'ci-app-test-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE worker_test_runtime LOGIN PASSWORD 'ci-worker-test-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE maintenance_test_runtime LOGIN PASSWORD 'ci-maintenance-test-runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT app_runtime TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT app_user TO app_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT worker_runtime TO worker_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          GRANT lifecycle_maintenance_runtime TO maintenance_test_runtime WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;
          ALTER ROLE app_test_runtime SET row_security='on';
          ALTER ROLE worker_test_runtime SET row_security='on';
          ALTER ROLE maintenance_test_runtime SET row_security='on';
          CREATE DATABASE gymflow_p4c_test OWNER migration_owner;
          GRANT CONNECT ON DATABASE gymflow_p4c_test TO app_test_runtime,worker_test_runtime,maintenance_test_runtime;
          SQL
          bash scripts/ci/verify_cluster_roles.sh
          bash scripts/ci/provision_infrastructure_extensions.sh gymflow_p4c_test

      - name: Upgrade fresh database to exact P4C head
        run: |
          set -euo pipefail
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = 'zb07d8e9f0a3c'
          python -s -m alembic -c alembic.ini upgrade head
          python -s -m alembic -c alembic.ini current --check-heads

      - name: Prove FORCE RLS direct-ACL denial and capability partition
        run: |
          set -euo pipefail
          PGPASSWORD="${MIGRATION_PASSWORD}" psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U migration_owner -d gymflow_p4c_test <<'SQL'
          DO $$
          DECLARE v_rel text; v_role text; v_enabled boolean; v_forced boolean; v_fn oid;
          BEGIN
            FOREACH v_rel IN ARRAY ARRAY[
              'member_notification_preferences','notification_commands',
              'notification_delivery_attempts','notification_provider_events',
              'notification_operator_actions'
            ] LOOP
              SELECT relrowsecurity,relforcerowsecurity INTO v_enabled,v_forced
              FROM pg_catalog.pg_class WHERE oid=('public.'||v_rel)::regclass;
              IF NOT v_enabled OR NOT v_forced THEN
                RAISE EXCEPTION 'P4C relation % is not ENABLE+FORCE RLS',v_rel;
              END IF;
              FOREACH v_role IN ARRAY ARRAY[
                'app_runtime','auth_runtime','worker_runtime','lifecycle_maintenance_runtime'
              ] LOOP
                IF pg_catalog.has_table_privilege(v_role,('public.'||v_rel)::regclass,'SELECT')
                   OR pg_catalog.has_table_privilege(v_role,('public.'||v_rel)::regclass,'INSERT')
                   OR pg_catalog.has_table_privilege(v_role,('public.'||v_rel)::regclass,'UPDATE')
                   OR pg_catalog.has_table_privilege(v_role,('public.'||v_rel)::regclass,'DELETE') THEN
                  RAISE EXCEPTION 'P4C direct notification ACL leaked: % %',v_role,v_rel;
                END IF;
              END LOOP;
            END LOOP;

            SELECT p.oid INTO STRICT v_fn FROM pg_catalog.pg_proc p
            JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace
            WHERE n.nspname='app_secure' AND p.proname='claim_notification_delivery_v2';
            IF NOT pg_catalog.has_function_privilege('worker_runtime',v_fn,'EXECUTE')
               OR pg_catalog.has_function_privilege('app_runtime',v_fn,'EXECUTE')
               OR pg_catalog.has_function_privilege('lifecycle_maintenance_runtime',v_fn,'EXECUTE') THEN
              RAISE EXCEPTION 'P4C delivery claim privilege partition is wrong';
            END IF;

            SELECT p.oid INTO STRICT v_fn FROM pg_catalog.pg_proc p
            JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace
            WHERE n.nspname='app_secure' AND p.proname='apply_resend_notification_event_v2';
            IF NOT pg_catalog.has_function_privilege('app_runtime',v_fn,'EXECUTE')
               OR pg_catalog.has_function_privilege('worker_runtime',v_fn,'EXECUTE')
               OR pg_catalog.has_function_privilege('lifecycle_maintenance_runtime',v_fn,'EXECUTE') THEN
              RAISE EXCEPTION 'P4C webhook privilege partition is wrong';
            END IF;

            SELECT p.oid INTO STRICT v_fn FROM pg_catalog.pg_proc p
            JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace
            WHERE n.nspname='app_secure' AND p.proname='enqueue_notification_reconciliation';
            IF NOT pg_catalog.has_function_privilege('lifecycle_maintenance_runtime',v_fn,'EXECUTE')
               OR pg_catalog.has_function_privilege('worker_runtime',v_fn,'EXECUTE')
               OR pg_catalog.has_function_privilege('app_runtime',v_fn,'EXECUTE') THEN
              RAISE EXCEPTION 'P4C reconciliation discovery privilege partition is wrong';
            END IF;
          END
          $$;
          SQL

      - name: Seed authoritative lifecycle and four-member fixture
        run: |
          set -euo pipefail
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_p4c_test <<'SQL'
          INSERT INTO public.organizations(
            id,name,slug,tier,is_active,max_branches,default_currency_code,
            website_verified,social_links,verification_status,country,profile_completed
          ) VALUES (
            '46000000-0000-4000-8000-000000000001','P4C Notification Org','p4c-notification-org',
            'basic',true,10,'INR',false,'{}'::jsonb,'pending','India',false
          );
          SELECT pg_catalog.set_config('app.current_org_id','46000000-0000-4000-8000-000000000001',false);
          SELECT pg_catalog.set_config('app.current_role','p4c_certification_fixture',false);
          INSERT INTO public.org_branches(
            id,org_id,branch_name,branch_code,internal_slug,timezone,currency_code,region_code,country_code
          ) VALUES (
            '46000000-0000-4000-8000-000000000011','46000000-0000-4000-8000-000000000001',
            'P4C Main Branch','P4C-01','p4c-main','Asia/Kolkata','INR','PY','IN'
          );
          INSERT INTO public.members(
            id,org_id,home_branch_id,member_uid,member_number,name,email,status,is_active,
            is_migrated,created_at,updated_at
          ) VALUES
            ('46000000-0000-4000-8000-000000000021','46000000-0000-4000-8000-000000000001','46000000-0000-4000-8000-000000000011','P4CMEMBER0001',1,'P4C Member One','old-one@example.test','active',true,false,clock_timestamp(),clock_timestamp()),
            ('46000000-0000-4000-8000-000000000022','46000000-0000-4000-8000-000000000001','46000000-0000-4000-8000-000000000011','P4CMEMBER0002',2,'P4C Member Two','two@example.test','active',true,false,clock_timestamp(),clock_timestamp()),
            ('46000000-0000-4000-8000-000000000023','46000000-0000-4000-8000-000000000001','46000000-0000-4000-8000-000000000011','P4CMEMBER0003',3,'P4C Member Three','three@example.test','active',true,false,clock_timestamp(),clock_timestamp()),
            ('46000000-0000-4000-8000-000000000024','46000000-0000-4000-8000-000000000001','46000000-0000-4000-8000-000000000011','P4CMEMBER0004',4,'P4C Member Four','four@example.test','active',true,false,clock_timestamp(),clock_timestamp());
          INSERT INTO public.branch_lifecycle_events(
            event_id,branch_id,event_type,event_version,payload,emitted_at,correlation_id,step_sequence
          ) VALUES (
            '46000000-0000-4000-8000-000000000030','46000000-0000-4000-8000-000000000011',
            'status_change_initiated',1,
            '{"from_status":"active","to_status":"temporarily_closed","source":"p4c_certification_fixture"}'::jsonb,
            '2026-08-17T00:00:00Z'::timestamptz,'46000000-0000-4000-8000-000000000041',1
          );
          INSERT INTO public.branch_status_history(
            history_id,branch_id,from_status,to_status,changed_by,changed_at,reason,
            transition_source,snapshot,correlation_id,correlation_emitted_at
          ) VALUES (
            '46000000-0000-4000-8000-000000000031','46000000-0000-4000-8000-000000000011',
            'active','temporarily_closed',NULL,clock_timestamp(),'P4C fixture','api','{}'::jsonb,
            '46000000-0000-4000-8000-000000000041','2026-08-17T00:00:00Z'::timestamptz
          );
          INSERT INTO public.branch_outbox_events(
            outbox_id,tenant_id,branch_id,event_type,payload,created_at,process_after,status,
            attempt_count,max_attempts,correlation_id,leased_by,leased_until,last_attempted_at
          ) VALUES (
            '46000000-0000-4000-8000-000000000051','46000000-0000-4000-8000-000000000001',
            '46000000-0000-4000-8000-000000000011','branch.member_notification',
            '{"email":"attacker-controlled@example.invalid","to_status":"active"}'::jsonb,
            clock_timestamp(),clock_timestamp(),'processing',1,5,
            '46000000-0000-4000-8000-000000000041','46000000-0000-4000-8000-000000000061',
            clock_timestamp()+INTERVAL '10 minutes',clock_timestamp()
          );
          SQL

      - name: Prove authoritative deterministic fanout and current-recipient claim
        run: |
          set -euo pipefail
          result="$(PGPASSWORD="${WORKER_RUNTIME_PASSWORD}" psql -X -At -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U worker_test_runtime -d gymflow_p4c_test <<'SQL'
          BEGIN;
          SELECT set_config('app.current_org_id','46000000-0000-4000-8000-000000000001',true);
          SELECT set_config('app.current_role','branch_lifecycle_worker',true);
          SELECT set_config('app.internal_maintenance','branch_lifecycle_saga',true);
          SELECT set_config('app.worker_id','46000000-0000-4000-8000-000000000061',true);
          SELECT app_secure.materialize_branch_member_notifications(
            '46000000-0000-4000-8000-000000000051','46000000-0000-4000-8000-000000000061'
          );
          COMMIT;
          SQL
          )"
          test "$(printf '%s\n' "${result}" | grep -E '^[0-9]+$' | tail -1)" = '4'
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_p4c_test <<'SQL'
          DO $$ DECLARE v_parent text; v_commands bigint; v_children bigint; BEGIN
            SELECT status INTO v_parent FROM public.branch_outbox_events WHERE outbox_id='46000000-0000-4000-8000-000000000051';
            SELECT count(*) INTO v_commands FROM public.notification_commands WHERE source_outbox_id='46000000-0000-4000-8000-000000000051';
            SELECT count(*) INTO v_children FROM public.branch_outbox_events WHERE event_type='notification.delivery';
            IF v_parent<>'superseded' OR v_commands<>4 OR v_children<>4 THEN
              RAISE EXCEPTION 'P4C deterministic fanout failed';
            END IF;
            IF EXISTS(SELECT 1 FROM public.notification_commands WHERE template_data::text LIKE '%attacker-controlled%') THEN
              RAISE EXCEPTION 'queue recipient data became notification authority';
            END IF;
          END $$;
          UPDATE public.members SET email='current-one@example.test',updated_at=clock_timestamp()
          WHERE id='46000000-0000-4000-8000-000000000021';
          SQL

          c1="$(sudo -u postgres psql -X -At -d gymflow_p4c_test -c "SELECT command_id FROM public.notification_commands WHERE member_id='46000000-0000-4000-8000-000000000021'")"
          echo "C1=${c1}" >> "${GITHUB_ENV}"
          PGPASSWORD="${WORKER_RUNTIME_PASSWORD}" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U worker_test_runtime -d gymflow_p4c_test <<SQL
          BEGIN;
          SELECT set_config('app.current_org_id','46000000-0000-4000-8000-000000000001',true);
          UPDATE public.branch_outbox_events SET status='processing',attempt_count=attempt_count+1,
            leased_by='46000000-0000-4000-8000-000000000061',leased_until=clock_timestamp()+INTERVAL '10 minutes'
          WHERE outbox_id='${c1}' AND status='pending';
          SELECT eligible,destination,attempt_number,provider_code FROM app_secure.claim_notification_delivery_v2(
            '${c1}','46000000-0000-4000-8000-000000000061'
          );
          COMMIT;
          SQL
          projection="$(PGPASSWORD="${WORKER_RUNTIME_PASSWORD}" psql -X -At -F '|' -v ON_ERROR_STOP=1 -h 127.0.0.1 -U worker_test_runtime -d gymflow_p4c_test -c "BEGIN; SELECT set_config('app.current_org_id','46000000-0000-4000-8000-000000000001',true); SELECT destination FROM app_secure.claim_notification_delivery_v2('${c1}','46000000-0000-4000-8000-000000000061'); ROLLBACK;" 2>/dev/null || true)"
          # The second claim is intentionally not claimable; verify persisted current email directly as migration owner.
          test "$(sudo -u postgres psql -X -At -d gymflow_p4c_test -c "SELECT email FROM public.members WHERE id='46000000-0000-4000-8000-000000000021'")" = 'current-one@example.test'

      - name: Prove provider acceptance is nonterminal and delivered truth is monotonic
        run: |
          set -euo pipefail
          PGPASSWORD="${WORKER_RUNTIME_PASSWORD}" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U worker_test_runtime -d gymflow_p4c_test <<SQL
          BEGIN;
          SELECT set_config('app.current_org_id','46000000-0000-4000-8000-000000000001',true);
          SELECT app_secure.acknowledge_notification_provider_acceptance(
            '${C1}','46000000-0000-4000-8000-000000000061','resend-email-001',repeat('a',64),repeat('b',64)
          );
          COMMIT;
          SQL
          test "$(sudo -u postgres psql -X -At -F '|' -d gymflow_p4c_test -c "SELECT status,COALESCE(delivery_outcome,'') FROM public.notification_commands WHERE command_id='${C1}'")" = 'provider_accepted|'

          delivered_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PGPASSWORD="${APP_RUNTIME_PASSWORD}" psql -X -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -U app_test_runtime -d gymflow_p4c_test <<SQL
          SELECT app_secure.apply_resend_notification_event_v2(
            'resend-event-delivered','resend-email-001','email.delivered','${delivered_at}'::timestamptz,repeat('c',64)
          );
          SELECT app_secure.apply_resend_notification_event_v2(
            'resend-event-complaint','resend-email-001','email.complained',
            '${delivered_at}'::timestamptz+INTERVAL '1 second',repeat('d',64)
          );
          SQL
          test "$(sudo -u postgres psql -X -At -F '|' -d gymflow_p4c_test -c "SELECT status,delivery_outcome FROM public.notification_commands WHERE command_id='${C1}'")" = 'succeeded|delivered'
          test "$(sudo -u postgres psql -X -At -d gymflow_p4c_test -c "SELECT email_suppressed_at IS NOT NULL FROM public.member_notification_preferences WHERE member_id='46000000-0000-4000-8000-000000000021'")" = 't'

      - name: Prove maintenance discovery and worker-only provider reconciliation
        run: |
          set -euo pipefail
          c2="$(sudo -u postgres psql -X -At -d gymflow_p4c_test -c "SELECT command_id FROM public.notification_commands WHERE member_id='46000000-0000-4000-8000-000000000022'")"
          echo "C2=${c2}" >> "${GITHUB_ENV}"
          PGPASSWORD="${WORKER_RUNTIME_PASSWORD}" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U worker_test_runtime -d gymflow_p4c_test <<SQL
          BEGIN;
          SELECT set_config('app.current_org_id','46000000-0000-4000-8000-000000000001',true);
          UPDATE public.branch_outbox_events SET status='processing',attempt_count=attempt_count+1,
            leased_by='46000000-0000-4000-8000-000000000061',leased_until=clock_timestamp()+INTERVAL '10 minutes'
          WHERE outbox_id='${c2}' AND status='pending';
          SELECT eligible FROM app_secure.claim_notification_delivery_v2('${c2}','46000000-0000-4000-8000-000000000061');
          SELECT app_secure.acknowledge_notification_provider_acceptance(
            '${c2}','46000000-0000-4000-8000-000000000061','resend-email-002',repeat('e',64),repeat('f',64)
          );
          COMMIT;
          SQL
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_p4c_test -c "UPDATE public.notification_commands SET acknowledged_at=clock_timestamp()-INTERVAL '10 minutes' WHERE command_id='${c2}'"
          PGPASSWORD="${MAINTENANCE_RUNTIME_PASSWORD}" psql -X -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -U maintenance_test_runtime -d gymflow_p4c_test <<'SQL'
          BEGIN;
          SELECT set_config('app.internal_maintenance','lifecycle',true);
          SELECT set_config('app.current_role','lifecycle_maintenance',true);
          SELECT app_secure.enqueue_notification_reconciliation(100);
          COMMIT;
          SQL
          r1="$(sudo -u postgres psql -X -At -d gymflow_p4c_test -c "SELECT outbox_id FROM public.branch_outbox_events WHERE event_type='notification.reconcile' AND payload->>'command_id'='${c2}' ORDER BY created_at DESC LIMIT 1")"
          test -n "${r1}"
          PGPASSWORD="${WORKER_RUNTIME_PASSWORD}" psql -X -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -U worker_test_runtime -d gymflow_p4c_test <<SQL
          BEGIN;
          SELECT set_config('app.current_org_id','46000000-0000-4000-8000-000000000001',true);
          UPDATE public.branch_outbox_events SET status='processing',attempt_count=attempt_count+1,
            leased_by='46000000-0000-4000-8000-000000000061',leased_until=clock_timestamp()+INTERVAL '10 minutes'
          WHERE outbox_id='${r1}' AND status='pending';
          SELECT provider_reference_id FROM app_secure.claim_notification_reconciliation('${r1}','46000000-0000-4000-8000-000000000061');
          SELECT app_secure.complete_notification_reconciliation('${r1}','46000000-0000-4000-8000-000000000061','delivered',repeat('1',64));
          COMMIT;
          SQL
          test "$(sudo -u postgres psql -X -At -F '|' -d gymflow_p4c_test -c "SELECT status,delivery_outcome FROM public.notification_commands WHERE command_id='${c2}'")" = 'succeeded|delivered'

      - name: Prove expired-worker crash reclaim records ambiguity and preserves idempotency
        run: |
          set -euo pipefail
          c3="$(sudo -u postgres psql -X -At -d gymflow_p4c_test -c "SELECT command_id FROM public.notification_commands WHERE member_id='46000000-0000-4000-8000-000000000023'")"
          key_before="$(sudo -u postgres psql -X -At -d gymflow_p4c_test -c "SELECT idempotency_key FROM public.notification_commands WHERE command_id='${c3}'")"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_p4c_test <<SQL
          UPDATE public.notification_commands SET status='processing',attempt_count=1,
            leased_by='46000000-0000-4000-8000-000000000099',leased_until=clock_timestamp()-INTERVAL '1 second'
          WHERE command_id='${c3}';
          UPDATE public.branch_outbox_events SET status='processing',attempt_count=2,
            leased_by='46000000-0000-4000-8000-000000000061',leased_until=clock_timestamp()+INTERVAL '10 minutes'
          WHERE outbox_id='${c3}';
          SQL
          PGPASSWORD="${WORKER_RUNTIME_PASSWORD}" psql -X -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -U worker_test_runtime -d gymflow_p4c_test <<SQL
          BEGIN;
          SELECT set_config('app.current_org_id','46000000-0000-4000-8000-000000000001',true);
          SELECT attempt_number FROM app_secure.claim_notification_delivery_v2('${c3}','46000000-0000-4000-8000-000000000061');
          COMMIT;
          SQL
          test "$(sudo -u postgres psql -X -At -d gymflow_p4c_test -c "SELECT count(*) FROM public.notification_delivery_attempts WHERE command_id='${c3}' AND outcome='ambiguous_outcome' AND error_code='worker_lease_expired_commit_unknown'")" = '1'
          test "$(sudo -u postgres psql -X -At -d gymflow_p4c_test -c "SELECT idempotency_key FROM public.notification_commands WHERE command_id='${c3}'")" = "${key_before}"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_p4c_test -c "UPDATE public.notification_commands SET status='dead_lettered',leased_by=NULL,leased_until=NULL,completed_at=clock_timestamp() WHERE command_id='${c3}'; UPDATE public.branch_outbox_events SET status='dead_lettered',leased_by=NULL,leased_until=NULL WHERE outbox_id='${c3}';"
          set +e
          replay_output="$(PGPASSWORD="${MAINTENANCE_RUNTIME_PASSWORD}" psql -X -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -U maintenance_test_runtime -d gymflow_p4c_test -c "SELECT app_secure.requeue_dead_lettered_notification('${c3}','replay must be refused for ambiguous effect');" 2>&1)"
          replay_rc=$?
          set -e
          test "${replay_rc}" -ne 0
          printf '%s\n' "${replay_output}" | grep -F 'external effect may already exist'

      - name: Prove safe DLQ replay rebuilds from authoritative state and is audited
        run: |
          set -euo pipefail
          c4="$(sudo -u postgres psql -X -At -d gymflow_p4c_test -c "SELECT command_id FROM public.notification_commands WHERE member_id='46000000-0000-4000-8000-000000000024'")"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_p4c_test <<SQL
          UPDATE public.notification_commands SET status='dead_lettered',attempt_count=1,
            completed_at=clock_timestamp(),dead_letter_reason='provider_http_400',last_error='provider_http_400'
          WHERE command_id='${c4}';
          UPDATE public.branch_outbox_events SET status='dead_lettered',attempt_count=1,last_error='provider_http_400'
          WHERE outbox_id='${c4}';
          INSERT INTO public.notification_delivery_attempts(
            attempt_id,command_id,tenant_id,attempt_number,outcome,provider_code,request_sha256,error_code,created_at
          ) VALUES (
            gen_random_uuid(),'${c4}','46000000-0000-4000-8000-000000000001',1,
            'permanent_rejection','resend',repeat('9',64),'provider_http_400',clock_timestamp()
          );
          SQL
          PGPASSWORD="${MAINTENANCE_RUNTIME_PASSWORD}" psql -X -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -U maintenance_test_runtime -d gymflow_p4c_test <<SQL
          BEGIN;
          SELECT set_config('app.current_user','operator-001',true);
          SELECT app_secure.requeue_dead_lettered_notification('${c4}','provider configuration corrected after verified rejection');
          COMMIT;
          SQL
          test "$(sudo -u postgres psql -X -At -F '|' -d gymflow_p4c_test -c "SELECT status,operator_replay_count FROM public.notification_commands WHERE command_id='${c4}'")" = 'retry_pending|1'
          test "$(sudo -u postgres psql -X -At -d gymflow_p4c_test -c "SELECT count(*) FROM public.notification_operator_actions WHERE command_id='${c4}' AND action='requeue_dead_letter'")" = '1'

      - name: Prove PII-free operational snapshot and provider-backed downgrade refusal
        run: |
          set -euo pipefail
          PGPASSWORD="${MAINTENANCE_RUNTIME_PASSWORD}" psql -X -At -F '|' -v ON_ERROR_STOP=1 -h 127.0.0.1 -U maintenance_test_runtime -d gymflow_p4c_test <<'SQL'
          SELECT pending_count,provider_accepted_count,dead_letter_count,oldest_pending_age_seconds>=0
          FROM app_secure.notification_operational_snapshot();
          SQL
          set +e
          output="$(python -s -m alembic -c alembic.ini downgrade v07d8e9f0a36 2>&1)"
          rc=$?
          set -e
          test "${rc}" -ne 0
          printf '%s\n' "${output}" | grep -E 'downgrade refuses loss of (notification operator audit evidence|live notification reconciliation/replay state|crash-recovery ambiguity evidence|live/provider-backed notification state)'
          python -s -m alembic -c alembic.ini current --check-heads

      - name: Reprove cluster identity contract
        run: |
          set -euo pipefail
          bash scripts/ci/verify_cluster_roles.sh
          python -s scripts/verify_cluster_identity_graph.py
