name: P3A Auth Role Graph Repair

on:
  push:
    branches: [hardening/p3a-organization-profile-authorization]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p3a-auth-role-graph-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hardening/p3a-organization-profile-authorization
          fetch-depth: 1

      - name: Remove app_runtime from auth deployment-login overlays only
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.github/workflows')
          changed = []
          occurrences = 0

          for path in sorted(root.glob('*.yml')):
              if path.name == 'p3a-auth-role-graph-repair.yml':
                  continue
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              out = []
              i = 0
              file_changed = False
              while i < len(lines):
                  line = lines[i]
                  if 'GRANT app_runtime TO auth_' in line and 'runtime' in line:
                      occurrences += 1
                      file_changed = True
                      # Handle the two-line canonical GRANT form used by newer gates.
                      if ';' not in line:
                          if i + 1 >= len(lines) or 'WITH ADMIN FALSE, INHERIT TRUE, SET FALSE;' not in lines[i + 1]:
                              raise SystemExit(f'unexpected multiline auth app_runtime grant in {path}:{i+1}')
                          i += 2
                          continue
                      i += 1
                      continue
                  out.append(line)
                  i += 1

              if file_changed:
                  path.write_text(''.join(out), encoding='utf-8')
                  changed.append(str(path))

          if occurrences < 3:
              raise SystemExit(f'expected at least three auth app_runtime overlay grants, found {occurrences}')

          remaining = []
          for path in sorted(root.glob('*.yml')):
              text = path.read_text(encoding='utf-8')
              if 'GRANT app_runtime TO auth_' in text:
                  remaining.append(str(path))
          if remaining:
              raise SystemExit(f'auth app_runtime grants remain: {remaining}')

          print(f'removed {occurrences} auth->app_runtime overlay grants from {len(changed)} workflows')
          for item in changed:
              print(item)
          PY

          git diff --check
          git diff -- .github/workflows

      - name: Commit exact role-graph correction and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p3a-auth-role-graph-repair.yml
          git add .github/workflows
          git diff --cached --check
          git commit -m 'ci: decouple auth overlays from app runtime'
          git push origin HEAD:hardening/p3a-organization-profile-authorization
