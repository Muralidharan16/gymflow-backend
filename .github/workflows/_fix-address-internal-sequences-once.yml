name: One-shot address provenance test finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: address-provenance-test-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'hardening/complete-migration-lineage'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/complete-migration-lineage
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Require persisted typed actor provenance
        id: patch
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('tests/test_address.py')
          source = path.read_text(encoding='utf-8')
          old = '''        assert old_snap["address_line1_hash"] == expected_old_hash\n        assert new_snap["address_line1_hash"] == expected_new_hash\n        assert str(logs[0].ip_address) == "192.168.1.50"\n'''
          new = '''        assert old_snap["address_line1_hash"] == expected_old_hash\n        assert new_snap["address_line1_hash"] == expected_new_hash\n        assert str(logs[0].changed_by) == str(owner_id)\n        assert logs[0].changed_by_type == "legacy_gym_owner"\n        assert str(logs[0].ip_address) == "192.168.1.50"\n'''
          old_count = source.count(old)
          new_count = source.count(new)
          if old_count == 1 and new_count == 0:
              path.write_text(source.replace(old, new), encoding='utf-8')
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(
                  f'address provenance test anchor drift: old={old_count}, new={new_count}'
              )
          PY
          python -m py_compile tests/test_address.py
          git diff --check
          if git diff --quiet -- tests/test_address.py; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run source-level protected trigger contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest --noconftest -q \
            tests/test_6f_address_internal_sequence_boundary.py \
            tests/test_address_runtime_privilege_boundary.py

      - name: Publish behavioral assertion only
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_address.py
          test "$(git diff --cached --name-only)" = 'tests/test_address.py'
          git diff --cached --check
          git commit -m 'test address audit typed actor provenance'
          git fetch origin hardening/complete-migration-lineage
          git rebase origin/hardening/complete-migration-lineage
          git push origin HEAD:hardening/complete-migration-lineage
