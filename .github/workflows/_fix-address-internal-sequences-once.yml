name: One-shot address protected trigger boundary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: address-protected-trigger-boundary-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'hardening/complete-migration-lineage'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/complete-migration-lineage
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Preserve typed actor provenance in protected triggers
        id: patch
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('alembic/versions/6f708192a3b4_address_runtime_privilege_boundary.py')
          source = path.read_text(encoding='utf-8')

          def reconcile(old: str, new: str, count: int = 1) -> None:
              global source
              old_count = source.count(old)
              new_count = source.count(new)
              if old_count == count and new_count == 0:
                  source = source.replace(old, new)
                  return
              if old_count == 0 and new_count == count:
                  return
              raise SystemExit(
                  f'6f typed-provenance anchor drift: old={old_count}, '
                  f'new={new_count}, expected={count}, anchor={old!r}'
              )

          reconcile(
              '                     valid_from, changed_by)\n',
              '                     valid_from, changed_by, changed_by_type)\n',
              count=2,
          )
          reconcile(
              "                     NULLIF(pg_catalog.current_setting('app.current_user_id', true), '')::uuid);\n",
              "                     NULLIF(pg_catalog.current_setting('app.current_user_id', true), '')::uuid,\n"
              "                     NULLIF(pg_catalog.current_setting('app.current_principal_type', true), ''));\n",
              count=2,
          )
          reconcile(
              '                         changed_by, ip_address, user_agent, request_id)\n',
              '                         changed_by, changed_by_type, ip_address, user_agent, request_id)\n',
          )
          reconcile(
              "                         NULLIF(pg_catalog.current_setting('app.current_user_id', true), '')::uuid,\n"
              "                         NULLIF(pg_catalog.current_setting('app.ip_address', true), '')::inet,\n",
              "                         NULLIF(pg_catalog.current_setting('app.current_user_id', true), '')::uuid,\n"
              "                         NULLIF(pg_catalog.current_setting('app.current_principal_type', true), ''),\n"
              "                         NULLIF(pg_catalog.current_setting('app.ip_address', true), '')::inet,\n",
          )
          reconcile(
              '''    required = {\n        _INSERT_FN: ("app.current_org_id", "public.branch_address_history"),\n        _UPDATE_FN: (\n            "app.current_org_id", "public.branch_address_history",\n            "public.branch_address_audit_log", "public.address_change_outbox",\n        ),\n    }\n''',
              '''    required = {\n        _INSERT_FN: (\n            "app.current_org_id", "app.current_user_id",\n            "app.current_principal_type", "changed_by_type",\n            "public.branch_address_history",\n        ),\n        _UPDATE_FN: (\n            "app.current_org_id", "app.current_user_id",\n            "app.current_principal_type", "changed_by_type",\n            "public.branch_address_history",\n            "public.branch_address_audit_log", "public.address_change_outbox",\n        ),\n    }\n''',
          )

          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile alembic/versions/6f708192a3b4_address_runtime_privilege_boundary.py
          git diff --check
          if git diff --quiet -- alembic/versions/6f708192a3b4_address_runtime_privilege_boundary.py; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run protected trigger boundary contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest --noconftest -q \
            tests/test_6f_address_internal_sequence_boundary.py \
            tests/test_address_runtime_privilege_boundary.py

      - name: Publish migration-only correction
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alembic/versions/6f708192a3b4_address_runtime_privilege_boundary.py
          test "$(git diff --cached --name-only)" = 'alembic/versions/6f708192a3b4_address_runtime_privilege_boundary.py'
          git diff --cached --check
          git commit -m 'fix address audit typed provenance boundary'
          git fetch origin hardening/complete-migration-lineage
          git rebase origin/hardening/complete-migration-lineage
          python -m pytest --noconftest -q \
            tests/test_6f_address_internal_sequence_boundary.py \
            tests/test_address_runtime_privilege_boundary.py
          git push origin HEAD:hardening/complete-migration-lineage
