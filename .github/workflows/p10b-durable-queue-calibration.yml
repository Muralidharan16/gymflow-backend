name: P10-B Durable Queue Calibration

on:
  push:
    branches:
      - hardening/p10-performance-security-final-production-certification
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p10b-durable-queue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CERTIFICATION_HEAD: zk07d8e9f0a45
  MIGRATION_PASSWORD: ci-migration-owner
  GENERAL_RUNTIME_PASSWORD: ci-app-test-runtime
  AUTH_RUNTIME_PASSWORD: ci-auth-test-runtime
  WORKER_RUNTIME_PASSWORD: ci-worker-test-runtime
  MAINTENANCE_RUNTIME_PASSWORD: ci-lifecycle-maintenance-runtime
  DATABASE_URL: postgresql+asyncpg://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_migration_test
  TEST_DATABASE_URL: postgresql+asyncpg://app_test_runtime:ci-app-test-runtime@127.0.0.1:5432/gymflow_test
  TEST_ADMIN_DATABASE_URL: postgresql://migration_owner:ci-migration-owner@127.0.0.1:5432/gymflow_test
  P10B_APP_DATABASE_URL: postgresql://app_test_runtime:ci-app-test-runtime@127.0.0.1:5432/gymflow_test
  WORKER_DATABASE_URL: postgresql+asyncpg://worker_test_runtime:ci-worker-test-runtime@127.0.0.1:5432/gymflow_test
  REDIS_URL: redis://127.0.0.1:6379/0
  CELERY_BROKER_URL: redis://127.0.0.1:6379/1
  CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
  SECRET_KEY: p10b-durable-queue-synthetic-secret-not-production
  AWS_ACCESS_KEY_ID: p10b-synthetic
  AWS_SECRET_ACCESS_KEY: p10b-synthetic
  S3_BUCKET_NAME: p10b-synthetic
  ENVIRONMENT: test
  PYTHONDONTWRITEBYTECODE: '1'
  EVIDENCE_DIR: p10b-durable-queue-evidence

jobs:
  durable-queue-calibration:
    name: Real Celery and PostgreSQL durable queue calibration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked environment and validate calibration code
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/resolved.txt
          diff -u requirements-test.lock /tmp/resolved.txt
          python -m py_compile scripts/ci/p10b_durable_queue_calibration.py

      - name: Prepare real PostgreSQL 16 reduced runtime identities and HEAD schema
        run: bash scripts/ci/prepare_p3e_pg16.sh

      - name: Calibrate real Celery to PostgreSQL durable queue
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          python -s scripts/ci/p10b_durable_queue_calibration.py \
            --items 400 \
            --concurrency 4 \
            --output "${EVIDENCE_DIR}/durable-queue-calibration.json" \
            --worker-log "${EVIDENCE_DIR}/worker.log" \
            | tee "${EVIDENCE_DIR}/calibration.log"
          grep -q 'P10B_DURABLE_QUEUE_CALIBRATION=PASS' "${EVIDENCE_DIR}/calibration.log"
          python - "${EVIDENCE_DIR}/durable-queue-calibration.json" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          assert data['decision'] == 'CALIBRATION_PASS'
          assert data['items'] == 400
          assert data['terminal_states'] == {'dead_lettered': 400, 'exact_terminal': 400}
          assert data['broker_remaining'] == 0
          assert data['external_provider_effects'] == 0
          assert data['durable_items_per_second'] > 0
          PY
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --exit-code
          git diff --cached --exit-code
          echo 'P10B_DURABLE_QUEUE_CALIBRATION=PASS'
          echo 'P10_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'

      - name: Upload durable queue calibration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p10b-durable-queue-${{ github.event.pull_request.head.sha || github.sha }}
          path: p10b-durable-queue-evidence/
          if-no-files-found: error
          retention-days: 14
