name: P9-M Populated Predecessor to HEAD Rehearsal

on:
  push:
    branches:
      - hardening/p9-data-protection-disaster-recovery
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p9m-populated-predecessor-head-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  populated_rehearsal:
    name: Real PG16 populated zj07 to zk07 rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      P9M_PREDECESSOR: zj07d8e9f0a44
      P9M_HEAD: zk07d8e9f0a45
      MIGRATION_PASSWORD: ci-p9m-migration-owner
      DATABASE_URL: postgresql+asyncpg://migration_owner:ci-p9m-migration-owner@127.0.0.1:5432/gymflow_p9m_test
      EVIDENCE_DIR: p9m-evidence
      PYTHONDONTWRITEBYTECODE: '1'
      ENVIRONMENT: test

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install exact locked test environment
        run: |
          set -euo pipefail
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-test.lock
          python -m pip check
          python -m pip freeze | LC_ALL=C sort > /tmp/p9m-resolved.txt
          diff -u requirements-test.lock /tmp/p9m-resolved.txt

      - name: Validate P9-M static contracts before runtime
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/p9m_upgrade_timer.py \
            tests/test_p9_governance_contracts.py \
            tests/test_p9m_populated_migration_contracts.py
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p9_governance_contracts.py \
            tests/test_p9m_populated_migration_contracts.py
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "${P9M_HEAD}"

      - name: Install PostgreSQL 16 and required extensions
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-16 \
            postgresql-client-16 \
            postgresql-contrib \
            postgresql-16-partman \
            postgresql-16-postgis-3
          sudo systemctl start postgresql
          pg_config --version
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres -c 'SELECT version();'
          test -f /usr/share/postgresql/16/extension/pg_partman.control

      - name: Bootstrap canonical reduced PostgreSQL roles
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap_cluster_roles.sh
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER ROLE migration_owner PASSWORD 'ci-p9m-migration-owner';
          CREATE DATABASE gymflow_p9m_test OWNER migration_owner;
          SQL
          bash scripts/ci/verify_cluster_roles.sh

      - name: Provision infrastructure-owned extension boundary
        run: |
          set -euo pipefail
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_p9m_test <<'SQL'
          CREATE SCHEMA IF NOT EXISTS partman AUTHORIZATION postgres;
          CREATE EXTENSION IF NOT EXISTS pg_partman SCHEMA partman;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE EXTENSION IF NOT EXISTS citext;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS postgis;

          GRANT USAGE ON SCHEMA partman TO migration_owner;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA partman TO migration_owner;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA partman TO migration_owner;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA partman TO migration_owner;
          GRANT EXECUTE ON ALL PROCEDURES IN SCHEMA partman TO migration_owner;
          SQL

      - name: Build exact zj07 predecessor with reduced migration authority
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          set -o pipefail
          python -s -m alembic -c alembic.ini upgrade "${P9M_PREDECESSOR}" 2>&1 \
            | tee "$EVIDENCE_DIR/upgrade-to-predecessor.log"
          python -s -m alembic -c alembic.ini current 2>&1 \
            | tee "$EVIDENCE_DIR/current-predecessor.log"
          grep -q "${P9M_PREDECESSOR}" "$EVIDENCE_DIR/current-predecessor.log"

      - name: Seed production-shaped deterministic synthetic predecessor
        run: |
          set -euo pipefail
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 \
            -d gymflow_p9m_test \
            -f scripts/ci/p9m_seed_populated_predecessor.sql \
            | tee "$EVIDENCE_DIR/seed.log"
          grep -q 'P9M_SYNTHETIC_PRODUCTION_SHAPE=PASS' "$EVIDENCE_DIR/seed.log"

      - name: Prove predecessor capability boundary and capture stable fingerprint
        run: |
          set -euo pipefail
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d gymflow_p9m_test <<'SQL'
          DO $$
          BEGIN
            IF to_regprocedure('app_secure.lifecycle_saga_dead_letter_count()') IS NOT NULL THEN
              RAISE EXCEPTION 'P9-M predecessor unexpectedly already has zk07 function';
            END IF;
            IF NOT pg_catalog.has_table_privilege(
                'app_security_owner', 'public.branch_outbox_events', 'SELECT'
            ) THEN
              RAISE EXCEPTION 'P9-M predecessor lost app_security_owner bounded outbox read';
            END IF;
            IF pg_catalog.has_table_privilege(
                'lifecycle_maintenance_runtime', 'public.branch_outbox_events', 'SELECT'
            ) THEN
              RAISE EXCEPTION 'P9-M predecessor already broadened lifecycle maintenance raw SELECT';
            END IF;
          END
          $$;
          SQL

          sudo -u postgres psql -X -qAt -v ON_ERROR_STOP=1 \
            -d gymflow_p9m_test \
            -f scripts/ci/p9m_stable_snapshot.sql \
            > "$EVIDENCE_DIR/predecessor-stable.txt"
          cat "$EVIDENCE_DIR/predecessor-stable.txt"
          grep -qx 'dead_lifecycle_count|204' "$EVIDENCE_DIR/predecessor-stable.txt"
          grep -qx 'app_security_owner_raw_outbox_select|true' "$EVIDENCE_DIR/predecessor-stable.txt"
          grep -qx 'lifecycle_maintenance_raw_outbox_select|false' "$EVIDENCE_DIR/predecessor-stable.txt"
          echo 'P9M_PREDECESSOR_CAPTURE=PASS'

      - name: Upgrade populated predecessor to exact zk07 and measure duration
        run: |
          set -euo pipefail
          python -s scripts/p9m_upgrade_timer.py \
            --evidence "$EVIDENCE_DIR/upgrade-duration.json" \
            --log "$EVIDENCE_DIR/upgrade-zj07-to-zk07.log" \
            | tee "$EVIDENCE_DIR/upgrade-timer-output.log"
          grep -q 'P9M_UPGRADE_DURATION_RECORDED=PASS' "$EVIDENCE_DIR/upgrade-timer-output.log"
          python -s -m alembic -c alembic.ini current 2>&1 \
            | tee "$EVIDENCE_DIR/current-head.log"
          grep -q "${P9M_HEAD}" "$EVIDENCE_DIR/current-head.log"
          echo 'P9M_EXACT_FORWARD_UPGRADE=PASS'

      - name: Prove byte-identical stable business and security fingerprint
        run: |
          set -euo pipefail
          sudo -u postgres psql -X -qAt -v ON_ERROR_STOP=1 \
            -d gymflow_p9m_test \
            -f scripts/ci/p9m_stable_snapshot.sql \
            > "$EVIDENCE_DIR/head-stable.txt"
          cmp "$EVIDENCE_DIR/predecessor-stable.txt" "$EVIDENCE_DIR/head-stable.txt" || {
            echo 'P9-M stable business/security fingerprint changed across zk07.' >&2
            diff -u "$EVIDENCE_DIR/predecessor-stable.txt" "$EVIDENCE_DIR/head-stable.txt" || true
            exit 1
          }
          echo 'P9M_STABLE_FINGERPRINT=PASS'

      - name: Prove exact intended zk07 capability delta
        run: |
          set -euo pipefail
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 \
            -d gymflow_p9m_test \
            -f scripts/ci/p9m_verify_head_capability.sql \
            | tee "$EVIDENCE_DIR/head-capability.log"
          grep -q 'P9M_EXPECTED_CAPABILITY_DELTA=PASS' "$EVIDENCE_DIR/head-capability.log"

      - name: Reprove inherited P8 and app-secure migration boundaries
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --maxfail=1 \
            tests/test_p9_governance_contracts.py \
            tests/test_p9m_populated_migration_contracts.py \
            tests/test_p8_governance_contracts.py \
            tests/test_migration_app_secure_owner_context_boundary.py \
            tests/test_pg_dump_normalizer.py
          python -s scripts/verify_alembic_graph.py
          test "$(python -s -m alembic -c alembic.ini heads | awk '{print $1}')" = "${P9M_HEAD}"

      - name: Emit P9-M decision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          echo 'P9_POPULATED_PREDECESSOR_TO_HEAD=PASS'
          echo 'P9_MIGRATION_DATA_INTEGRITY=PASS'
          echo 'P9_REFUND_PROVIDER_EXECUTION=DEFERRED_FAIL_CLOSED'

      - name: Upload P9-M rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p9m-populated-rehearsal-${{ github.event.pull_request.head.sha || github.sha }}
          path: p9m-evidence/
          if-no-files-found: error
          retention-days: 14
