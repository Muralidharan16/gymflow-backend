services:
  api:
    environment:
      DOERS_PROCESS_PROFILE: api
      CELERY_WORKER_PROFILE: ""
      WORKER_DATABASE_URL: ""
      MAINTENANCE_DATABASE_URL: ""
      SEARCH_PROVIDER_MODE: disabled
      OPENSEARCH_URL: ""
      OPENSEARCH_USERNAME: ""
      OPENSEARCH_PASSWORD: ""

  celery-worker:
    environment:
      DOERS_PROCESS_PROFILE: worker
      CELERY_WORKER_PROFILE: worker
      DATABASE_URL: ""
      AUTH_DATABASE_URL: ""
      MAINTENANCE_DATABASE_URL: ""
      SEARCH_PROVIDER_MODE: ${SEARCH_PROVIDER_MODE:-disabled}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-branches-v1}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      OPENSEARCH_TIMEOUT_SECONDS: ${OPENSEARCH_TIMEOUT_SECONDS:-5}
      OPENSEARCH_VERIFY_TLS: ${OPENSEARCH_VERIFY_TLS:-true}

  celery-maintenance-worker:
    environment:
      DOERS_PROCESS_PROFILE: maintenance
      CELERY_WORKER_PROFILE: maintenance
      DATABASE_URL: ""
      AUTH_DATABASE_URL: ""
      WORKER_DATABASE_URL: ""
      SEARCH_PROVIDER_MODE: disabled
      OPENSEARCH_URL: ""
      OPENSEARCH_USERNAME: ""
      OPENSEARCH_PASSWORD: ""

  celery-beat:
    environment:
      DOERS_PROCESS_PROFILE: beat
      CELERY_WORKER_PROFILE: ""
      DATABASE_URL: ""
      AUTH_DATABASE_URL: ""
      WORKER_DATABASE_URL: ""
      MAINTENANCE_DATABASE_URL: ""
      SEARCH_PROVIDER_MODE: disabled
      OPENSEARCH_URL: ""
      OPENSEARCH_USERNAME: ""
      OPENSEARCH_PASSWORD: ""

  flower:
    environment:
      DOERS_PROCESS_PROFILE: beat
      CELERY_WORKER_PROFILE: ""
      DATABASE_URL: ""
      AUTH_DATABASE_URL: ""
      WORKER_DATABASE_URL: ""
      MAINTENANCE_DATABASE_URL: ""
      SEARCH_PROVIDER_MODE: disabled
      OPENSEARCH_URL: ""
      OPENSEARCH_USERNAME: ""
      OPENSEARCH_PASSWORD: ""
