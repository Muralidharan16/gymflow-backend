services:
  celery-entitlement-worker:
    profiles:
      - pay24-stage1-readiness
    build: .
    command: >-
      celery -A app.core.celery_app:celery_app worker
      --loglevel=info --concurrency=1 --prefetch-multiplier=1 -Q entitlement
    deploy:
      replicas: 0
    environment:
      ENVIRONMENT: production
      DOERS_PROCESS_PROFILE: entitlement_worker
      CELERY_WORKER_PROFILE: entitlement
      DATABASE_URL: ""
      AUTH_DATABASE_URL: ""
      WORKER_DATABASE_URL: ""
      MAINTENANCE_DATABASE_URL: ""
      FINANCE_PAYMENT_DATABASE_URL: ""
      FINANCE_CONFIG_DATABASE_URL: ""
      ENTITLEMENT_DATABASE_URL: ${PAY24_ENTITLEMENT_DATABASE_URL:?required}
      REDIS_URL: ${REDIS_URL:?required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?required}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?required}
      REDIS_PRODUCTION_TOPOLOGY: ${REDIS_PRODUCTION_TOPOLOGY:?required}
      REDIS_PERSISTENCE_MODE: ${REDIS_PERSISTENCE_MODE:?required}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:?required}
      REDIS_HA_MIN_REPLICAS: ${REDIS_HA_MIN_REPLICAS:?required}
      REDIS_VM_OVERCOMMIT_MEMORY: ${REDIS_VM_OVERCOMMIT_MEMORY:?required}
      REDIS_MANAGED_PROVIDER_ATTESTED: ${REDIS_MANAGED_PROVIDER_ATTESTED:?required}
      P8_METRICS_OTLP_ENDPOINT: ${PAY24_ENTITLEMENT_METRICS_OTLP_ENDPOINT:?required}
      P8_METRICS_EXPORT_INTERVAL_SECONDS: ${P8_METRICS_EXPORT_INTERVAL_SECONDS:-30}
      P8_METRICS_EXPORT_TIMEOUT_SECONDS: ${P8_METRICS_EXPORT_TIMEOUT_SECONDS:-5}
      SECRET_KEY: ${SECRET_KEY:?required}
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      RAZORPAY_PROVIDER_MODE: disabled
      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
      RAZORPAY_WEBHOOK_SECRET: ""
      NOTIFICATION_EMAIL_PROVIDER_MODE: disabled
      P4C_RESEND_API_KEY: ""
      RESEND_WEBHOOK_SECRET: ""
      SEARCH_PROVIDER_MODE: disabled
      OPENSEARCH_URL: ""
      OPENSEARCH_USERNAME: ""
      OPENSEARCH_PASSWORD: ""
      SEARCH_METRICS_OTLP_ENDPOINT: ""
      P4E_METRICS_OTLP_ENDPOINT: ""
      PLATFORM_BILLING_PROVIDER_MODE: disabled
      PLATFORM_BILLING_CHECKOUT: "false"
      PLATFORM_BILLING_WEBHOOK_PROCESSING: "false"
      PLATFORM_BILLING_DUNNING_TRANSITIONS: "false"
      PLATFORM_BILLING_NOTIFICATIONS: "false"
