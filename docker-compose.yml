version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: doers
      POSTGRES_USER: doers
      POSTGRES_PASSWORD: doers
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports:
      - "8000:8000"
    depends_on: [postgres, redis]

  celery-worker:
    build: .
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 -Q worker
    env_file: .env.worker
    environment:
      CELERY_WORKER_PROFILE: worker
      AUTH_DATABASE_URL: ""
      MAINTENANCE_DATABASE_URL: ""
    depends_on: [postgres, redis]

  celery-maintenance-worker:
    build: .
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1 -Q lifecycle-maintenance
    env_file: .env.maintenance
    environment:
      CELERY_WORKER_PROFILE: maintenance
      AUTH_DATABASE_URL: ""
      WORKER_DATABASE_URL: ""
    depends_on: [postgres, redis]

  celery-beat:
    build: .
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env
    depends_on: [redis]

  flower:
    build: .
    command: celery -A app.tasks.celery_app flower --port=5555
    env_file: .env
    ports:
      - "5555:5555"
    depends_on: [redis]

volumes:
  pgdata:
