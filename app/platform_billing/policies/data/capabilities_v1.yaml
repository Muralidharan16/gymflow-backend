# Doers Platform Billing - Capability Registry V1

manifest_version: "1.0"

capabilities:
  - key: auth.session.refresh
    description: Refresh an expired authentication session.
    operation_class: security_recovery
    allowed_access_modes: [full, limited_write, read_only, billing_only, blocked]
    fallback_eligible: false
    recovery_capability: true

  - key: auth.logout
    description: Terminate the current session.
    operation_class: security_recovery
    allowed_access_modes: [full, limited_write, read_only, billing_only, blocked]
    fallback_eligible: false
    recovery_capability: true

  - key: security.manage_own_session
    description: View and revoke own sessions.
    operation_class: security_recovery
    allowed_access_modes: [full, limited_write, read_only, billing_only]
    fallback_eligible: false
    recovery_capability: true

  - key: support.contact
    description: Contact platform support.
    operation_class: billing_recovery
    allowed_access_modes: [full, limited_write, read_only, billing_only, blocked]
    fallback_eligible: true
    recovery_capability: true

  - key: platform_billing.view
    description: View safe Plan and Billing status.
    operation_class: safe_read
    allowed_access_modes: [full, limited_write, read_only, billing_only, blocked]
    fallback_eligible: true
    recovery_capability: true

  - key: platform_billing.manage_account
    description: Manage billing account identity and contacts.
    operation_class: ordinary_write
    allowed_access_modes: [full, limited_write, read_only, billing_only]
    fallback_eligible: false
    recovery_capability: true

  - key: platform_billing.manage_payment_method
    description: Add, update, or remove platform payment methods.
    operation_class: financial
    allowed_access_modes: [full, limited_write, read_only, billing_only]
    fallback_eligible: false
    recovery_capability: true

  - key: platform_billing.change_plan
    description: Change the Doers platform plan.
    operation_class: financial
    allowed_access_modes: [full, limited_write, read_only, billing_only]
    fallback_eligible: false
    recovery_capability: true

  - key: platform_billing.cancel
    description: Schedule or undo platform plan cancellation.
    operation_class: financial
    allowed_access_modes: [full, limited_write, read_only, billing_only]
    fallback_eligible: false
    recovery_capability: true

  - key: platform_billing.download_invoice
    description: Download platform billing invoice documents.
    operation_class: safe_read
    allowed_access_modes: [full, limited_write, read_only, billing_only]
    fallback_eligible: false
    recovery_capability: true

  - key: data.export
    description: Export organization data.
    operation_class: export
    required_feature_key: features.data_export
    allowed_access_modes: [full, limited_write, read_only]
    fallback_eligible: false
    recovery_capability: false

  - key: organization.view
    description: View organization profile.
    operation_class: safe_read
    allowed_access_modes: [full, limited_write, read_only]
    fallback_eligible: true
    recovery_capability: false

  - key: organization.update
    description: Update organization profile.
    operation_class: ordinary_write
    allowed_access_modes: [full, limited_write]
    fallback_eligible: false
    recovery_capability: false

  - key: branches.view
    description: View branch listing and details.
    operation_class: safe_read
    allowed_access_modes: [full, limited_write, read_only]
    fallback_eligible: true
    recovery_capability: false

  - key: branches.create
    description: Create a new branch.
    operation_class: capacity_increase
    required_feature_key: limits.branches.active
    usage_metric_key: limits.branches.active
    capacity_effect: increase
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false

  - key: branches.update
    description: Update branch details.
    operation_class: ordinary_write
    allowed_access_modes: [full, limited_write]
    fallback_eligible: false
    recovery_capability: false

  - key: branches.change_status
    description: Activate, deactivate, close, or reopen a branch.
    operation_class: capacity_decrease
    capacity_effect: decrease
    allowed_access_modes: [full, limited_write]
    fallback_eligible: false
    recovery_capability: false

  - key: branches.delete_request
    description: Request branch deletion.
    operation_class: destructive
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false

  - key: branch_contacts.view
    description: View branch contacts.
    operation_class: safe_read
    allowed_access_modes: [full, limited_write, read_only]
    fallback_eligible: true
    recovery_capability: false

  - key: branch_contacts.manage
    description: Manage branch contacts.
    operation_class: ordinary_write
    allowed_access_modes: [full, limited_write]
    fallback_eligible: false
    recovery_capability: false

  - key: branch_hours.view
    description: View branch operating hours.
    operation_class: safe_read
    allowed_access_modes: [full, limited_write, read_only]
    fallback_eligible: true
    recovery_capability: false

  - key: branch_hours.manage
    description: Manage branch operating hours.
    operation_class: ordinary_write
    allowed_access_modes: [full, limited_write]
    fallback_eligible: false
    recovery_capability: false

  - key: staff.view
    description: View staff listing.
    operation_class: safe_read
    allowed_access_modes: [full, limited_write, read_only]
    fallback_eligible: true
    recovery_capability: false

  - key: staff.invite
    description: Invite a staff member.
    operation_class: capacity_increase
    required_feature_key: limits.staff.active
    usage_metric_key: limits.staff.active
    capacity_effect: increase
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false

  - key: staff.update
    description: Update staff details or roles.
    operation_class: privileged_admin
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false

  - key: staff.revoke
    description: Revoke staff access.
    operation_class: destructive
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false

  - key: members.view
    description: View members.
    operation_class: safe_read
    allowed_access_modes: [full, limited_write, read_only]
    fallback_eligible: true
    recovery_capability: false

  - key: members.create
    description: Create a member.
    operation_class: capacity_increase
    required_feature_key: limits.members.active
    usage_metric_key: limits.members.active
    capacity_effect: increase
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false

  - key: members.update
    description: Update member details.
    operation_class: ordinary_write
    allowed_access_modes: [full, limited_write]
    fallback_eligible: false
    recovery_capability: false

  - key: members.deactivate
    description: Deactivate a member.
    operation_class: capacity_decrease
    capacity_effect: decrease
    allowed_access_modes: [full, limited_write]
    fallback_eligible: false
    recovery_capability: false

  - key: membership_plans.view
    description: View facility membership plans.
    operation_class: safe_read
    allowed_access_modes: [full, limited_write, read_only]
    fallback_eligible: true
    recovery_capability: false

  - key: membership_plans.create
    description: Create a facility membership plan.
    operation_class: capacity_increase
    required_feature_key: limits.membership_plans.active
    usage_metric_key: limits.membership_plans.active
    capacity_effect: increase
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false

  - key: membership_plans.update
    description: Update a facility membership plan.
    operation_class: ordinary_write
    allowed_access_modes: [full, limited_write]
    fallback_eligible: false
    recovery_capability: false

  - key: membership_plans.archive
    description: Archive a facility membership plan.
    operation_class: capacity_decrease
    capacity_effect: decrease
    allowed_access_modes: [full, limited_write]
    fallback_eligible: false
    recovery_capability: false

  - key: member_subscriptions.view
    description: View facility member subscriptions.
    operation_class: safe_read
    required_feature_key: features.member_subscriptions
    allowed_access_modes: [full, limited_write, read_only]
    fallback_eligible: true
    recovery_capability: false

  - key: member_subscriptions.create
    description: Create a facility member subscription.
    operation_class: ordinary_write
    required_feature_key: features.member_subscriptions
    allowed_access_modes: [full, limited_write]
    fallback_eligible: false
    recovery_capability: false

  - key: member_subscriptions.update
    description: Update a facility member subscription.
    operation_class: ordinary_write
    required_feature_key: features.member_subscriptions
    allowed_access_modes: [full, limited_write]
    fallback_eligible: false
    recovery_capability: false

  - key: member_subscriptions.cancel
    description: Cancel a facility member subscription.
    operation_class: destructive
    required_feature_key: features.member_subscriptions
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false

  - key: member_payments.view
    description: View facility member payment records.
    operation_class: safe_read
    required_feature_key: features.member_payments
    allowed_access_modes: [full, limited_write, read_only]
    fallback_eligible: true
    recovery_capability: false

  - key: member_payments.record
    description: Record a facility member payment.
    operation_class: financial
    required_feature_key: features.member_payments
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false

  - key: member_payments.refund
    description: Refund a facility member payment.
    operation_class: financial
    required_feature_key: features.member_payments
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false

  - key: attendance.view
    description: View attendance records.
    operation_class: safe_read
    required_feature_key: features.attendance
    allowed_access_modes: [full, limited_write, read_only]
    fallback_eligible: true
    recovery_capability: false

  - key: attendance.record
    description: Record attendance.
    operation_class: ordinary_write
    required_feature_key: features.attendance
    allowed_access_modes: [full, limited_write]
    fallback_eligible: false
    recovery_capability: false

  - key: reports.basic.view
    description: View basic reports.
    operation_class: safe_read
    required_feature_key: features.basic_reports
    allowed_access_modes: [full, limited_write, read_only]
    fallback_eligible: true
    recovery_capability: false

  - key: reports.advanced.view
    description: View advanced reports.
    operation_class: safe_read
    required_feature_key: features.advanced_reports
    allowed_access_modes: [full, limited_write, read_only]
    fallback_eligible: true
    recovery_capability: false

  - key: imports.create
    description: Create a bulk import.
    operation_class: ordinary_write
    allowed_access_modes: [full, limited_write]
    fallback_eligible: false
    recovery_capability: false

  - key: imports.view
    description: View import history.
    operation_class: safe_read
    allowed_access_modes: [full, limited_write, read_only]
    fallback_eligible: true
    recovery_capability: false

  - key: assets.view
    description: View organization assets.
    operation_class: safe_read
    allowed_access_modes: [full, limited_write, read_only]
    fallback_eligible: true
    recovery_capability: false

  - key: assets.manage
    description: Manage organization branding assets.
    operation_class: ordinary_write
    required_feature_key: features.custom_branding
    allowed_access_modes: [full, limited_write]
    fallback_eligible: false
    recovery_capability: false

  - key: internal.platform_billing.view
    description: View internal Platform Billing diagnostics.
    operation_class: internal
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false
    internal: true

  - key: internal.platform_billing.reconcile
    description: Run internal Platform Billing reconciliation.
    operation_class: internal
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false
    internal: true

  - key: internal.platform_billing.issue_refund
    description: Issue an internal platform refund.
    operation_class: internal
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false
    internal: true

  - key: internal.platform_billing.apply_credit
    description: Apply an internal platform credit.
    operation_class: internal
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false
    internal: true

  - key: internal.platform_billing.override_access
    description: Create or revoke internal access overrides.
    operation_class: internal
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false
    internal: true

  - key: internal.platform_billing.manage_catalog
    description: Manage internal Platform Billing catalog.
    operation_class: internal
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false
    internal: true

  - key: internal.platform_billing.view_sensitive_audit
    description: View sensitive internal Platform Billing audit evidence.
    operation_class: internal
    allowed_access_modes: [full]
    fallback_eligible: false
    recovery_capability: false
    internal: true
